<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROCKCELL Activity</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#000;color:#fff;
 font-family:Arial,sans-serif;
 min-height:100vh
}
header{
 padding:18px 16px;
 font-size:26px;font-weight:bold;
 border-bottom:1px solid #222;
 position:sticky;top:0;background:#000;z-index:5
}
main{padding:12px 14px 100px}
.title{
 color:#aaa;font-size:13px;
 font-weight:bold;text-transform:uppercase;
 margin:10px 4px
}
.card{
 display:flex;align-items:center;
 gap:12px;padding:14px 5px;
 border-bottom:1px solid #181818
}
.avatar{
 width:52px;height:52px;border-radius:50%;
 object-fit:cover;background:#222
}
.info{flex:1;min-width:0}
.name{font-weight:bold;font-size:15px}
.text{color:#aaa;font-size:13px;margin-top:5px}
.time{color:#666;font-size:11px;margin-top:5px}
.empty{
 text-align:center;color:#777;
 padding:70px 20px;line-height:1.6
}
.nav{
 position:fixed;left:12px;right:12px;bottom:12px;
 display:flex;padding:8px;border-radius:24px;
 background:rgba(25,25,25,.95);
 border:1px solid #333;backdrop-filter:blur(15px)
}
.nav a{
 flex:1;text-align:center;text-decoration:none;
 color:#999;font-size:11px;padding:8px 3px;
 border-radius:17px
}
.nav a.active{background:#fff;color:#000}
.icon{display:block;font-size:20px;margin-bottom:3px}
</style>
</head>

<body>

<header>Activity 🔔</header>

<main id="activity">
<div class="empty">Activity loading...</div>
</main>

<div class="nav">
<a href="home.html"><span class="icon">⌂</span>Home</a>
<a href="search.html"><span class="icon">⌕</span>Search</a>
<a href="create.html"><span class="icon">＋</span>Create</a>
<a href="activity.html" class="active"><span class="icon">♡</span>Activity</a>
<a href="profile.html"><span class="icon">◯</span>Profile</a>
</div>

<script>
const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";
const PROJECT_ID="crockcell-cd2e6";

const token=
 localStorage.getItem("crockcell_idToken")||
 localStorage.getItem("crockcellIdToken")||
 sessionStorage.getItem("crockcell_idToken")||
 sessionStorage.getItem("crockcellIdToken");

const uid=
 localStorage.getItem("crockcell_uid")||
 localStorage.getItem("crockcellUid")||
 sessionStorage.getItem("crockcell_uid")||
 sessionStorage.getItem("crockcellUid");

const activity=document.getElementById("activity");

if(!token||!uid){
 location.replace("index.html");
}

function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function photo(){
 return "data:image/svg+xml;charset=UTF-8,"+
 encodeURIComponent(
 '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">'+
 '<rect width="100" height="100" fill="#222"/>'+
 '<circle cx="50" cy="38" r="18" fill="#777"/>'+
 '<path d="M20 88c4-22 56-22 60 0" fill="#777"/>'+
 '</svg>'
 );
}

async function api(path,options={}){
 const url=
 "https://firestore.googleapis.com/v1/projects/"+
 PROJECT_ID+
 "/databases/(default)/documents"+
 path+
 (path.includes("?")?"&":"?")+"key="+API_KEY;

 return fetch(url,{
  ...options,
  headers:{
   Authorization:"Bearer "+token,
   "Content-Type":"application/json",
   ...(options.headers||{})
  }
 });
}

function userData(data){
 const f=data.fields||{};
 return{
  uid:f.uid?.stringValue||"",
  name:f.name?.stringValue||"User",
  username:f.username?.stringValue||"user",
  photoURL:f.photoURL?.stringValue||""
 };
}

async function getUser(id){
 const r=await api("/users/"+encodeURIComponent(id));
 if(!r.ok)return null;
 return userData(await r.json());
}

async function loadActivity(){

 try{

  const rows=await api(
   "/follows?pageSize=100"
  );

  if(!rows.ok)throw new Error();

  const data=await rows.json();
  const docs=data.documents||[];

  const following=[];
  const followers=[];

  docs.forEach(doc=>{
   const f=doc.fields||{};
   const follower=f.followerId?.stringValue||"";
   const followingId=f.followingId?.stringValue||"";

   if(follower===uid&&followingId){
    following.push(followingId);
   }

   if(followingId===uid&&follower){
    followers.push(follower);
   }
  });

  const ids=[...new Set([
   ...following,
   ...followers
  ])];

  if(!ids.length){
   activity.innerHTML=
   '<div class="empty">🔔<br><br>'+
   'No new activity yet.</div>';
   return;
  }

  const users=await Promise.all(
   ids.map(id=>getUser(id))
  );

  const valid=users.filter(Boolean);

  if(!valid.length){
   activity.innerHTML=
   '<div class="empty">No new activity yet.</div>';
   return;
  }

  activity.innerHTML=
   '<div class="title">Recent activity</div>';

  valid.forEach(u=>{

   const isFollower=
    followers.includes(u.uid);

   const isFollowing=
    following.includes(u.uid);

   let text="";

   if(isFollower&&isFollowing){
    text="You follow each other.";
   }else if(isFollower){
    text="Started following you.";
   }else if(isFollowing){
    text="You started following this user.";
   }

   const card=document.createElement("div");
   card.className="card";

   card.innerHTML=`
    <img class="avatar"
     src="${esc(u.photoURL||photo())}" alt="">

    <div class="info">
     <div class="name">${esc(u.name)}</div>
     <div class="text">
      @${esc(u.username)} · ${esc(text)}
     </div>
    </div>
   `;

   card.onclick=()=>{
    sessionStorage.setItem(
     "crockcell_profile_target",
     JSON.stringify(u)
    );
    location.href="profile.html";
   };

   activity.appendChild(card);
  });

 }catch(e){

  console.error(e);

  activity.innerHTML=
   '<div class="empty">'+
   'Activity load nahi ho paayi.<br><br>'+
   'Page refresh karke dobara try karo.'+
   '</div>';
 }
}

loadActivity();
</script>

</body>
</html>
