<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CROCKCELL - Sign Up</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#fafafa;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:410px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:28px 22px;
}

h1{
  text-align:center;
  font-size:30px;
  margin-bottom:7px;
}

.sub{
  text-align:center;
  color:#777;
  margin-bottom:22px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  margin-bottom:12px;
  outline:none;
}

input:focus{
  border-color:#555;
}

.passwordBox{
  position:relative;
  margin-bottom:12px;
}

.passwordBox input{
  margin-bottom:0;
  padding-right:75px;
}

.showBtn{
  position:absolute;
  right:7px;
  top:7px;
  border:0;
  background:#eee;
  padding:7px 11px;
  border-radius:6px;
}

.phoneRow{
  display:flex;
  gap:8px;
}

.phoneRow input{
  flex:1;
}

.otpBtn{
  border:0;
  border-radius:8px;
  background:#000;
  color:#fff;
  padding:0 13px;
  font-size:14px;
}

.verifyBtn,
.createBtn{
  width:100%;
  border:0;
  border-radius:8px;
  padding:13px;
  font-size:16px;
}

.verifyBtn{
  background:#16852a;
  color:#fff;
  margin-top:8px;
}

.createBtn{
  background:#000;
  color:#fff;
  margin-top:12px;
}

.status{
  min-height:22px;
  text-align:center;
  margin:13px 0;
  font-size:14px;
}

.ok{
  color:green;
  font-weight:bold;
}

.error{
  color:#d00000;
}

.note{
  color:#777;
  font-size:12px;
  margin-top:-7px;
  margin-bottom:12px;
}

#recaptcha-container{
  display:flex;
  justify-content:center;
  margin:8px 0;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#333;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<h1>CROCKCELL</h1>
<div class="sub">Create your account</div>

<input
  id="name"
  type="text"
  placeholder="Full Name"
>

<input
  id="username"
  type="text"
  placeholder="Username"
>

<input
  id="email"
  type="email"
  placeholder="Email"
>

<div class="passwordBox">

<input
  id="password"
  type="password"
  placeholder="Password"
>

<button
  type="button"
  class="showBtn"
  id="showPassword"
>
Show
</button>

</div>

<div class="phoneRow">

<input
  id="phone"
  type="tel"
  inputmode="tel"
  placeholder="Mobile Number"
>

<button
  type="button"
  class="otpBtn"
  id="sendOtp"
>
Send OTP
</button>

</div>

<div class="note">
India number enter karo, jaise 9876543210
</div>

<div id="recaptcha-container"></div>

<input
  id="otp"
  type="text"
  inputmode="numeric"
  maxlength="6"
  placeholder="6 digit OTP"
>

<button
  type="button"
  class="verifyBtn"
  id="verifyOtp"
>
Verify Mobile
</button>

<div
  id="status"
  class="status"
></div>

<button
  type="button"
  class="createBtn"
  id="createAccount"
>
Create Account
</button>

<a
  class="back"
  href="index.html"
>
Already have an account? Login
</a>

</div>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk",
  authDomain: "crockcell-cd2e6.firebaseapp.com",
  projectId: "crockcell-cd2e6",
  storageBucket: "crockcell-cd2e6.firebasestorage.app",
  messagingSenderId: "272223260943",
  appId: "1:272223260943:web:14db9eda3a5ba4b137ae7a",
  measurementId: "G-GG36JYC0DX"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const API_KEY = firebaseConfig.apiKey;


/* =========================
   VARIABLES
========================= */

let confirmationResult = null;
let verifiedPhone = false;


/* =========================
   ELEMENTS
========================= */

const nameInput =
  document.getElementById("name");

const usernameInput =
  document.getElementById("username");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const phoneInput =
  document.getElementById("phone");

const otpInput =
  document.getElementById("otp");

const statusBox =
  document.getElementById("status");

const sendOtpButton =
  document.getElementById("sendOtp");

const verifyOtpButton =
  document.getElementById("verifyOtp");

const createAccountButton =
  document.getElementById("createAccount");

const showPasswordButton =
  document.getElementById("showPassword");


/* =========================
   SHOW / HIDE PASSWORD
========================= */

showPasswordButton.addEventListener(
  "click",
  function(){

    if(passwordInput.type === "password"){

      passwordInput.type = "text";
      showPasswordButton.textContent = "Hide";

    }else{

      passwordInput.type = "password";
      showPasswordButton.textContent = "Show";

    }

  }
);


/* =========================
   STATUS
========================= */

function showStatus(message,type=""){

  statusBox.textContent = message;

  statusBox.className =
    "status " + type;

}


/* =========================
   PHONE FORMAT
========================= */

function getPhone(){

  let phone =
    phoneInput.value.trim();

  phone =
    phone.replace(/\s+/g,"");

  if(phone.startsWith("+91")){
    phone =
      phone.substring(3);
  }

  if(
    phone.startsWith("91") &&
    phone.length === 12
  ){
    phone =
      phone.substring(2);
  }

  if(!/^[6-9][0-9]{9}$/.test(phone)){
    return null;
  }

  return "+91" + phone;
}


/* =========================
   CREATE RECAPTCHA
========================= */

function createRecaptcha(){

  return new firebase.auth.RecaptchaVerifier(
    "recaptcha-container",
    {
      size:"normal",

      callback:function(){
        console.log("reCAPTCHA completed");
      },

      "expired-callback":function(){

        showStatus(
          "reCAPTCHA expire ho gaya. Dobara OTP bhejo.",
          "error"
        );

      }
    },
    auth
  );
}


/* =========================
   SEND OTP
========================= */

sendOtpButton.addEventListener(
  "click",
  async function(){

    const phone =
      getPhone();

    if(!phone){

      showStatus(
        "Valid 10 digit Indian mobile number enter karo.",
        "error"
      );

      return;
    }

    try{

      sendOtpButton.disabled = true;

      showStatus(
        "reCAPTCHA load ho raha hai..."
      );

      const verifier =
        createRecaptcha();

      await verifier.render();

      showStatus(
        "OTP bheja ja raha hai..."
      );

      confirmationResult =
        await auth.signInWithPhoneNumber(
          phone,
          verifier
        );

      showStatus(
        "OTP tumhare mobile par bhej diya gaya hai."
      );

    }catch(error){

      console.error(error);

      sendOtpButton.disabled = false;

      if(error.code === "auth/invalid-api-key"){

        showStatus(
          "Firebase API key Phone Auth ke liye accept nahi ho rahi.",
          "error"
        );

      }
      else if(error.code === "auth/unauthorized-domain"){

        showStatus(
          "Website domain Firebase me authorized nahi hai.",
          "error"
        );

      }
      else if(error.code === "auth/operation-not-allowed"){

        showStatus(
          "Firebase Phone Authentication enabled nahi hai.",
          "error"
        );

      }
      else if(error.code === "auth/invalid-phone-number"){

        showStatus(
          "Mobile number galat hai.",
          "error"
        );

      }
      else if(error.code === "auth/quota-exceeded"){

        showStatus(
          "SMS quota exceed ho gaya.",
          "error"
        );

      }
      else{

        showStatus(
          "OTP error: " + error.message,
          "error"
        );

      }

    }

  }
);


/* =========================
   VERIFY OTP
========================= */

verifyOtpButton.addEventListener(
  "click",
  async function(){

    if(!confirmationResult){

      showStatus(
        "Pehle Send OTP dabao.",
        "error"
      );

      return;
    }

    const code =
      otpInput.value.trim();

    if(!/^[0-9]{6}$/.test(code)){

      showStatus(
        "6 digit OTP enter karo.",
        "error"
      );

      return;
    }

    try{

      showStatus(
        "OTP verify ho raha hai..."
      );

      const result =
        await confirmationResult.confirm(code);

      if(!result.user){

        throw new Error(
          "Firebase user nahi mila."
        );

      }

      verifiedPhone = true;

      phoneInput.disabled = true;
      otpInput.disabled = true;
      sendOtpButton.disabled = true;
      verifyOtpButton.disabled = true;

      showStatus(
        "Mobile number verified ✓",
        "ok"
      );

    }catch(error){

      console.error(error);

      if(
        error.code ===
        "auth/invalid-verification-code"
      ){

        showStatus(
          "OTP galat hai.",
          "error"
        );

      }
      else if(
        error.code ===
        "auth/code-expired"
      ){

        showStatus(
          "OTP expire ho gaya. Dobara OTP bhejo.",
          "error"
        );

      }
      else{

        showStatus(
          "OTP verification failed: " +
          error.message,
          "error"
        );

      }

    }

  }
);


/* =========================
   CREATE ACCOUNT
========================= */

createAccountButton.addEventListener(
  "click",
  async function(){

    const name =
      nameInput.value.trim();

    const username =
      usernameInput.value.trim();

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    const phone =
      getPhone();


    /* BASIC CHECKS */

    if(!name){

      showStatus(
        "Name enter karo.",
        "error"
      );

      return;
    }

    if(!username){

      showStatus(
        "Username enter karo.",
        "error"
      );

      return;
    }

    if(!email){

      showStatus(
        "Email enter karo.",
        "error"
      );

      return;
    }

    if(password.length < 6){

      showStatus(
        "Password kam se kam 6 characters ka hona chahiye.",
        "error"
      );

      return;
    }

    if(!phone){

      showStatus(
        "Valid mobile number enter karo.",
        "error"
      );

      return;
    }

    if(!verifiedPhone){

      showStatus(
        "Pehle mobile number verify karo.",
        "error"
      );

      return;
    }


    try{

      createAccountButton.disabled = true;

      showStatus(
        "Account create ho raha hai..."
      );


      /*
       IMPORTANT:
       OTP verify karne ke baad Firebase me
       current user phone account hai.

       Ab usi user ke saath email/password
       link kar rahe hain.
      */

      const currentUser =
        auth.currentUser;

      if(!currentUser){

        throw new Error(
          "Verified Firebase user nahi mila. Dobara OTP verify karo."
        );

      }


      /* EMAIL + PASSWORD LINK */

      const credential =
        firebase.auth.EmailAuthProvider.credential(
          email,
          password
        );

      const linked =
        await currentUser.linkWithCredential(
          credential
        );


      /* TOKEN */

      const user =
        linked.user;

      const idToken =
        await user.getIdToken(true);

      const refreshToken =
        user.refreshToken;

      const uid =
        user.uid;


      /* =========================
         FIRESTORE PROFILE
      ========================= */

      const now =
        new Date().toISOString();

      const firestoreURL =
        "https://firestore.googleapis.com/v1/projects/" +
        firebaseConfig.projectId +
        "/databases/(default)/documents/users/" +
        uid +
        "?key=" +
        API_KEY;


      const firestoreResponse =
        await fetch(
          firestoreURL,
          {
            method:"PATCH",

            headers:{
              "Authorization":
                "Bearer " + idToken,

              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              fields:{

                uid:{
                  stringValue:uid
                },

                name:{
                  stringValue:name
                },

                username:{
                  stringValue:username
                },

                email:{
                  stringValue:email
                },

                phoneNumber:{
                  stringValue:phone
                },

                phoneVerified:{
                  booleanValue:true
                },

                photoURL:{
                  stringValue:""
                },

                bio:{
                  stringValue:""
                },

                createdAt:{
                  stringValue:now
                },

                updatedAt:{
                  stringValue:now
                }

              }

            })
          }
        );


      if(!firestoreResponse.ok){

        const firestoreError =
          await firestoreResponse.text();

        console.error(
          "Firestore error:",
          firestoreError
        );

        throw new Error(
          "Account ban gaya, lekin profile save nahi hui."
        );

      }


      /* =========================
         LOCAL STORAGE
      ========================= */

      localStorage.setItem(
        "crockcellIdToken",
        idToken
      );

      localStorage.setItem(
        "crockcellRefreshToken",
        refreshToken
      );

      localStorage.setItem(
        "crockcellUid",
        uid
      );

      localStorage.setItem(
        "crockcellProfile",
        JSON.stringify({

          email:email,

          uid:uid,

          name:name,

          username:username,

          phoneNumber:phone,

          phoneVerified:true

        })
      );


      showStatus(
        "CROCKCELL account successfully create ho gaya ✓",
        "ok"
      );


      setTimeout(
        function(){

          location.href =
            "home.html";

        },
        1200
      );


    }catch(error){

      console.error(error);

      createAccountButton.disabled = false;


      if(
        error.code ===
        "auth/email-already-in-use"
      ){

        showStatus(
          "Ye email already kisi account me registered hai.",
          "error"
        );

      }
      else if(
        error.code ===
        "auth/provider-already-linked"
      ){

        showStatus(
          "Email/password already linked hai.",
          "error"
        );

      }
      else if(
        error.code ===
        "auth/credential-already-in-use"
      ){

        showStatus(
          "Ye email kisi dusre Firebase account me use ho raha hai.",
          "error"
        );

      }
      else{

        showStatus(
          "Signup error: " +
          error.message,
          "error"
        );

      }

    }

  }
);

</script>

</body>
</html>
