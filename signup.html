<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROCKCELL Signup</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px
}
.box{
width:100%;
max-width:380px;
background:#111;
border:1px solid #222;
border-radius:16px;
padding:25px
}
h1{
text-align:center;
letter-spacing:2px;
margin-top:0
}
input{
width:100%;
padding:13px;
margin:7px 0;
border-radius:9px;
border:1px solid #333;
background:#050505;
color:#fff;
outline:none
}
button{
width:100%;
padding:13px;
margin-top:10px;
border:0;
border-radius:9px;
background:#fff;
color:#000;
font-weight:bold;
cursor:pointer
}
p{
text-align:center;
color:#aaa;
font-size:14px
}
a{color:#fff}
#msg{
text-align:center;
margin-top:12px;
font-size:14px
}
</style>
</head>

<body>

<div class="box">

<h1>CROCKCELL</h1>

<input id="name" placeholder="Full name">
<input id="username" placeholder="Username">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="signup()">Create account</button>

<div id="msg"></div>

<p>
Already have an account?
<a href="index.html">Login</a>
</p>

</div>

<script>

const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8wAgcjHzt2ORJk";
const PROJECT_ID="crockcell-cd2e6";

const BASE=
`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

async function signup(){

const name=document.getElementById("name").value.trim();
const username=document.getElementById("username").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

const msg=document.getElementById("msg");

if(!name||!username||!email||!password){
msg.style.color="#ff7777";
msg.textContent="Please fill all fields.";
return;
}

if(password.length<6){
msg.style.color="#ff7777";
msg.textContent="Password must be at least 6 characters.";
return;
}

msg.style.color="#aaa";
msg.textContent="Creating account...";

try{

const auth=await fetch(
`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
password:password,
returnSecureToken:true
})
}
);

const data=await auth.json();

if(!auth.ok){

let error=data.error?.message||"Signup failed";

if(error==="EMAIL_EXISTS")
error="This email is already registered.";

if(error==="INVALID_EMAIL")
error="Invalid email address.";

msg.style.color="#ff7777";
msg.textContent=error;
return;
}

/* Save authentication */

localStorage.setItem(
"crockcellIdToken",
data.idToken
);

localStorage.setItem(
"crockcellRefreshToken",
data.refreshToken
);

localStorage.setItem(
"crockcellUid",
data.localId
);

localStorage.setItem(
"crockcellProfile",
JSON.stringify({
name:name,
username:username,
email:email,
uid:data.localId
})
);

/* Create Firestore profile */

const profile={
fields:{
name:{stringValue:name},
username:{stringValue:username},
email:{stringValue:email},
uid:{stringValue:data.localId},
bio:{stringValue:""},
photoURL:{stringValue:""},
createdAt:{
timestampValue:new Date().toISOString()
}
}
};

await fetch(
`${BASE}/users/${data.localId}`,
{
method:"PATCH",
headers:{
"Content-Type":"application/json",
Authorization:`Bearer ${data.idToken}`
},
body:JSON.stringify(profile)
}
);

msg.style.color="#55ff88";
msg.textContent="Signup successful! Opening CROCKCELL...";

setTimeout(()=>{
location.href="home.html";
},500);

}catch(e){

msg.style.color="#ff7777";
msg.textContent="Network error. Please try again.";

}

}

</script>

</body>
</html>
