<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CROCKCELL - Sign Up</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:400px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#111;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.message{
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.login{
    text-align:center;
    margin-top:18px;
    font-size:14px;
}

.login a{
    color:#111;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">CROCKCELL</div>

    <div class="subtitle">
        Create your account
    </div>

    <input
        type="text"
        id="name"
        placeholder="Full name"
    >

    <input
        type="text"
        id="username"
        placeholder="Username"
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm password"
    >

    <button
        id="signupBtn"
        onclick="signup()">
        Create Account
    </button>

    <div
        class="message"
        id="message">
    </div>

    <div class="login">
        Already have an account?
        <a href="index.html">Login</a>
    </div>

</div>


<script>

/* FIREBASE API KEY */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";


async function signup(){

    const name =
        document.getElementById("name")
        .value.trim();

    const username =
        document.getElementById("username")
        .value.trim();

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const confirmPassword =
        document.getElementById("confirmPassword")
        .value;

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("signupBtn");


    message.innerText = "";


    if(!name || !username || !email ||
       !password || !confirmPassword){

        message.innerText =
            "Please fill all fields.";

        return;
    }


    if(password !== confirmPassword){

        message.innerText =
            "Passwords do not match.";

        return;
    }


    if(password.length < 6){

        message.innerText =
            "Password must be at least 6 characters.";

        return;
    }


    button.disabled = true;

    message.innerText =
        "Creating account...";


    try{

        /* CREATE FIREBASE AUTH ACCOUNT */

        const authResponse =
            await fetch(
                "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="
                + API_KEY,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        email:email,

                        password:password,

                        returnSecureToken:true

                    })
                }
            );


        const authData =
            await authResponse.json();


        if(!authResponse.ok){

            throw new Error(
                authData.error?.message ||
                "Signup failed"
            );

        }


        const uid =
            authData.localId;

        const idToken =
            authData.idToken;


        /* SAVE USER PROFILE IN FIRESTORE */

        const userData = {

            name:name,

            username:username,

            email:email,

            uid:uid,

            bio:"",

            photoURL:"",

            createdAt:
                new Date().toISOString()

        };


        const firestoreResponse =
            await fetch(

                "https://firestore.googleapis.com/v1/projects/"
                + "crockcell-cd2e6"
                + "/databases/(default)/documents/users/"
                + uid
                + "?updateMask.fieldPaths=name"
                + "&updateMask.fieldPaths=username"
                + "&updateMask.fieldPaths=email"
                + "&updateMask.fieldPaths=uid"
                + "&updateMask.fieldPaths=bio"
                + "&updateMask.fieldPaths=photoURL"
                + "&updateMask.fieldPaths=createdAt",

                {

                    method:"PATCH",

                    headers:{

                        "Content-Type":
                        "application/json",

                        "Authorization":
                        "Bearer " + idToken

                    },

                    body:JSON.stringify({

                        fields:{

                            name:{
                                stringValue:name
                            },

                            username:{
                                stringValue:username
                            },

                            email:{
                                stringValue:email
                            },

                            uid:{
                                stringValue:uid
                            },

                            bio:{
                                stringValue:""
                            },

                            photoURL:{
                                stringValue:""
                            },

                            createdAt:{
                                stringValue:
                                userData.createdAt
                            }

                        }

                    })

                }

            );


        const firestoreData =
            await firestoreResponse.json();


        if(!firestoreResponse.ok){

            console.log(
                "Firestore error:",
                firestoreData
            );

            throw new Error(
                "Account created, but profile could not be saved."
            );

        }


        /* SAVE LOGIN INFORMATION */

        localStorage.setItem(
            "crockcellIdToken",
            idToken
        );

        localStorage.setItem(
            "crockcellUid",
            uid
        );

        localStorage.setItem(
            "crockcellProfile",
            JSON.stringify(userData)
        );


        message.innerText =
            "Account created successfully!";


        /* GO TO HOME */

        setTimeout(function(){

            window.location.replace(
                "home.html"
            );

        },700);


    }catch(error){

        console.log(error);

        let errorMessage =
            error.message;


        if(errorMessage ===
           "EMAIL_EXISTS"){

            errorMessage =
                "This email is already registered.";

        }


        if(errorMessage ===
           "INVALID_EMAIL"){

            errorMessage =
                "Please enter a valid email.";

        }


        message.innerText =
            errorMessage;


        button.disabled = false;

    }

}

</script>

</body>
</html>
