<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Account - CROCKCELL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#080808,#171717,#301b52);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  color:#fff;
}

.container{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(18px);
  border-radius:28px;
  padding:28px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  letter-spacing:1px;
}

.subtitle{
  text-align:center;
  color:#bbb;
  margin:6px 0 25px;
  font-size:14px;
}

.field{
  margin-bottom:14px;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  color:#ddd;
}

input{
  width:100%;
  padding:14px 15px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:15px;
  background:rgba(0,0,0,.28);
  color:#fff;
  outline:0;
  font-size:15px;
}

input::placeholder{
  color:#888;
}

input:focus{
  border-color:#a78bfa;
  box-shadow:0 0 0 3px rgba(167,139,250,.14);
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:72px;
}

.show-btn{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#c4b5fd;
  font-weight:700;
  padding:8px;
}

.hint{
  margin-top:5px;
  font-size:11px;
  color:#999;
}

.create-btn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:15px;
  margin-top:7px;
  background:linear-gradient(135deg,#7c3aed,#ec4899);
  color:#fff;
  font-size:16px;
  font-weight:800;
}

.create-btn:disabled{
  opacity:.6;
}

.message{
  min-height:22px;
  text-align:center;
  margin:14px 0 4px;
  font-size:13px;
  line-height:1.4;
}

.login{
  text-align:center;
  margin-top:18px;
  color:#bbb;
  font-size:14px;
}

.login a{
  color:#c4b5fd;
  text-decoration:none;
  font-weight:700;
}

.note{
  margin-top:17px;
  padding:11px;
  border-radius:14px;
  background:rgba(255,255,255,.05);
  color:#aaa;
  font-size:11px;
  text-align:center;
  line-height:1.45;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">CROCKCELL</div>

<div class="subtitle">
Create your account
</div>

<div class="field">
<label>Full Name</label>

<input
id="name"
type="text"
placeholder="Enter your full name"
autocomplete="name">
</div>


<div class="field">

<label>Username</label>

<input
id="username"
type="text"
placeholder="e.g. krishna_007"
maxlength="30"
autocomplete="username"
autocapitalize="none">

<div class="hint">
3-30 characters: lowercase letters, numbers and _
</div>

</div>


<div class="field">

<label>Email</label>

<input
id="email"
type="email"
placeholder="Enter your email"
autocomplete="email">

</div>


<div class="field">

<label>Password</label>

<div class="password-box">

<input
id="password"
type="password"
placeholder="Create a password"
autocomplete="new-password">

<button
id="showPassword"
class="show-btn"
type="button">
Show
</button>

</div>

<div class="hint">
Password must contain at least 6 characters.
</div>

</div>


<button
id="createAccount"
class="create-btn"
type="button">

Create Account

</button>


<div
id="message"
class="message">
</div>


<div class="login">

Already have an account?

<a href="index.html">
Login
</a>

</div>


<div class="note">

Phone verification is not required right now.
Email + password is used for signup.

</div>

</div>


<script>

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


const nameInput =
document.getElementById("name");

const usernameInput =
document.getElementById("username");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const createBtn =
document.getElementById("createAccount");

const messageBox =
document.getElementById("message");


function showMessage(text,type="normal"){

messageBox.textContent=text;

messageBox.style.color =
type==="error"
?
"#fca5a5"
:
type==="success"
?
"#86efac"
:
"#ddd";

}


document.getElementById("showPassword").onclick=()=>{

passwordInput.type =
passwordInput.type==="password"
?
"text"
:
"password";

document.getElementById("showPassword").textContent =
passwordInput.type==="password"
?
"Show"
:
"Hide";

};


function firestoreUrl(collection,id=""){

return `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/${collection}${id?"/"+encodeURIComponent(id):""}?key=${API_KEY}`;

}


async function firestoreGet(collection,id,token){

return fetch(
firestoreUrl(collection,id),
{
headers:{
Authorization:"Bearer "+token
}
}
);

}


async function firestorePatch(
collection,
id,
fields,
token
){

const response =
await fetch(
firestoreUrl(collection,id),
{
method:"PATCH",

headers:{
"Content-Type":
"application/json",

Authorization:
"Bearer "+token
},

body:JSON.stringify({
fields:fields
})
}
);

const data =
await response.json();

if(!response.ok){

const error =
new Error(
data.error?.message ||
"Firestore save failed"
);

error.data=data;

throw error;

}

return data;

}


async function deleteAuthAccount(idToken){

try{

await fetch(
`https://identitytoolkit.googleapis.com/v1/accounts:delete?key=${API_KEY}`,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
idToken:idToken
})
}
);

}
catch(error){

console.log(error);

}

}


function fieldString(value){

return {
stringValue:
String(value ?? "")
};

}


createBtn.onclick =
async()=>{

const name =
nameInput.value.trim();

const username =
usernameInput.value
.trim()
.toLowerCase();

const email =
emailInput.value
.trim()
.toLowerCase();

const password =
passwordInput.value;


if(!name){

showMessage(
"Please enter your full name.",
"error"
);

return;

}


if(
!/^[a-z0-9_]{3,30}$/.test(
username
)
){

showMessage(
"Username must be 3-30 characters and use only lowercase letters, numbers and _.",
"error"
);

return;

}


if(
!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
email
)
){

showMessage(
"Please enter a valid email.",
"error"
);

return;

}


if(password.length<6){

showMessage(
"Password must contain at least 6 characters.",
"error"
);

return;

}


createBtn.disabled=true;


try{

/* CHECK USERNAME */

showMessage(
"Checking username..."
);


const existing =
await firestoreGet(
"usernameIndex",
username,
null
);


if(existing.ok){

showMessage(
"This username is already taken. Please choose another.",
"error"
);

createBtn.disabled=false;

return;

}


/* CREATE AUTH */

showMessage(
"Creating your account..."
);


const authResponse =
await fetch(
`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email:email,

password:password,

returnSecureToken:true

})
}
);


const auth =
await authResponse.json();


if(!authResponse.ok){

const code =
auth.error?.message ||
"Account creation failed.";

let message=code;


if(code==="EMAIL_EXISTS"){

message=
"This email is already registered.";

}

else if(
code.includes("WEAK_PASSWORD")
){

message=
"Password is too weak.";

}

showMessage(
message,
"error"
);

createBtn.disabled=false;

return;

}


const uid =
auth.localId;

const idToken =
auth.idToken;

const refreshToken =
auth.refreshToken;

const now =
new Date().toISOString();


try{

/* USERNAME INDEX */

await firestorePatch(
"usernameIndex",
username,
{

username:
fieldString(username),

uid:
fieldString(uid),

email:
fieldString(email),

createdAt:
fieldString(now)

},
idToken
);


/* USER PROFILE */

await firestorePatch(
"users",
uid,
{

uid:
fieldString(uid),

name:
fieldString(name),

username:
fieldString(username),

email:
fieldString(email),

photoURL:
fieldString(""),

bio:
fieldString(""),

phoneNumber:
fieldString(""),

phoneVerified:
{
booleanValue:false
},

createdAt:
fieldString(now),

updatedAt:
fieldString(now)

},
idToken
);

}
catch(error){

await deleteAuthAccount(
idToken
);

throw error;

}


/* PROFILE */

const profile={

uid:uid,

name:name,

username:username,

email:email,

photoURL:"",

bio:"",

phoneNumber:"",

phoneVerified:false

};


/* CURRENT KEYS */

localStorage.setItem(
"crockcell_idToken",
idToken
);

localStorage.setItem(
"crockcell_refreshToken",
refreshToken
);

localStorage.setItem(
"crockcell_uid",
uid
);

localStorage.setItem(
"crockcell_profile",
JSON.stringify(profile)
);


/* OLD KEYS */

localStorage.setItem(
"crockcellIdToken",
idToken
);

localStorage.setItem(
"crockcellRefreshToken",
refreshToken
);

localStorage.setItem(
"crockcellUid",
uid
);

localStorage.setItem(
"crockcellProfile",
JSON.stringify(profile)
);


showMessage(
"Account created successfully! Opening CROCKCELL...",
"success"
);


setTimeout(
()=>{
location.href="home.html";
},
900
);


}
catch(error){

console.error(error);

showMessage(
error.message ||
"Something went wrong. Please try again.",
"error"
);

createBtn.disabled=false;

}

};

</script>

</body>
</html>
