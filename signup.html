<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CROCKCELL - Sign Up</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      min-height:100vh;
      background:#000;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .box{
      width:100%;
      max-width:420px;
      text-align:center;
    }

    .logo{
      font-size:40px;
      font-weight:800;
      letter-spacing:2px;
      margin-bottom:8px;
    }

    .tagline{
      color:#aaa;
      font-size:14px;
      margin-bottom:25px;
    }

    .input-box{
      position:relative;
      margin-bottom:13px;
    }

    input{
      width:100%;
      padding:15px;
      padding-right:55px;
      border:1px solid #333;
      border-radius:12px;
      background:#111;
      color:#fff;
      font-size:16px;
      outline:none;
    }

    input:focus{
      border-color:#777;
    }

    .toggle{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:transparent;
      color:#aaa;
      cursor:pointer;
      padding:8px;
    }

    .otp-row{
      display:flex;
      gap:8px;
    }

    .otp-row input{
      flex:1;
      min-width:0;
    }

    .small-btn{
      width:125px;
      border:none;
      border-radius:12px;
      background:#222;
      color:#fff;
      font-weight:bold;
      cursor:pointer;
    }

    .small-btn:disabled{
      opacity:.5;
    }

    .main-btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:12px;
      background:#fff;
      color:#000;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      margin-top:5px;
    }

    .main-btn:disabled{
      opacity:.5;
    }

    .message{
      min-height:22px;
      margin-top:15px;
      font-size:14px;
      color:#ff7777;
    }

    .login{
      margin-top:20px;
      color:#aaa;
      font-size:14px;
    }

    .login a{
      color:#fff;
      text-decoration:none;
      font-weight:bold;
    }

    #recaptcha-container{
      margin:12px 0;
      display:flex;
      justify-content:center;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">CROCKCELL</div>

  <div class="tagline">
    Create your account
  </div>

  <form id="signupForm">

    <div class="input-box">
      <input
        type="text"
        id="name"
        placeholder="Full Name"
        autocomplete="name"
        required
      >
    </div>

    <div class="input-box">
      <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
        required
      >
    </div>

    <div class="input-box">
      <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
        required
      >
    </div>

    <div class="input-box">
      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="new-password"
        required
      >

      <button
        type="button"
        class="toggle"
        id="togglePassword"
      >
        Show
      </button>
    </div>

    <div class="input-box">
      <input
        type="tel"
        id="phone"
        placeholder="Mobile Number (+91XXXXXXXXXX)"
        autocomplete="tel"
        required
      >
    </div>

    <div class="otp-row">

      <input
        type="text"
        id="otp"
        placeholder="OTP"
        inputmode="numeric"
        maxlength="6"
      >

      <button
        type="button"
        class="small-btn"
        id="sendOtp"
      >
        Send OTP
      </button>

    </div>

    <div id="recaptcha-container"></div>

    <button
      type="button"
      class="main-btn"
      id="verifyOtp"
    >
      Verify Mobile
    </button>

    <button
      type="submit"
      class="main-btn"
      id="createAccount"
      style="margin-top:12px;"
    >
      Create Account
    </button>

  </form>

  <div class="message" id="message"></div>

  <div class="login">
    Already have an account?
    <a href="index.html">Login</a>
  </div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>


<script>

const firebaseConfig = {

  apiKey:"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk",

  authDomain:"crockcell-cd2e6.firebaseapp.com",

  projectId:"crockcell-cd2e6",

  storageBucket:"crockcell-cd2e6.firebasestorage.app",

  messagingSenderId:"272223260943",

  appId:"1:272223260943:web:14db9eda3a5ba4b137ae7a",

  measurementId:"G-GG36JYC0DX"

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();


const API_KEY =
  "AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
  "crockcell-cd2e6";


const nameInput =
  document.getElementById("name");

const usernameInput =
  document.getElementById("username");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const phoneInput =
  document.getElementById("phone");

const otpInput =
  document.getElementById("otp");

const sendOtp =
  document.getElementById("sendOtp");

const verifyOtp =
  document.getElementById("verifyOtp");

const createAccount =
  document.getElementById("createAccount");

const togglePassword =
  document.getElementById("togglePassword");

const message =
  document.getElementById("message");


let confirmationResult = null;

let phoneVerified = false;

let recaptchaVerifier = null;


/* PASSWORD SHOW / HIDE */

togglePassword.addEventListener("click",function(){

  if(passwordInput.type === "password"){

    passwordInput.type = "text";

    togglePassword.textContent = "Hide";

  }else{

    passwordInput.type = "password";

    togglePassword.textContent = "Show";

  }

});


/* MESSAGE */

function showMessage(text,color="#ff7777"){

  message.style.color = color;

  message.textContent = text;

}


/* USERNAME CHECK */

async function usernameExists(username){

  const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/usernameIndex/" +
    encodeURIComponent(username) +
    "?key=" +
    API_KEY;


  const response =
    await fetch(url);


  if(response.status === 404){

    return false;

  }


  if(!response.ok){

    throw new Error(
      "Username check nahi ho pa raha."
    );

  }


  return true;

}


/* CREATE RECAPTCHA */

function setupRecaptcha(){

  if(recaptchaVerifier){

    return;

  }


  recaptchaVerifier =
    new firebase.auth.RecaptchaVerifier(
      "recaptcha-container",
      {
        size:"normal"
      }
    );

}


/* SEND OTP */

sendOtp.addEventListener("click",async function(){

  try{

    let phone =
      phoneInput.value.trim();


    if(!phone){

      showMessage(
        "Mobile number enter karo."
      );

      return;

    }


    if(!phone.startsWith("+")){

      phone =
        "+91" +
        phone.replace(/\D/g,"");

    }


    if(phone.length !== 13){

      showMessage(
        "Valid Indian mobile number enter karo."
      );

      return;

    }


    sendOtp.disabled = true;

    sendOtp.textContent = "Sending...";


    setupRecaptcha();


    confirmationResult =
      await auth.signInWithPhoneNumber(
        phone,
        recaptchaVerifier
      );


    showMessage(
      "OTP bhej diya gaya hai.",
      "#77ff99"
    );


    sendOtp.textContent =
      "OTP Sent";


  }catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "OTP send nahi ho paya."
    );


    sendOtp.disabled = false;

    sendOtp.textContent =
      "Send OTP";

  }

});


/* VERIFY OTP */

verifyOtp.addEventListener("click",async function(){

  try{

    if(!confirmationResult){

      showMessage(
        "Pehle Send OTP dabao."
      );

      return;

    }


    const code =
      otpInput.value.trim();


    if(code.length !== 6){

      showMessage(
        "6 digit OTP enter karo."
      );

      return;

    }


    verifyOtp.disabled = true;

    verifyOtp.textContent =
      "Verifying...";


    await confirmationResult.confirm(code);


    phoneVerified = true;


    showMessage(
      "Mobile number verified!",
      "#77ff99"
    );


    verifyOtp.textContent =
      "Mobile Verified";


  }catch(error){

    console.error(error);

    phoneVerified = false;

    verifyOtp.disabled = false;

    verifyOtp.textContent =
      "Verify Mobile";


    showMessage(
      "OTP galat ya expire ho gaya."
    );

  }

});


/* CREATE ACCOUNT */

document.getElementById("signupForm")
.addEventListener("submit",async function(e){

  e.preventDefault();


  try{

    const name =
      nameInput.value.trim();


    const username =
      usernameInput.value
      .trim()
      .toLowerCase();


    const email =
      emailInput.value.trim()
      .toLowerCase();


    const password =
      passwordInput.value;


    const phone =
      phoneInput.value.trim();


    /* VALIDATION */

    if(name.length < 2){

      throw new Error(
        "Full Name enter karo."
      );

    }


    if(!/^[a-z0-9_]{3,30}$/.test(username)){

      throw new Error(
        "Username 3-30 characters ka ho. Sirf a-z, 0-9 aur _ use karo."
      );

    }


    if(password.length < 6){

      throw new Error(
        "Password kam se kam 6 characters ka hona chahiye."
      );

    }


    if(!phoneVerified){

      throw new Error(
        "Pehle mobile number verify karo."
      );

    }


    createAccount.disabled = true;

    createAccount.textContent =
      "Creating Account...";


    /* CHECK USERNAME */

    const exists =
      await usernameExists(username);


    if(exists){

      throw new Error(
        "Ye username already taken hai."
      );

    }


    /*
      PHONE USER CURRENTLY LOGGED IN HAI
      PHONE AUTH KE THROUGH
    */

    const currentUser =
      auth.currentUser;


    if(!currentUser){

      throw new Error(
        "Mobile verification session expire ho gaya. Dobara OTP verify karo."
      );

    }


    /* LINK EMAIL + PASSWORD */

    const credential =
      firebase.auth.EmailAuthProvider
      .credential(
        email,
        password
      );


    let linkedUser;


    try{

      const linked =
        await currentUser.linkWithCredential(
          credential
        );

      linkedUser =
        linked.user;

    }catch(error){

      /*
        Agar email/password already linked
        ho chuka ho to current user use karo.
      */

      if(
        error.code ===
        "auth/provider-already-linked"
      ){

        linkedUser =
          currentUser;

      }else{

        throw error;

      }

    }


    const uid =
      linkedUser.uid;


    /*
      USERNAME INDEX

      IMPORTANT:
      Ab email bhi save ho raha hai.
      Isse username se login possible hoga.
    */

    const usernameIndexUrl =
      "https://firestore.googleapis.com/v1/projects/" +
      PROJECT_ID +
      "/databases/(default)/documents/usernameIndex/" +
      encodeURIComponent(username) +
      "?key=" +
      API_KEY;


    const usernameIndexBody = {

      fields:{

        username:{
          stringValue:username
        },

        uid:{
          stringValue:uid
        },

        email:{
          stringValue:email
        },

        createdAt:{
          timestampValue:
            new Date().toISOString()
        }

      }

    };


    const usernameResponse =
      await fetch(
        usernameIndexUrl,
        {
          method:"PATCH",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              usernameIndexBody
            )
        }
      );


    if(!usernameResponse.ok){

      const errorData =
        await usernameResponse.json();

      console.error(
        errorData
      );

      throw new Error(
        "Username save nahi ho paya."
      );

    }


    /*
      GET ID TOKEN
    */

    const idToken =
      await linkedUser.getIdToken(true);


    const refreshToken =
      linkedUser.refreshToken;


    /*
      USER PROFILE
    */

    const profileUrl =
      "https://firestore.googleapis.com/v1/projects/" +
      PROJECT_ID +
      "/databases/(default)/documents/users/" +
      uid +
      "?key=" +
      API_KEY;


    const profileBody = {

      fields:{

        uid:{
          stringValue:uid
        },

        name:{
          stringValue:name
        },

        username:{
          stringValue:username
        },

        email:{
          stringValue:email
        },

        phoneNumber:{
          stringValue:phone
        },

        phoneVerified:{
          booleanValue:true
        },

        photoURL:{
          stringValue:""
        },

        bio:{
          stringValue:""
        },

        createdAt:{
          timestampValue:
            new Date().toISOString()
        },

        updatedAt:{
          timestampValue:
            new Date().toISOString()
        }

      }

    };


    const profileResponse =
      await fetch(
        profileUrl,
        {
          method:"PATCH",

          headers:{

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + idToken

          },

          body:
            JSON.stringify(
              profileBody
            )

        }
      );


    if(!profileResponse.ok){

      console.error(
        await profileResponse.json()
      );

      throw new Error(
        "Profile save nahi ho paya."
      );

    }


    /*
      SAVE LOGIN INFORMATION
    */

    localStorage.setItem(
      "crockcellIdToken",
      idToken
    );


    localStorage.setItem(
      "crockcellRefreshToken",
      refreshToken
    );


    localStorage.setItem(
      "crockcellUid",
      uid
    );


    localStorage.setItem(

      "crockcellProfile",

      JSON.stringify({

        uid:uid,

        name:name,

        username:username,

        email:email,

        phoneNumber:phone,

        photoURL:"",

        bio:""

      })

    );


    showMessage(
      "Account created successfully!",
      "#77ff99"
    );


    setTimeout(function(){

      location.href =
        "home.html";

    },800);


  }catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "Account create nahi ho paya."
    );


    createAccount.disabled =
      false;

    createAccount.textContent =
      "Create Account";

  }

});

</script>

</body>
</html>
