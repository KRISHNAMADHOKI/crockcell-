<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROCKCELL - Forgot Password</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#fafafa;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

.box{
  width:92%;
  max-width:380px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:18px;
  padding:28px 22px;
  text-align:center;
}

.logo{
  font-size:32px;
  font-weight:900;
  margin-bottom:12px;
}

h2{
  margin:10px 0;
}

p{
  color:#666;
  line-height:1.5;
  font-size:14px;
}

input{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  margin-top:14px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.back{
  display:block;
  margin-top:18px;
  color:#111;
  text-decoration:none;
  font-size:14px;
}

#msg{
  margin-top:15px;
  font-size:14px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">CROCKCELL</div>

  <h2>Forgot Password?</h2>

  <p>
    Apne CROCKCELL account ka email enter karo.
    Hum password reset karne ke liye email bhejenge.
  </p>

  <input
    id="email"
    type="email"
    placeholder="Email address"
    autocomplete="email"
  >

  <button id="sendBtn">
    Send Reset Link
  </button>

  <div id="msg"></div>

  <a class="back" href="index.html">
    ← Back to Login
  </a>

</div>

<script src="core.js"></script>

<script>

const API_KEY=
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const emailInput=document.getElementById("email");
const sendBtn=document.getElementById("sendBtn");
const msg=document.getElementById("msg");

sendBtn.onclick=async function(){

  const email=emailInput.value.trim();

  msg.innerText="";
  msg.style.color="#111";

  if(!email){

    msg.innerText="Please enter your email address.";
    return;
  }

  if(!email.includes("@")){

    msg.innerText="Please enter a valid email address.";
    return;
  }

  sendBtn.disabled=true;
  sendBtn.innerText="Sending...";

  try{

    const r=await fetch(
      "https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key="+
      API_KEY,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          requestType:"PASSWORD_RESET",
          email:email
        })
      }
    );

    const data=await r.json();

    if(!r.ok){

      let error=data.error?.message||"Unable to send reset email.";

      if(error==="EMAIL_NOT_FOUND"){
        error="No CROCKCELL account was found with this email.";
      }

      if(error==="INVALID_EMAIL"){
        error="Please enter a valid email address.";
      }

      throw new Error(error);
    }

    msg.style.color="green";

    msg.innerText=
      "Reset link sent! Apna email inbox check karo.";

    emailInput.disabled=true;
    sendBtn.innerText="Email Sent";

  }catch(e){

    msg.style.color="#c00";
    msg.innerText=e.message;

    sendBtn.disabled=false;
    sendBtn.innerText="Send Reset Link";
  }

};

</script>

</body>
</html>
