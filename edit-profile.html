<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Profile - CROCKCELL</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<header class="topbar"><div class="brand">Edit Profile</div><a class="iconbtn" href="profile.html">✕</a></header>
<section class="card stack"><input id="username" class="input" placeholder="Username"><textarea id="bio" class="textarea" placeholder="Bio"></textarea><input id="photo" class="input" type="url" placeholder="Profile photo URL"><button id="save" class="btn primary">Save Profile</button><div id="msg" class="notice hidden"></div></section>
</main><script src="core.js"></script><script>
const $=id=>document.getElementById(id),uid=CrockCell.uid(),sv=x=>x?.stringValue||"";
(async()=>{if(!uid)return location.href="index.html";const r=await CrockCell.request("users/"+uid),d=await r.json().catch(()=>({})),f=d.fields||{};$("username").value=sv(f.username)||sv(f.name);$("bio").value=sv(f.bio);$("photo").value=sv(f.profilePhoto)||sv(f.photoURL)})();
$("save").onclick=async()=>{const fields={username:{stringValue:$("username").value.trim()},bio:{stringValue:$("bio").value.trim()},profilePhoto:{stringValue:$("photo").value.trim()}};const r=await CrockCell.request("users/"+uid,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})});if(r.ok){const p=CrockCell.profile();p.username=$("username").value.trim();p.bio=$("bio").value.trim();p.profilePhoto=$("photo").value.trim();localStorage.setItem("crockcell_profile",JSON.stringify(p));location.href="profile.html"}else{$("msg").textContent="Profile save nahi hua."; $("msg").classList.remove("hidden")}};
</script></body></html>
