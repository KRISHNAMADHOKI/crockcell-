<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Profile - CROCKCELL</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#000;color:#fff;
 font-family:Arial,sans-serif;
 min-height:100vh
}
header{
 height:64px;display:flex;
 align-items:center;padding:0 15px;
 border-bottom:1px solid #222;
 font-size:21px;font-weight:bold
}
.back{
 border:0;background:none;color:#fff;
 font-size:32px;margin-right:12px
}
main{
 max-width:600px;margin:auto;
 padding:22px 18px 40px
}
.photo{
 display:block;width:120px;height:120px;
 border-radius:50%;object-fit:cover;
 background:#222;margin:10px auto 28px
}
label{
 display:block;color:#aaa;
 font-size:14px;font-weight:bold;
 margin:18px 0 8px
}
input,textarea{
 width:100%;border:1px solid #333;
 outline:0;border-radius:12px;
 background:#111;color:#fff;
 padding:14px;font-size:16px
}
textarea{
 height:110px;resize:none
}
button.save{
 width:100%;border:0;
 border-radius:14px;background:#fff;
 color:#000;padding:15px;
 margin-top:25px;
 font-size:16px;font-weight:bold
}
button:disabled{opacity:.5}
#msg{
 text-align:center;
 margin-top:15px;
 color:#aaa;
 line-height:1.5
}
.error{color:#ff7777!important}
.success{color:#70ff70!important}
</style>
</head>

<body>

<header>
<button class="back" onclick="history.back()">‹</button>
Edit Profile
</header>

<main>

<img id="photo" class="photo" src="" alt="Profile">

<label>Profile Photo</label>
<input id="photoInput" type="file" accept="image/*">

<label>Name</label>
<input id="name" type="text" placeholder="Your name">

<label>Username</label>
<input id="username" type="text" placeholder="Username">

<label>Bio</label>
<textarea id="bio" placeholder="Write your bio"></textarea>

<button id="save" class="save">Save Changes</button>

<div id="msg"></div>

</main>

<script>
const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";
const PROJECT_ID="crockcell-cd2e6";

const BASE=
 "https://firestore.googleapis.com/v1/projects/"+
 PROJECT_ID+
 "/databases/(default)/documents";

let token=
 localStorage.getItem("crockcell_idToken")||
 localStorage.getItem("crockcellIdToken")||
 sessionStorage.getItem("crockcell_idToken")||
 sessionStorage.getItem("crockcellIdToken");

const uid=
 localStorage.getItem("crockcell_uid")||
 localStorage.getItem("crockcellUid")||
 sessionStorage.getItem("crockcell_uid")||
 sessionStorage.getItem("crockcellUid");

let refresh=
 localStorage.getItem("crockcell_refreshToken")||
 localStorage.getItem("crockcellRefreshToken")||
 sessionStorage.getItem("crockcell_refreshToken")||
 sessionStorage.getItem("crockcellRefreshToken");

let newPhoto="";

const photo=document.getElementById("photo");
const photoInput=document.getElementById("photoInput");
const nameInput=document.getElementById("name");
const usernameInput=document.getElementById("username");
const bioInput=document.getElementById("bio");
const save=document.getElementById("save");
const msg=document.getElementById("msg");

if(!token||!uid){
 location.replace("index.html");
}

function show(text,type=""){
 msg.textContent=text;
 msg.className=type;
}

function defaultPhoto(){
 return "data:image/svg+xml;charset=UTF-8,"+
 encodeURIComponent(
 '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">'+
 '<rect width="100" height="100" fill="#222"/>'+
 '<circle cx="50" cy="38" r="18" fill="#777"/>'+
 '<path d="M20 88c4-22 56-22 60 0" fill="#777"/>'+
 '</svg>'
 );
}

async function getProfile(){

 try{

  const r=await fetch(
   BASE+"/users/"+encodeURIComponent(uid),
   {
    headers:{
     Authorization:"Bearer "+token
    },
    cache:"no-store"
   }
  );

  if(!r.ok){
   throw new Error("PROFILE_LOAD");
  }

  const data=await r.json();
  const f=data.fields||{};

  const profile={
   uid:uid,
   name:f.name?.stringValue||"",
   username:f.username?.stringValue||"",
   bio:f.bio?.stringValue||"",
   photoURL:f.photoURL?.stringValue||""
  };

  nameInput.value=profile.name;
  usernameInput.value=profile.username;
  bioInput.value=profile.bio;
  photo.src=profile.photoURL||defaultPhoto();

 }catch(e){

  console.error(e);

  show(
   "Profile load nahi ho paayi. Page refresh karo.",
   "error"
  );
 }
}

function compressPhoto(file){

 return new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=()=>{

   const img=new Image();

   img.onload=()=>{

    let w=img.width;
    let h=img.height;
    const max=500;

    if(w>h&&w>max){
     h=h*max/w;
     w=max;
    }else if(h>w&&h>max){
     w=w*max/h;
     h=max;
    }

    const canvas=document.createElement("canvas");

    canvas.width=Math.round(w);
    canvas.height=Math.round(h);

    const ctx=canvas.getContext("2d");

    ctx.drawImage(
     img,0,0,
     canvas.width,
     canvas.height
    );

    resolve(
     canvas.toDataURL("image/jpeg",.55)
    );
   };

   img.onerror=reject;
   img.src=reader.result;
  };

  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

photoInput.addEventListener("change",async()=>{

 const file=photoInput.files[0];

 if(!file)return;

 if(file.size>10*1024*1024){
  show("Photo 10MB se chhoti honi chahiye.","error");
  photoInput.value="";
  return;
 }

 try{

  show("Photo ready ho rahi hai...");

  newPhoto=await compressPhoto(file);

  photo.src=newPhoto;

  show("Photo ready hai ✓","success");

 }catch(e){

  show("Photo load nahi hui.","error");
 }
});

save.addEventListener("click",saveProfile);

async function saveProfile(){

 const name=nameInput.value.trim();

 const username=
  usernameInput.value.trim().replace(/^@/,"");

 const bio=bioInput.value.trim();

 if(!name){
  show("Name likho.","error");
  return;
 }

 if(!username){
  show("Username likho.","error");
  return;
 }

 if(username.length<3){
  show("Username kam se kam 3 characters ka ho.","error");
  return;
 }

 save.disabled=true;
 save.textContent="Saving...";
 show("Profile save ho rahi hai...");

 try{

  const get=await fetch(
   BASE+"/users/"+encodeURIComponent(uid),
   {
    headers:{
     Authorization:"Bearer "+token
    },
    cache:"no-store"
   }
  );

  if(!get.ok){
   throw new Error("PROFILE_READ");
  }

  const old=await get.json();

  const fields=old.fields||{};

  fields.name={
   stringValue:name
  };

  fields.username={
   stringValue:username
  };

  fields.bio={
   stringValue:bio
  };

  if(newPhoto){
   fields.photoURL={
    stringValue:newPhoto
   };
  }

  const update=await fetch(
   BASE+"/users/"+encodeURIComponent(uid),
   {
    method:"PATCH",
    headers:{
     Authorization:"Bearer "+token,
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     fields:fields
    }),
    cache:"no-store"
   }
  );

  if(!update.ok){

   const errorText=await update.text();

   console.error(errorText);

   throw new Error("PROFILE_SAVE");
  }

  const saved={
   uid:uid,
   name:name,
   username:username,
   bio:bio,
   photoURL:newPhoto||
    fields.photoURL?.stringValue||
    ""
  };

  localStorage.setItem(
   "crockcellProfile",
   JSON.stringify(saved)
  );

  localStorage.setItem(
   "crockcell_profile",
   JSON.stringify(saved)
  );

  sessionStorage.setItem(
   "crockcellProfile",
   JSON.stringify(saved)
  );

  show("Profile successfully save ho gayi ✓","success");

  setTimeout(()=>{
   location.href="profile.html";
  },700);

 }catch(e){

  console.error(e);

  show(
   "Profile save nahi hui. Dobara try karo.",
   "error"
  );

  save.disabled=false;
  save.textContent="Save Changes";
 }
}

getProfile();
</script>

</body>
</html>
