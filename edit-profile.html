<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Profile - CROCKCELL</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif
}

header{
height:60px;
border-bottom:1px solid #222;
display:flex;
align-items:center;
padding:0 18px;
font-size:22px;
font-weight:bold
}

.back{
font-size:30px;
margin-right:15px;
cursor:pointer
}

main{
max-width:650px;
margin:auto;
padding:25px 32px
}

.profilePhoto{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
display:block;
margin:10px auto 30px;
background:#222
}

label{
display:block;
margin:18px 0 8px;
color:#aaa;
font-weight:bold
}

input,textarea{
width:100%;
background:#111;
border:1px solid #333;
color:#fff;
border-radius:10px;
padding:14px;
font-size:16px
}

textarea{
height:110px;
resize:none
}

button{
width:100%;
margin-top:25px;
padding:15px;
border:0;
border-radius:10px;
background:#fff;
color:#000;
font-size:17px;
font-weight:bold
}

#msg{
text-align:center;
margin-top:18px;
color:#aaa
}
</style>
</head>

<body>

<header>
<span class="back" onclick="location.href='profile.html'">‹</span>
Edit Profile
</header>

<main>

<img id="profilePhoto"
class="profilePhoto"
src=""
alt="Profile">

<label>Profile Photo</label>
<input id="photoInput" type="file" accept="image/*">

<label>Name</label>
<input id="name" type="text" placeholder="Your name">

<label>Username</label>
<input id="username" type="text" placeholder="Username">

<label>Bio</label>
<textarea id="bio" placeholder="Write your bio"></textarea>

<button id="saveBtn" onclick="saveProfile()">
Save Changes
</button>

<div id="msg"></div>

</main>

<script>

const API_KEY=
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID=
"crockcell-cd2e6";

const BASE=
`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

let token=
localStorage.getItem("crockcellIdToken");

let uid=
localStorage.getItem("crockcellUid");

let refreshToken=
localStorage.getItem("crockcellRefreshToken");

let newPhoto="";


function $(id){
return document.getElementById(id);
}


function msg(text){
$("msg").textContent=text;
}


function defaultPhoto(){

return "data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="200" height="200">
<rect width="100%" height="100%" fill="#222"/>
<text x="50%" y="58%"
text-anchor="middle"
fill="#777"
font-size="70">👤</text>
</svg>
`);

}


async function refresh(){

if(!refreshToken)return false;

try{

const r=await fetch(
`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:
`grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`
}
);

const d=await r.json();

if(!r.ok||!d.id_token)return false;

token=d.id_token;

refreshToken=
d.refresh_token||refreshToken;

localStorage.setItem(
"crockcellIdToken",
token
);

localStorage.setItem(
"crockcellRefreshToken",
refreshToken
);

return true;

}catch(e){

return false;

}

}


async function getProfile(){

let r=await fetch(
`${BASE}/users/${uid}`,
{
headers:{
Authorization:"Bearer "+token
},
cache:"no-store"
}
);

if((r.status===401||r.status===403)
&&refreshToken){

if(await refresh()){

r=await fetch(
`${BASE}/users/${uid}`,
{
headers:{
Authorization:"Bearer "+token
},
cache:"no-store"
}
);

}

}

return r;

}


/* LOAD CURRENT PROFILE */

async function loadProfile(){

if(!token||!uid){

location.href="index.html";
return;

}

msg("Loading...");

try{

const r=await getProfile();

if(!r.ok){

msg("Profile load nahi hui.");
return;

}

const d=await r.json();

const f=d.fields||{};

$("name").value=
f.name?.stringValue||"";

$("username").value=
f.username?.stringValue||"";

$("bio").value=
f.bio?.stringValue||"";

const photo=
f.photoURL?.stringValue||"";

$("profilePhoto").src=
photo||defaultPhoto();

msg("");

}catch(e){

console.log(e);

msg("Something went wrong.");

}

}


/* COMPRESS PHOTO */

function compressPhoto(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=function(){

const img=new Image();

img.onload=function(){

const max=500;

let w=img.width;
let h=img.height;

if(w>h){

if(w>max){
h=h*(max/w);
w=max;
}

}else{

if(h>max){
w=w*(max/h);
h=max;
}

}

const canvas=
document.createElement("canvas");

canvas.width=Math.round(w);
canvas.height=Math.round(h);

const ctx=
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

/*
JPEG quality .55
Keeps Firebase document small
*/

const result=
canvas.toDataURL(
"image/jpeg",
0.55
);

resolve(result);

};

img.onerror=reject;

img.src=reader.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}


/* PHOTO SELECT */

$("photoInput").addEventListener(
"change",
async function(){

const file=this.files[0];

if(!file)return;

msg("Photo compress ho rahi hai...");

try{

newPhoto=
await compressPhoto(file);

$("profilePhoto").src=newPhoto;

msg("Photo ready hai ✓");

}catch(e){

console.log(e);

msg("Photo load nahi hui.");

}

});


/* SAVE PROFILE */

async function saveProfile(){

const name=
$("name").value.trim();

const username=
$("username").value
.trim()
.replace(/^@/,"");

const bio=
$("bio").value.trim();


if(!name){

msg("Name likho.");

return;

}

if(!username){

msg("Username likho.");

return;

}

if(username.length<3){

msg("Username kam se kam 3 characters ka ho.");

return;

}


$("saveBtn").disabled=true;

$("saveBtn").textContent="Saving...";

msg("Profile save ho rahi hai...");


try{

const fields={

name:{
stringValue:name
},

username:{
stringValue:username
},

bio:{
stringValue:bio
},

uid:{
stringValue:uid
},

updatedAt:{
timestampValue:
new Date().toISOString()
}

};


/*
Only add photo if a new photo
was selected.
*/

if(newPhoto){

fields.photoURL={
stringValue:newPhoto
};

}


let url=
`${BASE}/users/${uid}`;

const params=[];

Object.keys(fields).forEach(
key=>{
params.push(
"updateMask.fieldPaths="+
encodeURIComponent(key)
);
});

url+="?"+params.join("&");


let r=await fetch(
url,
{
method:"PATCH",

headers:{
Authorization:"Bearer "+token,
"Content-Type":"application/json"
},

body:JSON.stringify({
fields:fields
}),

cache:"no-store"
});


/* TOKEN EXPIRED */

if((r.status===401||r.status===403)
&&refreshToken){

if(await refresh()){

r=await fetch(
url,
{
method:"PATCH",

headers:{
Authorization:"Bearer "+token,
"Content-Type":"application/json"
},

body:JSON.stringify({
fields:fields
}),

cache:"no-store"
}
);

}

}


if(!r.ok){

const errorText=
await r.text();

console.log(
"FIREBASE ERROR:",
errorText
);

msg("Profile save nahi hui.");

$("saveBtn").disabled=false;

$("saveBtn").textContent=
"Save Changes";

return;

}


/* UPDATE LOCAL DATA */

let old={};

try{

old=JSON.parse(
localStorage.getItem(
"crockcellProfile"
)||"{}"
);

}catch(e){}


localStorage.setItem(
"crockcellProfile",
JSON.stringify({

...old,

uid:uid,

name:name,

username:username,

bio:bio,

photoURL:
newPhoto||
old.photoURL||
""

})
);


msg("Profile saved successfully ✓");

setTimeout(
()=>{

location.href=
"profile.html?v="+Date.now();

},
800
);


}catch(e){

console.log(e);

msg("Something went wrong.");

$("saveBtn").disabled=false;

$("saveBtn").textContent=
"Save Changes";

}

}


loadProfile();

</script>

</body>
</html>
