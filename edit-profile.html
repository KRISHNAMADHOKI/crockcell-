<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Profile - CROCKCELL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
header{height:60px;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 16px;font-size:21px;font-weight:bold}
.back{font-size:28px;margin-right:15px;cursor:pointer}
main{max-width:500px;margin:auto;padding:25px 18px}
.photo{width:100px;height:100px;border-radius:50%;background:#222;object-fit:cover;display:block;margin:10px auto 25px}
input,textarea{width:100%;background:#111;border:1px solid #333;color:#fff;border-radius:8px;padding:13px;margin:7px 0 16px;font-size:16px}
textarea{height:100px;resize:none}
label{font-size:14px;color:#aaa}
button{width:100%;border:0;border-radius:8px;padding:13px;background:#fff;color:#000;font-size:16px;font-weight:bold;margin-top:5px}
#msg{text-align:center;margin-top:15px;color:#aaa}
</style>
</head>

<body>

<header>
  <span class="back" onclick="location.href='profile.html'">‹</span>
  Edit Profile
</header>

<main>

<img id="photo" class="photo" src="" alt="Profile">

<label>Profile Photo</label>
<input id="photoInput" type="file" accept="image/*">

<label>Name</label>
<input id="name" type="text" placeholder="Your name">

<label>Username</label>
<input id="username" type="text" placeholder="Username">

<label>Bio</label>
<textarea id="bio" placeholder="Write something about yourself"></textarea>

<button onclick="saveProfile()">Save Changes</button>

<div id="msg"></div>

</main>

<script>
const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";
const PROJECT_ID="crockcell-cd2e6";
const BASE=`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

let token=localStorage.getItem("crockcellIdToken");
let uid=localStorage.getItem("crockcellUid");
let refreshToken=localStorage.getItem("crockcellRefreshToken");
let newPhoto="";

const $=id=>document.getElementById(id);

function setMsg(t){$("msg").textContent=t}

async function refresh(){
  if(!refreshToken)return false;

  try{
    const r=await fetch(
      `https://securetoken.googleapis.com/v1/token?key=${API_KEY}`,
      {
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`
      }
    );

    const d=await r.json();

    if(!r.ok||!d.id_token)return false;

    token=d.id_token;
    refreshToken=d.refresh_token||refreshToken;

    localStorage.setItem("crockcellIdToken",token);
    localStorage.setItem("crockcellRefreshToken",refreshToken);

    return true;
  }catch(e){
    return false;
  }
}

async function api(path,opt={},retry=true){
  opt.headers={
    ...(opt.headers||{}),
    Authorization:"Bearer "+token,
    "Content-Type":"application/json"
  };

  let r=await fetch(BASE+path,opt);

  if((r.status===401||r.status===403)&&retry&&refreshToken){
    if(await refresh())return api(path,opt,false);
  }

  return r;
}

function val(v){
  return v==null?"":String(v);
}

function toFields(obj){
  return {
    stringValue:obj===undefined||obj===null?"":String(obj)
  };
}

async function loadProfile(){

  if(!token||!uid){
    location.href="index.html";
    return;
  }

  setMsg("Loading...");

  try{
    let r=await api(`/users/${uid}`);

    if(!r.ok && refreshToken){
      if(await refresh())r=await api(`/users/${uid}`);
    }

    if(!r.ok){
      setMsg("Profile load nahi ho rahi.");
      return;
    }

    const d=await r.json();
    const f=d.fields||{};

    $("name").value=val(f.name?.stringValue);
    $("username").value=val(f.username?.stringValue);
    $("bio").value=val(f.bio?.stringValue);

    const p=val(f.photoURL?.stringValue);

    if(p){
      $("photo").src=p;
    }else{
      $("photo").src="data:image/svg+xml;charset=UTF-8,"+
      encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
        <rect width="100%" height="100%" fill="#222"/>
        <text x="50%" y="55%" text-anchor="middle" fill="#777" font-size="70">👤</text>
        </svg>`
      );
    }

    setMsg("");

  }catch(e){
    setMsg("Something went wrong.");
  }
}

$("photoInput").addEventListener("change",function(){

  const file=this.files[0];
  if(!file)return;

  if(file.size>5*1024*1024){
    setMsg("Photo 5MB se chhoti rakho.");
    this.value="";
    return;
  }

  const reader=new FileReader();

  reader.onload=e=>{
    newPhoto=e.target.result;
    $("photo").src=newPhoto;
  };

  reader.readAsDataURL(file);
});

async function saveProfile(){

  const name=$("name").value.trim();
  const username=$("username").value.trim().replace(/^@/,"");
  const bio=$("bio").value.trim();

  if(!name){
    setMsg("Name likho.");
    return;
  }

  if(!username){
    setMsg("Username likho.");
    return;
  }

  if(username.length<3){
    setMsg("Username kam se kam 3 characters ka ho.");
    return;
  }

  setMsg("Saving...");

  try{

    const body={
      fields:{
        name:{stringValue:name},
        username:{stringValue:username},
        bio:{stringValue:bio},
        uid:{stringValue:uid},
        updatedAt:{timestampValue:new Date().toISOString()}
      }
    };

    if(newPhoto){
      body.fields.photoURL={stringValue:newPhoto};
    }

    let r=await api(`/users/${uid}?updateMask.fieldPaths=name&updateMask.fieldPaths=username&updateMask.fieldPaths=bio&updateMask.fieldPaths=uid&updateMask.fieldPaths=updatedAt${newPhoto?"&updateMask.fieldPaths=photoURL":""}`,{
      method:"PATCH",
      body:JSON.stringify(body)
    });

    if(!r.ok){
      const err=await r.text();
      console.log(err);
      setMsg("Profile save nahi hui.");
      return;
    }

    const oldProfile=JSON.parse(localStorage.getItem("crockcellProfile")||"{}");

    localStorage.setItem("crockcellProfile",JSON.stringify({
      ...oldProfile,
      name,
      username,
      bio,
      uid,
      ...(newPhoto?{photoURL:newPhoto}:{} )
    }));

    setMsg("Profile updated successfully ✓");

    setTimeout(()=>{
      location.href="profile.html";
    },800);

  }catch(e){
    console.log(e);
    setMsg("Something went wrong.");
  }
}

loadProfile();
</script>

</body>
</html>
