<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Profile</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif
}

header{
height:65px;
border-bottom:1px solid #222;
display:flex;
align-items:center;
padding:0 25px;
font-size:22px;
font-weight:bold
}

.back{
font-size:32px;
margin-right:15px;
cursor:pointer
}

main{
max-width:650px;
margin:auto;
padding:25px 32px
}

.photo{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
display:block;
margin:15px auto 30px;
background:#222
}

label{
display:block;
margin:18px 0 8px;
color:#aaa;
font-weight:bold
}

input,textarea{
width:100%;
background:#111;
border:1px solid #333;
color:#fff;
border-radius:10px;
padding:14px;
font-size:16px
}

textarea{
height:110px;
resize:none
}

button{
width:100%;
margin-top:25px;
padding:15px;
border:0;
border-radius:10px;
background:#fff;
color:#000;
font-size:17px;
font-weight:bold
}

button:disabled{
opacity:.5
}

#msg{
margin-top:18px;
text-align:center;
color:#aaa;
line-height:1.5;
word-break:break-word
}

.error{
color:#ff7777!important
}

.success{
color:#72ff72!important
}
</style>
</head>

<body>

<header>
<span class="back" onclick="location.href='profile.html'">‹</span>
Edit Profile
</header>

<main>

<img id="photo" class="photo" src="" alt="Profile">

<label>Profile Photo</label>
<input id="photoInput" type="file" accept="image/*">

<label>Name</label>
<input id="name" type="text" placeholder="Your name">

<label>Username</label>
<input id="username" type="text" placeholder="Username">

<label>Bio</label>
<textarea id="bio" placeholder="Write your bio"></textarea>

<button id="saveBtn" onclick="saveProfile()">
Save Changes
</button>

<div id="msg"></div>

</main>

<script src="core.js"></script>

<script>

const API_KEY=
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID=
"crockcell-cd2e6";

const BASE=
"https://firestore.googleapis.com/v1/projects/"
+PROJECT_ID+
"/databases/(default)/documents";

let token=
localStorage.getItem("crockcell_idToken");

let uid=
localStorage.getItem("crockcell_uid");

let refreshToken=
localStorage.getItem("crockcell_refreshToken");

let newPhoto="";


function $(id){
return document.getElementById(id);
}


function show(text,type=""){
$("msg").textContent=text;
$("msg").className=type;
}


function defaultPhoto(){

return "data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="200" height="200">
<rect width="100%" height="100%" fill="#222"/>
<text x="50%" y="58%"
text-anchor="middle"
fill="#777"
font-size="70">👤</text>
</svg>
`);

}


async function refreshTokenNow(){

if(!refreshToken)return false;

try{

const r=await fetch(
"https://securetoken.googleapis.com/v1/token?key="
+API_KEY,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:
"grant_type=refresh_token&refresh_token="
+encodeURIComponent(refreshToken)
}
);

const d=await r.json();

if(!r.ok || !d.id_token){
console.log("TOKEN ERROR",d);
return false;
}

token=d.id_token;

refreshToken=
d.refresh_token || refreshToken;

localStorage.setItem(
"crockcell_idToken",
token
);

localStorage.setItem(
"crockcell_refreshToken",
refreshToken
);

return true;

}catch(e){

console.log(e);
return false;

}

}


/* LOAD PROFILE */

async function loadProfile(){

if(!token || !uid){

location.href="index.html";
return;

}

try{

let r=await fetch(
BASE+"/users/"+uid,
{
headers:{
Authorization:"Bearer "+token
},
cache:"no-store"
}
);

if((r.status===401||r.status===403)
&&refreshToken){

if(await refreshTokenNow()){

r=await fetch(
BASE+"/users/"+uid,
{
headers:{
Authorization:"Bearer "+token
},
cache:"no-store"
}
);

}

}

if(!r.ok){

show("Profile load nahi hui.","error");
return;

}

const d=await r.json();

const f=d.fields||{};

$("name").value=
f.name?.stringValue||"";

$("username").value=
f.username?.stringValue||"";

$("bio").value=
f.bio?.stringValue||"";

$("photo").src=
f.photoURL?.stringValue||defaultPhoto();

}catch(e){

console.log(e);

show("Profile load error.","error");

}

}


/* COMPRESS PHOTO */

function compressPhoto(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=function(){

const img=new Image();

img.onload=function(){

let w=img.width;
let h=img.height;

const max=450;

if(w>h){

if(w>max){
h=h*max/w;
w=max;
}

}else{

if(h>max){
w=w*max/h;
h=max;
}

}

const canvas=
document.createElement("canvas");

canvas.width=Math.round(w);
canvas.height=Math.round(h);

const ctx=
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

resolve(
canvas.toDataURL(
"image/jpeg",
0.45
)
);

};

img.onerror=reject;

img.src=reader.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}


/* PHOTO */

$("photoInput").addEventListener(
"change",
async function(){

const file=this.files[0];

if(!file)return;

try{

show("Photo compress ho rahi hai...");

newPhoto=
await compressPhoto(file);

$("photo").src=newPhoto;

show("Photo ready hai ✓","success");

}catch(e){

show("Photo load nahi hui.","error");

}

});


/* SAVE */

async function saveProfile(){

const name=
$("name").value.trim();

const username=
$("username").value.trim().replace(/^@/,"");

const bio=
$("bio").value.trim();


if(!name){

show("Name likho.","error");
return;

}

if(!username){

show("Username likho.","error");
return;

}

$("saveBtn").disabled=true;

$("saveBtn").textContent="Saving...";

show("Profile save ho rahi hai...");


try{

/*
First make sure token is fresh
*/

if(refreshToken){

await refreshTokenNow();

}


/*
Get existing document first.
This keeps all existing fields.
*/

let get=await fetch(
BASE+"/users/"+uid,
{
headers:{
Authorization:"Bearer "+token
},
cache:"no-store"
}
);


if(!get.ok){

const error=await get.text();

console.log("GET ERROR:",error);

show(
"Profile read error: "+
get.status,
"error"
);

$("saveBtn").disabled=false;

$("saveBtn").textContent=
"Save Changes";

return;

}


const oldDoc=await get.json();

const fields=
oldDoc.fields || {};


/*
Update only changed profile fields.
*/

fields.name={
stringValue:name
};

fields.username={
stringValue:username
};

fields.bio={
stringValue:bio
};

if(newPhoto){

fields.photoURL={
stringValue:newPhoto
};

}


/*
Use Firestore PATCH.
*/

const url=
BASE+"/users/"+uid;


let r=await fetch(
url,
{
method:"PATCH",

headers:{
Authorization:"Bearer "+token,
"Content-Type":"application/json"
},

body:JSON.stringify({
fields:fields
}),

cache:"no-store"
});


/*
If token expired, refresh and retry.
*/

if((r.status===401||r.status===403)
&&refreshToken){

if(await refreshTokenNow()){

r=await fetch(
url,
{
method:"PATCH",

headers:{
Authorization:"Bearer "+token,
"Content-Type":"application/json"
},

body:JSON.stringify({
fields:fields
}),

cache:"no-store"
}
);

}

}


if(!r.ok){

const errorText=
await r.text();

console.log(
"FIREBASE SAVE ERROR:",
errorText
);


/*
Show exact status so we can identify
the problem instead of guessing.
*/

show(
"Firebase error: "+
r.status+
" | Save nahi hui",
"error"
);

$("saveBtn").disabled=false;

$("saveBtn").textContent=
"Save Changes";

return;

}


/*
SAVE LOCAL CACHE
*/

let oldLocal={};

try{

oldLocal=
JSON.parse(
localStorage.getItem(
"crockcell_profile"
)||"{}"
);

}catch(e){}


localStorage.setItem(
"crockcell_profile",
JSON.stringify({

...oldLocal,

uid:uid,

name:name,

username:username,

bio:bio,

photoURL:
newPhoto||
fields.photoURL?.stringValue||
""

})
);


show(
"Profile saved successfully ✓",
"success"
);


setTimeout(
function(){

location.href=
"profile.html?v="+Date.now();

},
1000
);


}catch(e){

console.log("SAVE EXCEPTION:",e);

show(
"Save error: "+
e.message,
"error"
);

$("saveBtn").disabled=false;

$("saveBtn").textContent=
"Save Changes";

}

}


loadProfile();

</script>

</body>
</html>
