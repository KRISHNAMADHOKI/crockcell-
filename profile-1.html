<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile - CROCKCELL</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;font-family:Arial,sans-serif;padding-bottom:80px}.header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:10}.logo{font-size:22px;font-weight:bold}.header-btn{background:#171717;color:#fff;border:1px solid #333;padding:8px 13px;border-radius:9px}.profile{padding:25px 16px 10px;max-width:700px;margin:auto}.profile-top{display:flex;align-items:center;gap:22px}.profile-photo{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid #333;background:#111}.profile-info{flex:1}.profile-name{font-size:21px;font-weight:bold;margin-bottom:5px}.username{color:#aaa;margin-bottom:12px}.stats{display:flex;gap:22px}.stat{text-align:center}.stat-number{font-size:17px;font-weight:bold}.stat-label{color:#999;font-size:12px;margin-top:3px}.bio{margin-top:18px;color:#ddd;line-height:1.5;white-space:pre-wrap}.buttons{display:flex;gap:10px;margin-top:18px}.action-btn{flex:1;padding:11px;border:none;border-radius:9px;cursor:pointer;font-weight:bold;background:#fff;color:#000}.action-btn.secondary,.action-btn.following{background:#1b1b1b;color:#fff;border:1px solid #333}.section-title{max-width:700px;margin:25px auto 10px;padding:0 16px;font-size:18px;font-weight:bold}.post-grid{max-width:700px;margin:auto;padding:0 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.post{aspect-ratio:1/1;background:#111;overflow:hidden}.post img{width:100%;height:100%;object-fit:cover;display:block}.empty,.loading,.error{text-align:center;padding:40px 20px}.empty{grid-column:1/-1;color:#777}.loading{color:#888}.error{color:#ff6b6b}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:65px;background:#050505;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:20}.bottom-nav a{color:#aaa;text-decoration:none;font-size:12px;text-align:center}.bottom-nav a.active{color:#fff;font-weight:bold}.bottom-nav span{display:block;font-size:21px;margin-bottom:2px}</style></head>
<body><header class="header"><div class="logo">CROCKCELL</div><button class="header-btn" onclick="goBack()">Back</button></header>
<main><section class="profile"><div id="loadingBox" class="loading">Loading profile...</div><div id="profileBox" style="display:none"><div class="profile-top"><img id="profilePhoto" class="profile-photo" src="" alt="Profile"><div class="profile-info"><div id="profileName" class="profile-name">User</div><div id="profileUsername" class="username">@username</div><div class="stats"><div class="stat"><div id="postCount" class="stat-number">0</div><div class="stat-label">Posts</div></div><div class="stat"><div id="followersCount" class="stat-number">0</div><div class="stat-label">Followers</div></div><div class="stat"><div id="followingCount" class="stat-number">0</div><div class="stat-label">Following</div></div></div></div></div><div id="profileBio" class="bio"></div><div id="actionButtons" class="buttons"></div></div></section><div class="section-title">Posts</div><div id="postGrid" class="post-grid"><div class="loading">Loading posts...</div></div></main>
<nav class="bottom-nav"><a href="home.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>✉</span>Messages</a><a href="profile.html?self=1" class="active"><span>●</span>Profile</a></nav>
<script>
const PROJECT_ID="crockcell-cd2e6",FIRESTORE="https://firestore.googleapis.com/v1/projects/"+PROJECT_ID+"/databases/(default)/documents",DEFAULT_PHOTO="https://via.placeholder.com/300/111111/ffffff?text=C";
function store(a,b){return localStorage.getItem(a)||localStorage.getItem(b)||""}const token=store("crockcell_idToken","crockcellIdToken"),currentUID=store("crockcell_uid","crockcellUid");
const params=new URLSearchParams(location.search),targetUID=params.get("self")==="1"?currentUID:(params.get("uid")||currentUID);
async function getDoc(p){const r=await fetch(FIRESTORE+p,{headers:{Authorization:"Bearer "+token}});if(!r.ok)throw Error(r.status);return r.json()}
function val(v){if(!v)return null;if(v.stringValue!==undefined)return v.stringValue;if(v.integerValue!==undefined)return Number(v.integerValue);if(v.doubleValue!==undefined)return Number(v.doubleValue);if(v.booleanValue!==undefined)return v.booleanValue;if(v.timestampValue!==undefined)return v.timestampValue;if(v.arrayValue!==undefined)return(v.arrayValue.values||[]).map(val);if(v.mapValue!==undefined)return fields(v.mapValue.fields||{});return null}function fields(f){const o={};Object.keys(f||{}).forEach(k=>o[k]=val(f[k]));return o}
async function getUser(uid){try{const d=await getDoc("/users/"+encodeURIComponent(uid));if(d.fields)return fields(d.fields)}catch(e){}try{const body={structuredQuery:{from:[{collectionId:"users"}],where:{fieldFilter:{field:{fieldPath:"uid"},op:"EQUAL",value:{stringValue:uid}}},limit:10}};const r=await fetch(FIRESTORE+":runQuery",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify(body)});if(r.ok){for(const x of await r.json())if(x.document?.fields)return fields(x.document.fields)}}catch(e){}if(uid===currentUID){try{const p=localStorage.getItem("crockcell_profile");if(p)return JSON.parse(p)}catch(e){}}return null}
async function collection(n){try{const d=await getDoc("/"+n+"?pageSize=100");return(d.documents||[]).map(x=>({id:x.name.split("/").pop(),...fields(x.fields||{})}))}catch(e){return[]}}
function goBack(){history.length>1?history.back():location.href="home.html"}function editProfile(){location.href="edit-profile.html"}function openMessage(){sessionStorage.setItem("crockcell_message_target",JSON.stringify({uid:targetUID}));location.href="messages.html"}
async function toggleFollow(){const b=document.getElementById("followBtn");b.disabled=true;try{const a=await collection("follows"),old=a.find(x=>String(x.followerId)===String(currentUID)&&String(x.followingId)===String(targetUID));if(old)await fetch(FIRESTORE+"/follows/"+encodeURIComponent(old.id),{method:"DELETE",headers:{Authorization:"Bearer "+token}});else{const body={fields:{followerId:{stringValue:currentUID},followingId:{stringValue:targetUID},createdAt:{timestampValue:new Date().toISOString()}}};await fetch(FIRESTORE+"/follows/"+encodeURIComponent(currentUID+"_"+targetUID),{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify(body)})}loadProfile()}catch(e){alert("Follow update nahi ho paya.");b.disabled=false}}
function renderPosts(a){const g=document.getElementById("postGrid");g.innerHTML="";if(!a.length){g.innerHTML='<div class="empty">No posts yet</div>';return}a.sort((x,y)=>new Date(y.createdAt||0)-new Date(x.createdAt||0));a.forEach(p=>{const im=p.image||p.imageURL||p.photoURL;if(!im)return;const d=document.createElement("div");d.className="post";const i=document.createElement("img");i.src=im;i.loading="lazy";i.onerror=()=>d.remove();d.appendChild(i);g.appendChild(d)})}
function render(u,posts,follows,following){document.getElementById("profileName").textContent=u.name||u.displayName||u.fullName||u.username||"CROCKCELL User";const un=u.username||"user";document.getElementById("profileUsername").textContent=un.startsWith("@")?un:"@"+un;const i=document.getElementById("profilePhoto");i.src=u.profilePhoto||u.photoURL||u.photo||DEFAULT_PHOTO;i.onerror=()=>i.src=DEFAULT_PHOTO;document.getElementById("profileBio").textContent=u.bio||"";const mine=posts.filter(p=>String(p.userId)===String(targetUID));document.getElementById("postCount").textContent=mine.length;document.getElementById("followersCount").textContent=follows.filter(x=>String(x.followingId)===String(targetUID)).length;document.getElementById("followingCount").textContent=follows.filter(x=>String(x.followerId)===String(targetUID)).length;const box=document.getElementById("actionButtons");box.innerHTML="";if(String(targetUID)===String(currentUID)){const b=document.createElement("button");b.className="action-btn";b.textContent="Edit Profile";b.onclick=editProfile;box.appendChild(b)}else{const f=document.createElement("button");f.id="followBtn";f.className="action-btn"+(following?" following":"");f.textContent=following?"Following":"Follow";f.onclick=toggleFollow;const m=document.createElement("button");m.className="action-btn secondary";m.textContent="Message";m.onclick=openMessage;box.append(f,m)}document.getElementById("loadingBox").style.display="none";document.getElementById("profileBox").style.display="block";renderPosts(mine)}
async function loadProfile(){if(!token||!currentUID){document.getElementById("loadingBox").innerHTML='<div class="error">Please login first.</div>';return}if(!targetUID){document.getElementById("loadingBox").innerHTML='<div class="error">User UID not found.</div>';return}try{const u=await getUser(targetUID);if(!u){document.getElementById("loadingBox").innerHTML='<div class="error">User profile nahi mili.</div>';return}const [p,f]=await Promise.all([collection("posts"),collection("follows")]);const following=f.some(x=>String(x.followerId)===String(currentUID)&&String(x.followingId)===String(targetUID));render(u,p,f,following)}catch(e){console.error(e);document.getElementById("loadingBox").innerHTML='<div class="error">Profile load nahi ho payi.<br><br>Page refresh karke try karo.</div>'}}
loadProfile();
</script></body></html>
