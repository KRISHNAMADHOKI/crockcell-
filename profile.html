<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROCKCELL - Profile</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;font-family:Arial,sans-serif;color:#111;padding-bottom:70px}

.top{
  height:60px;background:#fff;border-bottom:1px solid #ddd;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 15px;position:sticky;top:0;z-index:5
}

.logo{font-size:22px;font-weight:800}
button{border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}
.edit{background:#111;color:#fff}

.profile{
  background:#fff;padding:20px 15px;border-bottom:1px solid #ddd
}

.head{
  display:flex;align-items:center;gap:18px
}

.avatar{
  width:88px;height:88px;border-radius:50%;
  object-fit:cover;background:#ddd
}

.details{flex:1}

.name{font-size:20px;font-weight:800}
.username{color:#777;margin-top:4px}
.bio{margin-top:10px;line-height:1.4}

.stats{
  display:flex;gap:30px;margin-top:20px
}

.stat{text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:13px;color:#777}

.follow{
  margin-top:15px;
  width:100%;
  background:#111;color:#fff
}

.postsTitle{
  padding:15px;font-weight:800;background:#fff;
  border-bottom:1px solid #ddd
}

.posts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
}

.post{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#ddd
}

.empty{
  padding:40px 10px;text-align:center;color:#777;
  grid-column:1/-1
}

.bottom{
  position:fixed;bottom:0;left:0;right:0;height:60px;
  background:#fff;border-top:1px solid #ddd;
  display:flex;justify-content:space-around;align-items:center;
  z-index:10
}

.bottom button{
  background:none;font-size:14px
}
</style>
</head>

<body>

<div class="top">
  <div class="logo">CROCKCELL</div>
  <button id="edit" class="edit" style="display:none">Edit</button>
</div>

<div id="profile" class="profile">
  Loading profile...
</div>

<div class="postsTitle">Posts</div>
<div id="posts" class="posts"></div>

<div class="bottom">
  <button onclick="location.href='home.html'">Home</button>
  <button onclick="location.href='search.html'">Search</button>
  <button onclick="location.href='create.html'">Create</button>
  <button onclick="goMyProfile()">Profile</button>
</div>

<script>
const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";
const PROJECT_ID="crockcell-cd2e6";
const BASE="https://firestore.googleapis.com/v1/projects/"+PROJECT_ID+"/databases/(default)/documents";

let token=localStorage.getItem("crockcellIdToken");
const myUid=localStorage.getItem("crockcellUid");
const refreshToken=localStorage.getItem("crockcellRefreshToken");

if(!token||!myUid){
  location.href="index.html";
}

const params=new URLSearchParams(location.search);

const requestedUid=params.get("uid")||"";
const requestedDoc=params.get("doc")||"";

function val(x){
  if(!x)return "";
  if(x.stringValue!==undefined)return x.stringValue;
  if(x.integerValue!==undefined)return x.integerValue;
  if(x.doubleValue!==undefined)return x.doubleValue;
  if(x.booleanValue!==undefined)return x.booleanValue;
  return "";
}

function esc(s){
  return String(s||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function refreshTokenNow(){

  if(!refreshToken)return false;

  try{

    const r=await fetch(
      "https://securetoken.googleapis.com/v1/token?key="+API_KEY,
      {
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"grant_type=refresh_token&refresh_token="+
              encodeURIComponent(refreshToken)
      }
    );

    const d=await r.json();

    if(!r.ok)return false;

    token=d.id_token;

    localStorage.setItem("crockcellIdToken",token);

    if(d.refresh_token){
      localStorage.setItem("crockcellRefreshToken",d.refresh_token);
    }

    return true;

  }catch(e){
    return false;
  }
}

async function api(url,options={}){

  options.headers={
    ...(options.headers||{}),
    "Authorization":"Bearer "+token,
    "Content-Type":"application/json"
  };

  let r=await fetch(url,options);

  if((r.status===401||r.status===403)&&refreshToken){

    const ok=await refreshTokenNow();

    if(ok){
      options.headers.Authorization="Bearer "+token;
      r=await fetch(url,options);
    }
  }

  return r;
}

function userFromDoc(doc){

  const f=doc.fields||{};
  const docId=doc.name.split("/").pop();

  return {
    docId:docId,
    uid:val(f.uid)||"",
    name:val(f.name)||"User",
    username:val(f.username)||"",
    bio:val(f.bio)||"",
    photoURL:val(f.photoURL)||""
  };
}

async function findUserByUid(uid){

  if(!uid)return null;

  const body={
    structuredQuery:{
      from:[{collectionId:"users"}],
      where:{
        fieldFilter:{
          field:{fieldPath:"uid"},
          op:"EQUAL",
          value:{stringValue:uid}
        }
      },
      limit:1
    }
  };

  const r=await api(
    BASE+":runQuery?key="+API_KEY,
    {
      method:"POST",
      body:JSON.stringify(body)
    }
  );

  if(!r.ok)return null;

  const data=await r.json();

  for(const item of data){
    if(item.document){
      const u=userFromDoc(item.document);

      if(u.uid){
        return u;
      }
    }
  }

  return null;
}

async function findUserByDocId(docId){

  if(!docId)return null;

  const r=await api(
    BASE+"/users/"+encodeURIComponent(docId)+"?key="+API_KEY
  );

  if(!r.ok)return null;

  const doc=await r.json();

  if(!doc.fields)return null;

  return userFromDoc(doc);
}

async function getUser(){

  // 1. URL me actual UID diya hua hai to pehle UID se search.
  if(requestedUid){

    const u=await findUserByUid(requestedUid);

    if(u)return u;
  }

  // 2. UID query se na mile to document ID se check.
  if(requestedDoc){

    const u=await findUserByDocId(requestedDoc);

    if(u)return u;
  }

  // 3. Agar old URL me document ID ko uid ki tarah bheja gaya hai,
  // tab bhi profile recover ho jayegi.
  if(requestedUid){

    const u=await findUserByDocId(requestedUid);

    if(u)return u;
  }

  // 4. Kuch bhi nahi mila to apni profile.
  return await findUserByUid(myUid);
}

async function getPosts(uid){

  const body={
    structuredQuery:{
      from:[{collectionId:"posts"}],
      where:{
        fieldFilter:{
          field:{fieldPath:"userId"},
          op:"EQUAL",
          value:{stringValue:uid}
        }
      },
      limit:100
    }
  };

  const r=await api(
    BASE+":runQuery?key="+API_KEY,
    {
      method:"POST",
      body:JSON.stringify(body)
    }
  );

  if(!r.ok)return [];

  const data=await r.json();

  const posts=[];

  for(const item of data){
    if(item.document){
      posts.push(item.document);
    }
  }

  posts.sort((a,b)=>{

    const da=val(a.fields?.createdAt);
    const db=val(b.fields?.createdAt);

    return String(db).localeCompare(String(da));
  });

  return posts;
}

function showProfile(user){

  const own=user.uid===myUid;

  document.getElementById("edit").style.display=
    own?"block":"none";

  document.getElementById("edit").onclick=()=>{
    location.href="edit-profile.html";
  };

  const profile=document.getElementById("profile");

  profile.innerHTML=`
    <div class="head">

      <img class="avatar"
        src="${user.photoURL||""}"
        onerror="this.style.visibility='hidden'">

      <div class="details">

        <div class="name">${esc(user.name)}</div>

        <div class="username">
          @${esc(user.username)}
        </div>

      </div>
    </div>

    <div class="bio">${esc(user.bio)}</div>

    ${
      own
      ? ""
      : `<button id="followBtn" class="follow">Follow</button>`
    }

    <div class="stats">
      <div class="stat">
        <b id="postCount">0</b>
        <span>Posts</span>
      </div>

      <div class="stat">
        <b>0</b>
        <span>Followers</span>
      </div>

      <div class="stat">
        <b>0</b>
        <span>Following</span>
      </div>
    </div>
  `;

  if(!own){

    document.getElementById("followBtn").onclick=function(){

      if(this.innerText==="Follow"){
        this.innerText="Following";
      }else{
        this.innerText="Follow";
      }

    };

  }
}

async function load(){

  if(refreshToken){
    await refreshTokenNow();
  }

  const user=await getUser();

  if(!user){

    document.getElementById("profile").innerHTML=
      '<div class="empty">User profile not found.</div>';

    return;
  }

  // Actual UID save hoga, document ID nahi.
  if(user.uid){
    localStorage.setItem("crockcellViewedUser",user.uid);
  }

  showProfile(user);

  const posts=await getPosts(user.uid);

  const box=document.getElementById("posts");

  document.getElementById("postCount").innerText=posts.length;

  if(!posts.length){

    box.innerHTML='<div class="empty">No Posts Yet</div>';

    return;
  }

  box.innerHTML="";

  posts.forEach(doc=>{

    const f=doc.fields||{};
    const image=val(f.image);

    if(!image)return;

    const img=document.createElement("img");

    img.className="post";
    img.src=image;
    img.alt="Post";

    box.appendChild(img);
  });
}

function goMyProfile(){

  // Apni profile par hamesha actual Firebase UID jayegi.
  location.href=
    "profile.html?uid="+encodeURIComponent(myUid);
}

load();
</script>

</body>
</html>
