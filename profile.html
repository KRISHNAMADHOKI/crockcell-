<script>


/* =========================================
   FIREBASE
========================================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================================
   SESSION
========================================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let currentUID =
localStorage.getItem(
  "crockcell_uid"
);


if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}

if(!currentUID){

  currentUID =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}


if(!token || !currentUID){

  window.location.replace(
    "index.html"
  );

}


/* =========================================
   URL
========================================= */

const params =
new URLSearchParams(
  window.location.search
);

const requestedUID =
params.get("uid");

const requestedUsername =
params.get("username");

const requestedName =
params.get("name");

const requestedPhoto =
params.get("photo");


/* =========================================
   SESSION PROFILE FROM SEARCH
========================================= */

let savedTarget = null;


try{

  const saved =
  sessionStorage.getItem(
    "crockcell_profile_target"
  );

  if(saved){

    savedTarget =
    JSON.parse(saved);

  }

}
catch(error){

  console.log(
    "Saved profile unavailable"
  );

}


/* =========================================
   PROFILE UID
========================================= */

const profileUID =
requestedUID ||
(savedTarget?.uid) ||
currentUID;


/* =========================================
   ELEMENTS
========================================= */

const profileArea =
document.getElementById(
  "profileArea"
);

const listModal =
document.getElementById(
  "listModal"
);

const listTitle =
document.getElementById(
  "listTitle"
);

const listContent =
document.getElementById(
  "listContent"
);

const closeList =
document.getElementById(
  "closeList"
);


/* =========================================
   CURRENT PROFILE
========================================= */

let currentProfile = null;


/* =========================================
   FIRESTORE BASE
========================================= */

function firestoreBase(){

  return (
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents"
  );

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

  try{

    /*
      IMPORTANT:

      Search se profile open hone par
      savedTarget me already user data hota hai.

      Isliye Firebase ka wait nahi.
    */

    if(
      savedTarget &&
      savedTarget.uid === profileUID
    ){

      currentProfile = {

        uid:
        savedTarget.uid,

        username:
        savedTarget.username ||
        requestedUsername ||
        "user",

        name:
        savedTarget.name ||
        requestedName ||
        savedTarget.username ||
        "User",

        photoURL:
        savedTarget.photoURL ||
        requestedPhoto ||
        "",

        bio:""

      };


      renderProfile();


      /*
        Firebase se bio/counts background me.
      */

      loadExtraProfileData();

      return;

    }


    /*
      URL se profile data available ho
      to bhi turant show.
    */

    if(
      requestedUID &&
      (
        requestedUsername ||
        requestedName ||
        requestedPhoto
      )
    ){

      currentProfile = {

        uid:
        requestedUID,

        username:
        requestedUsername ||
        "user",

        name:
        requestedName ||
        requestedUsername ||
        "User",

        photoURL:
        requestedPhoto ||
        "",

        bio:""

      };


      renderProfile();

      loadExtraProfileData();

      return;

    }


    /*
      Apni profile ho to Firebase se load.
    */

    const user =
    await getUserByUID(
      profileUID
    );


    if(!user){

      throw new Error(
        "USER_NOT_FOUND"
      );

    }


    currentProfile =
    user;


    renderProfile();

    loadExtraProfileData();

  }
  catch(error){

    console.error(
      "PROFILE ERROR:",
      error
    );


    profileArea.innerHTML = `

      <div class="error-box">

        Profile load nahi ho paayi.

        <br><br>

        <button
          class="retry-btn"
          onclick="location.reload()"
        >
          Retry
        </button>

      </div>

    `;

  }

}


/* =========================================
   EXTRA PROFILE DATA
========================================= */

async function loadExtraProfileData(){

  /*
    Firebase se actual profile data
    background me lene ki koshish.
  */

  try{

    const user =
    await getUserByUID(
      profileUID
    );


    if(user){

      currentProfile.name =
      user.name ||
      currentProfile.name;

      currentProfile.username =
      user.username ||
      currentProfile.username;

      currentProfile.photoURL =
      user.photoURL ||
      currentProfile.photoURL;

      currentProfile.bio =
      user.bio ||
      "";


      updateProfileDisplay();

    }

  }
  catch(error){

    console.log(
      "Extra profile data skipped"
    );

  }


  /*
    Follow information.
  */

  loadFollowCounts();


  if(
    currentProfile.uid !==
    currentUID
  ){

    updateFollowButton();

  }

}


/* =========================================
   UPDATE PROFILE DISPLAY
========================================= */

function updateProfileDisplay(){

  const nameElement =
  document.getElementById(
    "profileName"
  );

  const usernameElement =
  document.getElementById(
    "profileUsername"
  );

  const bioElement =
  document.getElementById(
    "profileBio"
  );

  const photoElement =
  document.getElementById(
    "profilePhoto"
  );


  if(nameElement){

    nameElement.textContent =
    currentProfile.name ||
    "User";

  }


  if(usernameElement){

    usernameElement.textContent =
    "@" +
    (
      currentProfile.username ||
      "user"
    );

  }


  if(bioElement){

    bioElement.textContent =
    currentProfile.bio ||
    "No bio yet.";

  }


  if(photoElement){

    photoElement.src =
    currentProfile.photoURL ||
    placeholderPhoto();

  }

}


/* =========================================
   RENDER PROFILE
========================================= */

function renderProfile(){

  const isOwn =
  currentProfile.uid ===
  currentUID;


  profileArea.innerHTML = `

    <div class="top">

      <img
        id="profilePhoto"
        class="photo"
        src="${
          escapeAttribute(
            currentProfile.photoURL ||
            placeholderPhoto()
          )
        }"
        alt=""
      >

      <div class="info">

        <div
          id="profileName"
          class="name"
        >
          ${escapeHTML(
            currentProfile.name ||
            "User"
          )}
        </div>

        <div
          id="profileUsername"
          class="username"
        >
          @${escapeHTML(
            currentProfile.username ||
            "user"
          )}
        </div>

      </div>

    </div>


    <!-- STATS -->

    <div class="stats">

      <div
        id="followersStat"
        class="stat"
      >

        <div
          id="followersCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Followers
        </div>

      </div>


      <div
        id="followingStat"
        class="stat"
      >

        <div
          id="followingCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Following
        </div>

      </div>


      <div class="stat">

        <div
          id="postsCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Posts
        </div>

      </div>

    </div>


    <!-- BIO -->

    <div
      id="profileBio"
      class="bio"
    >
      ${escapeHTML(
        currentProfile.bio ||
        "No bio yet."
      )}
    </div>


    <!-- BUTTONS -->

    ${
      isOwn

      ?

      `
      <div class="actions">

        <button
          id="editButton"
          class="action-btn"
          type="button"
        >
          Edit Profile
        </button>

      </div>
      `

      :

      `
      <div class="actions">

        <button
          id="followButton"
          class="action-btn"
          type="button"
        >
          Follow
        </button>

        <button
          id="messageButton"
          class="action-btn"
          type="button"
        >
          Message
        </button>

      </div>
      `

    }

  `;


  /*
    FOLLOWERS
  */

  document
  .getElementById(
    "followersStat"
  )
  .onclick =
  function(){

    openUserList(
      "Followers"
    );

  };


  /*
    FOLLOWING
  */

  document
  .getElementById(
    "followingStat"
  )
  .onclick =
  function(){

    openUserList(
      "Following"
    );

  };


  /*
    OWN PROFILE
  */

  if(isOwn){

    document
    .getElementById(
      "editButton"
    )
    .onclick =
    function(){

      window.location.assign(
        "edit-profile.html"
      );

    };

  }
  else{

    /*
      FOLLOW
    */

    document
    .getElementById(
      "followButton"
    )
    .onclick =
    toggleFollow;


    /*
      MESSAGE
    */

    document
    .getElementById(
      "messageButton"
    )
    .onclick =
    function(){

      openMessage(
        currentProfile
      );

    };

  }

}


/* =========================================
   GET USER BY UID
========================================= */

async function getUserByUID(
  targetUID
){

  /*
    METHOD 1:
    Document ID = UID
  */

  try{

    const url =
    firestoreBase() +
    "/users/" +
    encodeURIComponent(
      targetUID
    ) +
    "?key=" +
    API_KEY;


    const response =
    await fetch(
      url,
      {

        headers:{
          Authorization:
          "Bearer " + token
        }

      }
    );


    if(response.ok){

      const data =
      await response.json();


      return convertUser(
        targetUID,
        data.fields || {}
      );

    }

  }
  catch(error){

    console.log(
      "Direct user lookup failed"
    );

  }


  /*
    METHOD 2:
    Search users where uid == targetUID
  */

  try{

    const url =
    firestoreBase() +
    ":runQuery?key=" +
    API_KEY;


    const body = {

      structuredQuery:{

        from:[
          {
            collectionId:"users"
          }
        ],

        where:{

          fieldFilter:{

            field:{
              fieldPath:"uid"
            },

            op:"EQUAL",

            value:{
              stringValue:
              targetUID
            }

          }

        },

        limit:1

      }

    };


    const response =
    await fetch(
      url,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify(body)

      }
    );


    if(response.ok){

      const rows =
      await response.json();


      for(
        const row of rows
      ){

        if(row.document){

          return convertUser(
            targetUID,
            row.document.fields || {}
          );

        }

      }

    }

  }
  catch(error){

    console.log(
      "UID field search failed"
    );

  }


  return null;

}


/* =========================================
   CONVERT USER
========================================= */

function convertUser(
  uid,
  f
){

  return {

    uid:
    f.uid?.stringValue ||
    uid,

    name:
    f.name?.stringValue ||
    f.username?.stringValue ||
    "User",

    username:
    f.username?.stringValue ||
    "user",

    photoURL:
    f.photoURL?.stringValue ||
    "",

    bio:
    f.bio?.stringValue ||
    ""

  };

}


/* =========================================
   FOLLOW STATUS
========================================= */

async function updateFollowButton(){

  const button =
  document.getElementById(
    "followButton"
  );


  if(!button)return;


  try{

    const following =
    await checkFollowing(
      currentUID,
      currentProfile.uid
    );


    button.textContent =
    following
    ?
    "Following"
    :
    "Follow";


    button.classList.toggle(
      "following-btn",
      following
    );

  }
  catch(error){

    console.log(
      "Follow status unavailable"
    );

  }

}


/* =========================================
   CHECK FOLLOWING
========================================= */

async function checkFollowing(
  followerID,
  followingID
){

  const id =
  followerID +
  "_" +
  followingID;


  const url =
  firestoreBase() +
  "/follows/" +
  encodeURIComponent(id) +
  "?key=" +
  API_KEY;


  const response =
  await fetch(
    url,
    {

      headers:{
        Authorization:
        "Bearer " + token
      }

    }
  );


  return response.ok;

}


/* =========================================
   FOLLOW / UNFOLLOW
========================================= */

async function toggleFollow(){

  const button =
  document.getElementById(
    "followButton"
  );


  if(!button)return;


  button.disabled = true;


  try{

    const alreadyFollowing =
    await checkFollowing(
      currentUID,
      currentProfile.uid
    );


    const id =
    currentUID +
    "_" +
    currentProfile.uid;


    const url =
    firestoreBase() +
    "/follows/" +
    encodeURIComponent(id) +
    "?key=" +
    API_KEY;


    if(alreadyFollowing){

      const response =
      await fetch(
        url,
        {
          method:"DELETE",
          headers:{
            Authorization:
            "Bearer " + token
          }
        }
      );


      if(!response.ok){

        throw new Error(
          "UNFOLLOW_FAILED"
        );

      }


      button.textContent =
      "Follow";


      button.classList.remove(
        "following-btn"
      );


      changeFollowerCount(
        -1
      );

    }
    else{

      const body = {

        fields:{

          followerId:{
            stringValue:
            currentUID
          },

          followingId:{
            stringValue:
            currentProfile.uid
          },

          createdAt:{
            timestampValue:
            new Date().toISOString()
          }

        }

      };


      const response =
      await fetch(
        url,
        {

          method:"PATCH",

          headers:{

            Authorization:
            "Bearer " + token,

            "Content-Type":
            "application/json"

          },

          body:
          JSON.stringify(body)

        }
      );


      if(!response.ok){

        throw new Error(
          "FOLLOW_FAILED"
        )
