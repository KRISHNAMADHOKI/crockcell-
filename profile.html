<script>

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================
   SESSION
========================= */

let token =
localStorage.getItem("crockcell_idToken");

let currentUID =
localStorage.getItem("crockcell_uid");


if(!token){

  token =
  sessionStorage.getItem("crockcell_idToken");

}

if(!currentUID){

  currentUID =
  sessionStorage.getItem("crockcell_uid");

}


if(!token || !currentUID){

  window.location.replace("index.html");

}


/* =========================
   URL
========================= */

const params =
new URLSearchParams(
  window.location.search
);

const requestedUID =
params.get("uid");

const requestedUsername =
params.get("username");

const requestedName =
params.get("name");


const profileUID =
requestedUID ||
currentUID;


/* =========================
   ELEMENTS
========================= */

const profileArea =
document.getElementById("profileArea");

const listModal =
document.getElementById("listModal");

const listTitle =
document.getElementById("listTitle");

const listContent =
document.getElementById("listContent");

const closeList =
document.getElementById("closeList");


let currentProfile = null;


/* =========================
   FIRESTORE URL
========================= */

function firestoreBase(){

  return (
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents"
  );

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  try{

    let userData = null;


    /*
      STEP 1:
      Pehle document ID ko UID maan kar try.
    */

    try{

      const directURL =
        firestoreBase() +
        "/users/" +
        encodeURIComponent(profileUID) +
        "?key=" +
        API_KEY;


      const directResponse =
      await fetch(
        directURL,
        {
          headers:{
            Authorization:
            "Bearer " + token
          }
        }
      );


      if(directResponse.ok){

        userData =
        await directResponse.json();

      }

    }
    catch(error){

      console.log(
        "Direct profile lookup failed"
      );

    }


    /*
      STEP 2:
      Agar document ID se nahi mila,
      users collection ke andar uid field se search.
    */

    if(!userData){

      userData =
      await findUserByUID(
        profileUID
      );

    }


    /*
      STEP 3:
      Agar phir bhi nahi mila.
    */

    if(!userData){

      throw new Error(
        "USER_NOT_FOUND"
      );

    }


    const f =
    userData.fields || {};


    /*
      Actual UID document ke andar se.
    */

    const actualUID =
      f.uid?.stringValue ||
      profileUID;


    currentProfile = {

      uid:actualUID,

      name:
      f.name?.stringValue ||
      requestedName ||
      requestedUsername ||
      "User",

      username:
      f.username?.stringValue ||
      requestedUsername ||
      "",

      photoURL:
      f.photoURL?.stringValue ||
      "",

      bio:
      f.bio?.stringValue ||
      ""

    };


    /*
      PROFILE KO TURANT SHOW KARO.
    */

    renderProfile();


    /*
      Baaki features background me.
    */

    loadFollowCounts();

    if(currentProfile.uid !== currentUID){

      updateFollowButton();

    }

  }
  catch(error){

    console.error(
      "PROFILE ERROR:",
      error
    );


    profileArea.innerHTML = `

      <div class="error-box">

        Profile load nahi ho paayi.

        <br>

        User database me nahi mila.

        <br><br>

        <small>
          UID: ${escapeHTML(profileUID)}
        </small>

        <br>

        <button
          class="retry-btn"
          onclick="location.reload()"
        >
          Retry
        </button>

      </div>

    `;

  }

}


/* =========================
   FIND USER BY UID FIELD
========================= */

async function findUserByUID(
  targetUID
){

  const url =
    firestoreBase() +
    ":runQuery?key=" +
    API_KEY;


  const body = {

    structuredQuery:{

      from:[

        {
          collectionId:"users"
        }

      ],

      where:{

        fieldFilter:{

          field:{
            fieldPath:"uid"
          },

          op:"EQUAL",

          value:{
            stringValue:targetUID
          }

        }

      },

      limit:1

    }

  };


  const response =
  await fetch(
    url,
    {

      method:"POST",

      headers:{

        Authorization:
        "Bearer " + token,

        "Content-Type":
        "application/json"

      },

      body:
      JSON.stringify(body)

    }
  );


  if(!response.ok){

    console.log(
      "UID query failed:",
      response.status
    );

    return null;

  }


  const rows =
  await response.json();


  for(
    const row of rows
  ){

    if(row.document){

      return row.document;

    }

  }


  return null;

}


/* =========================
   RENDER PROFILE
========================= */

function renderProfile(){

  const isOwn =
  currentProfile.uid === currentUID;


  profileArea.innerHTML = `

    <div class="top">

      <img
        class="photo"
        src="${
          escapeAttribute(
            currentProfile.photoURL ||
            placeholderPhoto()
          )
        }"
        alt=""
      >

      <div class="info">

        <div class="name">
          ${escapeHTML(
            currentProfile.name
          )}
        </div>

        <div class="username">
          @${escapeHTML(
            currentProfile.username
          )}
        </div>

      </div>

    </div>


    <div class="stats">

      <div
        class="stat"
        id="followersStat"
      >

        <div
          id="followersCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Followers
        </div>

      </div>


      <div
        class="stat"
        id="followingStat"
      >

        <div
          id="followingCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Following
        </div>

      </div>


      <div class="stat">

        <div
          id="postsCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Posts
        </div>

      </div>

    </div>


    <div class="bio">

      ${escapeHTML(
        currentProfile.bio ||
        "No bio yet."
      )}

    </div>


    ${
      isOwn

      ?

      `
      <div class="actions">

        <button
          id="editButton"
          class="action-btn"
          type="button"
        >
          Edit Profile
        </button>

      </div>
      `

      :

      `
      <div class="actions">

        <button
          id="followButton"
          class="action-btn"
          type="button"
        >
          Follow
        </button>

        <button
          id="messageButton"
          class="action-btn"
          type="button"
        >
          Message
        </button>

      </div>
      `

    }

  `;


  document
    .getElementById("followersStat")
    .onclick =
    function(){

      openUserList("Followers");

    };


  document
    .getElementById("followingStat")
    .onclick =
    function(){

      openUserList("Following");

    };


  if(isOwn){

    document
      .getElementById("editButton")
      .onclick =
      function(){

        window.location.assign(
          "edit-profile.html"
        );

      };

  }
  else{

    document
      .getElementById("followButton")
      .onclick =
      toggleFollow;


    document
      .getElementById("messageButton")
      .onclick =
      function(){

        openMessage(
          currentProfile
        );

      };

  }

}


/* =========================
   FOLLOW STATUS
========================= */

async function updateFollowButton(){

  const button =
  document.getElementById(
    "followButton"
  );


  if(!button){

    return;

  }


  try{

    const following =
    await checkFollowing(
      currentUID,
      currentProfile.uid
    );


    button.textContent =
    following
    ?
    "Following"
    :
    "Follow";


    button.classList.toggle(
      "following-btn",
      following
    );

  }
  catch(error){

    console.log(
      "Follow status skipped"
    );

  }

}


/* =========================
   FOLLOW COUNTS
========================= */

async function loadFollowCounts(){

  if(!currentProfile){

    return;

  }


  try{

    const followers =
    await getFollowDocuments(
      "followingId",
      currentProfile.uid
    );


    const following =
    await getFollowDocuments(
      "followerId",
      currentProfile.uid
    );


    const followersCount =
    document.getElementById(
      "followersCount"
    );

    const followingCount =
    document.getElementById(
      "followingCount"
    );


    if(followersCount){

      followersCount.textContent =
      followers.length;

    }


    if(followingCount){

      followingCount.textContent =
      following.length;

    }

  }
  catch(error){

    console.log(
      "Follow counts unavailable"
    );

  }

}


/* =========================
   FOLLOW CHECK
========================= */

async function checkFollowing(
  followerID,
  followingID
){

  const id =
  followerID +
  "_" +
  followingID;


  const url =
    firestoreBase() +
    "/follows/" +
    encodeURIComponent(id) +
    "?key=" +
    API_KEY;


  const response =
  await fetch(
    url,
    {
      headers:{
        Authorization:
        "Bearer " + token
      }
    }
  );


  return response.ok;

}


/* =========================
   FOLLOW / UNFOLLOW
========================= */

async function toggleFollow(){

  const button =
  document.getElementById(
    "followButton"
  );


  if(!button){

    return;

  }


  button.disabled = true;


  try{

    const alreadyFollowing =
    await checkFollowing(
      currentUID,
      currentProfile.uid
    );


    const id =
    currentUID +
    "_" +
    currentProfile.uid;


    const url =
      firestoreBase() +
      "/follows/" +
      encodeURIComponent(id) +
      "?key=" +
      API_KEY;


    if(alreadyFollowing){

      const response =
      await fetch(
        url,
        {
          method:"DELETE",
          headers:{
            Authorization:
            "Bearer " + token
          }
        }
      );


      if(!response.ok){

        throw new Error(
          "UNFOLLOW_FAILED"
        );

      }


      button.textContent =
      "Follow";

      button.classList.remove(
        "following-btn"
      );


      changeFollowerCount(-1);

    }
    else{

      const body = {

        fields:{

          followerId:{
            stringValue:
            currentUID
          },

          followingId:{
            stringValue:
            currentProfile.uid
          },

          createdAt:{
            timestampValue:
            new Date().toISOString()
          }

        }

      };


      const response =
      await fetch(
        url,
        {

          method:"PATCH",

          headers:{

            Authorization:
            "Bearer " + token,

            "Content-Type":
            "application/json"

          },

          body:
          JSON.stringify(body)

        }
      );


      if(!response.ok){

        throw new Error(
          "FOLLOW_FAILED"
        );

      }


      button.textContent =
      "Following";

      button.classList.add(
        "following-btn"
      );


      changeFollowerCount(1);

    }

  }
  catch(error){

    console.error(error);

    alert(
      "Follow update nahi ho paaya."
    );

  }


  button.disabled = false;

}


/* =========================
   CHANGE FOLLOWER COUNT
========================= */

function changeFollowerCount(
  amount
){

  const element =
  document.getElementById(
    "followersCount"
  );


  if(!element){

    return;

  }


  let number =
  parseInt(
    element.textContent
  ) || 0;


  number += amount;


  if(number < 0){

    number = 0;

  }


  element.textContent =
  number;

}


/* =========================
   GET FOLLOW DOCUMENTS
========================= */

async function getFollowDocuments(
  fieldName,
  targetUID
){

  const url =
    firestoreBase() +
    ":runQuery?key=" +
    API_KEY;


  const body = {

    structuredQuery:{

      from:[
        {
          collectionId:"follows"
        }
      ],

      where:{

        fieldFilter:{

          field:{
            fieldPath:fieldName
          },

          op:"EQUAL",

          value:{
            stringValue:targetUID
          }

        }

      },

      limit:1000

    }

  };


  const response =
  await fetch(
    url,
    {

      method:"POST",

      headers:{

        Authorization:
        "Bearer " + token,

        "Content-Type":
        "application/json"

      },

      body:
      JSON.stringify(body)

    }
  );


  if(!response.ok){

    throw new Error(
      "FOLLOW_QUERY_FAILED"
    );

  }


  const rows =
  await response.json();


  const result=[];


  rows.forEach(row=>{

    if(!row.document){

      return;

    }


    const f =
    row.document.fields || {};


    result.push({

      followerId:
      f.followerId?.stringValue ||
      "",

      followingId:
      f.followingId?.stringValue ||
      ""

    });

  });


  return result;

}


/* =========================
   USER LIST
========================= */

async function openUserList(
  type
){

  listModal.style.display =
  "flex";


  listTitle.textContent =
  type;


  listContent.innerHTML = `

    <div class="list-empty">
      Loading...
    </div>

  `;


  try{

    const documents =
    await getFollowDocuments(

      type === "Followers"
      ?
      "followingId"
      :
      "followerId",

      currentProfile.uid

    );


    const ids =
    documents.map(
      item =>
      type === "Followers"
      ?
      item.followerId
      :
      item.followingId
    );


    if(!ids.length){

      listContent.innerHTML = `

        <div class="list-empty">

          ${
            type === "Followers"
            ?
            "Abhi koi followers nahi hain."
            :
            "Abhi kisi ko follow nahi kiya."

          }

        </div>

      `;

      return;

    }


    const users=[];


    for(
      const id of ids
    ){

      const user =
      await getUserByUID(id);


      if(user){

        users.push(user);

      }

    }


    renderUserList(users);

  }
  catch(error){

    console.error(error);

    listContent.innerHTML = `

      <div class="list-empty">
        List load nahi ho paayi.
      </div>

    `;

  }

}


/* =========================
   GET USER BY UID
   DIRECT + QUERY
========================= */

async function getUserByUID(
  targetUID
){

  /*
    Pehle direct document ID.
  */

  try{

    const directURL =
      firestoreBase() +
      "/users/" +
      encodeURIComponent(targetUID) +
      "?key=" +
      API_KEY;


    const response =
    await fetch(
      directURL,
      {
        headers:{
          Authorization:
          "Bearer " + token
        }
      }
    );


    if(response.ok){

      const da
