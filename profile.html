<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile - CROCKCELL</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
padding-bottom:70px
}

.header{
height:64px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
border-bottom:1px solid #222
}

.leftHead{
display:flex;
align-items:center;
gap:14px
}

.back{
font-size:28px;
cursor:pointer
}

.logo{
font-size:20px;
font-weight:bold
}

.settings{
font-size:22px;
cursor:pointer
}

.profile{
padding:20px 16px 12px
}

.top{
display:flex;
align-items:center
}

.photo{
width:88px;
height:88px;
border-radius:50%;
object-fit:cover;
background:#222;
margin-right:20px
}

.details{
flex:1;
min-width:0
}

.name{
font-size:20px;
font-weight:bold;
margin-bottom:5px
}

.username{
font-size:14px;
color:#999;
margin-bottom:8px
}

.bio{
font-size:14px;
line-height:1.4;
white-space:pre-wrap
}

.stats{
display:flex;
justify-content:space-around;
margin-top:22px;
text-align:center
}

.statNumber{
font-size:18px;
font-weight:bold
}

.statText{
font-size:12px;
color:#999;
margin-top:4px
}

.actions{
margin-top:18px
}

.editBtn,
.followBtn{
width:100%;
height:42px;
border:0;
border-radius:10px;
font-weight:bold;
font-size:15px;
cursor:pointer;
background:#fff;
color:#000
}

.following{
background:#292929;
color:#fff
}

.tabs{
height:52px;
display:flex;
align-items:center;
justify-content:center;
border-top:1px solid #222;
border-bottom:1px solid #222;
margin-top:10px
}

.tab{
font-size:22px
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:2px;
padding-top:2px
}

.post{
width:100%;
aspect-ratio:1/1;
background:#151515;
overflow:hidden;
cursor:pointer
}

.post img{
width:100%;
height:100%;
object-fit:cover;
display:block
}

.noPosts,
.loading,
.error{
text-align:center;
color:#888;
padding:45px 15px
}

.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
height:60px;
background:#000;
border-top:1px solid #222;
display:flex;
justify-content:space-around;
align-items:center;
z-index:10
}

.bottom a{
color:#aaa;
text-decoration:none;
font-size:23px
}

.bottom a.active{
color:#fff
}
</style>
</head>

<body>

<div class="header">

<div class="leftHead">
<div class="back" onclick="history.back()">‹</div>
<div class="logo">CROCKCELL</div>
</div>

<div class="settings" id="settingsBtn">⚙</div>

</div>

<div id="page">

<div class="loading">
Loading profile...
</div>

</div>

<div class="bottom">

<a href="home.html">⌂</a>
<a href="search.html">⌕</a>
<a href="create.html">＋</a>
<a href="activity.html">♡</a>
<a href="profile.html" class="active">◉</a>

</div>

<script>

const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";
const PROJECT_ID="crockcell-cd2e6";

const BASE=
`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

let token=localStorage.getItem("crockcellIdToken");
let myUid=localStorage.getItem("crockcellUid");
let refreshToken=localStorage.getItem("crockcellRefreshToken");

const page=document.getElementById("page");

if(!token || !myUid){
location.href="index.html";
}

function esc(v){
return String(v||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function value(field){

if(!field)return"";

if(field.stringValue!==undefined)
return field.stringValue;

if(field.integerValue!==undefined)
return field.integerValue;

return"";
}

async function refresh(){

if(!refreshToken)return false;

try{

const r=await fetch(
`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:
"grant_type=refresh_token&refresh_token="+
encodeURIComponent(refreshToken)
}
);

const d=await r.json();

if(!r.ok || !d.id_token)
return false;

token=d.id_token;

if(d.refresh_token)
refreshToken=d.refresh_token;

localStorage.setItem(
"crockcellIdToken",
token
);

localStorage.setItem(
"crockcellRefreshToken",
refreshToken
);

return true;

}catch(e){
return false;
}
}

async function firebase(path,options={}){

options.headers=Object.assign(
{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
options.headers||{}
);

let r=await fetch(BASE+path,options);

if((r.status===401 || r.status===403)
&& refreshToken){

const ok=await refresh();

if(ok){

options.headers.Authorization=
"Bearer "+token;

r=await fetch(BASE+path,options);

}
}

const text=await r.text();

let data=null;

try{
data=text?JSON.parse(text):null
}catch(e){}

if(!r.ok){

throw new Error(
data?.error?.message ||
("Firebase error "+r.status)
);

}

return data;
}

function makeUser(doc){

const f=doc.fields||{};

return{
id:doc.name.split("/").pop(),
uid:value(f.uid) || doc.name.split("/").pop(),
name:value(f.name),
username:value(f.username),
bio:value(f.bio),
photoURL:value(f.photoURL),
email:value(f.email)
};

}

/*
 URL se jis user ko open karna hai
 uska ID mil raha hai.
*/

const params=new URLSearchParams(
location.search
);

let requestedId=params.get("uid");

/*
 Agar direct profile.html khola gaya hai
 to apni profile open hogi.
*/

if(!requestedId){
requestedId=myUid;
}

let profileUser=null;

async function getUser(){

/*
 Pehle document ID se try
*/

try{

const doc=await firebase(
"/users/"+encodeURIComponent(requestedId),
{
method:"GET"
}
);

if(doc){
profileUser=makeUser(doc);
return profileUser;
}

}catch(e){}

/*
 Agar document ID UID nahi hai,
 to uid field se search karenge.
*/

try{

const query={
structuredQuery:{
from:[
{collectionId:"users"}
],
where:{
fieldFilter:{
field:{
fieldPath:"uid"
},
op:"EQUAL",
value:{
stringValue:requestedId
}
}
},
limit:1
}
};

const data=await firebase(
":runQuery",
{
method:"POST",
body:JSON.stringify(query)
}
);

const found=(data||[])
.find(x=>x.document);

if(found){
profileUser=makeUser(found.document);
return profileUser;
}

}catch(e){}

return null;
}

async function getPosts(userId){

const query={
structuredQuery:{
from:[
{collectionId:"posts"}
],
where:{
fieldFilter:{
field:{
fieldPath:"userId"
},
op:"EQUAL",
value:{
stringValue:userId
}
}
},
orderBy:[
{
field:{
fieldPath:"createdAt"
},
direction:"DESCENDING"
}
],
limit:100
}
};

try{

const data=await firebase(
":runQuery",
{
method:"POST",
body:JSON.stringify(query)
}
);

return(data||[])
.filter(x=>x.document)
.map(x=>x.document);

}catch(e){

console.log("Posts error:",e);
return[];

}
}

function postData(doc){

const f=doc.fields||{};

return{
id:doc.name.split("/").pop(),
image:value(f.image),
caption:value(f.caption),
createdAt:value(f.createdAt)
};

}

function renderProfile(user,posts){

const isMe=
(user.uid===myUid || user.id===myUid);

const photo=
user.photoURL ||
"https://via.placeholder.com/200";

const name=
user.name ||
user.username ||
"User";

const username=
user.username || "";

page.innerHTML=`

<div class="profile">

<div class="top">

<img
class="photo"
src="${esc(photo)}"
onerror="this.src='https://via.placeholder.com/200'"
>

<div class="details">

<div class="name">
${esc(name)}
</div>

<div class="username">
${username?"@"+esc(username):""}
</div>

<div class="bio">
${esc(user.bio||"")}
</div>

</div>

</div>

<div class="stats">

<div>
<div class="statNumber">
${posts.length}
</div>
<div class="statText">
Posts
</div>
</div>

<div>
<div class="statNumber">
0
</div>
<div class="statText">
Followers
</div>
</div>

<div>
<div class="statNumber">
0
</div>
<div class="statText">
Following
</div>
</div>

</div>

<div class="actions">

${
isMe
?
`<button
class="editBtn"
id="editBtn"
>
Edit profile
</button>`
:
`<button
class="followBtn"
id="profileFollowBtn"
>
Follow
</button>`
}

</div>

</div>

<div class="tabs">
<div class="tab">▦</div>
</div>

${
posts.length
?
`<div class="grid">
${posts.map(p=>{

const post=postData(p);

return`

<div
class="post"
data-post="${esc(post.id)}"
>

<img
src="${esc(post.image)}"
onerror="this.style.display='none'"
>

</div>

`;

}).join("")}
</div>`
:
`<div class="noPosts">
No posts yet
</div>`
}

`;

if(isMe){

document.getElementById("editBtn")
.addEventListener("click",()=>{
location.href="edit-profile.html";
});

}else{

document.getElementById("profileFollowBtn")
.addEventListener(
"click",
()=>toggleFollow(
user.uid||user.id
)
);

}

document.querySelectorAll(".post")
.forEach(post=>{

post.addEventListener("click",()=>{

/*
 Abhi post open karne ke liye
 post ID save kar rahe hain.
 Next step me isi se Like,
 Comment aur Share add karenge.
*/

localStorage.setItem(
"crockcellViewedPost",
post.dataset.post
);

alert(
"Post open system next step me add hoga."
);

});

});

}

async function toggleFollow(target){

const followId=
myUid+"_"+target;

const button=
document.getElementById(
"profileFollowBtn"
);

try{

let exists=true;

try{

await firebase(
"/follows/"+followId,
{method:"GET"}
);

}catch(e){

exists=false;

}

if(exists){

await firebase(
"/follows/"+followId,
{method:"DELETE"}
);

button.textContent="Follow";
button.classList.remove("following");

}else{

await firebase(
"/follows/"+followId,
{
method:"PATCH",
body:JSON.stringify({
fields:{
followerId:{
stringValue:myUid
},
followingId:{
stringValue:target
},
createdAt:{
timestampValue:
new Date().toISOString()
}
}
})
}
);

button.textContent="Following";
button.classList.add("following");

}

}catch(e){

alert(
"Follow update nahi ho paya."
);

}

}

document.getElementById(
"settingsBtn"
).addEventListener(
"click",
()=>{

if(profileUser &&
(profileUser.uid===myUid ||
 profileUser.id===myUid)){

location.href="edit-profile.html";

}else{

alert(
"Settings sirf apni profile par available hain."
);

}

});

async function start(){

try{

const user=await getUser();

if(!user){

page.innerHTML=`
<div class="error">
Profile nahi mili.
</div>
`;

return;
}

const realUid=
user.uid ||
user.id;

const posts=
await getPosts(realUid);

renderProfile(user,posts);

}catch(e){

console.log(e);

page.innerHTML=`
<div class="error">
Profile load nahi ho paayi.
</div>
`;

}

}

start();

</script>

</body>
  </html>
