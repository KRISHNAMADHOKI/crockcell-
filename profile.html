<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CROCKCELL Profile</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  padding-bottom:100px;
}

.header{
  padding:20px 18px 10px;
}

.top{
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar{
  width:92px;
  height:92px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}

.info{
  flex:1;
}

.name{
  font-size:23px;
  font-weight:bold;
}

.username{
  color:#888;
  margin-top:5px;
  font-size:15px;
}

.bio{
  margin-top:18px;
  color:#ccc;
  line-height:1.4;
  font-size:15px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.action-btn{
  flex:1;
  height:44px;
  border:0;
  border-radius:16px;
  background:#fff;
  color:#000;
  font-weight:bold;
  font-size:14px;
}

.message-btn{
  background:#202020;
  color:#fff;
  border:1px solid #444;
}

.stats{
  display:flex;
  margin-top:22px;
  padding:16px 0;
  border-top:1px solid #222;
  border-bottom:1px solid #222;
}

.stat{
  flex:1;
  text-align:center;
}

.stat-number{
  font-size:19px;
  font-weight:bold;
}

.stat-label{
  color:#888;
  font-size:12px;
  margin-top:4px;
}

.section{
  padding:18px;
}

.section-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

.posts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.post{
  aspect-ratio:1;
  background:#181818;
  overflow:hidden;
}

.post img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.empty{
  text-align:center;
  color:#666;
  padding:45px 10px;
  font-size:14px;
}

.loading{
  text-align:center;
  color:#888;
  padding:60px 20px;
}

.bottom-nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:20;
  display:flex;
  justify-content:space-around;
  padding:8px;
  border-radius:24px;
  background:rgba(25,25,25,.92);
  backdrop-filter:blur(18px);
  border:1px solid #333;
}

.nav-item{
  flex:1;
  text-align:center;
  padding:8px 4px;
  border-radius:17px;
  color:#999;
  text-decoration:none;
  font-size:11px;
}

.nav-item.active{
  background:#fff;
  color:#000;
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

</style>

</head>

<body>


<div id="loading" class="loading">
  Loading profile...
</div>


<div id="profilePage" style="display:none;">


  <div class="header">

    <div class="top">

      <img
        id="profilePhoto"
        class="avatar"
        src=""
        alt=""
      >

      <div class="info">

        <div
          id="profileName"
          class="name"
        >
        </div>

        <div
          id="profileUsername"
          class="username"
        >
        </div>

      </div>

    </div>


    <div
      id="profileBio"
      class="bio"
    >
    </div>


    <div
      id="actions"
      class="actions"
    >
    </div>


    <div class="stats">

      <div class="stat">

        <div
          id="postCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Posts
        </div>

      </div>


      <div class="stat">

        <div
          id="followers"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Followers
        </div>

      </div>


      <div class="stat">

        <div
          id="following"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Following
        </div>

      </div>

    </div>

  </div>


  <div class="section">

    <div class="section-title">
      Posts
    </div>

    <div
      id="posts"
      class="posts"
    >
    </div>

  </div>


</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <a
    class="nav-item"
    href="home.html"
  >
    <span class="nav-icon">⌂</span>
    Home
  </a>

  <a
    class="nav-item"
    href="search.html"
  >
    <span class="nav-icon">⌕</span>
    Search
  </a>

  <a
    class="nav-item"
    href="reels.html"
  >
    <span class="nav-icon">▶</span>
    Reels
  </a>

  <a
    class="nav-item"
    href="messages.html"
  >
    <span class="nav-icon">♡</span>
    Messages
  </a>

  <a
    class="nav-item active"
    href="profile.html"
  >
    <span class="nav-icon">◯</span>
    Profile
  </a>

</div>


<script>

/* =========================
   FIREBASE
========================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================
   CURRENT LOGIN SESSION
========================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let currentUID =
localStorage.getItem(
  "crockcell_uid"
);


/* SESSION STORAGE FALLBACK */

if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}

if(!currentUID){

  currentUID =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}


/* =========================
   CHECK LOGIN
========================= */

if(!token || !currentUID){

  window.location.replace(
    "index.html"
  );

}


/* =========================
   URL PARAMETERS
========================= */

const params =
new URLSearchParams(
  window.location.search
);


const requestedUID =
params.get("uid");


const requestedUsername =
params.get("username");


/*
  Agar Search se kisi user ka
  profile khola gaya hai to
  requestedUID use hoga.

  Agar apna profile khola gaya
  hai to currentUID use hoga.
*/

const profileUID =
requestedUID ||
currentUID;


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  try{

    const profileURL =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/users/" +
    encodeURIComponent(profileUID);


    const response =
    await fetch(
      profileURL,
      {
        headers:{
          Authorization:
          "Bearer " + token
        }
      }
    );


    if(!response.ok){

      throw new Error(
        "Profile not found"
      );

    }


    const data =
    await response.json();


    const f =
    data.fields || {};


    const profile = {

      uid:profileUID,

      name:
      f.name?.stringValue ||
      requestedUsername ||
      "User",

      username:
      f.username?.stringValue ||
      requestedUsername ||
      "",

      photoURL:
      f.photoURL?.stringValue ||
      "",

      bio:
      f.bio?.stringValue ||
      ""

    };


    showProfile(profile);


    await loadPosts(profileUID);


  }catch(error){

    console.error(error);

    document.getElementById(
      "loading"
    ).innerHTML =
    "Profile load nahi ho paayi.";

  }

}


/* =========================
   SHOW PROFILE
========================= */

function showProfile(profile){

  document.getElementById(
    "loading"
  ).style.display="none";


  document.getElementById(
    "profilePage"
  ).style.display="block";


  document.getElementById(
    "profileName"
  ).textContent =
  profile.name;


  document.getElementById(
    "profileUsername"
  ).textContent =
  "@" + profile.username;


  document.getElementById(
    "profileBio"
  ).textContent =
  profile.bio;


  document.getElementById(
    "profilePhoto"
  ).src =
  profile.photoURL ||
  placeholderPhoto();


  const actions =
  document.getElementById(
    "actions"
  );


  actions.innerHTML="";


  /* =====================
     OWN PROFILE
  ===================== */

  if(profile.uid===currentUID){

    const editButton =
    document.createElement(
      "button"
    );

    editButton.className=
    "action-btn";

    editButton.textContent=
    "Edit Profile";

    editButton.onclick=function(){

      window.location.href=
      "edit-profile.html";

    };

    actions.appendChild(
      editButton
    );


  }


  /* =====================
     OTHER USER
  ===================== */

  else{

    const followButton =
    document.createElement(
      "button"
    );

    followButton.className=
    "action-btn";

    followButton.textContent=
    "Follow";

    followButton.onclick=function(){

      alert(
        "Follow system next update me connect karenge."
      );

    };


    const messageButton =
    document.createElement(
      "button"
    );

    messageButton.className=
    "action-btn message-btn";

    messageButton.textContent=
    "Message";

    messageButton.onclick=function(){

      window.location.href=
      "messages.html?uid=" +
      encodeURIComponent(
        profile.uid
      ) +
      "&username=" +
      encodeURIComponent(
        profile.username
      );

    };


    actions.appendChild(
      followButton
    );

    actions.appendChild(
      messageButton
    );

  }

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(uid){

  const postsBox =
  document.getElementById(
    "posts"
  );


  try{

    const queryURL =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents:runQuery" +
    "?key=" +
    API_KEY;


    const queryBody={

      structuredQuery:{

        from:[
          {
            collectionId:"posts"
          }
        ],

        where:{

          fieldFilter:{

            field:{
              fieldPath:"uid"
            },

            op:"EQUAL",

            value:{
              stringValue:uid
            }

          }

        },

        limit:50

      }

    };


    const response =
    await fetch(
      queryURL,
      {

        method:"POST",

        headers:{
          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"
        },

        body:
        JSON.stringify(
          queryBody
        )

      }
    );


    if(!response.ok){

      postsBox.innerHTML =
      `<div class="empty">
        No posts yet
      </div>`;

      return;

    }


    const rows =
    await response.json();


    const posts =
    rows.filter(
      row=>row.document
    );


    document.getElementById(
      "postCount"
    ).textContent =
    posts.length;


    postsBox.innerHTML="";


    if(!posts.length){

      postsBox.innerHTML =
      `<div class="empty">
        No posts yet
      </div>`;

      return;

    }


    posts.forEach(row=>{

      const f =
      row.document.fields || {};


      const imageURL =
      f.imageURL?.stringValue ||
      f.image?.stringValue ||
      "";


      if(!imageURL)return;


      const post =
      document.createElement(
        "div"
      );

      post.className="post";


      const img =
      document.createElement(
        "img"
      );

      img.src=imageURL;

      img.loading="lazy";


      post.appendChild(img);

      postsBox.appendChild(post);

    });


  }catch(error){

    console.error(
      "Posts error:",
      error
    );

    postsBox.innerHTML =
    `<div class="empty">
      No posts yet
    </div>`;

  }

}


/* =========================
   PLACEHOLDER
========================= */

function placeholderPhoto(){

  return "data:image/svg+xml," +

  "<svg xmlns='http://www.w3.org/2000/svg' " +

  "width='100' height='100'>" +

  "<rect width='100' height='100' " +

  "fill='%23333333'/>" +

  "</svg>";

}


/* =========================
   START
========================= */

loadProfile();

</script>

</body>
</html>
