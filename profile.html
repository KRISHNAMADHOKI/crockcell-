<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile - CROCKCELL</title><link rel="stylesheet" href="style.css">
</head><body><main class="app">
<header class="topbar"><div class="brand">Profile</div><a class="iconbtn" href="settings.html">⚙</a></header>
<section class="card">
<div class="row"><img id="avatar" class="avatar lg" src="https://via.placeholder.com/160"><div><h2 id="username" style="margin:0">Loading...</h2><div id="bio" class="muted">Loading...</div></div></div>
<div class="row" style="justify-content:space-around;margin:22px 0"><div style="text-align:center"><b id="posts">0</b><div class="muted">Posts</div></div><div style="text-align:center"><b id="followers">0</b><div class="muted">Followers</div></div><div style="text-align:center"><b id="following">0</b><div class="muted">Following</div></div></div>
<button id="edit" class="btn primary" style="width:100%">Edit Profile</button>
</section>
<h3>Posts</h3><section id="grid" class="grid"></section>
</main>
<nav class="nav"><div class="navinner"><a href="home.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>✉</span>Messages</a><a class="active" href="profile.html"><span>●</span>Profile</a></div></nav>
<script src="core.js"></script><script>
const $=id=>document.getElementById(id), uid=CrockCell.uid();
const sv=x=>x?.stringValue||"";
async function load(){if(!uid)return location.href="index.html";const u=await CrockCell.request("users/"+uid);const ud=await u.json().catch(()=>({}));const f=ud.fields||{};$("username").textContent=sv(f.username)||sv(f.name)||"User";$("bio").textContent=sv(f.bio)||"No bio yet";$("avatar").src=sv(f.profilePhoto)||sv(f.photoURL)||"https://via.placeholder.com/160";
const q={structuredQuery:{from:[{collectionId:"posts"}],where:{fieldFilter:{field:{fieldPath:"userId"},op:"EQUAL",value:{stringValue:uid}}}}};const r=await fetch(`${CrockCell.BASE}:runQuery?key=${CrockCell.API_KEY}`,{method:"POST",headers:{"Content-Type":"application/json",...(CrockCell.token()?{Authorization:"Bearer "+CrockCell.token()}: {})},body:JSON.stringify(q)});const rows=await r.json().catch(()=>[]);const docs=rows.filter(x=>x.document).map(x=>x.document);$("posts").textContent=docs.length;$("grid").innerHTML=docs.length?"":"<div class='empty' style='grid-column:1/-1'>Abhi koi post nahi hai.</div>";docs.sort((a,b)=>(b.fields?.createdAt?.stringValue||"").localeCompare(a.fields?.createdAt?.stringValue||"")).forEach(d=>{const img=sv(d.fields?.image)||sv(d.fields?.photoURL);if(img)$("grid").insertAdjacentHTML("beforeend",`<img src="${img}" alt="Post">`)});}
$("edit").onclick=()=>location.href="edit-profile.html";load();
</script></body></html>
