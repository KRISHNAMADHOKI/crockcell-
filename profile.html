<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CROCKCELL Profile</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

.header{
  padding:22px 18px 15px;
  border-bottom:1px solid #222;
}

.title{
  font-size:28px;
  font-weight:bold;
}

.profile{
  padding:25px 18px 110px;
}

.top{
  display:flex;
  align-items:center;
  gap:18px;
}

.photo{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}

.info{
  flex:1;
}

.name{
  font-size:22px;
  font-weight:bold;
}

.username{
  color:#888;
  margin-top:5px;
}

.bio{
  margin-top:20px;
  color:#ccc;
  line-height:1.5;
}

.message-btn{
  width:100%;
  height:48px;
  margin-top:22px;
  border:0;
  border-radius:17px;
  background:#fff;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.message-btn:active{
  transform:scale(.98);
}

.status{
  text-align:center;
  color:#777;
  padding:45px 20px;
}

.bottom-nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:20;
  display:flex;
  padding:8px;
  border-radius:24px;
  background:rgba(25,25,25,.92);
  backdrop-filter:blur(18px);
  border:1px solid #333;
}

.nav-item{
  flex:1;
  text-align:center;
  padding:8px 4px;
  border-radius:17px;
  color:#999;
  text-decoration:none;
  font-size:11px;
}

.nav-item.active{
  background:#fff;
  color:#000;
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

</style>

</head>

<body>

<div class="header">
  <div class="title">Profile</div>
</div>

<div id="profileArea" class="profile">

  <div class="status">
    Loading profile...
  </div>

</div>


<div class="bottom-nav">

  <a class="nav-item" href="home.html">
    <span class="nav-icon">⌂</span>
    Home
  </a>

  <a class="nav-item" href="search.html">
    <span class="nav-icon">⌕</span>
    Search
  </a>

  <a class="nav-item" href="reels.html">
    <span class="nav-icon">▶</span>
    Reels
  </a>

  <a class="nav-item" href="messages.html">
    <span class="nav-icon">♡</span>
    Messages
  </a>

  <a class="nav-item active" href="profile.html">
    <span class="nav-icon">◯</span>
    Profile
  </a>

</div>


<script>

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================
   SESSION
========================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let currentUID =
localStorage.getItem(
  "crockcell_uid"
);


if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}

if(!currentUID){

  currentUID =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}


if(!token || !currentUID){

  window.location.replace(
    "index.html"
  );

}


/* =========================
   URL
========================= */

const params =
new URLSearchParams(
  window.location.search
);

const requestedUID =
params.get("uid");

const requestedUsername =
params.get("username");


/*
  Agar UID diya gaya hai to
  wahi profile open hogi.

  Warna current user.
*/

const profileUID =
requestedUID ||
currentUID;


/* =========================
   ELEMENT
========================= */

const profileArea =
document.getElementById(
  "profileArea"
);


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  try{

    const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/users/" +
    encodeURIComponent(profileUID) +
    "?key=" +
    API_KEY;


    const response =
    await fetch(
      url,
      {
        headers:{
          Authorization:
          "Bearer " + token
        }
      }
    );


    if(!response.ok){

      throw new Error(
        "PROFILE_NOT_FOUND"
      );

    }


    const data =
    await response.json();


    const f =
    data.fields || {};


    const profile = {

      uid:
      profileUID,

      name:
      f.name?.stringValue ||
      requestedUsername ||
      "User",

      username:
      f.username?.stringValue ||
      requestedUsername ||
      "",

      photoURL:
      f.photoURL?.stringValue ||
      "",

      bio:
      f.bio?.stringValue ||
      ""

    };


    renderProfile(
      profile
    );


  }
  catch(error){

    console.error(
      error
    );


    profileArea.innerHTML = `

      <div class="status">
        Profile load nahi ho paayi.
      </div>

    `;

  }

}


/* =========================
   RENDER
========================= */

function renderProfile(profile){

  const isOwn =
  profile.uid === currentUID;


  profileArea.innerHTML = `

    <div class="top">

      <img
        id="profilePhoto"
        class="photo"
        src="${
          escapeAttribute(
            profile.photoURL ||
            placeholderPhoto()
          )
        }"
        alt=""
      >

      <div class="info">

        <div class="name">
          ${escapeHTML(
            profile.name
          )}
        </div>

        <div class="username">
          @${escapeHTML(
            profile.username
          )}
        </div>

      </div>

    </div>


    <div class="bio">
      ${escapeHTML(
        profile.bio ||
        "No bio yet."
      )}
    </div>

    ${
      isOwn

      ?

      `<button
        class="message-btn"
        type="button"
        onclick="editOwnProfile()"
      >
        Edit Profile
      </button>`

      :

      `<button
        id="messageButton"
        class="message-btn"
        type="button"
      >
        Message
      </button>`

    }

  `;


  if(!isOwn){

    const messageButton =
    document.getElementById(
      "messageButton"
    );


    messageButton.onclick =
    function(){

      openMessage(
        profile
      );

    };

  }

}


/* =========================
   OPEN MESSAGE
========================= */

function openMessage(profile){

  /*
    SABSE IMPORTANT PART

    Target user ko sessionStorage
    me save kar rahe hain.
  */

  const target = {

    uid:
    profile.uid,

    username:
    profile.username,

    name:
    profile.name,

    photoURL:
    profile.photoURL || ""

  };


  try{

    sessionStorage.setItem(
      "crockcell_chat_target",
      JSON.stringify(
        target
      )
    );

  }
  catch(error){

    console.error(
      error
    );

  }


  /*
    URL me bhi target UID bhej rahe hain.
    Dono methods rakhe gaye hain.
  */

  const url =
    "messages.html" +
    "?uid=" +
    encodeURIComponent(
      target.uid
    ) +
    "&username=" +
    encodeURIComponent(
      target.username
    ) +
    "&name=" +
    encodeURIComponent(
      target.name
    );


  window.location.assign(
    url
  );

}


/* =========================
   OWN PROFILE
========================= */

function editOwnProfile(){

  window.location.assign(
    "edit-profile.html"
  );

}


/* =========================
   HELPERS
========================= */

function escapeHTML(text){

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttribute(text){

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    );

}


function placeholderPhoto(){

  return "data:image/svg+xml," +

  "<svg xmlns='http://www.w3.org/2000/svg' " +

  "width='100' height='100'>" +

  "<rect width='100' height='100' " +

  "fill='%23333333'/>" +

  "</svg>";

}


loadProfile();

</script>

</body>
</html>
