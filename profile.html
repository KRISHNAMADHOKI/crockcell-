<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROCKCELL Profile</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
padding-bottom:65px
}
header{
height:58px;
border-bottom:1px solid #222;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
position:sticky;
top:0;
background:#000;
z-index:5
}
.logo{
font-size:22px;
font-weight:bold;
letter-spacing:1px
}
header a{
color:#fff;
text-decoration:none
}
.profile{
padding:22px 16px;
border-bottom:1px solid #222;
max-width:650px;
margin:auto
}
.row{
display:flex;
align-items:center;
gap:18px
}
.avatar{
width:85px;
height:85px;
border-radius:50%;
object-fit:cover;
background:#222
}
.name{
font-size:21px;
font-weight:bold
}
.username{
color:#999;
margin-top:4px
}
.bio{
margin-top:15px;
color:#ddd;
line-height:1.4
}
.edit{
display:inline-block;
margin-top:15px;
padding:9px 18px;
border:1px solid #444;
border-radius:8px;
color:#fff;
text-decoration:none
}
.stats{
display:flex;
gap:35px;
margin-top:20px
}
.stat{
text-align:center
}
.stat b{
display:block;
font-size:18px
}
.stat span{
color:#999;
font-size:13px
}
.grid{
max-width:650px;
margin:auto;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:2px
}
.grid img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
background:#111
}
.empty,.loading{
text-align:center;
padding:40px;
color:#888;
grid-column:1/-1
}
nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:58px;
background:#000;
border-top:1px solid #222;
display:flex;
justify-content:space-around;
align-items:center;
z-index:9
}
nav a{
color:#fff;
text-decoration:none;
font-size:22px
}
.error{
text-align:center;
padding:30px;
color:#f66
}
</style>
</head>

<body>

<header>
<a href="home.html">←</a>
<div class="logo">CROCKCELL</div>
<a href="edit-profile.html">⚙</a>
</header>

<section class="profile">

<div class="row">

<img id="avatar" class="avatar" src="" alt="Profile">

<div>
<div id="name" class="name">Loading...</div>
<div id="username" class="username"></div>
</div>

</div>

<div id="bio" class="bio"></div>

<a class="edit" href="edit-profile.html">
Edit profile
</a>

<div class="stats">
<div class="stat">
<b id="postCount">0</b>
<span>Posts</span>
</div>

<div class="stat">
<b>0</b>
<span>Followers</span>
</div>

<div class="stat">
<b>0</b>
<span>Following</span>
</div>
</div>

</section>

<main id="grid" class="grid">
<div class="loading">Loading posts...</div>
</main>

<nav>
<a href="home.html">⌂</a>
<a href="search.html">⌕</a>
<a href="create.html">＋</a>
<a href="activity.html">♡</a>
<a href="profile.html">◉</a>
</nav>

<script>

const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";
const PROJECT_ID="crockcell-cd2e6";

const BASE=
`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

let token=localStorage.getItem("crockcellIdToken");
let uid=localStorage.getItem("crockcellUid");
let refreshToken=localStorage.getItem("crockcellRefreshToken");

const val=f=>f?.stringValue??f?.integerValue??f?.timestampValue??"";

async function refresh(){

if(!refreshToken)return false;

try{

let r=await fetch(
`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:
`grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`
}
);

let d=await r.json();

if(!r.ok||!d.id_token)return false;

token=d.id_token;
uid=d.user_id||uid;
refreshToken=d.refresh_token||refreshToken;

localStorage.setItem(
"crockcellIdToken",token
);

localStorage.setItem(
"crockcellUid",uid
);

localStorage.setItem(
"crockcellRefreshToken",refreshToken
);

return true;

}catch(e){

return false;

}

}

async function api(path,opt={},retry=true){

opt={
...opt,
headers:{
...(opt.headers||{}),
Authorization:`Bearer ${token}`
}
};

let r=await fetch(BASE+path,opt);

if(
(r.status==401||r.status==403)
&&retry
&&await refresh()
){

return api(path,opt,false);

}

return r;

}

async function loadProfile(){

let r=await api(`/users/${uid}`);

if(!r.ok){

document.getElementById("name").textContent=
"Profile unavailable";

return;

}

let d=await r.json();
let f=d.fields||{};

let name=val(f.name)||"User";
let username=val(f.username)||"user";
let bio=val(f.bio)||"";
let photo=val(f.photoURL)||"";

document.getElementById("name").textContent=name;

document.getElementById("username").textContent=
"@"+username;

document.getElementById("bio").textContent=bio;

if(photo){

document.getElementById("avatar").src=photo;

}else{

document.getElementById("avatar").style.display="none";

}

}

async function loadPosts(){

let grid=document.getElementById("grid");

let r=await api(
"/posts?pageSize=300"
);

if(!r.ok){

grid.innerHTML=
`<div class="error">
Posts load nahi ho paayi.
</div>`;

return;

}

let d=await r.json();

let posts=(d.documents||[])
.filter(x=>String(val(x.fields?.userId))===String(uid))
.sort((a,b)=>
String(val(b.fields?.createdAt))
.localeCompare(
String(val(a.fields?.createdAt))
)
);

document.getElementById("postCount").textContent=
posts.length;

if(!posts.length){

grid.innerHTML=
`<div class="empty">
Abhi koi post nahi hai.
</div>`;

return;

}

grid.innerHTML="";

posts.forEach(doc=>{

let f=doc.fields||{};
let image=val(f.image);

if(!image)return;

let img=document.createElement("img");

img.src=image;
img.alt="Post";
img.loading="lazy";

grid.appendChild(img);

});

}

async function start(){

if(!refreshToken){

location.href="index.html";
return;

}

if(!await refresh()){

localStorage.removeItem("crockcellIdToken");
localStorage.removeItem("crockcellRefreshToken");
localStorage.removeItem("crockcellUid");

location.href="index.html";
return;

}

await loadProfile();
await loadPosts();

}

start();

</script>

</body>
</html>
