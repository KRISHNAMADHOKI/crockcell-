<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile - CROCKCELL</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
}

main{
  max-width:720px;
  margin:auto;
  padding:18px 16px 90px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:24px;
}

.icon{
  border:0;
  background:#181820;
  color:#fff;
  border-radius:12px;
  padding:10px 12px;
  font-size:18px;
}

.card{
  margin-top:18px;
  background:#15151d;
  border:1px solid #252532;
  border-radius:20px;
  padding:18px;
}

.top{
  display:flex;
  gap:16px;
  align-items:center;
}

.avatar{
  width:82px;
  height:82px;
  border-radius:50%;
  object-fit:cover;
  background:#292936;
  border:2px solid #33333f;
}

.name{
  font-size:22px;
  font-weight:700;
}

.bio{
  color:#a8a8b5;
  margin-top:6px;
  line-height:1.4;
  white-space:pre-wrap;
}

.stats{
  display:flex;
  justify-content:space-around;
  margin-top:20px;
}

.stat{
  text-align:center;
}

.stat b{
  display:block;
  font-size:18px;
}

.stat span{
  font-size:12px;
  color:#aaa;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.btn{
  flex:1;
  border:0;
  border-radius:12px;
  padding:12px;
  font-weight:700;
  background:#fff;
  color:#111;
  cursor:pointer;
}

.btn.alt{
  background:#252531;
  color:#fff;
}

.links{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.link{
  padding:14px;
  border-radius:14px;
  background:#1d1d27;
  color:#fff;
  text-decoration:none;
  text-align:center;
  font-size:14px;
}

.section-title{
  margin:25px 2px 12px;
  font-size:18px;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.post{
  aspect-ratio:1/1;
  background:#181820;
  overflow:hidden;
  cursor:pointer;
}

.post img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:35px 10px;
  color:#999;
  background:#15151d;
  border-radius:14px;
}

.loading{
  text-align:center;
  color:#999;
  padding:30px;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111118;
  border-top:1px solid #292934;
  display:flex;
  justify-content:space-around;
  padding:10px 4px;
  z-index:50;
}

nav a{
  color:#aaa;
  text-decoration:none;
  font-size:12px;
}

.active{
  color:#fff!important;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal-box{
  width:100%;
  max-width:420px;
  background:#17171f;
  border:1px solid #2a2a35;
  border-radius:18px;
  padding:20px;
}

.modal-box h2{
  margin-top:0;
}

.modal-box button{
  width:100%;
  margin-top:10px;
}

.close{
  background:#252531!important;
  color:#fff!important;
}
</style>
</head>

<body>

<main>

<header>
  <h1>CROCKCELL</h1>
  <button class="icon" id="settings">⚙️</button>
</header>

<section class="card">

  <div class="top">

    <img
      id="avatar"
      class="avatar"
      alt="Profile"
      src="https://via.placeholder.com/160"
    >

    <div>
      <div id="username" class="name">Loading...</div>
      <div id="bio" class="bio">Loading profile...</div>
    </div>

  </div>

  <div class="stats">

    <div class="stat">
      <b id="posts">0</b>
      <span>Posts</span>
    </div>

    <div class="stat">
      <b id="followers">0</b>
      <span>Followers</span>
    </div>

    <div class="stat">
      <b id="following">0</b>
      <span>Following</span>
    </div>

  </div>

  <div class="actions">

    <button id="mainAction" class="btn">
      Edit Profile
    </button>

    <button id="message" class="btn alt">
      Message
    </button>

  </div>

  <div class="links">

    <a class="link" href="story_cloud.html">
      ☁️ Cloud Stories
    </a>

    <a class="link" href="notes_cloud.html">
      📝 Cloud Notes
    </a>

  </div>

</section>

<div class="section-title">
  Posts
</div>

<section id="postGrid" class="grid">
  <div class="loading">Loading posts...</div>
</section>

</main>

<nav>
  <a href="home_cloud.html">Home</a>
  <a href="search.html">Search</a>
  <a href="reels.html">Reels</a>
  <a href="messages.html">Messages</a>
  <a class="active" href="profile.html">Profile</a>
</nav>

<div id="postModal" class="modal">

  <div class="modal-box">

    <h2>Post</h2>

    <img
      id="modalImage"
      style="width:100%;border-radius:12px;max-height:60vh;object-fit:contain;background:#000"
    >

    <p id="modalCaption" style="color:#ccc"></p>

    <button id="deletePost" class="btn" style="background:#e8e8e8">
      Delete Post
    </button>

    <button id="closeModal" class="btn close">
      Close
    </button>

  </div>

</div>

<script>

const API_KEY =
'AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk';

const PROJECT_ID =
'crockcell-cd2e6';

const BASE =
`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

const $ = id => document.getElementById(id);

function getToken(){

  if(window.CrockCell && window.CrockCell.getToken){
    return window.CrockCell.getToken();
  }

  return localStorage.getItem('crockcell_idToken') ||
         sessionStorage.getItem('crockcell_idToken') ||
         localStorage.getItem('crockcellIdToken') ||
         sessionStorage.getItem('crockcellIdToken') ||
         '';

}

function getUID(){

  if(window.CrockCell && window.CrockCell.getUID){
    return window.CrockCell.getUID();
  }

  return localStorage.getItem('crockcell_uid') ||
         sessionStorage.getItem('crockcell_uid') ||
         localStorage.getItem('crockcellUid') ||
         sessionStorage.getItem('crockcellUid') ||
         '';

}

const uid = getUID();

const params =
new URLSearchParams(location.search);

const target =
params.get('uid') ||
sessionStorage.getItem('crockcell_target_uid') ||
uid;

let selectedPost = null;


/* =========================
   FIRESTORE API
========================= */

async function api(path, options={}){

  let token = getToken();

  options.headers = {
    ...(options.headers || {}),
    ...(token ? {
      Authorization:'Bearer '+token
    } : {})
  };

  let response =
    await fetch(
      `${BASE}/${path}?key=${API_KEY}`,
      options
    );

  if(
    (response.status === 401 ||
     response.status === 403) &&
    window.CrockCell &&
    window.CrockCell.refreshToken
  ){

    try{

      const newToken =
        await window.CrockCell.refreshToken();

      if(newToken){

        options.headers.Authorization =
          'Bearer '+newToken;

        response =
          await fetch(
            `${BASE}/${path}?key=${API_KEY}`,
            options
          );

      }

    }catch(e){

      console.log('Token refresh failed');

    }

  }

  return response;

}


/* =========================
   FIELD HELPERS
========================= */

function stringValue(field){

  if(!field) return '';

  return field.stringValue || '';

}

function intValue(field){

  if(!field) return 0;

  return Number(field.integerValue || 0);

}


/* =========================
   LOAD USER
========================= */

async function loadUser(){

  if(!target){

    $('username').textContent='User';
    $('bio').textContent='Please login first.';
    return;

  }

  const response =
    await api(`users/${target}`);

  if(!response.ok){

    $('username').textContent='User not found';
    $('bio').textContent='Profile could not be loaded.';
    return;

  }

  const data =
    await response.json();

  const fields =
    data.fields || {};

  $('username').textContent =
    stringValue(fields.username) ||
    stringValue(fields.name) ||
    'User';

  $('bio').textContent =
    stringValue(fields.bio) ||
    'No bio yet';

  const photo =
    stringValue(fields.profilePhoto) ||
    stringValue(fields.photoURL);

  if(photo){

    $('avatar').src = photo;

  }

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  $('postGrid').innerHTML =
    '<div class="loading">Loading posts...</div>';

  const response =
    await api('posts?pageSize=100');

  if(!response.ok){

    $('postGrid').innerHTML =
      '<div class="empty">Posts load nahi ho paaye.</div>';

    return;

  }

  const data =
    await response.json();

  const documents =
    data.documents || [];

  const userPosts =
    documents
      .filter(doc => {

        const fields =
          doc.fields || {};

        return stringValue(fields.userId) === target;

      })
      .sort((a,b)=>{

        const aTime =
          stringValue(a.fields?.createdAt);

        const bTime =
          stringValue(b.fields?.createdAt);

        return bTime.localeCompare(aTime);

      });

  $('posts').textContent =
    userPosts.length;

  $('postGrid').innerHTML='';

  if(userPosts.length===0){

    $('postGrid').innerHTML =
      '<div class="empty">Abhi koi post nahi hai.</div>';

    return;

  }

  userPosts.forEach(doc => {

    const fields =
      doc.fields || {};

    const image =
      stringValue(fields.image) ||
      stringValue(fields.photoURL);

    if(!image) return;

    const postId =
      stringValue(fields.postId) ||
      doc.name.split('/').pop();

    const box =
      document.createElement('div');

    box.className='post';

    const img =
      document.createElement('img');

    img.src=image;
    img.alt='Post';

    box.appendChild(img);

    box.onclick =
      ()=>openPost(
        postId,
        image,
        stringValue(fields.caption)
      );

    $('postGrid').appendChild(box);

  });

}


/* =========================
   FOLLOW COUNTS
========================= */

async function loadFollowCounts(){

  try{

    const followerQuery = {

      structuredQuery:{

        from:[
          {collectionId:'follows'}
        ],

        where:{
          fieldFilter:{
            field:{
              fieldPath:'followingId'
            },
            op:'EQUAL',
            value:{
              stringValue:target
            }
          }
        }

      }

    };

    const followingQuery = {

      structuredQuery:{

        from:[
          {collectionId:'follows'}
        ],

        where:{
          fieldFilter:{
            field:{
              fieldPath:'followerId'
            },
            op:'EQUAL',
            value:{
              stringValue:target
            }
          }
        }

      }

    };

    const [followersRes,followingRes] =
      await Promise.all([

        fetch(
          `${BASE}:runQuery?key=${API_KEY}`,
          {
            method:'POST',
            headers:{
              'Content-Type':'application/json',
              ...(getToken() ? {
                Authorization:'Bearer '+getToken()
              } : {})
            },
            body:JSON.stringify(followerQuery)
          }
        ),

        fetch(
          `${BASE}:runQuery?key=${API_KEY}`,
          {
            method:'POST',
            headers:{
              'Content-Type':'application/json',
              ...(getToken() ? {
                Authorization:'Bearer '+getToken()
              } : {})
            },
            body:JSON.stringify(followingQuery)
          }
        )

      ]);

    const followers =
      followersRes.ok
      ? await followersRes.json()
      : [];

    const following =
      followingRes.ok
      ? await followingRes.json()
      : [];

    $('followers').textContent =
      followers.filter(x=>x.document).length;

    $('following').textContent =
      following.filter(x=>x.document).length;

  }catch(error){

    console.log('Follow count error:',error);

  }

}


/* =========================
   PROFILE BUTTONS
========================= */

function setupButtons(){

  if(uid === target){

    $('mainAction').textContent =
      'Edit Profile';

    $('mainAction').onclick =
      ()=>location.href='edit-profile.html';

    $('message').style.display='none';

  }else{

    $('mainAction').textContent =
      'Follow';

    $('mainAction').onclick =
      ()=>alert(
        'Follow system next update me connect karenge.'
      );

    $('message').style.display='block';

    $('message').onclick =
      ()=>location.href=
        `messages.html?uid=${encodeURIComponent(target)}`;

  }

}


/* =========================
   POST MODAL
========================= */

function openPost(id,image,caption){

  selectedPost=id;

  $('modalImage').src=image;

  $('modalCaption').textContent =
    caption || '';

  $('postModal').style.display='flex';

  $('deletePost').style.display =
    uid===target
    ? 'block'
    : 'none';

}


$('closeModal').onclick =
  ()=>{
    $('postModal').style.display='none';
  };


$('postModal').onclick =
  e=>{

    if(e.target === $('postModal')){

      $('postModal').style.display='none';

    }

  };


/* =========================
   DELETE POST
========================= */

$('deletePost').onclick =
async ()=>{

  if(!selectedPost) return;

  if(uid !== target){

    alert('Aap sirf apni post delete kar sakte ho.');

    return;

  }

  const ok =
    confirm('Kya aap ye post delete karna chahte ho?');

  if(!ok) return;

  try{

    const response =
      await api(
        `posts/${selectedPost}`,
        {
          method:'DELETE'
        }
      );

    if(!response.ok){

      alert('Post delete nahi hui.');

      return;

    }

    $('postModal').style.display='none';

    await loadPosts();

  }catch(error){

    console.log(error);

    alert('Post delete karte waqt error aaya.');

  }

};


/* =========================
   SETTINGS
========================= */

$('settings').onclick =
  ()=>{
    location.href='settings.html';
  };


/* =========================
   START
========================= */

async function startProfile(){

  await loadUser();

  await Promise.all([
    loadPosts(),
    loadFollowCounts()
  ]);

  setupButtons();

}

startProfile();

</script>

</body>
    </html>
