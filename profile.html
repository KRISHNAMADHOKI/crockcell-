<script>


/* =========================
   FIREBASE REST CONFIG
========================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================
   SESSION
========================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let currentUID =
localStorage.getItem(
  "crockcell_uid"
);


if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}


if(!currentUID){

  currentUID =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}


if(!token || !currentUID){

  window.location.replace(
    "index.html"
  );

}


/* =========================
   URL
========================= */

const params =
new URLSearchParams(
  window.location.search
);


const requestedUID =
params.get("uid");


const requestedUsername =
params.get("username");


const profileUID =
requestedUID ||
currentUID;


/* =========================
   ELEMENTS
========================= */

const profileArea =
document.getElementById(
  "profileArea"
);

const listModal =
document.getElementById(
  "listModal"
);

const listTitle =
document.getElementById(
  "listTitle"
);

const listContent =
document.getElementById(
  "listContent"
);

const closeList =
document.getElementById(
  "closeList"
);


/* =========================
   PROFILE DATA
========================= */

let currentProfile = null;

let followersUsers = [];

let followingUsers = [];


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  try{

    const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/users/" +
    encodeURIComponent(
      profileUID
    ) +
    "?key=" +
    API_KEY;


    const response =
    await fetch(
      url,
      {

        headers:{

          Authorization:
          "Bearer " + token

        }

      }
    );


    if(!response.ok){

      throw new Error(
        "PROFILE_NOT_FOUND"
      );

    }


    const data =
    await response.json();


    const f =
    data.fields || {};


    currentProfile = {

      uid:
      profileUID,

      name:
      f.name?.stringValue ||
      requestedUsername ||
      "User",

      username:
      f.username?.stringValue ||
      requestedUsername ||
      "",

      photoURL:
      f.photoURL?.stringValue ||
      "",

      bio:
      f.bio?.stringValue ||
      ""

    };


    await renderProfile();


  }
  catch(error){

    console.error(
      error
    );


    profileArea.innerHTML = `

      <div class="status">
        Profile load nahi ho paayi.
      </div>

    `;

  }

}


/* =========================
   RENDER PROFILE
========================= */

async function renderProfile(){

  if(!currentProfile){

    return;

  }


  const isOwn =
  currentProfile.uid === currentUID;


  /*
    Followers / following count
  */

  const counts =
  await getFollowCounts(
    currentProfile.uid
  );


  /*
    Follow status
  */

  let isFollowing = false;


  if(!isOwn){

    isFollowing =
    await checkFollowing(
      currentUID,
      currentProfile.uid
    );

  }


  profileArea.innerHTML = `

    <div class="top">

      <img
        id="profilePhoto"
        class="photo"
        src="${
          escapeAttribute(
            currentProfile.photoURL ||
            placeholderPhoto()
          )
        }"
        alt=""
      >


      <div class="info">

        <div class="name">
          ${escapeHTML(
            currentProfile.name
          )}
        </div>

        <div class="username">
          @${escapeHTML(
            currentProfile.username
          )}
        </div>

      </div>

    </div>


    <!-- STATS -->

    <div class="stats">

      <div
        class="stat"
        id="followersStat"
      >

        <div
          id="followersCount"
          class="stat-number"
        >
          ${counts.followers}
        </div>

        <div class="stat-label">
          Followers
        </div>

      </div>


      <div
        class="stat"
        id="followingStat"
      >

        <div
          id="followingCount"
          class="stat-number"
        >
          ${counts.following}
        </div>

        <div class="stat-label">
          Following
        </div>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="postsCount"
        >
          0
        </div>

        <div class="stat-label">
          Posts
        </div>

      </div>

    </div>


    <!-- BIO -->

    <div class="bio">

      ${escapeHTML(
        currentProfile.bio ||
        "No bio yet."
      )}

    </div>


    <!-- ACTIONS -->

    ${
      isOwn

      ?

      `
        <div class="actions">

          <button
            class="action-btn"
            type="button"
            id="editProfileButton"
          >
            Edit Profile
          </button>

        </div>
      `

      :

      `
        <div class="actions">

          <button
            id="followButton"
            class="
              action-btn
              ${
                isFollowing
                ?
                "following-btn"
                :
                ""
              }
            "
            type="button"
          >
            ${
              isFollowing
              ?
              "Following"
              :
              "Follow"
            }
          </button>


          <button
            id="messageButton"
            class="action-btn"
            type="button"
          >
            Message
          </button>

        </div>
      `

    }

  `;


  /* =========================
     FOLLOWERS CLICK
  ========================= */

  document
    .getElementById(
      "followersStat"
    )
    .addEventListener(
      "click",
      function(){

        openUserList(
          "Followers"
        );

      }
    );


  /* =========================
     FOLLOWING CLICK
  ========================= */

  document
    .getElementById(
      "followingStat"
    )
    .addEventListener(
      "click",
      function(){

        openUserList(
          "Following"
        );

      }
    );


  /* =========================
     OWN PROFILE
  ========================= */

  if(isOwn){

    document
      .getElementById(
        "editProfileButton"
      )
      .addEventListener(
        "click",
        function(){

          window.location.assign(
            "edit-profile.html"
          );

        }
      );

  }


  /* =========================
     OTHER USER
  ========================= */

  if(!isOwn){

    const followButton =
    document.getElementById(
      "followButton"
    );


    followButton.addEventListener(
      "click",
      function(){

        toggleFollow();

      }
    );


    const messageButton =
    document.getElementById(
      "messageButton"
    );


    messageButton.addEventListener(
      "click",
      function(){

        openMessage(
          currentProfile
        );

      }
    );

  }

}


/* =========================
   FOLLOW DOCUMENT ID
========================= */

function followDocumentID(
  followerID,
  followingID
){

  return (
    followerID +
    "_" +
    followingID
  );

}


/* =========================
   CHECK FOLLOWING
========================= */

async function checkFollowing(
  followerID,
  followingID
){

  try{

    const documentID =
    followDocumentID(
      followerID,
      followingID
    );


    const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/follows/" +
    encodeURIComponent(
      documentID
    ) +
    "?key=" +
    API_KEY;


    const response =
    await fetch(
      url,
      {

        headers:{

          Authorization:
          "Bearer " + token

        }

      }
    );


    return response.ok;

  }
  catch(error){

    return false;

  }

}


/* =========================
   TOGGLE FOLLOW
========================= */

async function toggleFollow(){

  if(!currentProfile){

    return;

  }


  if(
    currentProfile.uid ===
    currentUID
  ){

    return;

  }


  const button =
  document.getElementById(
    "followButton"
  );


  button.disabled = true;


  const currentlyFollowing =
  await checkFollowing(
    currentUID,
    currentProfile.uid
  );


  try{

    const documentID =
    followDocumentID(
      currentUID,
      currentProfile.uid
    );


    const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/follows/" +
    encodeURIComponent(
      documentID
    ) +
    "?key=" +
    API_KEY;


    if(currentlyFollowing){

      /*
        UNFOLLOW
      */

      const response =
      await fetch(
        url,
        {

          method:"DELETE",

          headers:{

            Authorization:
            "Bearer " + token

          }

        }
      );


      if(!response.ok){

        throw new Error(
          "UNFOLLOW_FAILED"
        );

      }

    }
    else{

      /*
        FOLLOW
      */

      const body = {

        fields:{

          followerId:{

            stringValue:
            currentUID

          },

          followingId:{

            stringValue:
            currentProfile.uid

          },

          createdAt:{

            timestampValue:
            new Date().toISOString()

          }

        }

      };


      const response =
      await fetch(
        url,
        {

          method:"PATCH",

          headers:{

            Authorization:
            "Bearer " + token,

            "Content-Type":
            "application/json"

          },

          body:
          JSON.stringify(body)

        }
      );


      if(!response.ok){

        throw new Error(
          "FOLLOW_FAILED"
        );

      }

    }


    /*
      Profile refresh
    */

    await renderProfile();


  }
  catch(error){

    console.error(
      error
    );


    alert(
      "Follow update nahi ho paaya."
    );

  }


  button.disabled = false;

}


/* =========================
   FOLLOW COUNTS
========================= */

async function getFollowCounts(
  targetUID
){

  try{

    const followers =
    await getFollowDocuments(
      "followingId",
      targetUID
    );


    const following =
    await getFollowDocuments(
      "followerId",
      targetUID
    );


    return {

      followers:
      followers.length,

      following:
      following.length

    };

  }
  catch(error){

    console.error(
      error
    );


    return {

      followers:0,

      following:0

    };

  }

}


/* =========================
   GET FOLLOW DOCUMENTS
========================= */

async function getFollowDocuments(
  fieldName,
  targetUID
){

  const url =
  "https://firestore.googleapis.com/v1/projects/" +
  PROJECT_ID +
  "/databases/(default)/documents:runQuery" +
  "?key=" +
  API_KEY;


  const body = {

    structuredQuery:{

      from:[

        {
          collectionId:
          "follows"
        }

      ],

      where:{

        fieldFilter:{

          field:{

            fieldPath:
            fieldName

          },

          op:
          "EQUAL",

          value:{

            stringValue:
            targetUID

          }

        }

      },

      limit:1000

    }

  };


  const response =
  await fetch(
    url,
    {

      method:"POST",

      headers:{

        Authorization:
        "Bearer " + token,

        "Content-Type":
        "application/json"

      },

      body:
      JSON.stringify(body)

    }
  );


  if(!response.ok){

    throw new Error(
      "FOLLOW_QUERY_FAILED"
    );

  }


  const rows =
  await response.json();


  const result=[];


  rows.forEach(row=>{

    if(!row.document){

      return;

    }


    const f =
    row.document.fields || {};


    result.push({

      followerId:
      f.followerId?.stringValue ||
      "",

      followingId:
      f.followingId?.stringValue ||
      ""

    });

  });


  return result;

}


/* =========================
   OPEN USER LIST
========================= */

async function openUserList(
  type
){

  listModal.style.display =
  "flex";


  listTitle.textContent =
  type;


  listContent.innerHTML = `

    <div class="list-empty">
      Loading ${type.toLowerCase()}...
    </div>

  `;


  try{

    let followDocuments;


    if(type === "Followers"){

      followDocuments =
      await getFollowDocuments(
        "followingId",
        currentProfile.uid
      );

    }
    else{

      followDocuments =
      await getFollowDocuments(
        "followerId",
        currentProfile.uid
      );

    }


    const userIDs =
    followDocuments.map(
      item => {

        if(type === "Followers"){

          return item.followerId;

        }

        return item.followingId;

      }
    );


    if(!userIDs.length){

      listContent.innerHTML = `

        <div class="list-empty">
          ${type === "Followers"
            ? "Abhi koi followers nahi hain."
            : "Abhi kisi ko follow nahi kiya."
          }
        </div>

      `;

      return;

    }


    const users=[];


    /*
      Har UID ka profile load
    */

    for(
      const id of userIDs
    ){

      if(!id){

        continue;

      }


      const user =
      await getUserByUID(
        id
      );


      if(user){

        users.push(
          user
        );

      }

    }


    renderUserList(
      users
    );

  }
  catch(error){

    console.error(
      error
    );


    listContent.innerHTML = `

      <div class="list-empty">
        List load nahi ho paayi.
      </div>

    `;

  }

}


/* =========================
   GET USER
========================= */

async function getUserByUID(
  targetUID
){

  const url =
  "https://firestore.googleapis.com/v1/projects/" +
  PROJECT_ID +
  "/database
