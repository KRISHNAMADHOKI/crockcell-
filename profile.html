<script>

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================
   SESSION
========================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let currentUID =
localStorage.getItem(
  "crockcell_uid"
);

if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}

if(!currentUID){

  currentUID =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}

if(!token || !currentUID){

  window.location.replace(
    "index.html"
  );

}


/* =========================
   URL
========================= */

const params =
new URLSearchParams(
  window.location.search
);

const requestedUID =
params.get("uid");

const requestedUsername =
params.get("username");

const profileUID =
requestedUID ||
currentUID;


/* =========================
   ELEMENTS
========================= */

const profileArea =
document.getElementById(
  "profileArea"
);

const listModal =
document.getElementById(
  "listModal"
);

const listTitle =
document.getElementById(
  "listTitle"
);

const listContent =
document.getElementById(
  "listContent"
);

const closeList =
document.getElementById(
  "closeList"
);


let currentProfile = null;

let followersUsers = [];

let followingUsers = [];


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  try{

    const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/users/" +
    encodeURIComponent(
      profileUID
    ) +
    "?key=" +
    API_KEY;


    const response =
    await fetch(
      url,
      {
        headers:{
          Authorization:
          "Bearer " + token
        }
      }
    );


    if(!response.ok){

      throw new Error(
        "PROFILE_NOT_FOUND"
      );

    }


    const data =
    await response.json();


    const f =
    data.fields || {};


    currentProfile = {

      uid:
      profileUID,

      name:
      f.name?.stringValue ||
      requestedUsername ||
      "User",

      username:
      f.username?.stringValue ||
      requestedUsername ||
      "",

      photoURL:
      f.photoURL?.stringValue ||
      "",

      bio:
      f.bio?.stringValue ||
      ""

    };


    /*
      PROFILE KO TURANT SHOW KARO
    */

    await renderProfile();


    /*
      FOLLOW DATA BAAD ME LOAD HOGA
    */

    loadFollowData();


  }
  catch(error){

    console.error(
      "Profile error:",
      error
    );


    profileArea.innerHTML = `

      <div class="status">
        Profile load nahi ho paayi.
      </div>

    `;

  }

}


/* =========================
   RENDER PROFILE
========================= */

async function renderProfile(){

  if(!currentProfile){

    return;

  }


  const isOwn =
  currentProfile.uid === currentUID;


  /*
    Default counts.
    Profile in numbers ke saath
    immediately show hogi.
  */

  let followersCount = 0;

  let followingCount = 0;

  let isFollowing = false;


  /*
    Follow status ko profile block
    hone se bachane ke liye
    safe timeout ke saath load karenge.
  */

  if(!isOwn){

    try{

      isFollowing =
      await Promise.race([

        checkFollowing(
          currentUID,
          currentProfile.uid
        ),

        timeoutPromise(
          3000,
          false
        )

      ]);

    }
    catch(error){

      isFollowing = false;

    }

  }


  profileArea.innerHTML = `

    <div class="top">

      <img
        id="profilePhoto"
        class="photo"
        src="${
          escapeAttribute(
            currentProfile.photoURL ||
            placeholderPhoto()
          )
        }"
        alt=""
      >

      <div class="info">

        <div class="name">
          ${escapeHTML(
            currentProfile.name
          )}
        </div>

        <div class="username">
          @${escapeHTML(
            currentProfile.username
          )}
        </div>

      </div>

    </div>


    <div class="stats">

      <div
        class="stat"
        id="followersStat"
      >

        <div
          id="followersCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Followers
        </div>

      </div>


      <div
        class="stat"
        id="followingStat"
      >

        <div
          id="followingCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Following
        </div>

      </div>


      <div class="stat">

        <div
          id="postsCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Posts
        </div>

      </div>

    </div>


    <div class="bio">

      ${escapeHTML(
        currentProfile.bio ||
        "No bio yet."
      )}

    </div>


    ${
      isOwn

      ?

      `
        <div class="actions">

          <button
            id="editProfileButton"
            class="action-btn"
            type="button"
          >
            Edit Profile
          </button>

        </div>
      `

      :

      `
        <div class="actions">

          <button
            id="followButton"
            class="action-btn ${
              isFollowing
              ?
              "following-btn"
              :
              ""
            }"
            type="button"
          >
            ${
              isFollowing
              ?
              "Following"
              :
              "Follow"
            }
          </button>


          <button
            id="messageButton"
            class="action-btn"
            type="button"
          >
            Message
          </button>

        </div>
      `

    }

  `;


  document
    .getElementById(
      "followersStat"
    )
    .addEventListener(
      "click",
      function(){

        openUserList(
          "Followers"
        );

      }
    );


  document
    .getElementById(
      "followingStat"
    )
    .addEventListener(
      "click",
      function(){

        openUserList(
          "Following"
        );

      }
    );


  if(isOwn){

    document
      .getElementById(
        "editProfileButton"
      )
      .addEventListener(
        "click",
        function(){

          window.location.assign(
            "edit-profile.html"
          );

        }
      );

  }
  else{

    document
      .getElementById(
        "followButton"
      )
      .addEventListener(
        "click",
        toggleFollow
      );


    document
      .getElementById(
        "messageButton"
      )
      .addEventListener(
        "click",
        function(){

          openMessage(
            currentProfile
          );

        }
      );

  }

}


/* =========================
   LOAD FOLLOW DATA
========================= */

async function loadFollowData(){

  if(!currentProfile){

    return;

  }


  try{

    const followers =
    await Promise.race([

      getFollowDocuments(
        "followingId",
        currentProfile.uid
      ),

      timeoutPromise(
        5000,
        []
      )

    ]);


    const following =
    await Promise.race([

      getFollowDocuments(
        "followerId",
        currentProfile.uid
      ),

      timeoutPromise(
        5000,
        []
      )

    ]);


    const followersCount =
    document.getElementById(
      "followersCount"
    );

    const followingCount =
    document.getElementById(
      "followingCount"
    );


    if(followersCount){

      followersCount.textContent =
      followers.length;

    }


    if(followingCount){

      followingCount.textContent =
      following.length;

    }


  }
  catch(error){

    console.error(
      "Follow data error:",
      error
    );

  }

}


/* =========================
   FOLLOW DOCUMENT ID
========================= */

function followDocumentID(
  followerID,
  followingID
){

  return (
    followerID +
    "_" +
    followingID
  );

}


/* =========================
   CHECK FOLLOWING
========================= */

async function checkFollowing(
  followerID,
  followingID
){

  const documentID =
  followDocumentID(
    followerID,
    followingID
  );


  const url =
  "https://firestore.googleapis.com/v1/projects/" +
  PROJECT_ID +
  "/databases/(default)/documents/follows/" +
  encodeURIComponent(
    documentID
  ) +
  "?key=" +
  API_KEY;


  const response =
  await fetch(
    url,
    {
      headers:{
        Authorization:
        "Bearer " + token
      }
    }
  );


  return response.ok;

}


/* =========================
   FOLLOW / UNFOLLOW
========================= */

async function toggleFollow(){

  if(!currentProfile){

    return;

  }


  const button =
  document.getElementById(
    "followButton"
  );


  if(!button){

    return;

  }


  button.disabled = true;


  try{

    const following =
    await checkFollowing(
      currentUID,
      currentProfile.uid
    );


    const documentID =
    followDocumentID(
      currentUID,
      currentProfile.uid
    );


    const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/follows/" +
    encodeURIComponent(
      documentID
    ) +
    "?key=" +
    API_KEY;


    if(following){

      const response =
      await fetch(
        url,
        {
          method:"DELETE",

          headers:{
            Authorization:
            "Bearer " + token
          }
        }
      );


      if(!response.ok){

        throw new Error(
          "UNFOLLOW_FAILED"
        );

      }

    }
    else{

      const body = {

        fields:{

          followerId:{
            stringValue:
            currentUID
          },

          followingId:{
            stringValue:
            currentProfile.uid
          },

          createdAt:{
            timestampValue:
            new Date().toISOString()
          }

        }

      };


      const response =
      await fetch(
        url,
        {

          method:"PATCH",

          headers:{

            Authorization:
            "Bearer " + token,

            "Content-Type":
            "application/json"

          },

          body:
          JSON.stringify(body)

        }
      );


      if(!response.ok){

        throw new Error(
          "FOLLOW_FAILED"
        );

      }

    }


    /*
      Button ko directly update karo.
      Puri profile reload nahi hogi.
    */

    const nowFollowing =
    !following;


    button.textContent =
    nowFollowing
    ?
    "Following"
    :
    "Follow";


    button.classList.toggle(
      "following-btn",
      nowFollowing
    );


    /*
      Count update
    */

    const count =
    document.getElementById(
      "followersCount"
    );


    if(count){

      let number =
      parseInt(
        count.textContent
      ) || 0;


      number +=
      nowFollowing
      ?
      1
      :
      -1;


      if(number < 0){

        number = 0;

      }


      count.textContent =
      number;

    }

  }
  catch(error){

    console.error(
      "Follow error:",
      error
    );


    alert(
      "Follow update nahi ho paaya."
    );

  }


  button.disabled = false;

}


/* =========================
   GET FOLLOW DOCUMENTS
========================= */

async function getFollowDocuments(
  fieldName,
  targetUID
){

  const url =
  "https://firestore.googleapis.com/v1/projects/" +
  PROJECT_ID +
  "/databases/(default)/documents:runQuery" +
  "?key=" +
  API_KEY;


  const body = {

    structuredQuery:{

      from:[

        {
          collectionId:
          "follows"
        }

      ],

      where:{

        fieldFilter:{

          field:{
            fieldPath:
            fieldName
          },

          op:
          "EQUAL",

          value:{
            stringValue:
            targetUID
          }

        }

      },

      limit:1000

    }

  };


  const response =
  await fetch(
    url,
    {

      method:"POST",

      headers:{

        Authorization:
        "Bearer " + token,

        "Content-Type":
        "application/json"

      },

      body:
      JSON.stringify(body)

    }
  );


  if(!response.ok){

    throw new Error(
      "FOLLOW_QUERY_FAILED"
    );

  }


  const rows =
  await response.json();


  const result=[];


  rows.forEach(row=>{

    if(!row.document){

      return;

    }


    const f =
    row.document.fields || {};


    result.push({

      followerId:
      f.followerId?.stringValue ||
      "",

      followingId:
      f.followingId?.stringValue ||
      ""

    });

  });


  return result;

}


/* =========================
   USER LIST
========================= */

async function openUserList(
  type
){

  listModal.style.display =
  "flex";


  listTitle.textContent =
  type;


  listContent.innerHTML = `

    <div class="list-empty">
      Loading...
    </div>

  `;


  try{

    const documents =
    await Promise.race([

      getFollowDocuments(

        type === "Followers"
        ?
        "followingId"
        :
        "followerId",

        currentProfile.uid

      ),

      timeoutPromise(
        6000,
        []
      )

    ]);


    const ids =
    documents.map(
      item =>

      type === "Followers"
      ?
      item.followerId
      :
      item.followingId

    );


    if(!ids.length){

      listContent.innerHTML = `

        <div class="list-empty">

          ${
            type === "Followers"
            ?
            "Abhi koi followers nahi hain."
            :
            "Abhi kisi ko follow nahi kiya."

          }

        </div>

      `;

      return;

    }


    const users=[];


    for(
      const id of ids
    ){

      if(!id){

        continue;

      }


      const user =
      await getUserByUID(
        id
      );


      if(user){

        users.push(
          user
        );

      }

    }


    renderUserList(
      users
    );

  }
  catch(error){

    console.error(
      error
    );


    listContent.innerHTML = `

      <div class="list-empty">
        List load nahi ho paayi.
      </div>

    `;

  }

}


/* =========================
   GET USER
========================= */

async function getUserByUID(
  targetUID
){

  const url =
  "https://firestore.googleapis.com/v1/projects/" +
  PROJECT_ID +
  "/databases/(default)/documents/users/" +
  encodeURIComponent(
    targetUID
  ) +
  "?key=" +
  API_KEY;


  const response =
  await fetch(
    url,
    {
      headers:{
        Authorization:
        "Bearer " + token
      }
    }
  );


  if(!response.ok){

    return null;

  }


  const data =
  await response.json();


  const f =
  data.fields || {};


  return {

    uid:
    targetUID,

    name:
    f.name?.stringValue ||
    f.username?.stringValue ||
    "User",

    username:
    f.username?.stringValue ||
    "user",

    photoURL:
    f.photoURL?.stringValue ||
    "",

    bio:
    f.bio?.stringValue ||
    ""

  };

}


/* =========================
   RENDER USER LIST
=======
