<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROCKCELL - Profile</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#fafafa;
  font-family:Arial,sans-serif;
  color:#111;
  padding-bottom:70px;
}

/* TOP */
.top{
  height:60px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.top-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.top button{
  border:0;
  border-radius:9px;
  padding:9px 13px;
  font-weight:700;
  cursor:pointer;
}

.edit{
  background:#111;
  color:#fff;
}

/* PROFILE */
.profile{
  background:#fff;
  padding:20px 15px;
  border-bottom:1px solid #ddd;
}

.head{
  display:flex;
  align-items:center;
  gap:18px;
}

.avatar{
  width:88px;
  height:88px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.details{
  flex:1;
}

.name{
  font-size:20px;
  font-weight:800;
}

.username{
  color:#777;
  margin-top:4px;
}

.bio{
  margin-top:10px;
  line-height:1.4;
}

.stats{
  display:flex;
  gap:30px;
  margin-top:20px;
}

.stat{
  text-align:center;
  cursor:pointer;
}

.stat b{
  display:block;
  font-size:18px;
}

.stat span{
  font-size:13px;
  color:#777;
}

.follow{
  margin-top:15px;
  width:100%;
  background:#111;
  color:#fff;
}

/* POSTS */
.postsTitle{
  padding:15px;
  font-weight:800;
  background:#fff;
  border-bottom:1px solid #ddd;
}

.posts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
}

.post{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#ddd;
}

.empty{
  padding:40px 10px;
  text-align:center;
  color:#777;
  grid-column:1/-1;
}

/* PROFILE MENU */
.profile-menu{
  display:none;
  position:fixed;
  right:12px;
  bottom:70px;
  width:220px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:15px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);
  overflow:hidden;
  z-index:50;
}

.profile-menu.show{
  display:block;
}

.menu-title{
  padding:14px;
  font-weight:800;
  border-bottom:1px solid #eee;
}

.menu-btn{
  width:100%;
  background:#fff;
  border:0;
  border-bottom:1px solid #eee;
  padding:14px;
  text-align:left;
  font-size:15px;
  cursor:pointer;
}

.menu-btn:hover{
  background:#f5f5f5;
}

.menu-btn.logout{
  color:#d00;
  border-bottom:0;
}

/* BOTTOM NAV */
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:60px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:40;
}

.bottom button{
  background:none;
  border:0;
  font-size:13px;
  cursor:pointer;
  padding:8px 10px;
}

.bottom button.active{
  font-weight:800;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="top">

  <div class="logo">CROCKCELL</div>

  <div class="top-right">

    <button
      id="edit"
      class="edit"
      style="display:none">
      Edit
    </button>

    <button
      onclick="toggleProfileMenu()"
      aria-label="Profile menu">
      ☰
    </button>

  </div>

</div>


<!-- PROFILE -->
<div id="profile" class="profile">
  Loading profile...
</div>


<!-- POSTS -->
<div class="postsTitle">
  Posts
</div>

<div id="posts" class="posts"></div>


<!-- PROFILE MENU -->
<div id="profileMenu" class="profile-menu">

  <div class="menu-title">
    Profile Menu
  </div>

  <button
    class="menu-btn"
    onclick="goMyProfile()">
    👤 My Profile
  </button>

  <button
    class="menu-btn"
    onclick="location.href='create.html'">
    ➕ Create Post
  </button>

  <button
    class="menu-btn"
    onclick="location.href='edit-profile.html'">
    ✏️ Edit Profile
  </button>

  <button
    class="menu-btn"
    onclick="openSettings()">
    ⚙️ Settings
  </button>

  <button
    class="menu-btn logout"
    onclick="logout()">
    🚪 Logout
  </button>

</div>


<!-- BOTTOM NAV -->
<div class="bottom">

  <button onclick="location.href='home.html'">
    🏠<br>Home
  </button>

  <button onclick="location.href='search.html'">
    🔍<br>Search
  </button>

  <button onclick="location.href='reels.html'">
    🎬<br>Reels
  </button>

  <button
    class="active"
    onclick="goMyProfile()">
    👤<br>Profile
  </button>

</div>


<script>

const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID="crockcell-cd2e6";

const BASE=
"https://firestore.googleapis.com/v1/projects/"
+PROJECT_ID+
"/databases/(default)/documents";


let token=
localStorage.getItem("crockcellIdToken");

const myUid=
localStorage.getItem("crockcellUid");

const refreshToken=
localStorage.getItem("crockcellRefreshToken");


if(!token || !myUid){
  location.href="index.html";
}


const params=
new URLSearchParams(location.search);

const requestedUid=
params.get("uid")||"";

const requestedDoc=
params.get("doc")||"";


/* VALUE */
function val(x){

  if(!x)return "";

  if(x.stringValue!==undefined)
    return x.stringValue;

  if(x.integerValue!==undefined)
    return x.integerValue;

  if(x.doubleValue!==undefined)
    return x.doubleValue;

  if(x.booleanValue!==undefined)
    return x.booleanValue;

  return "";
}


/* ESCAPE */
function esc(s){

  return String(s||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* REFRESH TOKEN */
async function refreshTokenNow(){

  if(!refreshToken)
    return false;

  try{

    const r=await fetch(
      "https://securetoken.googleapis.com/v1/token?key="
      +API_KEY,
      {
        method:"POST",
        headers:{
          "Content-Type":
          "application/x-www-form-urlencoded"
        },
        body:
        "grant_type=refresh_token&refresh_token="
        +encodeURIComponent(refreshToken)
      }
    );

    const d=await r.json();

    if(!r.ok)
      return false;

    token=d.id_token;

    localStorage.setItem(
      "crockcellIdToken",
      token
    );

    if(d.refresh_token){

      localStorage.setItem(
        "crockcellRefreshToken",
        d.refresh_token
      );

    }

    return true;

  }catch(e){

    return false;

  }
}


/* API */
async function api(url,options={}){

  options.headers={
    ...(options.headers||{}),
    "Authorization":"Bearer "+token,
    "Content-Type":"application/json"
  };

  let r=await fetch(url,options);

  if(
    (r.status===401 || r.status===403)
    &&
    refreshToken
  ){

    const ok=
      await refreshTokenNow();

    if(ok){

      options.headers.Authorization=
        "Bearer "+token;

      r=await fetch(url,options);

    }

  }

  return r;
}


/* USER FROM FIRESTORE */
function userFromDoc(doc){

  const f=doc.fields||{};

  const docId=
    doc.name.split("/").pop();

  return {

    docId:docId,

    uid:val(f.uid)||"",

    name:
      val(f.name)||"User",

    username:
      val(f.username)||"",

    bio:
      val(f.bio)||"",

    photoURL:
      val(f.photoURL)||""

  };

}


/* FIND USER BY UID */
async function findUserByUid(uid){

  if(!uid)
    return null;

  const body={

    structuredQuery:{

      from:[
        {
          collectionId:"users"
        }
      ],

      where:{

        fieldFilter:{

          field:{
            fieldPath:"uid"
          },

          op:"EQUAL",

          value:{
            stringValue:uid
          }

        }

      },

      limit:1

    }

  };


  const r=await api(

    BASE+
    ":runQuery?key="+
    API_KEY,

    {

      method:"POST",

      body:
        JSON.stringify(body)

    }

  );


  if(!r.ok)
    return null;


  const data=
    await r.json();


  for(const item of data){

    if(item.document){

      const u=
        userFromDoc(item.document);

      if(u.uid)
        return u;

    }

  }


  return null;
}


/* FIND USER BY DOCUMENT ID */
async function findUserByDocId(docId){

  if(!docId)
    return null;

  const r=await api(

    BASE+
    "/users/"+
    encodeURIComponent(docId)+
    "?key="+
    API_KEY

  );


  if(!r.ok)
    return null;


  const doc=
    await r.json();


  if(!doc.fields)
    return null;


  return userFromDoc(doc);
}


/* GET USER */
async function getUser(){

  if(requestedUid){

    const u=
      await findUserByUid(requestedUid);

    if(u)
      return u;

  }


  if(requestedDoc){

    const u=
      await findUserByDocId(requestedDoc);

    if(u)
      return u;

  }


  if(requestedUid){

    const u=
      await findUserByDocId(requestedUid);

    if(u)
      return u;

  }


  return await findUserByUid(myUid);
}


/* GET POSTS */
async function getPosts(uid){

  const body={

    structuredQuery:{

      from:[
        {
          collectionId:"posts"
        }
      ],

      where:{

        fieldFilter:{

          field:{
            fieldPath:"userId"
          },

          op:"EQUAL",

          value:{
            stringValue:uid
          }

        }

      },

      limit:100

    }

  };


  const r=await api(

    BASE+
    ":runQuery?key="+
    API_KEY,

    {

      method:"POST",

      body:
        JSON.stringify(body)

    }

  );


  if(!r.ok)
    return [];


  const data=
    await r.json();


  const posts=[];


  for(const item of data){

    if(item.document){

      posts.push(
        item.document
      );

    }

  }


  posts.sort((a,b)=>{

    const da=
      val(a.fields?.createdAt);

    const db=
      val(b.fields?.createdAt);

    return String(db)
      .localeCompare(String(da));

  });


  return posts;
}


/* SHOW PROFILE */
function showProfile(user){

  const own=
    user.uid===myUid;


  document.getElementById("edit")
    .style.display=
    own ? "block" : "none";


  document.getElementById("edit")
    .onclick=()=>{

      location.href=
        "edit-profile.html";

    };


  const profile=
    document.getElementById("profile");


  profile.innerHTML=`

    <div class="head">

      <img
        class="avatar"
        src="${esc(user.photoURL)}"
        onerror="this.style.visibility='hidden'">

      <div class="details">

        <div class="name">
          ${esc(user.name)}
        </div>

        <div class="username">
          @${esc(user.username)}
        </div>

      </div>

    </div>


    <div class="bio">
      ${esc(user.bio)}
    </div>


    ${
      own
      ?
      ""
      :
      `
      <button
        id="followBtn"
        class="follow">
        Follow
      </button>
      `
    }


    <div class="stats">

      <div
        class="stat"
        onclick="showFollowers()">

        <b id="postCount">0</b>

        <span>Posts</span>

      </div>


      <div
        class="stat"
        onclick="showFollowers()">

        <b>0</b>

        <span>Followers</span>

      </div>


      <div
        class="stat"
        onclick="showFollowing()">

        <b>0</b>

        <span>Following</span>

      </div>

    </div>

  `;


  if(!own){

    const followBtn=
      document.getElementById("followBtn");


    followBtn.onclick=()=>{

      if(
        followBtn.innerText===
        "Follow"
      ){

        followBtn.innerText=
          "Following";

      }else{

        followBtn.innerText=
          "Follow";

      }

    };

  }

}


/* MY PROFILE */
function goMyProfile(){

  closeProfileMenu();

  location.href=
    "profile.html?uid="+
    encodeURIComponent(myUid);
}


/* PROFILE MENU */
function toggleProfileMenu(){

  document
    .getElementById("profileMenu")
    .classList.toggle("show");

}


function closeProfileMenu(){

  document
    .getElementById("profileMenu")
    .classList.remove("show");

}


/* SETTINGS */
function openSettings(){

  closeProfileMenu();

  alert(
    "CROCKCELL Settings\n\nSettings section next step me complete ki jayegi."
  );

}


/* FOLLOWERS */
function showFollowers(){

  alert(
    "Followers list next step me Firebase se connect ki jayegi."
  );

}


/* FOLLOWING */
function showFollowing(){

  alert(
    "Following list next step me Firebase se connect ki jayegi."
  );

}


/* LOGOUT */
function logout(){

  closeProfileMenu();

  localStorage.removeItem(
    "crockcellIdToken"
  );

  localStorage.removeItem(
    "crockcellRefreshToken"
  );

  localStorage.removeItem(
    "crockcellUid"
  );

  localStorage.removeItem(
    "crockcellProfile"
  );

  location.href="index.html";

}


/* CLOSE MENU OUTSIDE */
document.addEventListener(
  "click",
  function(e){

    const menu=
      document.getElementById(
        "profileMenu"
      );

    const buttons=
      document.querySelectorAll(
        ".top-right button"
      );


    let insideButton=false;

    buttons.forEach(btn=>{

      if(btn.contains(e.target))
        insideButton=true;

    });


    if(
      !menu.contains(e.target)
      &&
      !insideButton
    ){

      closeProfileMenu();

    }

  }
);


/* LOAD */
async function load(){

  if(refreshToken){

    await refreshTokenNow();

  }


  const user=
    await getUser();


  if(!user){

    document.getElementById(
      "profile"
    ).innerHTML=
      '<div class="empty">User profile not found.</div>';

    return;

  }


  if(user.uid){

    localStorage.setItem(
      "crockcellViewedUser",
      user.uid
    );

  }


  showProfile(user);


  const posts=
    await getPosts(user.uid);


  const box=
    document.getElementById(
      "posts"
    );


  document.getElementById(
    "postCount"
  ).innerText=
    posts.length;


  if(!posts.length){

    box.innerHTML=
      '<div class="empty">No Posts Yet</div>';

    return;

  }


  box.innerHTML="";


  posts.forEach(doc=>{

    const f=
      doc.fields||{};

    const image=
      val(f.image);


    if(!image)
      return;


    const img=
      document.createElement("img");


    img.className="post";

    img.src=image;

    img.alt="Post";


    box.appendChild(img);

  });

}


load();

</script>

</body>
</html>
