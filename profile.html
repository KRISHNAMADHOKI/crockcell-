<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CROCKCELL Profile</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

.header{
  padding:22px 18px 15px;
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(0,0,0,.95);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #222;
}

.title{
  font-size:28px;
  font-weight:bold;
}

.profile{
  padding:25px 18px 115px;
}

.top{
  display:flex;
  align-items:center;
  gap:18px;
}

.photo{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  flex-shrink:0;
}

.info{
  flex:1;
  min-width:0;
}

.name{
  font-size:22px;
  font-weight:bold;
}

.username{
  margin-top:5px;
  color:#888;
}

.bio{
  margin-top:20px;
  color:#ccc;
  line-height:1.5;
}

.stats{
  display:flex;
  margin-top:25px;
  padding:16px 0;
  border-top:1px solid #222;
  border-bottom:1px solid #222;
}

.stat{
  flex:1;
  text-align:center;
  cursor:pointer;
}

.stat-number{
  font-size:20px;
  font-weight:bold;
}

.stat-label{
  margin-top:5px;
  color:#888;
  font-size:13px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:22px;
}

.action-btn{
  flex:1;
  height:48px;
  border:0;
  border-radius:17px;
  background:#fff;
  color:#000;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.following-btn{
  background:#222;
  color:#fff;
  border:1px solid #444;
}

.action-btn:disabled{
  opacity:.6;
}

.status{
  text-align:center;
  color:#777;
  padding:45px 20px;
}

.error-box{
  text-align:center;
  color:#777;
  padding:45px 20px;
  line-height:1.7;
}

.retry-btn{
  margin-top:15px;
  border:0;
  border-radius:15px;
  padding:11px 18px;
  background:#fff;
  color:#000;
  font-weight:bold;
}

.list-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);
  z-index:100;
  display:none;
  align-items:flex-end;
}

.list-box{
  width:100%;
  max-height:78vh;
  background:#111;
  border-radius:25px 25px 0 0;
  border:1px solid #333;
  overflow:hidden;
}

.list-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
  border-bottom:1px solid #292929;
}

.list-title{
  font-size:20px;
  font-weight:bold;
}

.close-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:22px;
}

.list-content{
  max-height:65vh;
  overflow-y:auto;
  padding:8px 15px 25px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 5px;
  border-bottom:1px solid #222;
  cursor:pointer;
}

.user-row:active{
  background:#1b1b1b;
}

.user-avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}

.user-details{
  flex:1;
  min-width:0;
}

.user-name{
  font-size:16px;
  font-weight:bold;
}

.user-username{
  color:#888;
  font-size:13px;
  margin-top:4px;
}

.user-arrow{
  color:#777;
  font-size:24px;
}

.list-empty{
  text-align:center;
  color:#777;
  padding:45px 20px;
}

.bottom-nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:20;
  display:flex;
  padding:8px;
  border-radius:24px;
  background:rgba(25,25,25,.92);
  backdrop-filter:blur(18px);
  border:1px solid #333;
}

.nav-item{
  flex:1;
  text-align:center;
  padding:8px 4px;
  border-radius:17px;
  color:#999;
  text-decoration:none;
  font-size:11px;
}

.nav-item.active{
  background:#fff;
  color:#000;
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}


.profile-topbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.profile-settings{width:40px;height:40px;border-radius:50%;border:1px solid #333;background:#111;color:#fff;font-size:20px;cursor:pointer}
.cloud-section{margin-top:24px;padding-top:20px;border-top:1px solid #222}
.cloud-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cloud-head b{font-size:18px}.cloud-head a{color:#888;text-decoration:none;font-size:12px}
.cloud-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:5px}.cloud-row::-webkit-scrollbar{display:none}
.cloud-card{flex:0 0 112px;background:#111;border:1px solid #292929;border-radius:16px;padding:8px;color:#fff;text-decoration:none}
.cloud-thumb{width:94px;height:94px;border-radius:13px;object-fit:cover;display:block;background:#222}.cloud-note{width:94px;height:94px;border-radius:13px;background:#181818;border:1px solid #303030;padding:9px;color:#ddd;font-size:12px;line-height:1.35;overflow:hidden;box-sizing:border-box}.cloud-label{margin-top:7px;color:#aaa;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cloud-empty{color:#666;font-size:12px;padding:10px 0}

</style>

</head>

<body>


<div class="header">

  <div class="title">
    Profile
  </div>

</div>


<div id="profileArea" class="profile">

  <div class="status">
    Loading profile...
  </div>

</div>


<!-- FOLLOWERS / FOLLOWING MODAL -->

<div
  id="listModal"
  class="list-modal"
>

  <div class="list-box">

    <div class="list-header">

      <div
        id="listTitle"
        class="list-title"
      >
        Followers
      </div>

      <button
        id="closeList"
        class="close-btn"
        type="button"
      >
        ×
      </button>

    </div>

    <div
      id="listContent"
      class="list-content"
    >

      <div class="list-empty">
        Loading...
      </div>

    </div>

  </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <a
    class="nav-item"
    href="home.html"
  >
    <span class="nav-icon">⌂</span>
    Home
  </a>

  <a
    class="nav-item"
    href="search.html"
  >
    <span class="nav-icon">⌕</span>
    Search
  </a>

  <a
    class="nav-item"
    href="reels.html"
  >
    <span class="nav-icon">▶</span>
    Reels
  </a>

  <a
    class="nav-item"
    href="messages.html"
  >
    <span class="nav-icon">♡</span>
    Messages
  </a>

  <a
    class="nav-item active"
    href="profile.html"
  >
    <span class="nav-icon">◯</span>
    Profile
  </a>

</div>


<script>


/* =========================================
   FIREBASE
========================================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================================
   SESSION
========================================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let currentUID =
localStorage.getItem(
  "crockcell_uid"
);

let refreshToken =
localStorage.getItem("crockcell_refreshToken") ||
sessionStorage.getItem("crockcell_refreshToken");


if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}

if(!currentUID){

  currentUID =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}


if(!token || !currentUID){

  window.location.replace(
    "index.html"
  );

}


/* =========================================
   REFRESH FIREBASE TOKEN
========================================= */
async function refreshAuthToken(){
  if(!refreshToken) return false;
  try{
    const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:`grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`
    });
    const d=await r.json();
    if(!r.ok || !d.id_token) return false;
    token=d.id_token;
    currentUID=d.user_id || currentUID;
    refreshToken=d.refresh_token || refreshToken;
    localStorage.setItem("crockcell_idToken",token);
    localStorage.setItem("crockcell_refreshToken",refreshToken);
    localStorage.setItem("crockcell_uid",currentUID);
    sessionStorage.setItem("crockcell_idToken",token);
    sessionStorage.setItem("crockcell_refreshToken",refreshToken);
    sessionStorage.setItem("crockcell_uid",currentUID);
    return true;
  }catch(e){ console.error("Token refresh error",e); return false; }
}


/* =========================================
   URL
========================================= */

const params =
new URLSearchParams(
  window.location.search
);

const requestedUID =
params.get("uid");

const requestedUsername =
params.get("username");

const requestedName =
params.get("name");

const requestedPhoto =
params.get("photo");


/* =========================================
   SESSION PROFILE FROM SEARCH
========================================= */

let savedTarget = null;


try{

  const saved =
  sessionStorage.getItem(
    "crockcell_profile_target"
  );

  if(saved){

    savedTarget =
    JSON.parse(saved);

  }

}
catch(error){

  console.log(
    "Saved profile unavailable"
  );

}


/* =========================================
   PROFILE UID
========================================= */

const profileUID =
requestedUID ||
(savedTarget?.uid) ||
currentUID;


/* =========================================
   ELEMENTS
========================================= */

const profileArea =
document.getElementById(
  "profileArea"
);

const listModal =
document.getElementById(
  "listModal"
);

const listTitle =
document.getElementById(
  "listTitle"
);

const listContent =
document.getElementById(
  "listContent"
);

const closeList =
document.getElementById(
  "closeList"
);


/* =========================================
   CURRENT PROFILE
========================================= */

let currentProfile = null;


/* =========================================
   FIRESTORE BASE
========================================= */

function firestoreBase(){

  return (
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents"
  );

}


function escapeHTML(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeAttribute(s){return escapeHTML(s).replace(/`/g,"&#96;");}

function renderProfile(){
  const p=currentProfile||{};
  const isOwn=p.uid===currentUID;
  const avatar=p.photoURL||"https://via.placeholder.com/160?text=C";
  profileArea.innerHTML=`
    <div class="profile-topbar">
      ${isOwn?'<button id="settingsButton" class="profile-settings" type="button" aria-label="Settings">⚙️</button>':''}
    </div>
    <div style="text-align:center">
      <img src="${escapeAttribute(avatar)}" alt="Profile" style="width:96px;height:96px;border-radius:50%;object-fit:cover;background:#222;border:2px solid #333">
      <h2 style="margin:12px 0 3px">${escapeHTML(p.name||p.username||"User")}</h2>
      <div style="color:#888">@${escapeHTML(p.username||"user")}</div>
    </div>
    <div class="stats">
      <div id="followersStat" class="stat"><div id="followersCount" class="stat-number">0</div><div class="stat-label">Followers</div></div>
      <div id="followingStat" class="stat"><div id="followingCount" class="stat-number">0</div><div class="stat-label">Following</div></div>
      <div class="stat"><div id="postsCount" class="stat-number">0</div><div class="stat-label">Posts</div></div>
    </div>
    <div class="bio">${escapeHTML(p.bio||"No bio yet.")}</div>
    <div class="actions">
      ${isOwn
        ? '<button id="editButton" class="action-btn" type="button">Edit Profile</button>'
        : '<button id="followButton" class="action-btn" type="button">Follow</button><button id="messageButton" class="action-btn" type="button">Message</button>'}
    </div>
    <section class="cloud-section"><div class="cloud-head"><b>Stories</b><a href="story_cloud.html">See all</a></div><div id="profileStories" class="cloud-row"><div class="cloud-empty">Loading Stories...</div></div></section>
    <section class="cloud-section"><div class="cloud-head"><b>Notes</b><a href="notes_cloud.html">See all</a></div><div id="profileNotes" class="cloud-row"><div class="cloud-empty">Loading Notes...</div></div></section>`;

  if(isOwn){
    const settingsButton=document.getElementById("settingsButton");
    if(settingsButton)settingsButton.onclick=()=>location.href="settings.html";
    const editButton=document.getElementById("editButton");
    if(editButton)editButton.onclick=()=>location.href="edit-profile.html";
  }else{
    const followButton=document.getElementById("followButton");
    if(followButton){followButton.onclick=toggleFollow;updateFollowButton();}
    const messageButton=document.getElementById("messageButton");
    if(messageButton)messageButton.onclick=()=>openMessage(p);
  }
  const followersStat=document.getElementById("followersStat");
  const followingStat=document.getElementById("followingStat");
  if(followersStat)followersStat.onclick=()=>openUserList("Followers");
  if(followingStat)followingStat.onclick=()=>openUserList("Following");
  loadProfileCloud();
}

async function checkFollowing(followerID,followingID){
  try{
    const r=await fetch(firestoreBase()+"/follows/"+encodeURIComponent(followerID+"_"+followingID)+"?key="+API_KEY,{headers:{Authorization:"Bearer "+token}});
    return r.ok;
  }catch(e){return false;}
}
async function updateFollowButton(){
  const b=document.getElementById("followButton"); if(!b)return;
  const yes=await checkFollowing(currentUID,currentProfile.uid);
  b.textContent=yes?"Following":"Follow";
}
async function toggleFollow(){
  const b=document.getElementById("followButton"); if(!b)return;
  b.disabled=true;
  const id=currentUID+"_"+currentProfile.uid;
  const url=firestoreBase()+"/follows/"+encodeURIComponent(id)+"?key="+API_KEY;
  try{
    const yes=await checkFollowing(currentUID,currentProfile.uid);
    if(yes){
      const r=await fetch(url,{method:"DELETE",headers:{Authorization:"Bearer "+token}});
      if(!r.ok)throw new Error("UNFOLLOW_FAILED");
      b.textContent="Follow";
    }else{
      const r=await fetch(url,{method:"PATCH",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({fields:{followerId:{stringValue:currentUID},followingId:{stringValue:currentProfile.uid},createdAt:{timestampValue:new Date().toISOString()}}})});
      if(!r.ok)throw new Error("FOLLOW_FAILED");
      b.textContent="Following";
    }
    await loadProfileCounts();
  }catch(e){console.error(e);alert("Follow update nahi ho paaya.");}
  b.disabled=false;
}
async function openUserList(type){
  listTitle.textContent=type; listContent.innerHTML='<div class="list-empty">Loading...</div>'; listModal.style.display="flex";
  try{
    const field=type==="Followers"?"followingId":"followerId";
    const r=await fetch(firestoreBase()+":runQuery?key="+API_KEY,{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({structuredQuery:{from:[{collectionId:"follows"}],where:{fieldFilter:{field:{fieldPath:field},op:"EQUAL",value:{stringValue:currentProfile.uid}}},limit:100}})});
    if(!r.ok)throw new Error("LIST_FAILED");
    const rows=await r.json(); const ids=rows.filter(x=>x.document).map(x=>{const f=x.document.fields||{};return type==="Followers"?f.followerId?.stringValue:f.followingId?.stringValue;}).filter(Boolean);
    if(!ids.length){listContent.innerHTML='<div class="list-empty">No users yet.</div>';return;}
    const users=[];
    for(const id of ids){const u=await getUserByUID(id);if(u)users.push(u);}
    listContent.innerHTML=users.map(u=>`<div class="user-row" onclick="sessionStorage.setItem('crockcell_profile_target',JSON.stringify(${JSON.stringify(u)}));location.href='profile.html';"><img class="user-avatar" src="${escapeAttribute(u.photoURL||"https://via.placeholder.com/80")}"><div class="user-details"><div class="user-name">${escapeHTML(u.name)}</div><div class="user-username">@${escapeHTML(u.username)}</div></div><div class="user-arrow">›</div></div>`).join("")||'<div class="list-empty">No users found.</div>';
  }catch(e){console.error(e);listContent.innerHTML='<div class="list-empty">List load nahi hui.</div>';}
}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

  try{

    /*
      IMPORTANT:

      Search se profile open hone par
      savedTarget me already user data hota hai.

      Isliye Firebase ka wait nahi.
    */

    if(
      savedTarget &&
      savedTarget.uid === profileUID
    ){

      currentProfile = {

        uid:
        savedTarget.uid,

        username:
        savedTarget.username ||
        requestedUsername ||
        "user",

        name:
        savedTarget.name ||
        requestedName ||
        savedTarget.username ||
        "User",

        photoURL:
        savedTarget.photoURL ||
        requestedPhoto ||
        "",

        bio:""

      };


      renderProfile();


      /*
        Firebase se bio/counts background me.
      */

      loadExtraProfileData();

      return;

    }


    /*
      URL se profile data available ho
      to bhi turant show.
    */

    if(
      requestedUID &&
      (
        requestedUsername ||
        requestedName ||
        requestedPhoto
      )
    ){

      currentProfile = {

        uid:
        requestedUID,

        username:
        requestedUsername ||
        "user",

        name:
        requestedName ||
        requestedUsername ||
        "User",

        photoURL:
        requestedPhoto ||
        "",

        bio:""

      };


      renderProfile();

      loadExtraProfileData();

      return;

    }


    /*
      Apni profile ho to Firebase se load.
    */

    const user =
    await getUserByUID(
      profileUID
    );


    if(!user){

      throw new Error(
        "USER_NOT_FOUND"
      );

    }


    currentProfile =
    user;


    renderProfile();

    loadExtraProfileData();

  }
  catch(error){

    console.error(
      "PROFILE ERROR:",
      error
    );


    profileArea.innerHTML = `

      <div class="error-box">

        Profile load nahi ho paayi.

        <br><br>

        <button
          class="retry-btn"
          onclick="location.reload()"
        >
          Retry
        </button>

      </div>

    `;

  }

}


/* =========================================
   EXTRA PROFILE DATA
========================================= */

async function loadExtraProfileData(){
  try{
    const user=await getUserByUID(profileUID);
    if(user){
      currentProfile={...currentProfile,...user};
      renderProfile();
    }
    await loadProfileCounts();
  }catch(error){console.log("Extra profile data unavailable",error);}
}

async function loadProfileCounts(){
  const followers=document.getElementById("followersCount");
  const following=document.getElementById("followingCount");
  const posts=document.getElementById("postsCount");
  try{
    const r=await fetch(firestoreBase()+"/follows?pageSize=300&key="+API_KEY,{headers:{Authorization:"Bearer "+token}});
    if(r.ok){
      const d=await r.json(); let f=0,g=0;
      for(const doc of d.documents||[]){
        const x=doc.fields||{};
        if(x.followingId?.stringValue===profileUID) f++;
        if(x.followerId?.stringValue===profileUID) g++;
      }
      if(followers)followers.textContent=String(f);
      if(following)following.textContent=String(g);
    }
    const r2=await fetch(firestoreBase()+"/posts?pageSize=300&key="+API_KEY,{headers:{Authorization:"Bearer "+token}});
    if(r2.ok){
      const d2=await r2.json(); let n=0;
      for(const doc of d2.documents||[]){ if(doc.fields?.uid?.stringValue===profileUID) n++; }
      if(posts)posts.textContent=String(n);
    }
    if(profileUID!==currentUID) await updateFollowButton();
  }catch(e){console.log("Counts unavailable",e);}
}

function cloudString(fields,name){return fields?.[name]?.stringValue||"";}
function cloudTime(fields,name){const f=fields?.[name];if(!f)return 0;if(f.integerValue!==undefined)return Number(f.integerValue)||0;if(f.doubleValue!==undefined)return Number(f.doubleValue)||0;if(f.timestampValue){const n=Date.parse(f.timestampValue);return Number.isNaN(n)?0:n;}return 0;}
async function canViewCloud(uid,privacy){
  if(uid===currentUID)return true;
  const p=String(privacy||"Everyone").toLowerCase();
  if(p==="everyone")return true;
  if(p==="followers")return await checkFollowing(currentUID,uid);
  return false;
}

async function loadProfileStories(){
  const box=document.getElementById("profileStories"); if(!box||!currentProfile)return;
  try{
    const r=await fetch(firestoreBase()+"/stories?pageSize=100&key="+API_KEY,{headers:{Authorization:"Bearer "+token}});
    if(!r.ok)throw new Error("STORIES_FAILED");
    const d=await r.json(); const now=Date.now(); const arr=[];
    for(const doc of d.documents||[]){
      const f=doc.fields||{}; const uid=cloudString(f,"uid"); const data=cloudString(f,"data"); const exp=cloudTime(f,"expiresAt");
      if(uid!==currentProfile.uid||!data||(exp&&exp<=now))continue;
      if(await canViewCloud(uid,cloudString(f,"privacy")))arr.push({data,type:cloudString(f,"type")||"image",username:cloudString(f,"username")||currentProfile.username,createdAt:cloudTime(f,"createdAt")});
    }
    arr.sort((a,b)=>b.createdAt-a.createdAt); const items=arr.slice(0,8);
    if(!items.length){box.innerHTML='<div class="cloud-empty">No active stories.</div>';return;}
    box.innerHTML=items.map(x=>{const media=x.type.toLowerCase().includes("video")?`<video class="cloud-thumb" src="${escapeAttribute(x.data)}" muted playsinline></video>`:`<img class="cloud-thumb" src="${escapeAttribute(x.data)}" alt="Story">`;return `<a class="cloud-card" href="story_cloud.html">${media}<div class="cloud-label">@${escapeHTML(x.username)}</div></a>`}).join("");
  }catch(e){console.error(e);box.innerHTML='<div class="cloud-empty">Stories load nahi hui.</div>';}
}

async function loadProfileNotes(){
  const box=document.getElementById("profileNotes"); if(!box||!currentProfile)return;
  try{
    const r=await fetch(firestoreBase()+"/notes?pageSize=100&key="+API_KEY,{headers:{Authorization:"Bearer "+token}});
    if(!r.ok)throw new Error("NOTES_FAILED");
    const d=await r.json(); const arr=[];
    for(const doc of d.documents||[]){
      const f=doc.fields||{}; const uid=cloudString(f,"uid"); const text=cloudString(f,"text");
      if(uid!==currentProfile.uid||!text)continue;
      if(await canViewCloud(uid,cloudString(f,"privacy")))arr.push({text,createdAt:cloudTime(f,"updatedAt")||cloudTime(f,"createdAt")});
    }
    arr.sort((a,b)=>b.createdAt-a.createdAt); const items=arr.slice(0,8);
    if(!items.length){box.innerHTML='<div class="cloud-empty">No notes yet.</div>';return;}
    box.innerHTML=items.map(x=>`<a class="cloud-card" href="notes_cloud.html"><div class="cloud-note">${escapeHTML(x.text)}</div><div class="cloud-label">Note</div></a>`).join("");
  }catch(e){console.error(e);box.innerHTML='<div class="cloud-empty">Notes load nahi hui.</div>';}
}
function loadProfileCloud(){loadProfileStories();loadProfileNotes();}

function openMessage(profile){
  try{sessionStorage.setItem("crockcell_chat_target",JSON.stringify(profile));}catch(e){}
  location.href="messages.html";
}

if(closeList){closeList.onclick=function(){listModal.style.display="none";};}
if(listModal){listModal.addEventListener("click",function(e){if(e.target===listModal)listModal.style.display="none";});}

async function start(){
  if(!token||!currentUID){window.location.replace("index.html");return;}
  if(refreshToken) await refreshAuthToken();
  await loadProfile();
}
start();
</script>
