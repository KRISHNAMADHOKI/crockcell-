<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CROCKCELL Profile</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.header{padding:22px 18px 15px;position:sticky;top:0;z-index:10;background:rgba(0,0,0,.95);border-bottom:1px solid #222}.title{font-size:28px;font-weight:700}.profile{padding:25px 18px 115px}.top{display:flex;align-items:center;gap:18px}.photo{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#222}.info{flex:1;min-width:0}.name{font-size:22px;font-weight:700}.username{margin-top:5px;color:#888}.bio{margin-top:20px;color:#ccc;line-height:1.5;white-space:pre-wrap}.stats{display:flex;margin-top:25px;padding:16px 0;border-top:1px solid #222;border-bottom:1px solid #222}.stat{flex:1;text-align:center;cursor:pointer}.stat-number{font-size:20px;font-weight:700}.stat-label{margin-top:5px;color:#888;font-size:13px}.actions{display:flex;gap:10px;margin-top:22px}.btn{flex:1;height:48px;border:0;border-radius:17px;background:#fff;color:#000;font-size:15px;font-weight:700}.btn.dark{background:#222;color:#fff;border:1px solid #444}.status,.error{text-align:center;color:#777;padding:45px 20px}.retry{margin-top:15px;padding:11px 18px;border:0;border-radius:15px;font-weight:700}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;display:none;align-items:flex-end}.box{width:100%;max-height:78vh;background:#111;border-radius:25px 25px 0 0;border:1px solid #333;overflow:hidden}.mh{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid #292929}.mt{font-size:20px;font-weight:700}.close{width:38px;height:38px;border:0;border-radius:50%;background:#222;color:#fff;font-size:22px}.list{max-height:65vh;overflow:auto;padding:8px 15px 25px}.row{display:flex;align-items:center;gap:12px;padding:13px 5px;border-bottom:1px solid #222;cursor:pointer}.avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#222}.ud{flex:1;min-width:0}.un{font-size:16px;font-weight:700}.uu{color:#888;font-size:13px;margin-top:4px}.empty{text-align:center;color:#777;padding:45px 20px}.nav{position:fixed;left:12px;right:12px;bottom:12px;z-index:20;display:flex;padding:8px;border-radius:24px;background:rgba(25,25,25,.94);border:1px solid #333}.nav a{flex:1;text-align:center;padding:8px 4px;border-radius:17px;color:#999;text-decoration:none;font-size:11px}.nav a.active{background:#fff;color:#000}.icon{display:block;font-size:20px;margin-bottom:3px}
</style></head><body>
<div class="header"><div class="title">Profile</div></div>
<div id="profileArea" class="profile"><div class="status">Loading profile...</div></div>
<div id="modal" class="modal"><div class="box"><div class="mh"><div id="modalTitle" class="mt">Followers</div><button id="close" class="close">×</button></div><div id="list" class="list"><div class="empty">Loading...</div></div></div></div>
<div class="nav"><a href="home.html"><span class="icon">⌂</span>Home</a><a href="search.html"><span class="icon">⌕</span>Search</a><a href="reels.html"><span class="icon">▶</span>Reels</a><a href="messages.html"><span class="icon">♡</span>Messages</a><a class="active" href="profile.html"><span class="icon">◯</span>Profile</a></div>
<script>
const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk", PROJECT_ID="crockcell-cd2e6";
const BASE=`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;
function get(k){return localStorage.getItem(k)||sessionStorage.getItem(k)||localStorage.getItem(k.replace("_",""))||sessionStorage.getItem(k.replace("_",""));}
let token=get("crockcell_idToken"), currentUID=get("crockcell_uid");
const qs=new URLSearchParams(location.search);
let target=null;try{target=JSON.parse(sessionStorage.getItem("crockcell_profile_target")||"null")}catch(e){}
const profileUID=qs.get("uid")||target?.uid||currentUID;
let profile=null;
const area=document.getElementById("profileArea");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function photo(v){return v||"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="100%" height="100%" fill="#222"/><text x="50%" y="60%" text-anchor="middle" fill="#777" font-size="70">👤</text></svg>`)}
function field(f,n){return f?.[n]?.stringValue||""}
async function getUser(uid){
 if(!uid)return null;
 try{let r=await fetch(`${BASE}/users/${encodeURIComponent(uid)}?key=${API_KEY}`,{headers:{Authorization:"Bearer "+token},cache:"no-store"});if(r.ok){let d=await r.json(),f=d.fields||{};return {uid:field(f,"uid")||uid,name:field(f,"name")||field(f,"username")||"User",username:field(f,"username")||"user",photoURL:field(f,"photoURL"),bio:field(f,"bio")};}}
 catch(e){}
 return null;
}
async function queryFollows(kind,uid){
 const f=kind==="followers"?"followingId":"followerId";
 try{let body={structuredQuery:{from:[{collectionId:"follows"}],where:{fieldFilter:{field:{fieldPath:f},op:"EQUAL",value:{stringValue:uid}}},limit:100}};let r=await fetch(`${BASE}:runQuery?key=${API_KEY}`,{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)return [];let rows=await r.json(),ids=[];rows.forEach(x=>{let z=x.document?.fields||{},id=kind==="followers"?field(z,"followerId"):field(z,"followingId");if(id)ids.push(id)});return [...new Set(ids)];}catch(e){return []}
}
async function count(kind,uid){return (await queryFollows(kind,uid)).length}
async function following(a,b){try{let r=await fetch(`${BASE}/follows/${encodeURIComponent(a+"_"+b)}?key=${API_KEY}`,{headers:{Authorization:"Bearer "+token}});return r.ok}catch(e){return false}}
function render(){let own=profile.uid===currentUID;area.innerHTML=`<div class="top"><img id="pimg" class="photo" src="${esc(photo(profile.photoURL))}"><div class="info"><div class="name">${esc(profile.name)}</div><div class="username">@${esc(profile.username)}</div></div></div><div class="stats"><div class="stat" id="followers"><div id="followersCount" class="stat-number">0</div><div class="stat-label">Followers</div></div><div class="stat" id="following"><div id="followingCount" class="stat-number">0</div><div class="stat-label">Following</div></div><div class="stat"><div class="stat-number">0</div><div class="stat-label">Posts</div></div></div><div class="bio">${esc(profile.bio||"No bio yet.")}</div><div class="actions">${own?`<button class="btn" id="edit">Edit Profile</button>`:`<button class="btn" id="follow">Follow</button><button class="btn dark" id="msg">Message</button>`}</div>`;
 document.getElementById("followers").onclick=()=>openList("Followers");document.getElementById("following").onclick=()=>openList("Following");
 if(own)document.getElementById("edit").onclick=()=>location.href="edit-profile.html";else{document.getElementById("msg").onclick=()=>{sessionStorage.setItem("crockcell_chat_target",JSON.stringify(profile));location.href="messages.html"};document.getElementById("follow").onclick=toggleFollow;updateFollow()}
 loadCounts();
}
async function loadCounts(){document.getElementById("followersCount").textContent=await count("followers",profile.uid);document.getElementById("followingCount").textContent=await count("following",profile.uid)}
async function updateFollow(){let b=document.getElementById("follow");if(!b)return;b.textContent=await following(currentUID,profile.uid)?"Following":"Follow"}
async function toggleFollow(){let b=document.getElementById("follow");b.disabled=true;let id=currentUID+"_"+profile.uid,url=`${BASE}/follows/${encodeURIComponent(id)}?key=${API_KEY}`;try{if(await following(currentUID,profile.uid)){let r=await fetch(url,{method:"DELETE",headers:{Authorization:"Bearer "+token}});if(!r.ok)throw 0;b.textContent="Follow"}else{let r=await fetch(url,{method:"PATCH",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({fields:{followerId:{stringValue:currentUID},followingId:{stringValue:profile.uid},createdAt:{timestampValue:new Date().toISOString()}}})});if(!r.ok)throw 0;b.textContent="Following"}loadCounts()}catch(e){alert("Follow update nahi ho paaya.")}finally{b.disabled=false}}
async function openList(kind){document.getElementById("modalTitle").textContent=kind;document.getElementById("list").innerHTML='<div class="empty">Loading...</div>';document.getElementById("modal").style.display="flex";let ids=await queryFollows(kind.toLowerCase(),profile.uid);if(!ids.length){document.getElementById("list").innerHTML='<div class="empty">No users yet.</div>';return}let users=(await Promise.all(ids.map(getUser))).filter(Boolean);document.getElementById("list").innerHTML="";users.forEach(u=>{let d=document.createElement("div");d.className="row";d.innerHTML=`<img class="avatar" src="${esc(photo(u.photoURL))}"><div class="ud"><div class="un">${esc(u.name)}</div><div class="uu">@${esc(u.username)}</div></div><div>›</div>`;d.onclick=()=>{sessionStorage.setItem("crockcell_profile_target",JSON.stringify(u));location.href="profile.html"};document.getElementById("list").appendChild(d)})}
document.getElementById("close").onclick=()=>document.getElementById("modal").style.display="none";
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.style.display="none"};
async function start(){if(!token||!currentUID){location.replace("index.html");return}let quick=target&&target.uid===profileUID?target:null;if(quick){profile={uid:quick.uid,name:quick.name||quick.username||"User",username:quick.username||"user",photoURL:quick.photoURL||"",bio:""};render()}let fresh=await getUser(profileUID);if(!fresh){if(!quick){area.innerHTML='<div class="error">Profile load nahi ho paayi.<br><button class="retry" onclick="location.reload()">Retry</button></div>'}return}profile=fresh;render();if(profileUID===currentUID)localStorage.setItem("crockcell_profile",JSON.stringify(profile))}
start();
</script></body></html>
