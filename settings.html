<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CROCKCELL Settings</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{padding:20px 16px 110px;max-width:700px;margin:auto}.head{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{width:42px;height:42px;border:1px solid #333;border-radius:14px;background:#171717;color:#fff;font-size:22px}.title{font-size:27px;font-weight:700}.profile{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid #292929;background:#111;border-radius:22px;margin-bottom:22px}.photo{width:62px;height:62px;border-radius:50%;object-fit:cover;background:#222}.pname{font-size:18px;font-weight:700}.puser{color:#888;margin-top:4px}.section{font-size:13px;color:#888;margin:18px 5px 8px}.group{border:1px solid #292929;border-radius:20px;overflow:hidden;background:#111}.item{width:100%;min-height:66px;padding:12px 15px;border:0;border-bottom:1px solid #252525;background:#111;color:#fff;display:flex;align-items:center;gap:13px;text-align:left}.item:last-child{border-bottom:0}.button{cursor:pointer}.icon{font-size:21px;width:27px;text-align:center}.txt{flex:1}.label{font-size:15px;font-weight:700}.desc{font-size:12px;color:#888;margin-top:4px;line-height:1.35}.arrow{font-size:25px;color:#777}.switch{position:relative;width:48px;height:28px}.switch input{display:none}.slider{position:absolute;inset:0;border-radius:20px;background:#333}.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#777;transition:.2s}.switch input:checked+.slider{background:#fff}.switch input:checked+.slider:before{transform:translateX(20px);background:#000}.danger{color:#ff6666}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#222;border:1px solid #444;border-radius:15px;padding:11px 16px;display:none;z-index:50;font-size:13px}.nav{position:fixed;left:12px;right:12px;bottom:12px;z-index:20;display:flex;padding:8px;border-radius:24px;background:rgba(25,25,25,.95);border:1px solid #333}.nav a{flex:1;text-align:center;padding:8px 4px;border-radius:17px;color:#999;text-decoration:none;font-size:11px}.nav a.active{background:#fff;color:#000}.navicon{font-size:20px;margin-bottom:3px}
</style></head><body>
<main class="wrap">
<div class="head"><button class="back" onclick="location.href='profile.html'">‹</button><div class="title">Settings</div></div>
<div class="profile"><img id="profilePhoto" class="photo" alt="Profile"><div><div id="profileName" class="pname">CROCKCELL User</div><div id="profileUsername" class="puser">@user</div></div></div>
<div class="section">Account</div><div class="group">
<button class="item button" onclick="location.href='edit-profile.html'"><div class="icon">✏️</div><div class="txt"><div class="label">Edit Profile</div><div class="desc">Name, username, bio and profile photo</div></div><div class="arrow">›</div></button>
<button class="item button" onclick="accountInfo()"><div class="icon">👤</div><div class="txt"><div class="label">Account Information</div><div class="desc">View your account details</div></div><div class="arrow">›</div></button></div>
<div class="section">Privacy</div><div class="group"><label class="item"><div class="icon">🔍</div><div class="txt"><div class="label">Searchable Profile</div><div class="desc">Allow people to find your profile</div></div><div class="switch"><input id="searchable" type="checkbox" checked><span class="slider"></span></div></label></div>
<div class="section">Security</div><div class="group">
<button class="item button" onclick="location.href='security.html'"><div class="icon">🛡️</div><div class="txt"><div class="label">Security Center</div><div class="desc">Login activity and account security</div></div><div class="arrow">›</div></button>
<button class="item button" onclick="location.href='security.html#password'"><div class="icon">🔑</div><div class="txt"><div class="label">Password & Recovery</div><div class="desc">Send a password reset email</div></div><div class="arrow">›</div></button>
<button class="item button" onclick="location.href='security.html#biometric'"><div class="icon">🔐</div><div class="txt"><div class="label">Biometric Login</div><div class="desc">Device fingerprint or face unlock</div></div><div class="arrow">›</div></button></div>
<div class="section">Notifications</div><div class="group"><label class="item"><div class="icon">🔔</div><div class="txt"><div class="label">Notifications</div><div class="desc">Likes, comments, followers and messages</div></div><div class="switch"><input id="notifications" type="checkbox" checked><span class="slider"></span></div></label><label class="item"><div class="icon">💬</div><div class="txt"><div class="label">Message Notifications</div><div class="desc">Alerts for new messages</div></div><div class="switch"><input id="messageNotifications" type="checkbox" checked><span class="slider"></span></div></label></div>
<div class="section">Messages</div><div class="group"><button class="item button" onclick="msg('Message privacy settings will be added next')"><div class="icon">✉️</div><div class="txt"><div class="label">Message Settings</div><div class="desc">Control who can message you</div></div><div class="arrow">›</div></button><button class="item button" onclick="msg('Blocked accounts will be added next')"><div class="icon">🚫</div><div class="txt"><div class="label">Blocked Accounts</div><div class="desc">Manage accounts you have blocked</div></div><div class="arrow">›</div></button></div>
<div class="section">Content & Activity</div><div class="group"><button class="item button" onclick="msg('Saved content will be added next')"><div class="icon">🔖</div><div class="txt"><div class="label">Saved</div><div class="desc">Posts and Reels you saved</div></div><div class="arrow">›</div></button><button class="item button" onclick="location.href='activity.html'"><div class="icon">🕘</div><div class="txt"><div class="label">Your Activity</div><div class="desc">Review your CROCKCELL activity</div></div><div class="arrow">›</div></button></div>
<div class="section">Help & About</div><div class="group"><button class="item button" onclick="msg('Help Center will be added next')"><div class="icon">❓</div><div class="txt"><div class="label">Help Center</div><div class="desc">Get help with CROCKCELL</div></div><div class="arrow">›</div></button><button class="item button" onclick="msg('CROCKCELL social app')"><div class="icon">ℹ️</div><div class="txt"><div class="label">About CROCKCELL</div><div class="desc">Version 1.0 • Free-first build</div></div><div class="arrow">›</div></button></div>
<div class="section">Account Actions</div><div class="group"><button class="item button" onclick="logout()"><div class="icon">↪️</div><div class="txt"><div class="label">Log Out</div><div class="desc">Sign out from this device</div></div><div class="arrow">›</div></button></div>
<div class="section">Danger Zone</div><div class="group"><button class="item button danger" onclick="deactivate()"><div class="icon">⏸️</div><div class="txt"><div class="label">Deactivate Account</div><div class="desc">Temporarily disable the account</div></div><div class="arrow">›</div></button><button class="item button danger" onclick="deleteAccount()"><div class="icon">🗑️</div><div class="txt"><div class="label">Delete Account</div><div class="desc">Permanent deletion requires secure backend confirmation</div></div><div class="arrow">›</div></button></div>
</main>
<nav class="nav"><a href="home.html"><div class="navicon">⌂</div>Home</a><a href="search.html"><div class="navicon">⌕</div>Search</a><a href="reels.html"><div class="navicon">▶</div>Reels</a><a href="messages.html"><div class="navicon">✉</div>Messages</a><a class="active" href="profile.html"><div class="navicon">◯</div>Profile</a></nav>
<div id="toast" class="toast"></div>
<script>
const PROJECT_ID='crockcell-cd2e6';
const token=localStorage.getItem('crockcellIdToken')||localStorage.getItem('crockcell_idToken')||sessionStorage.getItem('crockcellIdToken')||sessionStorage.getItem('crockcell_idToken')||'';
const uid=localStorage.getItem('crockcellUid')||localStorage.getItem('crockcell_uid')||sessionStorage.getItem('crockcellUid')||sessionStorage.getItem('crockcell_uid')||'';
if(!token||!uid)location.href='index.html';
const userURL='https://firestore.googleapis.com/v1/projects/'+PROJECT_ID+'/databases/(default)/documents/users/'+encodeURIComponent(uid);
function val(f){if(!f)return '';if(f.stringValue!==undefined)return f.stringValue;if(f.booleanValue!==undefined)return f.booleanValue;if(f.integerValue!==undefined)return Number(f.integerValue);return ''}
function msg(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.style.display='none',1900)}
async function loadProfile(){try{let saved=JSON.parse(localStorage.getItem('crockcellProfile')||'null');if(saved){document.getElementById('profileName').textContent=saved.name||saved.username||'CROCKCELL User';document.getElementById('profileUsername').textContent=saved.username?'@'+saved.username:'@user';if(saved.photoURL)document.getElementById('profilePhoto').src=saved.photoURL}let r=await fetch(userURL,{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)return;let d=await r.json(),f=d.fields||{},name=val(f.name)||val(f.fullName),username=val(f.username),photo=val(f.photoURL);document.getElementById('profileName').textContent=name||'CROCKCELL User';document.getElementById('profileUsername').textContent=username?'@'+username:'@user';if(photo)document.getElementById('profilePhoto').src=photo;localStorage.setItem('crockcellProfile',JSON.stringify({uid,name,username,photoURL:photo,bio:val(f.bio)}))}catch(e){}}
['searchable','notifications','messageNotifications'].forEach(id=>{const k='crockcell_setting_'+id,s=localStorage.getItem(k),el=document.getElementById(id);if(s!==null)el.checked=s==='true';el.addEventListener('change',()=>{localStorage.setItem(k,el.checked?'true':'false');msg(el.checked?'Setting enabled':'Setting disabled')})});
function accountInfo(){const p=JSON.parse(localStorage.getItem('crockcellProfile')||'{}');alert('Username: @'+(p.username||'user')+'\nUID: '+uid+'\nEmail: account email is protected by Firebase Auth.');}
function logout(){if(!confirm('Are you sure you want to log out?'))return;['crockcellIdToken','crockcellUid','crockcell_idToken','crockcell_uid','crockcellProfile','crockcell_chat_target','crockcell_profile_target'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)});location.href='index.html'}
function deactivate(){if(confirm('Deactivate Account ko abhi secure Firebase backend se connect karna baaki hai. Settings ko change nahi kiya jayega.'))msg('Backend confirmation required')}
function deleteAccount(){if(!confirm('Delete Account permanently?'))return;if(!confirm('Final confirmation: account deletion backend se securely connect karna abhi baaki hai. Continue?'))return;msg('Secure backend deletion required')}
loadProfile();
</script></body></html>
