<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Settings - CROCKCELL</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:Arial,sans-serif}body{padding-bottom:90px}button,a{font:inherit}.header{position:sticky;top:0;z-index:100;height:64px;display:flex;align-items:center;gap:14px;padding:0 16px;background:rgba(5,5,5,.9);backdrop-filter:blur(18px);border-bottom:1px solid #1b1b1b}.back{width:42px;height:42px;border:0;border-radius:50%;background:#181818;color:#fff;font-size:25px}.title{font-size:21px;font-weight:800}.wrap{max-width:650px;margin:auto;padding:15px}.profile{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid #222;border-radius:20px;background:linear-gradient(145deg,#151515,#0b0b0b);margin-bottom:22px}.photo{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#222;border:2px solid #555}.pinfo{flex:1;min-width:0}.name{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.username{color:#999;font-size:13px;margin-top:4px}.edit{border:1px solid #333;background:#fff;color:#000;border-radius:13px;padding:9px 12px;font-weight:700}.section{color:#888;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin:20px 5px 8px}.group{overflow:hidden;border:1px solid #202020;border-radius:18px;background:#111}.item{width:100%;min-height:62px;padding:10px 13px;display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;border:0;border-bottom:1px solid #202020;background:transparent;text-align:left}.item:last-child{border-bottom:0}.item:active{background:#1a1a1a}.icon{width:38px;height:38px;flex-shrink:0;border-radius:12px;background:#1d1d1d;display:flex;align-items:center;justify-content:center;font-size:19px}.txt{flex:1;min-width:0}.label{font-size:15px;font-weight:700}.desc{color:#858585;font-size:12px;line-height:1.3;margin-top:4px}.arrow{color:#777;font-size:22px}.switch{position:relative;width:48px;height:28px;flex-shrink:0}.switch input{display:none}.slider{position:absolute;inset:0;background:#333;border-radius:30px}.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#fff}.switch input:checked+.slider:before{transform:translateX(20px);background:#000}.logout{width:100%;height:52px;margin-top:25px;border:1px solid #552525;border-radius:17px;background:#190d0d;color:#ff7070;font-weight:800}.danger{color:#ff6565}.version{text-align:center;color:#555;font-size:12px;margin:24px 0}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);z-index:2000;background:#fff;color:#000;padding:11px 16px;border-radius:16px;font-size:13px;font-weight:700;display:none;max-width:90%}.bottom{position:fixed;left:9px;right:9px;bottom:calc(8px + env(safe-area-inset-bottom));height:62px;z-index:500;display:flex;align-items:center;justify-content:space-around;border:1px solid #222;border-radius:21px;background:rgba(15,15,15,.9);backdrop-filter:blur(18px)}.nav{width:19%;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#777;border-radius:15px;font-size:9px;font-weight:700}.nav.active{color:#fff;background:#1c1c1c}.navicon{font-size:20px;line-height:22px}.navphoto{width:25px;height:25px;border-radius:50%;object-fit:cover;border:1px solid #777;background:#222}@media(max-width:380px){.wrap{padding:12px}.item{padding:10px 11px}.desc{font-size:11px}}
</style>
</head>
<body>
<header class="header"><button class="back" type="button" onclick="history.length>1?history.back():location.href='profile.html'">‹</button><div class="title">Settings</div></header>
<main class="wrap">
<section class="profile"><img id="profilePhoto" class="photo" alt="Profile"><div class="pinfo"><div id="profileName" class="name">Loading...</div><div id="profileUsername" class="username">@user</div></div><button class="edit" type="button" onclick="location.href='edit-profile.html'">Edit</button></section>
<div class="section">Account</div><div class="group">
<a class="item" href="edit-profile.html"><div class="icon">👤</div><div class="txt"><div class="label">Edit Profile</div><div class="desc">Name, username, bio and profile photo</div></div><div class="arrow">›</div></a>
<button class="item" type="button" onclick="msg('Account information')"><div class="icon">📋</div><div class="txt"><div class="label">Account Information</div><div class="desc">View your account details</div></div><div class="arrow">›</div></button></div>
<div class="section">Privacy</div><div class="group">
<button class="item" type="button" onclick="msg('Privacy settings will be connected next')"><div class="icon">🔒</div><div class="txt"><div class="label">Privacy</div><div class="desc">Control who can see and interact with you</div></div><div class="arrow">›</div></button>
<label class="item"><div class="icon">🔍</div><div class="txt"><div class="label">Searchable Profile</div><div class="desc">Allow people to find your profile</div></div><div class="switch"><input id="searchable" type="checkbox" checked><span class="slider"></span></div></label></div>
<div class="section">Security</div><div class="group">
<button class="item" type="button" onclick="msg('Security Center will be connected next')"><div class="icon">🛡️</div><div class="txt"><div class="label">Security Center</div><div class="desc">Login activity and account security</div></div><div class="arrow">›</div></button>
<button class="item" type="button" onclick="msg('Password and recovery will be connected next')"><div class="icon">🔑</div><div class="txt"><div class="label">Password & Recovery</div><div class="desc">Password and account recovery</div></div><div class="arrow">›</div></button>
<button class="item" type="button" onclick="msg('Biometric login will be added next')"><div class="icon">🔐</div><div class="txt"><div class="label">Biometric Login</div><div class="desc">Fingerprint or face unlock</div></div><div class="arrow">›</div></button></div>
<div class="section">Notifications</div><div class="group">
<label class="item"><div class="icon">🔔</div><div class="txt"><div class="label">Notifications</div><div class="desc">Likes, comments, followers and messages</div></div><div class="switch"><input id="notifications" type="checkbox" checked><span class="slider"></span></div></label>
<label class="item"><div class="icon">💬</div><div class="txt"><div class="label">Message Notifications</div><div class="desc">Alerts for new messages</div></div><div class="switch"><input id="messageNotifications" type="checkbox" checked><span class="slider"></span></div></label></div>
<div class="section">Messages</div><div class="group">
<button class="item" type="button" onclick="msg('Message privacy settings will be connected next')"><div class="icon">✉️</div><div class="txt"><div class="label">Message Settings</div><div class="desc">Control who can message you</div></div><div class="arrow">›</div></button>
<button class="item" type="button" onclick="msg('Blocked accounts list will be connected next')"><div class="icon">🚫</div><div class="txt"><div class="label">Blocked Accounts</div><div class="desc">Manage accounts you have blocked</div></div><div class="arrow">›</div></button></div>
<div class="section">Content & Activity</div><div class="group">
<button class="item" type="button" onclick="msg('Saved posts will be added next')"><div class="icon">🔖</div><div class="txt"><div class="label">Saved</div><div class="desc">Posts and Reels you saved</div></div><div class="arrow">›</div></button>
<button class="item" type="button" onclick="msg('Activity history will be added next')"><div class="icon">🕘</div><div class="txt"><div class="label">Your Activity</div><div class="desc">Review your CROCKCELL activity</div></div><div class="arrow">›</div></button></div>
<div class="section">Help & About</div><div class="group">
<button class="item" type="button" onclick="msg('Help Center coming next')"><div class="icon">❓</div><div class="txt"><div class="label">Help Center</div><div class="desc">Get help with CROCKCELL</div></div><div class="arrow">›</div></button>
<button class="item" type="button" onclick="msg('CROCKCELL Version 1.0')"><div class="icon">ℹ️</div><div class="txt"><div class="label">About CROCKCELL</div><div class="desc">App information and policies</div></div><div class="arrow">›</div></button></div>
<button class="logout" type="button" onclick="logout()">Log out</button>
<div class="section">Danger Zone</div><div class="group">
<button class="item" type="button" onclick="deactivate()"><div class="icon">⏸️</div><div class="txt"><div class="label danger">Deactivate Account</div><div class="desc">Temporarily stop using your account</div></div><div class="arrow">›</div></button>
<button class="item" type="button" onclick="deleteAccount()"><div class="icon">⚠️</div><div class="txt"><div class="label danger">Delete Account</div><div class="desc">Permanently delete your account</div></div><div class="arrow">›</div></button></div>
<div class="version">CROCKCELL • Version 1.0</div>
</main>
<div id="toast" class="toast"></div>
<nav class="bottom"><a class="nav" href="home.html"><div class="navicon">⌂</div><div>Home</div></a><a class="nav" href="search.html"><div class="navicon">⌕</div><div>Search</div></a><a class="nav" href="reels.html"><div class="navicon">▶</div><div>Reels</div></a><a class="nav" href="messages.html"><div class="navicon">✉</div><div>Messages</div></a><a class="nav active" href="profile.html"><img id="navPhoto" class="navphoto" alt="Profile"><div>Profile</div></a></nav>
<script>
const PROJECT_ID='crockcell-cd2e6';
const token=localStorage.getItem('crockcellIdToken')||localStorage.getItem('crockcell_idToken')||sessionStorage.getItem('crockcellIdToken')||sessionStorage.getItem('crockcell_idToken')||'';
const uid=localStorage.getItem('crockcellUid')||localStorage.getItem('crockcell_uid')||sessionStorage.getItem('crockcellUid')||sessionStorage.getItem('crockcell_uid')||'';
if(!token||!uid) location.href='index.html';
const userURL='https://firestore.googleapis.com/v1/projects/'+PROJECT_ID+'/databases/(default)/documents/users/'+encodeURIComponent(uid);
function val(f){if(!f)return '';if(f.stringValue!==undefined)return f.stringValue;if(f.booleanValue!==undefined)return f.booleanValue;if(f.integerValue!==undefined)return Number(f.integerValue);return ''}
async function loadProfile(){try{const saved=JSON.parse(localStorage.getItem('crockcellProfile')||'null');if(saved){document.getElementById('profileName').textContent=saved.name||saved.fullName||'CROCKCELL User';document.getElementById('profileUsername').textContent=saved.username?'@'+saved.username:'@user';if(saved.photoURL){document.getElementById('profilePhoto').src=saved.photoURL;document.getElementById('navPhoto').src=saved.photoURL}}const r=await fetch(userURL,{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const d=await r.json(),f=d.fields||{},name=val(f.name)||val(f.fullName),username=val(f.username),photo=val(f.photoURL);document.getElementById('profileName').textContent=name||'CROCKCELL User';document.getElementById('profileUsername').textContent=username?'@'+username:'@user';if(photo){document.getElementById('profilePhoto').src=photo;document.getElementById('navPhoto').src=photo}localStorage.setItem('crockcellProfile',JSON.stringify({uid,name,username,photoURL:photo}))}catch(e){console.log(e)}}
function msg(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tm);window.tm=setTimeout(()=>x.style.display='none',1900)}
['searchable','notifications','messageNotifications'].forEach(id=>{const k='crockcell_setting_'+id,s=localStorage.getItem(k);const el=document.getElementById(id);if(s!==null)el.checked=s==='true';el.addEventListener('change',()=>{localStorage.setItem(k,el.checked?'true':'false');msg(el.checked?'Setting enabled':'Setting disabled')})});
function logout(){if(!confirm('Are you sure you want to log out?'))return;['crockcellIdToken','crockcellUid','crockcell_idToken','crockcell_uid','crockcellProfile','crockcell_chat_target','crockcell_profile_target'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)});location.href='index.html'}
function deactivate(){alert('Deactivate Account ko secure Firebase backend confirmation ke saath next step me connect karenge. Abhi account deactivate nahi hoga.')}
function deleteAccount(){if(!confirm('Account permanently delete karna hai?'))return;if(!confirm('Ye permanent action hai. Continue?'))return;alert('Secure backend deletion abhi connected nahi hai, isliye account delete nahi kiya gaya.')}
loadProfile();
</script>
</body>
</html>
