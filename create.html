<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create - CROCKCELL</title><link rel="stylesheet" href="style.css">
</head><body><main class="app">
<header class="topbar"><div class="brand">Create Post</div><a class="iconbtn" href="home.html">✕</a></header>
<section class="card stack">
<input id="photo" class="input" type="file" accept="image/*">
<img id="preview" class="hidden" style="width:100%;max-height:520px;object-fit:cover;border-radius:16px">
<textarea id="caption" class="textarea" placeholder="Write a caption..."></textarea>
<button id="post" class="btn primary">Post</button><div id="msg" class="notice hidden"></div>
</section></main>
<script src="core.js"></script><script>
const $=id=>document.getElementById(id);let imageData="";
$("photo").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024)return show("Image 10MB se chhoti rakho.");const rd=new FileReader();rd.onload=()=>{imageData=rd.result;$("preview").src=imageData;$("preview").classList.remove("hidden")};rd.readAsDataURL(f)};
function show(t){$("msg").textContent=t;$("msg").classList.remove("hidden")}
function compress(data,max=900,q=.72){return new Promise(res=>{const i=new Image();i.onload=()=>{let w=i.width,h=i.height,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(i,0,0,w,h);res(c.toDataURL("image/jpeg",q))};i.src=data})}
$("post").onclick=async()=>{if(!imageData)return show("Pehle photo select karo.");$("post").disabled=true;show("Posting...");
try{const img=await compress(imageData);const uid=CrockCell.uid();const p=CrockCell.profile();if(!uid)return location.href="index.html";const id=uid+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);const fields={postId:{stringValue:id},userId:{stringValue:uid},username:{stringValue:p.username||"User"},name:{stringValue:p.name||p.username||"User"},caption:{stringValue:$("caption").value.trim()},image:{stringValue:img},likes:{integerValue:"0"},createdAt:{stringValue:new Date().toISOString()}};const r=await CrockCell.request("posts/"+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})});if(!r.ok){const d=await r.text();console.log(d);throw Error("Post save failed")}location.href="home.html"}catch(e){console.error(e);show("Post save nahi ho payi. Console check karo.");$("post").disabled=false}};
</script></body></html>
