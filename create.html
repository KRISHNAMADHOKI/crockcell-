<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CROCKCELL - Create Post</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
padding-bottom:90px;
}

.header{
height:64px;
background:#000;
border-bottom:1px solid #222;
display:flex;
align-items:center;
padding:0 16px;
position:sticky;
top:0;
z-index:5;
}

.header h2{
font-size:21px;
margin:0;
}

.container{
max-width:520px;
margin:20px auto;
padding:0 14px;
}

.card{
background:#111;
border:1px solid #292929;
padding:18px;
border-radius:18px;
}

input,
textarea{
width:100%;
padding:13px;
border:1px solid #333;
border-radius:11px;
margin-bottom:12px;
outline:none;
background:#191919;
color:#fff;
font-size:15px;
}

input[type="file"]{
padding:10px;
}

textarea{
min-height:110px;
resize:none;
}

.preview{
width:100%;
max-height:470px;
object-fit:contain;
border-radius:12px;
margin-bottom:12px;
display:none;
background:#050505;
}

button.post{
width:100%;
padding:14px;
border:0;
border-radius:12px;
background:#fff;
color:#000;
font-size:16px;
font-weight:700;
cursor:pointer;
}

button:disabled{
opacity:.55;
cursor:not-allowed;
}

.message{
text-align:center;
min-height:22px;
margin-top:12px;
font-size:14px;
color:#aaa;
}

.note{
color:#777;
font-size:12px;
line-height:1.45;
margin-top:12px;
}

.bottomNav{
position:fixed;
bottom:12px;
left:12px;
right:12px;
height:65px;
background:rgba(25,25,25,.94);
border:1px solid #333;
border-radius:24px;
display:flex;
align-items:center;
justify-content:space-around;
z-index:20;
}

.bottomNav a{
text-decoration:none;
color:#999;
text-align:center;
font-size:10px;
flex:1;
padding:8px 2px;
border-radius:17px;
}

.bottomNav a.active{
background:#fff;
color:#000;
}

.bottomNav div{
font-size:20px;
margin-bottom:3px;
}

</style>
</head>

<body>

<div class="header">
<h2>Create Post</h2>
</div>


<div class="container">

<div class="card">

<input
type="file"
id="imageInput"
accept="image/*"
>

<img
id="preview"
class="preview"
alt="Preview"
>

<textarea
id="caption"
maxlength="2200"
placeholder="Write a caption..."
></textarea>

<button
id="postButton"
class="post"
type="button"
>
Post
</button>

<div
id="message"
class="message">
</div>

<div class="note">
Photo automatically compress hoke save hogi.
</div>

</div>

</div>


<div class="bottomNav">

<a href="home.html">
<div>⌂</div>
Home
</a>

<a href="search.html">
<div>⌕</div>
Search
</a>

<a
href="create.html"
class="active"
>
<div>＋</div>
Create
</a>

<a href="activity.html">
<div>♡</div>
Activity
</a>

<a href="profile.html">
<div>●</div>
Profile
</a>

</div>


<script>

/* =========================================
   FIREBASE SETTINGS
========================================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";

const BASE =
`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;


/* =========================================
   ELEMENTS
========================================= */

const imageInput =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

const caption =
document.getElementById("caption");

const button =
document.getElementById("postButton");

const message =
document.getElementById("message");


/* =========================================
   ACCOUNT
========================================= */

let token =
localStorage.getItem("crockcell_idToken") ||
"";

let uid =
localStorage.getItem("crockcell_uid") ||
"";


/* =========================================
   PROFILE
========================================= */

function getProfile(){

let data = {};

try{

data =
JSON.parse(
localStorage.getItem(
"crockcell_profile"
) || "{}"
);

}catch(error){

data={};

}

return data;

}


/* =========================================
   CHECK LOGIN
========================================= */

async function checkLogin(){

if(window.CrockCell){

token =
window.CrockCell.getToken() ||
token;

uid =
window.CrockCell.getUID() ||
uid;

}


if(!token || !uid){

location.replace("index.html");

return false;

}

return true;

}


/* =========================================
   IMAGE PREVIEW
========================================= */

imageInput.addEventListener(
"change",
function(){

const file =
imageInput.files[0];


if(!file){

preview.style.display="none";

return;

}


if(!file.type.startsWith("image/")){

message.textContent =
"Please select an image.";

imageInput.value="";

preview.style.display="none";

return;

}


if(file.size >
10 * 1024 * 1024){

message.textContent =
"Image 10 MB se chhoti rakho.";

imageInput.value="";

preview.style.display="none";

return;

}


message.textContent="";


const reader =
new FileReader();


reader.onload =
function(e){

preview.src =
e.target.result;

preview.style.display =
"block";

};


reader.onerror =
function(){

message.textContent =
"Image preview load nahi hui.";

};


reader.readAsDataURL(file);

});


/* =========================================
   COMPRESS IMAGE
========================================= */

function compressImage(file){

return new Promise(
function(resolve,reject){

const reader =
new FileReader();


reader.onload =
function(e){

const image =
new Image();


image.onload =
function(){

const maxWidth=900;
const maxHeight=900;

let width =
image.width;

let height =
image.height;


if(width > maxWidth){

height =
Math.round(
height *
maxWidth /
width
);

width=maxWidth;

}


if(height > maxHeight){

width =
Math.round(
width *
maxHeight /
height
);

height=maxHeight;

}


const canvas =
document.createElement(
"canvas"
);


canvas.width=width;
canvas.height=height;


const ctx =
canvas.getContext("2d");


ctx.drawImage(
image,
0,
0,
width,
height
);


const result =
canvas.toDataURL(
"image/jpeg",
0.72
);


resolve(result);

};


image.onerror =
function(){

reject(
new Error(
"Image load failed."
)
);

};


image.src=e.target.result;

};


reader.onerror =
function(){

reject(
new Error(
"Image read failed."
)
);

};


reader.readAsDataURL(file);

});

}


/* =========================================
   CREATE UNIQUE POST ID
========================================= */

function createPostId(){

return (
uid +
"_" +
Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2,10)
);

}


/* =========================================
   CREATE POST
========================================= */

async function createPost(){

const file =
imageInput.files[0];


if(!file){

message.textContent =
"Please select an image.";

return;

}


const loggedIn =
await checkLogin();


if(!loggedIn)
return;


const text =
caption.value.trim();


button.disabled=true;

message.textContent =
"Photo compress ho rahi hai...";


try{

const image =
await compressImage(file);


message.textContent =
"Post save ho rahi hai...";


const profile =
getProfile();


const username =
profile.username ||
"user";


const name =
profile.name ||
username;


const photoURL =
profile.photoURL ||
profile.photo ||
profile.profilePhoto ||
"";


const postId =
createPostId();


const createdAt =
new Date().toISOString();


/*
IMPORTANT:

POST ID UNIQUE HAI.

Isliye har new post ka
alag Firestore document banega.

Purani post overwrite nahi hogi.
*/


const fields={

postId:{
stringValue:postId
},

userId:{
stringValue:uid
},

username:{
stringValue:username
},

name:{
stringValue:name
},

caption:{
stringValue:text
},

image:{
stringValue:image
},

photoURL:{
stringValue:photoURL
},

likes:{
integerValue:"0"
},

createdAt:{
timestampValue:createdAt
}

};


const response =
await fetch(
`${BASE}/posts/${encodeURIComponent(postId)}`,
{
method:"PATCH",

headers:{
"Content-Type":
"application/json",

Authorization:
"Bearer "+token
},

body:JSON.stringify({
fields:fields
})

}
);


/* TOKEN EXPIRED */

if(
(response.status===401 ||
response.status===403) &&
window.CrockCell
){

const refreshed =
await window.CrockCell.refreshToken();


if(refreshed){

token =
window.CrockCell.getToken();

uid =
window.CrockCell.getUID();


const retry =
await fetch(
`${BASE}/posts/${encodeURIComponent(postId)}`,
{
method:"PATCH",

headers:{
"Content-Type":
"application/json",

Authorization:
"Bearer "+token
},

body:JSON.stringify({
fields:fields
})

}
);


if(!retry.ok){

const errorData =
await retry.json()
.catch(
()=>({})
);

throw new Error(
errorData.error?.message ||
"Post save failed."
);

}

}else{

throw new Error(
"Login session expire ho gaya. Please login again."
);

}

}else if(!response.ok){

const data =
await response.json()
.catch(
()=>({})
);

throw new Error(
data.error?.message ||
"Post save failed."
);

}


/* =========================================
   LOCAL COPY

   Ye sirf backup/cache hai.
   Main post Firestore mein save ho chuki hai.
========================================= */

try{

let localPosts =
JSON.parse(
localStorage.getItem(
"crockcellPosts"
) || "[]"
);


if(!Array.isArray(localPosts))
localPosts=[];


localPosts.push({

id:postId,

postId:postId,

userId:uid,

username:username,

name:name,

caption:text,

image:image,

photoURL:photoURL,

likes:0,

createdAt:createdAt

});


/*
Latest 100 local posts rakhenge.
*/

if(localPosts.length > 100){

localPosts =
localPosts.slice(
localPosts.length-100
);

}


localStorage.setItem(
"crockcellPosts",
JSON.stringify(
localPosts
)
);

}catch(error){

console.log(
"Local cache error:",
error
);

}


/* =========================================
   SUCCESS
========================================= */

message.textContent =
"Post created successfully!";


imageInput.value="";
caption.value="";

preview.src="";
preview.style.display="none";


setTimeout(
function(){

location.replace(
"home.html"
);

},
700
);


}catch(error){

console.error(
"Create post error:",
error
);

message.textContent =
error.message ||
"Something went wrong.";

button.disabled=false;

}

}


/* =========================================
   BUTTON
========================================= */

button.addEventListener(
"click",
createPost
);


/* =========================================
   START
========================================= */

checkLogin();

</script>

</body>
</html>
