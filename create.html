<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CROCKCELL - Create Post</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
    padding-bottom:80px;
}

.header{
    height:60px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 16px;
}

.header h2{
    font-size:20px;
}

.container{
    max-width:500px;
    margin:20px auto;
    padding:0 14px;
}

.card{
    background:white;
    padding:18px;
    border-radius:14px;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:9px;
    margin-bottom:12px;
    outline:none;
}

textarea{
    min-height:100px;
    resize:none;
}

.preview{
    width:100%;
    max-height:450px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:12px;
    display:none;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#111;
    color:white;
    font-size:16px;
}

button:disabled{
    opacity:.6;
}

.message{
    text-align:center;
    margin-top:12px;
    font-size:14px;
}

.bottomNav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.bottomNav a{
    text-decoration:none;
    color:#111;
    text-align:center;
    font-size:12px;
}

.bottomNav div{
    font-size:21px;
    margin-bottom:3px;
}
</style>
</head>

<body>

<div class="header">
    <h2>Create Post</h2>
</div>

<div class="container">

    <div class="card">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

        <img
            id="preview"
            class="preview"
        >

        <textarea
            id="caption"
            placeholder="Write a caption..."
        ></textarea>

        <button
            id="postButton"
            onclick="createPost()">
            Post
        </button>

        <div
            class="message"
            id="message">
        </div>

    </div>

</div>


<div class="bottomNav">

    <a href="home.html">
        <div>⌂</div>
        Home
    </a>

    <a href="search.html">
        <div>⌕</div>
        Search
    </a>

    <a href="create.html">
        <div>＋</div>
        Create
    </a>

    <a href="activity.html">
        <div>♡</div>
        Activity
    </a>

    <a href="profile.html">
        <div>●</div>
        Profile
    </a>

</div>


<script>

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";

const token =
localStorage.getItem("crockcell_idToken");

const uid =
localStorage.getItem("crockcell_uid");


/* LOGIN CHECK */

if(!token || !uid){

    window.location.replace(
        "index.html"
    );

}


/* PROFILE */

let profile = {};

try{

    profile =
        JSON.parse(
            localStorage.getItem(
                "crockcell_profile"
            ) || "{}"
        );

}catch(e){

    profile={};

}


/* IMAGE PREVIEW */

document
.getElementById("imageInput")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                const preview =
                    document.getElementById(
                        "preview"
                    );

                preview.src =
                    e.target.result;

                preview.style.display =
                    "block";

            };

        reader.readAsDataURL(file);

    }
);


/* CREATE POST */

async function createPost(){

    const imageInput =
        document.getElementById(
            "imageInput"
        );

    const caption =
        document.getElementById(
            "caption"
        ).value.trim();

    const button =
        document.getElementById(
            "postButton"
        );

    const message =
        document.getElementById(
            "message"
        );


    message.innerText="";


    if(!imageInput.files[0]){

        message.innerText =
            "Please select an image.";

        return;

    }


    button.disabled=true;

    message.innerText =
        "Creating post...";


    try{

        const file =
            imageInput.files[0];


        /* COMPRESS IMAGE */

        const compressedImage =
            await compressImage(file);


        const postId =
            Date.now().toString();


        const username =
            profile.username ||
            "user";


        const email =
            profile.email ||
            "";


        const postData = {

            userId:uid,

            username:username,

            email:email,

            caption:caption,

            image:compressedImage,

            likes:0,

            createdAt:
                new Date().toISOString()

        };


        /* SAVE POST IN FIRESTORE */

        const response =
            await fetch(

                "https://firestore.googleapis.com/v1/projects/"
                + PROJECT_ID
                + "/databases/(default)/documents/posts/"
                + postId,

                {

                    method:"PATCH",

                    headers:{

                        "Content-Type":
                        "application/json",

                        "Authorization":
                        "Bearer " + token

                    },

                    body:JSON.stringify({

                        fields:{

                            userId:{
                                stringValue:uid
                            },

                            username:{
                                stringValue:username
                            },

                            email:{
                                stringValue:email
                            },

                            caption:{
                                stringValue:caption
                            },

                            image:{
                                stringValue:compressedImage
                            },

                            likes:{
                                integerValue:"0"
                            },

                            createdAt:{
                                stringValue:
                                postData.createdAt
                            }

                        }

                    })

                }

            );


        const data =
            await response.json();


        if(!response.ok){

            console.log(data);

            throw new Error(
                data.error?.message ||
                "Post could not be saved."
            );

        }


        /* ALSO SAVE LOCALLY */

        let posts=[];

        try{

            posts =
                JSON.parse(
                    localStorage.getItem(
                        "crockcellPosts"
                    ) || "[]"
                );

        }catch(e){

            posts=[];

        }


        posts.push({

            id:postId,

            userId:uid,

            username:username,

            email:email,

            caption:caption,

            image:compressedImage,

            likes:0,

            createdAt:
                postData.createdAt

        });


        localStorage.setItem(

            "crockcellPosts",

            JSON.stringify(posts)

        );


        message.innerText =
            "Post created successfully!";


        setTimeout(
            function(){

                window.location.replace(
                    "home.html"
                );

            },
            700
        );


    }catch(error){

        console.log(error);

        message.innerText =
            error.message ||
            "Something went wrong.";

        button.disabled=false;

    }

}


/* IMAGE COMPRESSION */

function compressImage(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const img =
                        new Image();


                    img.onload =
                        function(){

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            const maxWidth =
                                900;


                            let width =
                                img.width;

                            let height =
                                img.height;


                            if(width > maxWidth){

                                height =
                                    height *
                                    maxWidth /
                                    width;

                                width =
                                    maxWidth;

                            }


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            const result =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.75
                                );


                            resolve(result);

                        };


                    img.onerror =
                        reject;

                    img.src =
                        event.target.result;

                };


            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        }
    );

}

</script>

</body>
</html>
