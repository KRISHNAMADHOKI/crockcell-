<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home - CROCKCELL</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    padding-bottom:90px;
}

/* HEADER */

header{
    height:58px;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    position:sticky;
    top:0;
    background:rgba(0,0,0,.92);
    backdrop-filter:blur(15px);
    z-index:10;
}

.logo{
    font-size:22px;
    font-weight:bold;
    letter-spacing:1px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.header-btn{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:#fff;
    font-size:21px;
    border-radius:50%;
    transition:.2s;
}

.header-btn:active{
    background:#222;
    transform:scale(.92);
}

/* PROFILE */

#profile{
    padding:14px 16px;
    border-bottom:1px solid #222;
    color:#aaa;
}

#profile b{
    color:#fff;
    font-size:18px;
}

/* FEED */

#feed{
    max-width:600px;
    margin:auto;
    padding-bottom:20px;
}

.post{
    border-bottom:1px solid #222;
    padding-bottom:15px;
    margin-bottom:8px;
}

.top{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#222;
    object-fit:cover;
    border:1px solid #333;
}

.name{
    font-weight:bold;
}

.photo{
    width:100%;
    max-height:650px;
    object-fit:cover;
    display:block;
}

.actions{
    display:flex;
    gap:18px;
    padding:10px 14px 5px;
    font-size:23px;
}

.actions button{
    border:0;
    background:none;
    color:#fff;
    cursor:pointer;
    transition:.15s;
}

.actions button:active{
    transform:scale(.82);
}

.info{
    padding:0 14px;
}

.caption{
    margin-top:7px;
}

.comments{
    padding:8px 14px;
}

.comment{
    font-size:14px;
    margin:7px 0;
    color:#ddd;
}

.comment b{
    color:#fff;
}

.comment button{
    color:#888;
    margin-left:6px;
    background:none;
    border:0;
}

.form{
    display:flex;
    gap:7px;
    padding:0 14px;
}

.form input{
    flex:1;
    background:#111;
    border:1px solid #333;
    border-radius:20px;
    padding:10px;
    color:#fff;
    outline:none;
}

.form input:focus{
    border-color:#666;
}

.form button{
    background:#fff;
    color:#000;
    border:0;
    border-radius:20px;
    padding:0 14px;
}

.del{
    color:#f66;
    font-size:12px;
    background:none;
    border:0;
    margin-top:8px;
}

.loading{
    text-align:center;
    padding:35px;
    color:#aaa;
}

.error{
    text-align:center;
    padding:25px;
    color:#f66;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    height:68px;

    background:rgba(20,20,20,.88);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid #333;
    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    z-index:20;

    box-shadow:
        0 8px 30px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.04);
}

.nav-item{
    width:25%;
    height:56px;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    text-decoration:none;
    color:#777;

    border-radius:17px;
    transition:.2s;

    position:relative;
}

.nav-icon{
    width:40px;
    height:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
    border-radius:12px;

    transition:.2s;
}

.nav-label{
    font-size:9px;
    margin-top:2px;
    color:#777;
}

.nav-item.active{
    color:#fff;
}

.nav-item.active .nav-icon{
    background:#fff;
    color:#000;
    transform:translateY(-1px);
}

.nav-item.active .nav-label{
    color:#fff;
    font-weight:bold;
}

.nav-item:active{
    transform:scale(.90);
}

/* PROFILE PHOTO */

.nav-profile-photo{
    width:31px;
    height:31px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #777;
}

.nav-item.active .nav-profile-photo{
    border-color:#fff;
}

/* MENU */

.profile-menu{
    display:none;

    position:fixed;
    right:14px;
    bottom:88px;

    width:205px;

    background:rgba(22,22,22,.96);
    backdrop-filter:blur(18px);

    border:1px solid #333;
    border-radius:18px;

    overflow:hidden;

    z-index:35;

    box-shadow:0 8px 35px rgba(0,0,0,.7);
}

.profile-menu a,
.profile-menu button{
    width:100%;
    display:block;

    padding:15px;

    color:#fff;
    text-decoration:none;

    background:none;
    border:0;
    border-bottom:1px solid #292929;

    text-align:left;
    font-size:14px;
}

.profile-menu a:active,
.profile-menu button:active{
    background:#292929;
}

.profile-menu .logout{
    color:#ff6262;
    border-bottom:0;
}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
}

@media(max-width:380px){

    .bottom-nav{
        left:7px;
        right:7px;
        bottom:7px;
    }

    .nav-label{
        font-size:8px;
    }

}

.cloud-strip{max-width:600px;margin:0 auto;padding:12px 14px;border-bottom:1px solid #222}
.cloud-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}

<script>

/* =========================================
   FIREBASE SETTINGS
========================================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


const BASE =
`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;


/* =========================================
   CURRENT ACCOUNT KEYS
========================================= */

let token =
localStorage.getItem("crockcell_idToken");

let uid =
localStorage.getItem("crockcell_uid");

let refreshToken =
localStorage.getItem("crockcell_refreshToken");


/* =========================================
   FIRESTORE VALUE HELPER
========================================= */

function val(f){

if(!f)
return "";

return (
f.stringValue ??
f.integerValue ??
f.timestampValue ??
f.booleanValue ??
""
);

}


/* =========================================
   HTML ESCAPE
========================================= */

function esc(s){

return String(s ?? "")
.replace(/[&<>"']/g,function(m){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m];

});

}


/* =========================================
   REFRESH FIREBASE TOKEN
========================================= */

async function refresh(){

if(!refreshToken)
return false;

try{

const r =
await fetch(
`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`,
{
method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body:
`grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`
}
);


const d =
await r.json();


if(!r.ok || !d.id_token){

console.log(
"Token refresh failed:",
d
);

return false;

}


token =
d.id_token;

uid =
d.user_id || uid;

refreshToken =
d.refresh_token || refreshToken;


/* SAVE NEW KEYS */

localStorage.setItem(
"crockcell_idToken",
token
);

localStorage.setItem(
"crockcell_refreshToken",
refreshToken
);

localStorage.setItem(
"crockcell_uid",
uid
);


return true;


}catch(error){

console.error(
"Refresh error:",
error
);

return false;

}

}


/* =========================================
   FIRESTORE API
========================================= */

async function api(
path,
opt={},
retry=true
){

if(!token)
return null;


const options = {

...opt,

headers:{

...(opt.headers || {}),

Authorization:
`Bearer ${token}`

}

};


let r =
await fetch(
BASE + path,
options
);


/* TOKEN EXPIRED */

if(
(r.status===401 || r.status===403) &&
retry
){

const refreshed =
await refresh();


if(refreshed){

return api(
path,
opt,
false
);

}

}


return r;

}


/* =========================================
   LOAD PROFILE
========================================= */

async function profile(){

if(!uid){

location.href="index.html";

return;

}


let r =
await api(
`/users/${encodeURIComponent(uid)}`
);


if(!r || !r.ok){

document.getElementById(
"profile"
).innerHTML =
"<b>Profile unavailable</b>";

return;

}


let d =
await r.json();

let f =
d.fields || {};


let username =
val(f.username) ||
" user";


let name =
val(f.name) ||
username;


let photo =
val(f.photoURL) ||
val(f.photo) ||
val(f.profilePhoto) ||
"";


document.getElementById(
"profile"
).innerHTML =

`<b>${esc(name)}</b>
<br>
@${esc(username)}`;


/* SAVE PROFILE USING NEW KEY */

let oldProfile={};

try{

oldProfile =
JSON.parse(
localStorage.getItem(
"crockcell_profile"
) || "{}"
);

}catch(error){

oldProfile={};

}


localStorage.setItem(
"crockcell_profile",
JSON.stringify({

...oldProfile,

uid:uid,

username:username,

name:name,

photoURL:photo,

email:
val(f.email) || ""

})
);


/* PROFILE PHOTO */

if(photo){

document.getElementById(
"navProfilePhoto"
).src=photo;

}

}


/* =========================================
   POSTS
========================================= */

async function posts(){

let box =
document.getElementById("feed");


let r =
await api(
"/posts?pageSize=50"
);


if(!r || !r.ok){

box.innerHTML =
`
<div class="error">
Posts load nahi hui.<br>
Please refresh the page.
</div>
`;

return;

}


let d =
await r.json();


let arr =
(d.documents || [])
.sort(function(a,b){

return String(
val(b.fields?.createdAt)
)
.localeCompare(
String(
val(a.fields?.createdAt)
)
);

});


box.innerHTML="";


if(!arr.length){

box.innerHTML =
`
<div class="loading">
Abhi koi post nahi hai.
</div>
`;

return;

}


arr.forEach(renderPost);

}


/* =========================================
   RENDER POST
========================================= */

function renderPost(doc){

let f =
doc.fields || {};


let id =
val(f.postId) ||
doc.name.split("/").pop();


let image =
val(f.image);


let username =
val(f.username) ||
"user";


let caption =
val(f.caption);


let likes =
Number(
val(f.likes) || 0
);


let postPhoto =
val(f.photoURL) ||
val(f.photo) ||
val(f.profilePhoto) ||
"";


let el =
document.createElement("article");


el.className="post";

el.id=
"post_"+id;


el.innerHTML=`

<div class="top">

${
postPhoto

?

`<img
class="avatar"
src="${esc(postPhoto)}"
alt="Profile">`

:

`<div class="avatar"></div>`

}

<div class="name">
${esc(username)}
</div>

</div>


${
image

?

`<img
class="photo"
src="${esc(image)}"
alt="post">`

:

""

}


<div class="actions">

<button
id="like_${esc(id)}"
onclick="likePost('${esc(id)}')">
♡
</button>

<button
onclick="focusComment('${esc(id)}')">
💬
</button>

<button
onclick="sharePost('${esc(id)}')">
↗
</button>

</div>


<div class="info">

<b id="count_${esc(id)}">
${likes} likes
</b>


${
caption

?

`<div class="caption">
<b>${esc(username)}</b>
${esc(caption)}
</div>`

:

""
}


${
String(
val(f.userId)
) === String(uid)

?

`<button
class="del"
onclick="deletePost('${esc(id)}')">
Delete post
</button>`

:

""
}

</div>


<div
class="comments"
id="comments_${esc(id)}">

<div style="color:#777">
Loading comments...
</div>

</div>


<div class="form">

<input
id="input_${esc(id)}"
placeholder="Add a comment...">

<button
onclick="sendComment('${esc(id)}')">
Post
</button>

</div>

`;


document
.getElementById("feed")
.appendChild(el);


checkLike(id);

loadComments(id);

}


/* =========================================
   CHECK LIKE
========================================= */

async function checkLike(id){

let r =
await api(
`/likes/${encodeURIComponent(id+"_"+uid)}`
);


let b =
document.getElementById(
"like_"+id
);


if(
r &&
r.ok &&
b
){

b.textContent="♥";

}

}


/* =========================================
   LIKE
========================================= */

async function likePost(id){

let likeId =
id+"_"+uid;


let r =
await api(
`/likes/${encodeURIComponent(likeId)}`
);


if(!r)
return;


if(r.ok){

await api(
`/likes/${encodeURIComponent(likeId)}`,
{
method:"DELETE"
}
);


await changeLikeCount(
id,
-1
);


let b =
document.getElementById(
"like_"+id
);


if(b)
b.textContent="♡";


}else{

await api(
`/likes/${encodeURIComponent(likeId)}`,
{
method:"PATCH",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

fields:{

postId:{
stringValue:id
},

userId:{
stringValue:uid
},

createdAt:{
timestampValue:
new Date().toISOString()
}

}

})

}
);


await changeLikeCount(
id,
1
);


let b =
document.getElementById(
"like_"+id
);


if(b)
b.textContent="♥";

}

}


/* =========================================
   LIKE COUNT
========================================= */

async function changeLikeCount(id,n){

let r =
await api(
`/posts/${encodeURIComponent(id)}`
);


if(!r || !r.ok)
return;


let d =
await r.json();


let f =
d.fields || {};


let count =
Number(
val(f.likes) || 0
) + n;


if(count<0)
count=0;


await api(
`/posts/${encodeURIComponent(id)}?updateMask.fieldPaths=likes`,
{
method:"PATCH",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

fields:{

likes:{
integerValue:String(count)
}

}

})

}
);


let c =
document.getElementById(
"count_"+id
);


if(c)
c.textContent =
count+" likes";

}


/* =========================================
   COMMENTS
========================================= */

async function loadComments(id){

let box =
document.getElementById(
"comments_"+id
);


let r =
await api(
"/comments?pageSize=300"
);


if(!r || !r.ok){

box.innerHTML="";

return;

}


let d =
await r.json();


let list =
(d.documents || [])
.filter(function(x){

return val(
x.fields?.postId
) === id;

})
.sort(function(a,b){

return String(
val(a.fields?.createdAt)
)
.localeCompare(
String(
val(b.fields?.createdAt)
)
);

});


if(!list.length){

box.innerHTML =
`
<div style="color:#777">
No comments yet.
</div>
`;

return;

}


box.innerHTML =
list.map(function(x){

let f =
x.fields || {};

let cid =
x.name.split("/").pop();


return `

<div class="comment">

<b>
${esc(
val(f.username) || "user"
)}
</b>

${esc(
val(f.text)
)}

${
val(f.userId) === uid

?

`<button
onclick="deleteComment(
'${cid}',
'${esc(id)}'
)">
Delete
</button>`

:

""
}

</div>

`;

}).join("");

}


/* =========================================
   SEND COMMENT
========================================= */

async function sendComment(id){

let input =
document.getElementById(
"input_"+id
);


let text =
input.value.trim();


if(!text)
return;


let p={};


try{

p =
JSON.parse(
localStorage.getItem(
"crockcell_profile"
) || "{}"
);

}catch(error){

p={};

}


await api(
"/comments",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

fields:{

postId:{
stringValue:id
},

userId:{
stringValue:uid
},

username:{
stringValue:
p.username ||
p.name ||
"user"
},

text:{
stringValue:text
},

createdAt:{
timestampValue:
new Date().toISOString()
}

}

})

}
);


input.value="";

loadComments(id);

}


/* =========================================
   DELETE COMMENT
========================================= */

async function deleteComment(cid,id){

let r =
await api(
`/comments/${encodeURIComponent(cid)}`
);


if(!r || !r.ok)
return;


let d =
await r.json();


if(
val(d.fields?.userId) !== uid
)
return;


await api(
`/comments/${encodeURIComponent(cid)}`,
{
method:"DELETE"
}
);


loadComments(id);

}


/* =========================================
   DELETE POST
========================================= */

async function deletePost(id){

if(
!confirm("Delete this post?")
)
return;


let r =
await api(
`/posts/${encodeURIComponent(id)}`
);


if(!r || !r.ok)
return;


let d =
await r.json();


if(
val(d.fields?.userId) !== uid
){

alert(
"You can delete only your own post."
);

return;

}


for(
let collection of
["likes","comments"]
){

let q =
await api(
`/${collection}?pageSize=300`
);


if(!q || !q.ok)
continue;


let data =
await q.json();


for(
let x of
data.documents || []
){

let f =
x.fields || {};


if(
val(f.postId) === id ||
val(f.reelId) === id
){

let cid =
x.name.split("/").pop();


await api(
`/${collection}/${encodeURIComponent(cid)}`,
{
method:"DELETE"
}
);

}

}

}


await api(
`/posts/${encodeURIComponent(id)}`,
{
method:"DELETE"
}
);


document
.getElementById(
"post_"+id
)
?.remove();

}


/* =========================================
   COMMENT FOCUS
========================================= */

function focusComment(id){

document
.getElementById(
"input_"+id
)
?.focus();

}


/* =========================================
   SHARE
========================================= */

async function sharePost(id){

let url =
location.origin +
location.pathname +
"?post=" +
encodeURIComponent(id);


try{

if(navigator.share){

await navigator.share({

title:"CROCKCELL",

url:url

});

}else{

await navigator.clipboard
.writeText(url);

alert(
"Post link copied"
);

}

}catch(error){}

}


/* =========================================
   PROFILE MENU
========================================= */

function toggleProfileMenu(){

let menu =
document.getElementById(
"profileMenu"
);

let overlay =
document.getElementById(
"menuOverlay"
);


let open =
menu.style.display === "block";


if(open){

closeProfileMenu();

}else{

menu.style.display="block";

overlay.style.display="block";

}

}


function closeProfileMenu(){

document.getElementById(
"profileMenu"
).style.display="none";


document.getElementById(
"menuOverlay"
).style.display="none";

}


/* =========================================
   LOGOUT
========================================= */

function logout(){

/* CURRENT KEYS */

localStorage.removeItem(
"crockcell_idToken"
);

localStorage.removeItem(
"crockcell_refreshToken"
);

localStorage.removeItem(
"crockcell_uid"
);

localStorage.removeItem(
"crockcell_profile"
);


/* OLD KEYS ALSO CLEAR */

localStorage.removeItem(
"crockcellIdToken"
);

localStorage.removeItem(
"crockcellRefreshToken"
);

localStorage.removeItem(
"crockcellUid"
);

localStorage.removeItem(
"crockcellProfile"
);


location.href =
"index.html";

}


/* =========================================
   START
========================================= */

async function start(){

console.log(
"CROCKCELL HOME START"
);

console.log(
"UID:",
uid
);

console.log(
"Token exists:",
!!token
);


/* NO LOGIN DATA */

if(!token || !uid){

location.href =
"index.html";

return;

}


/* TRY TOKEN REFRESH */

if(refreshToken){

const refreshed =
await refresh();

console.log(
"Token refresh:",
refreshed
);

}


/* LOAD CURRENT USER */

await profile();


/* LOAD FEED */

await posts();

}


/* START APP */

start();
