<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home - CROCKCELL</title><link rel="stylesheet" href="style.css">
</head><body><main class="app">
<header class="topbar"><div class="brand">CROCKCELL</div><button class="iconbtn" id="logout">Logout</button></header>
<div id="feed" class="stack"></div>
</main>
<nav class="nav"><div class="navinner">
<a class="active" href="home.html"><span>⌂</span>Home</a>
<a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a>
<a href="messages.html"><span>✉</span>Messages</a><a href="profile.html"><span>●</span>Profile</a>
</div></nav>
<script src="core.js"></script><script>
const feed=document.getElementById("feed");
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){
 const r=await CrockCell.request("posts?pageSize=100"); const d=await r.json().catch(()=>({}));
 const docs=d.documents||[]; docs.sort((a,b)=>(b.fields?.createdAt?.stringValue||"").localeCompare(a.fields?.createdAt?.stringValue||""));
 feed.innerHTML=docs.length?"":"<div class='empty'>Abhi koi post nahi hai.</div>";
 docs.forEach(doc=>{
  const f=doc.fields||{}, img=f.image?.stringValue||f.photoURL?.stringValue||"";
  const user=f.username?.stringValue||"User", cap=f.caption?.stringValue||"";
  if(!img)return;
  feed.insertAdjacentHTML("beforeend",`<article class="post"><div class="postbody row"><div class="avatar" style="background:#222"></div><b>${esc(user)}</b></div><img src="${img}" alt="Post"><div class="postbody"><div>${esc(cap)}</div><div class="muted" style="margin-top:8px">♡ ${f.likes?.integerValue||0} likes</div></div></article>`);
 });
}
document.getElementById("logout").onclick=()=>CrockCell.logout();load();
</script></body></html>
