<body>

<div class="header">

<div class="logo">
CROCKCELL
</div>

Log out

</div>


<div class="profile">

<div class="circle" id="profileCircle">
U
</div>

<div class="info">

<b id="profileName">
User
</b>

<span id="profileEmail">
Account
</span>

</div>

</div>


<div id="posts">

<div class="message">
Loading posts...
</div>

</div>


<div class="nav">

<a href="home.html">
<div>⌂</div>
Home
</a>

<a href="search.html">
<div>⌕</div>
Search
</a>

<a href="create.html">
<div>＋</div>
Create
</a>

<a href="activity.html">
<div>♡</div>
Activity
</a>

<div>●</div>
Profile
</a>

<script>

const PROJECT_ID = "crockcell-cd2e6";

const token =
localStorage.getItem("crockcellIdToken");

const uid =
localStorage.getItem("crockcellUid");


if(!token || !uid){

window.location.replace("index.html");

}


/* FIRESTORE VALUE */

function readValue(field){

if(!field){
return "";
}

if(field.stringValue !== undefined){
return field.stringValue;
}

if(field.integerValue !== undefined){
return Number(field.integerValue);
}

if(field.doubleValue !== undefined){
return Number(field.doubleValue);
}

if(field.booleanValue !== undefined){
return field.booleanValue;
}

if(field.timestampValue !== undefined){
return field.timestampValue;
}

return "";

}


/* SAFE TEXT */

function safeText(value){

const div =
document.createElement("div");

div.textContent =
value == null ? "" : String(value);

return div.innerHTML;

}


/* PROFILE */

async function loadProfile(){

try{

const url =
"https://firestore.googleapis.com/v1/projects/"
+ PROJECT_ID
+ "/databases/(default)/documents/users/"
+ encodeURIComponent(uid);

const response =
await fetch(url,{
headers:{
"Authorization":"Bearer "+token
}
});

if(!response.ok){
return;
}

const data =
await response.json();

const fields =
data.fields || {};

const name =
readValue(fields.name) || "User";

const username =
readValue(fields.username) || "";

const email =
readValue(fields.email) || "";

document.getElementById("profileName").innerText =
username ? "@"+username : name;

document.getElementById("profileEmail").innerText =
email;

document.getElementById("profileCircle").innerText =
(username || name || "U").charAt(0).toUpperCase();

}catch(error){

console.log("PROFILE ERROR:",error);

}

}


/* LOAD POSTS */

async function loadPosts(){

const box =
document.getElementById("posts");

box.innerHTML = `
<div class="message">
Loading posts...
</div>
`;

try{

const url =
"https://firestore.googleapis.com/v1/projects/"
+ PROJECT_ID
+ "/databases/(default)/documents/posts?pageSize=50";

const response =
await fetch(url,{
headers:{
"Authorization":"Bearer "+token
}
});

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error?.message || "Posts error"
);

}

const documents =
data.documents || [];

box.innerHTML = "";

if(documents.length === 0){

box.innerHTML = `
<div class="message">
No posts yet.
</div>
`;

return;

}


/* NEWEST FIRST */

documents.sort(function(a,b){

const aDate =
readValue(a.fields?.createdAt) || "";

const bDate =
readValue(b.fields?.createdAt) || "";

return String(bDate).localeCompare(String(aDate));

});


for(const item of documents){

renderPost(item);

}

}catch(error){

console.log("POST ERROR:",error);

box.innerHTML = `
<div class="error">
<b>Posts load nahi hui.</b>
<br><br>
${safeText(error.message)}
</div>
`;

}

}


/* RENDER POST */

function renderPost(item){

const fields =
item.fields || {};

const fullName =
item.name || "";

const postId =
fullName.split("/").pop();

const username =
readValue(fields.username) || "user";

const caption =
readValue(fields.caption) || "";

const image =
readValue(fields.image) || "";

const likes =
Number(readValue(fields.likes) || 0);

const postUserId =
readValue(fields.userId) || "";

const isOwner =
postUserId === uid;


const post =
document.createElement("div");

post.className = "post";

post.innerHTML = `

<div class="postTop">

<div class="circle">
${safeText(
String(username).charAt(0).toUpperCase()
)}
</div>

<div class="postUser">
@${safeText(username)}
</div>

${
isOwner
?
`
<button
class="deletePost"
onclick="deletePost('${safeText(postId)}')">
Delete
</button>
`
:
""
}

</div>


${
image
?
`
<img
class="postImage"
src="${image}">
`
:
""
}


<div class="postBody">

<div class="actions">

<button
class="likeButton"
data-post-id="${safeText(postId)}"
onclick="likePost(this)">
♡
</button>

<button
onclick="focusComment('${safeText(postId)}')">
💬
</button>

<button onclick="sharePost()">
↗
</button>

</div>


<div
class="likes"
id="likes-${safeText(postId)}">
${likes} likes
</div>


<div
class="commentCount"
id="commentCount-${safeText(postId)}">
Comments: 0
</div>


<div class="caption">

<b>
@${safeText(username)}
</b>

${safeText(caption)}

</div>


<div class="commentSection">

<div id="comments-${safeText(postId)}">

<div class="loadingComments">
Loading comments...
</div>

</div>


<div class="commentForm">

<input
id="input-${safeText(postId)}"
class="commentInput"
placeholder="Write a comment..."
maxlength="300">

<button
class="commentButton"
onclick="sendComment('${safeText(postId)}')">
Send
</button>

</div>

</div>

</div>
`;

document.getElementById("posts").appendChild(post);

checkLike(postId);

loadComments(postId);

}


/* CHECK LIKE */

async function checkLike(postId){

try{

const likeId =
postId + "_" + uid;

const url =
"https://firestore.googleapis.com/v1/projects/"
+ PROJECT_ID
+ "/databases/(default)/documents/likes/"
+ encodeURIComponent(likeId);

const response =
await fetch(url,{
headers:{
"Authorization":"Bearer "+token
}
});

const button =
document.querySelector(
'[data-post-id="'+CSS.escape(postId)+'"]'
);

if(button && response.ok){

button.innerText = "♥";

button.setAttribute(
"data-liked",
"true"
);

}else if(button){

button.setAttribute(
"data-liked",
"false"
);

}

}catch(error){

console.log("LIKE CHECK ERROR:",error);

}

}


/* LIKE */

async function likePost(button){

const postId =
button.getAttribute("data-post-id");

const liked =
button.getAttribute("data-liked") === "true";

if(button.disabled){
return;
}

button.disabled = true;

try{

const likeId =
postId + "_" + uid;

const url =
"https://firestore.googleapis.com/v1/projects/"
+ PROJECT_ID
+ "/databases/(default)/documents/likes/"
+ encodeURIComponent(likeId);


if(liked){

const response =
await fetch(url,{
method:"DELETE",
headers:{
"Authorization":"Bearer "+token
}
});

if(!response.ok){
throw new Error("Unlike failed");
}

button.innerText = "♡";

button.setAttribute(
"data-liked",
"false"
);

await changeLikeCount(postId,-1);

}else{

const response =
await fetch(url,{
method:"PATCH",

headers:{
"Authorization":"Bearer "+token,
"Content-Type":"application/json"
},

body:JSON.stringify({

fields:{

postId:{
stringValue:postId
},

userId:{
stringValue:uid
},

createdAt:{
timestampValue:new Date().toISOString()
}

}

})

});

if(!response.ok){

const data =
await response.json();

throw new Error(
data.error?.message || "Like failed"
);

}

button.innerText = "♥";

button.setAttribute(
"data-liked",
"true"
);

await changeLikeCount(postId,1);

}

}catch(error){

alert(
"Like save nahi hua: "+error.message
);

}finally{

button.disabled = false;

}

}


/* LIKE COUNT */

async function changeLikeCount(postId,change){

try{

const url =
"https://firestore.googleapis.com/v1/projects/"
+ PROJECT_ID
+ "/databases/(default)/documents/posts/"
+ encodeURIComponent(postId);

const response =
await fetch(url,{
headers:{
"Authorization":"Bearer "+token
}
});

const data =
await response.json();

if(!response.ok){
throw new Error("Post update failed");
}

let likes =
Number(readValue(data.fields?.likes) || 0);

likes += change;

if(likes < 0){
likes = 0;
}

const updateUrl =
url + "?updateMask.fieldPaths=likes";

await fetch(updateUrl,{
method:"PATCH",

headers:{
"Authorization":"Bearer "+token,
"Content-Type":"application/json"
},

body:JSON.stringify({

fields:{
likes:{
integerValue:likes
}
}

})

});

const box =
document.getElementById("likes-"+postId);

if(box){

box.innerText =
likes+" likes";

}

}catch(error){

console.log(
"LIKE COUNT ERROR:",
error
);

}

}


/* LOAD COMMENTS */

async function loadComments(postId){

const box =
document.getElementById(
"comments-"+postId
);

if(!box){
return;
}

try{

const url =
"https://firestore.googleapis.com/v1/projects/"
+ PROJECT_ID
+ "/databases/(default)/documents/comments?pageSize=50";

const response =
await fetch(url,{
headers:{
"Authorization":"Bearer "+token
}
});

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error?.message || "Comments error"
);

}

let comments =
data.documents || [];

comments =
comments.filter(function(item){

return readValue(
item.fields?.postId
) === postId;

});


comments.sort(function(a,b){

const aDate =
readValue(a.fields?.createdAt) || "";

const bDate =
readValue(b.fields?.createdAt) || "";

return String(aDate).localeCompare(String(bDate));

});


const countBox =
document.getElementById(
"commentCount-"+postId
);

if(countBox){

countBox.innerText =
"Comments: "+comments.length;

}

box.innerHTML = "";


if(comments.length === 0){

box.innerHTML = `
<div class="loadingComments">
No comments yet.
</div>
`;

return;

}


comments.forEach(function(item){

const fields =
item.fields || {};

const username =
readValue(fields.username) || "user";

const text =
readValue(fields.text) || "";

const commentUserId =
readValue(fields.userId) || "";

const fullCommentName =
item.name || "";

const commentId =
fullCommentName.split("/").pop();

const div =
document.createElement("div");

div.className = "comment";

let deleteButton = "";

if(commentUserId === uid){

deleteButton = `
<button
class="deleteComment"
onclick="deleteComment('${safeText(commentId)}','${safeText(postId)}')">
Delete
</button>
`;

}

div.innerHTML = `

<div class="commentText">

<b>
@${safeText(username)}
</b>

${safeText(text)}

</div>

${deleteButton}

`;

box.appendChild(div);

});


}catch(error){

console.log(
"COMMENT ERROR:",
error
);

box.innerHTML = `
<div class="loadingComments">
No comments yet.
</div>
`;

}

}


/* SEND COMMENT */

async function sendComment(postId){

const input =
document.getElementById(
"input-"+postId
);

if(!input){
return;
}

const text =
input.value.trim();

if(!text){

alert("Comment likho.");

return;

}

const button =
input.parentElement.querySelector("button");

button.disabled = true;

try{

const profileUrl =
"https://firestore.googleapis.com/v1/projects/"
+ PROJECT_ID
+ "/databases/(default)/documents/users/"
+ encodeURIComponent(uid);

const profileResponse =
await fetch(profileUrl,{
headers:{
"Authorization":"Bearer "+token
}
});

const profileData =
await profileResponse.json();

let username = "User";

if(profileResponse.ok){

username =
readValue(
profileData.fields?.username
) || "User";

}


const url =
"https://firestore.googleapis.com/v1/projects/"
+ PROJECT_ID
+ "/databases/(default)/documents/comments";

const response =
await fetch(url,{
method:"POST",

headers:{
"Authorization":"Bearer "+token,
"Content-Type":"application/json"
},

body:JSON.stringify({

fields:{

postId:{
stringValue:postId
},

userId:{
stringValue:uid
},

username:{
stringValue:username
},

text:{
stringValue:text
},

createdAt:{
timestampValue:new Date().toISOString()
}

}

})

});

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error?.message ||
"Comment save failed"
);

}

input.value = "";

await loadComments(postId);

}catch(error){

alert(
"Comment save nahi hua: "+error.message
);

}finally{

button.disabled = false;

}

}


/* DELETE COMMENT */

async function deleteComment(commentId,postId){

if(!confirm(
"Kya aap ye comment delete karna chahte ho?"
)){

return;

}

try{

const url =
"https://firestore.googleapis.com/v1/projects/"
+ PROJECT_ID
+ "/databases/(default)/documents/comments/"
+ encodeURIComponent(commentId);

const response =
await fetch(url,{
method:"DELETE",
headers:{
"Authorization":"Bearer "+token
}
});

if(!response.ok){

const data =
await response.json();

throw new Error(
data.error?.message || "Delete failed"
);

}

await loadComments(postId);

}catch(error){

alert(
"Comment delete nahi hua: "+error.message
);

}

}


/* DELETE ALL MATCHING DOCUMENTS */

async function deleteRelatedDocuments(
collection,
postId
){

const url =
"https://firestore.googleapis.com/v1/projects/"
+ PROJECT_ID
+ "/databases/(default)/documents/"
+ collection
+ "?pageSize=300";

const response =
await fetch(url,{
headers:{
"Authorization":"Bearer "+token
}
});

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error?.message ||
(collection+" load failed")
);

}

const documents =
data.documents || [];


for(const item of documents){

const itemPostId =
readValue(item.fields?.postId) || "";

if(itemPostId !== postId){
continue;
}

if(!item.name){
continue;
}


/* DELETE RELATED DOCUMENT */

const deleteResponse =
await fetch(
"https://firestore.googleapis.com/v1/"
+ item.name,
{
method:"DELETE",
headers:{
"Authorization":"Bearer "+token
}
}
);

if(!deleteResponse.ok){

const deleteData =
await deleteResponse.json();

throw new Error(
deleteData.error?.message ||
("Unable to delete "+collection)
);

}

}

}


/* DELETE POST */

async function deletePost(postId){

if(!confirm(
"Post ke saare likes aur comments bhi delete ho jayenge. Kya delete karna hai?"
)){

return;

}

try{

/* FIRST CHECK POST */

const postUrl =
"https://firestore.googleapis.com/v1/projects/"
+ PROJECT_ID
+ "/databases/(default)/documents/posts/"
+ encodeURIComponent(postId);

const postResponse =
await fetch(postUrl,{
headers:{
"Authorization":"Bearer "+token
}
});

const postData =
await postResponse.json();

if(!postResponse.ok){

throw new Error(
postData.error?.message ||
"Post nahi mili."
);

}


/* OWNER CHECK */

const ownerId =
readValue(postData.fields?.userId) || "";

if(ownerId !== uid){

throw new Error(
"Sirf post owner hi post delete kar sakta hai."
);

}


/* DELETE LIKES */

await deleteRelatedDocuments(
"likes",
postId
);


/* DELETE COMMENTS */

await deleteRelatedDocuments(
"comments",
postId
);


/* DELETE POST */

const deletePostResponse =
await fetch(postUrl,{
method:"DELETE",

headers:{
"Authorization":"Bearer "+token
}
});

if(!deletePostResponse.ok){

const deleteData =
await deletePostResponse.json();

throw new Error(
deleteData.error?.message ||
"Post delete failed"
);

}


/* REMOVE LOCAL COPY */

try{

const localPosts =
JSON.parse(
localStorage.getItem(
"crockcellPosts"
) || "[]"
);

const remaining =
localPosts.filter(function(post){

const localId =
post.id ||
post.postId ||
"";

return String(localId) !== String(postId);

});

localStorage.setItem(
"crockcellPosts",
JSON.stringify(remaining)
);

}catch(error){

console.log(
"LOCAL DELETE ERROR:",
error
);

}


/* RELOAD POSTS */

await loadPosts();

}catch(error){

console.log(
"DELETE POST ERROR:",
error
);

alert(
"Post delete nahi hui: "+error.message
);

}

}


/* FOCUS COMMENT */

function focusComment(postId){

const input =
document.getElementById(
"input-"+postId
);

if(input){

input.focus();

input.scrollIntoView({
behavior:"smooth",
block:"center"
});

}

}


/* SHARE */

function sharePost(){

alert(
"Share system baad me add karenge."
);

}


/* LOGOUT */

function logout(){

localStorage.removeItem(
"crockcellIdToken"
);

localStorage.removeItem(
"crockcellUid"
);

localStorage.removeItem(
"crockcellProfile"
);

window.location.replace(
"index.html"
);

}


/* START */

loadProfile();
loadPosts();

</script>
