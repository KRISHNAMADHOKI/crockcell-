<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CROCKCELL Reels</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#reelsContainer{
  width:100%;
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}

.reel{
  position:relative;
  width:100%;
  height:100vh;
  scroll-snap-align:start;
  background:#000;
  overflow:hidden;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.topBar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:70px;
  padding:12px;
  z-index:20;
}

.backBtn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.5);
  color:#fff;
  font-size:28px;
}

.actions{
  position:absolute;
  right:12px;
  bottom:100px;
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.actionBox{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.actionBtn{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.5);
  color:#fff;
  font-size:25px;
}

.actionCount{
  font-size:13px;
}

.soundBtn{
  position:absolute;
  top:75px;
  right:15px;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:#fff;
  font-size:20px;
  z-index:25;
  display:none;
}

.pauseIcon{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:30px;
  z-index:15;
}

.reelInfo{
  position:absolute;
  left:15px;
  right:80px;
  bottom:22px;
  z-index:20;
  text-shadow:0 1px 5px #000;
}

.username{
  font-size:18px;
  font-weight:bold;
  margin-bottom:7px;
}

.caption{
  font-size:15px;
}

/* COMMENTS */

#commentsOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  display:none;
}

.commentsPanel{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:70vh;
  background:#111;
  border-radius:22px 22px 0 0;
  display:flex;
  flex-direction:column;
}

.commentsHeader{
  height:60px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #333;
}

.commentsTitle{
  font-size:18px;
  font-weight:bold;
}

.closeBtn{
  border:0;
  background:none;
  color:#fff;
  font-size:28px;
}

.commentsList{
  flex:1;
  overflow-y:auto;
  padding:10px 15px;
}

.commentItem{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #292929;
}

.avatar{
  width:38px;
  height:38px;
  flex-shrink:0;
  border-radius:50%;
  background:#333;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

.commentBody{
  flex:1;
}

.commentUser{
  font-weight:bold;
  font-size:14px;
  margin-bottom:4px;
}

.commentText{
  font-size:14px;
  color:#ddd;
  word-break:break-word;
}

.deleteComment{
  margin-top:6px;
  padding:0;
  border:0;
  background:none;
  color:#ff5555;
  font-size:12px;
}

.noComments{
  text-align:center;
  color:#aaa;
  padding:35px 10px;
}

.commentInputArea{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #333;
}

#commentInput{
  flex:1;
  height:44px;
  border-radius:22px;
  border:1px solid #444;
  background:#222;
  color:#fff;
  padding:0 16px;
  outline:none;
}

#sendComment{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  font-size:18px;
}
</style>
</head>

<body>

<div id="reelsContainer">

<!-- REEL 1 -->
<div class="reel" data-reel-id="demo_reel_1">

<video
src="https://www.w3schools.com/html/mov_bbb.mp4"
loop
playsinline
preload="auto"></video>

<button class="soundBtn" onclick="toggleSound(this,event)">🔊</button>

<div class="pauseIcon">▶</div>

<div class="topBar">
<button class="backBtn" onclick="goBack()">‹</button>
</div>

<div class="actions">

<div class="actionBox">
<button class="actionBtn likeBtn" onclick="likeReel(this,event)">♡</button>
<span class="actionCount likeCount">0</span>
</div>

<div class="actionBox">
<button class="actionBtn" onclick="openComments(this,event)">💬</button>
<span class="actionCount commentCount">0</span>
</div>

<div class="actionBox">
<button class="actionBtn" onclick="shareReel(this,event)">↗</button>
<span class="actionCount">Share</span>
</div>

</div>

<div class="reelInfo">
<div class="username">@CROCKCELL</div>
<div class="caption">Welcome to CROCKCELL Reels</div>
</div>

</div>


<!-- REEL 2 -->
<div class="reel" data-reel-id="demo_reel_2">

<video
src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
loop
playsinline
preload="auto"></video>

<button class="soundBtn" onclick="toggleSound(this,event)">🔊</button>

<div class="pauseIcon">▶</div>

<div class="topBar">
<button class="backBtn" onclick="goBack()">‹</button>
</div>

<div class="actions">

<div class="actionBox">
<button class="actionBtn likeBtn" onclick="likeReel(this,event)">♡</button>
<span class="actionCount likeCount">0</span>
</div>

<div class="actionBox">
<button class="actionBtn" onclick="openComments(this,event)">💬</button>
<span class="actionCount commentCount">0</span>
</div>

<div class="actionBox">
<button class="actionBtn" onclick="shareReel(this,event)">↗</button>
<span class="actionCount">Share</span>
</div>

</div>

<div class="reelInfo">
<div class="username">@CROCKCELL</div>
<div class="caption">Enjoy the reels experience</div>
</div>

</div>

</div>


<!-- COMMENTS PANEL -->

<div id="commentsOverlay">

<div class="commentsPanel">

<div class="commentsHeader">
<div class="commentsTitle">
Comments <span id="commentsNumber">(0)</span>
</div>

<button class="closeBtn" onclick="closeComments()">×</button>
</div>

<div id="commentsList" class="commentsList">
<div class="noComments">Loading...</div>
</div>

<div class="commentInputArea">

<input
id="commentInput"
type="text"
maxlength="300"
placeholder="Write a comment...">

<button
id="sendComment"
onclick="sendComment()">➤</button>

</div>

</div>

</div>


<script>

/* FIREBASE */

const PROJECT_ID = "crockcell-cd2e6";

const token =
localStorage.getItem("crockcellIdToken");

const uid =
localStorage.getItem("crockcellUid");

if(!token || !uid){
  window.location.href="index.html";
}


/* CURRENT REEL */

let currentReelId = "";


/* FIRESTORE URL */

function collectionUrl(collection){

return "https://firestore.googleapis.com/v1/projects/"
+ PROJECT_ID
+ "/databases/(default)/documents/"
+ collection;

}


/* READ FIRESTORE VALUE */

function readValue(field){

if(!field) return "";

if(field.stringValue !== undefined)
return field.stringValue;

if(field.integerValue !== undefined)
return Number(field.integerValue);

if(field.timestampValue !== undefined)
return field.timestampValue;

if(field.booleanValue !== undefined)
return field.booleanValue;

return "";

}


/* SAFE TEXT */

function safeText(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* BACK */

function goBack(){

if(history.length > 1){
history.back();
}else{
window.location.href="home.html";
}

}


/* VIDEO SYSTEM */

const reels =
document.querySelectorAll(".reel");


reels.forEach(function(reel){

const video =
reel.querySelector("video");

const soundBtn =
reel.querySelector(".soundBtn");

const pauseIcon =
reel.querySelector(".pauseIcon");


video.addEventListener("click",function(){

if(video.paused){

video.play().catch(function(error){
console.log("PLAY ERROR",error);
});

}else{

video.pause();

}

});


video.addEventListener("play",function(){

soundBtn.style.display="none";
pauseIcon.style.display="none";

});


video.addEventListener("pause",function(){

soundBtn.style.display="block";
pauseIcon.style.display="flex";

});

});


/* SOUND */

function toggleSound(button,event){

event.stopPropagation();

const reel =
button.closest(".reel");

const video =
reel.querySelector("video");

if(video.muted){

video.muted=false;
video.volume=1;
button.innerText="🔊";

}else{

video.muted=true;
button.innerText="🔇";

}

}


/* AUTO PLAY */

const observer =
new IntersectionObserver(function(entries){

entries.forEach(function(entry){

const reel =
entry.target;

const video =
reel.querySelector("video");

if(entry.isIntersecting){

video.play().catch(function(error){
console.log("AUTOPLAY ERROR",error);
});

}else{

video.pause();

}

});

},{
threshold:0.7
});


reels.forEach(function(reel){
observer.observe(reel);
});


/* LIKE */

async function likeReel(button,event){

event.stopPropagation();

const reel =
button.closest(".reel");

const reelId =
reel.dataset.reelId;

const likeId =
reelId+"_"+uid;

const url =
collectionUrl("reelLikes")
+"/"+encodeURIComponent(likeId);

try{

const check =
await fetch(url,{
headers:{
"Authorization":"Bearer "+token
}
});


if(check.ok){

await fetch(url,{
method:"DELETE",
headers:{
"Authorization":"Bearer "+token
}
});

button.innerText="♡";

}else{

await fetch(url,{
method:"PATCH",
headers:{
"Authorization":"Bearer "+token,
"Content-Type":"application/json"
},
body:JSON.stringify({
fields:{
reelId:{stringValue:reelId},
userId:{stringValue:uid},
createdAt:{
timestampValue:new Date().toISOString()
}
}
})
});

button.innerText="♥";

}

await loadLikeCount(reelId,reel);

}catch(error){

console.log("LIKE ERROR",error);

}

}


/* LIKE COUNT */

async function loadLikeCount(reelId,reel){

try{

const response =
await fetch(
collectionUrl("reelLikes")+"?pageSize=300",
{
headers:{
"Authorization":"Bearer "+token
}
});

const data =
await response.json();

let count=0;

(data.documents || []).forEach(function(doc){

const fields =
doc.fields || {};

if(
readValue(fields.reelId) === reelId
){

count++;

}

});

reel.querySelector(".likeCount").innerText=count;

}catch(error){

console.log("LIKE COUNT ERROR",error);

}

}


/* CHECK LIKE */

async function checkLike(reel){

const reelId =
reel.dataset.reelId;

const likeId =
reelId+"_"+uid;

try{

const response =
await fetch(
collectionUrl("reelLikes")
+"/"+encodeURIComponent(likeId),
{
headers:{
"Authorization":"Bearer "+token
}
});

if(response.ok){

reel.querySelector(".likeBtn").innerText="♥";

}

}catch(error){

console.log(error);

}

}


/* COMMENTS OPEN */

async function openComments(button,event){

event.stopPropagation();

const reel =
button.closest(".reel");

currentReelId =
reel.dataset.reelId;

document.getElementById(
"commentsOverlay"
).style.display="block";

document.getElementById(
"commentsList"
).innerHTML=
'<div class="noComments">Loading comments...</div>';

await loadComments();

document.getElementById(
"commentInput"
).focus();

}


/* CLOSE COMMENTS */

function closeComments(){

document.getElementById(
"commentsOverlay"
).style.display="none";

currentReelId="";

}


/* LOAD COMMENTS */

async function loadComments(){

try{

const response =
await fetch(
collectionUrl("comments")+"?pageSize=300",
{
headers:{
"Authorization":"Bearer "+token
}
});

const data =
await response.json();

if(!response.ok){
throw new Error("Comments load failed");
}

let comments=[];

(data.documents || []).forEach(function(doc){

const fields =
doc.fields || {};

if(
readValue(fields.reelId) ===
currentReelId
){

comments.push({

id:doc.name.split("/").pop(),

userId:readValue(fields.userId),

username:readValue(fields.username),

text:readValue(fields.text),

createdAt:readValue(fields.createdAt)

});

}

});


comments.sort(function(a,b){

return new Date(a.createdAt || 0)
-
new Date(b.createdAt || 0);

});


renderComments(comments);


const reel =
document.querySelector(
'.reel[data-reel-id="'+currentReelId+'"]'
);

if(reel){

reel.querySelector(
".commentCount"
).innerText=comments.length;

}

}catch(error){

console.log("COMMENTS ERROR",error);

document.getElementById(
"commentsList"
).innerHTML=
'<div class="noComments">Comments load nahi hue.</div>';

}

}


/* RENDER COMMENTS */

function renderComments(comments){

const list =
document.getElementById("commentsList");

document.getElementById(
"commentsNumber"
).innerText=
"("+comments.length+")";


if(comments.length===0){

list.innerHTML=
'<div class="noComments">Abhi koi comment nahi hai.<br>Pehla comment karo!</div>';

return;

}


let html="";


comments.forEach(function(comment){

const username =
comment.username || "User";

const first =
username.charAt(0).toUpperCase();


html += `

<div class="commentItem">

<div class="avatar">
${safeText(first)}
</div>

<div class="commentBody">

<div class="commentUser">
@${safeText(username)}
</div>

<div class="commentText">
${safeText(comment.text)}
</div>

${
comment.userId === uid
?
`
<button
class="deleteComment"
onclick="deleteComment('${safeText(comment.id)}')">
Delete
</button>
`
:
""
}

</div>

</div>

`;

});


list.innerHTML=html;

}


/* SEND COMMENT */

async function sendComment(){

const input =
document.getElementById("commentInput");

const text =
input.value.trim();

if(!text || !currentReelId)
return;


const button =
document.getElementById("sendComment");

button.disabled=true;


try{

let username="User";


const profileResponse =
await fetch(
collectionUrl("users")+
"/"+
encodeURIComponent(uid),
{
headers:{
"Authorization":"Bearer "+token
}
});


if(profileResponse.ok){

const profile =
await profileResponse.json();

username =
readValue(profile.fields?.username)
||
readValue(profile.fields?.name)
||
"User";

}


const response =
await fetch(
collectionUrl("comments"),
{
method:"POST",

headers:{
"Authorization":"Bearer "+token,
"Content-Type":"application/json"
},

body:JSON.stringify({

fields:{

reelId:{
stringValue:currentReelId
},

userId:{
stringValue:uid
},

username:{
stringValue:username
},

text:{
stringValue:text
},

createdAt:{
timestampValue:new Date().toISOString()
}

}

})

});


if(!response.ok){

const error =
await response.json();

throw new Error(
error.error?.message ||
"Comment failed"
);

}


input.value="";

await loadComments();


}catch(error){

alert(
"Comment nahi hua: "+
error.message
);

}finally{

button.disabled=false;

}

}


/* DELETE COMMENT */

async function deleteComment(commentId){

if(
!confirm("Kya ye comment delete karna hai?")
)
return;


try{

const response =
await fetch(
collectionUrl("comments")+
"/"+
encodeURIComponent(commentId),
{
method:"DELETE",
headers:{
"Authorization":"Bearer "+token
}
});


if(!response.ok){

throw new Error(
"Comment delete failed"
);

}


await loadComments();


}catch(error){

alert(
"Comment delete nahi hua."
);

}

}


/* SHARE */

function shareReel(button,event){

event.stopPropagation();

const reel =
button.closest(".reel");

const url =
window.location.href;

if(navigator.share){

navigator.share({

title:"CROCKCELL Reel",

text:"Check this reel on CROCKCELL",

url:url

}).catch(function(error){

console.log(error);

});

}else{

alert(
"Share option is available on supported devices."
);

}

}


/* ENTER TO SEND */

document.getElementById(
"commentInput"
).addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

event.preventDefault();

sendComment();

}

});


/* LOAD DATA */

reels.forEach(async function(reel){

await checkLike(reel);

await loadLikeCount(
reel.dataset.reelId,
reel
);

});


</script>

</body>
</html>
