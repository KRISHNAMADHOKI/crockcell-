<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;

html,
body{
margin:0;

#reelsContainer{

.topBar{

left:0;
right:0;

/* NAVIGATION */

.bottomNav{

left:10px;

right:10px;

calc(8px + env(safe-area-inset-bottom));

z-index:5000;

1px solid rgba(255,255,255,.1);

}


.navItem.active{

.navIcon{

height:27px;

align-items:center;
justify-content:center;

margin-bottom:2px;

}


.profileNavPhoto{

width:27px;
height:27px;

object-fit:cover;

background:#333;

border:
2px solid rgba(255,255,255,.8);

}


/* COMMENTS */

#commentsOverlay{

position:fixed;

inset:0;

background:
rgba(0,0,0,.6);

z-index:10000;

display:none;

}


.commentsPanel{

position:absolute;

left:0;
right:0;
bottom:0;

height:70vh;

background:#111;

border-radius:
22px 22px 0 0;

display:flex;

flex-direction:column;

overflow:hidden;

}


.commentsHeader{

height:60px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 18px;

border-bottom:
1px solid #333;

}


.commentsTitle{

}


.closeBtn{

height:42px;

border:0;

}


.commentsList{

flex:1;

overflow-y:auto;

padding:10px 15px;

}


.commentItem{

display:flex;

gap:10px;

padding:12px 0;

border-bottom:
1px solid #292929;

}


.avatar{

width:38px;
height:38px;

flex-shrink:0;

border-radius:50%;

background:#333;

display:flex;

justify-content:center;

align-items:center;

font-weight:bold;

}


.commentBody{

flex:1;

min-width:0;

}


.commentUser{

font-weight:bold;

font-size:14px;

margin-bottom:4px;

}


.commentText{

font-size:14px;

color:#ddd;

word-break:break-word;

}


.deleteComment{

margin-top:6px;

padding:0;

border:0;

background:none;

font-size:12px;

}


.noComments{

text-align:center;

color:#aaa;

padding:35px 10px;

}


.commentInputArea{

display:flex;

gap:8px;

padding:12px;

border-top:
1px solid #333;

}


#commentInput{

flex:1;

min-width:0;

height:44px;

border-radius:22px;

border:1px solid #444;

background:#222;

color:#fff;

padding:0 16px;

outline:none;

font-size:14px;

}


#sendComment{

width:44px;
height:44px;

border:0;

border-radius:50%;

background:#fff;

color:#000;

font-size:18px;

}


@media(max-width:380px){

.bottomNav{

left:7px;
right:7px;

}

.navItem{

font-size:9px;

height:53px;

}

.actions{

right:9px;

bottom:108px;

}

.actionBtn{

width:46px;
height:46px;

}

.reelInfo{

bottom:88px;

}

}

<script>

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


let token =
localStorage.getItem(
"crockcell_idToken"
)
||
localStorage.getItem(
"crockcellIdToken"
);


let uid =
localStorage.getItem(
"crockcell_uid"
)
||
localStorage.getItem(
"crockcellUid"
);


if(!token || !uid){

location.replace(
"index.html"
);

}


function collectionUrl(
collection,
id=""
){

return `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/${collection}${id?"/"+encodeURIComponent(id):""}?key=${API_KEY}`;

}


function readValue(field){

if(!field)
return "";

if(field.stringValue!==undefined)
return field.stringValue;

if(field.integerValue!==undefined)
return Number(
field.integerValue
);

if(field.timestampValue!==undefined)
return field.timestampValue;

if(field.booleanValue!==undefined)
return field.booleanValue;

return "";

}


function safeText(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* PROFILE PHOTO */

async function loadProfilePhoto(){

const img =
document.getElementById(
"navProfilePhoto"
);

try{

let profile=null;

try{

profile =
JSON.parse(
localStorage.getItem(
"crockcell_profile"
)
||
localStorage.getItem(
"crockcellProfile"
)
||
"null"
);

}
catch(e){}


if(
profile &&
profile.photoURL
){

img.src =
profile.photoURL;

return;

}


const response =
await fetch(
collectionUrl(
"users",
uid
),
{
headers:{
Authorization:
"Bearer "+token
}
}
);


if(!response.ok)
return;


const data =
await response.json();


const photo =
readValue(
data.fields?.photoURL
);


if(photo){

img.src=photo;

profile =
profile || {};

profile.uid=uid;

profile.photoURL=photo;


localStorage.setItem(
"crockcell_profile",
JSON.stringify(profile)
);

localStorage.setItem(
"crockcellProfile",
JSON.stringify(profile)
);

}

}
catch(error){

console.log(error);

}

}


loadProfilePhoto();


let currentReelId="";


const reels =
document.querySelectorAll(
".reel"
);


/* VIDEO */

reels.forEach(
reel=>{

const video =
reel.querySelector(
"video"
);

const sound =
reel.querySelector(
".soundBtn"
);

const pause =
reel.querySelector(
".pauseIcon"
);


video.addEventListener(
"click",
()=>{

if(video.paused){

video.play()
.catch(()=>{});

}
else{

video.pause();

}

});


video.addEventListener(
"play",
()=>{

sound.style.display="none";

pause.style.display="none";

});


video.addEventListener(
"pause",
()=>{

sound.style.display="flex";

pause.style.display="flex";

});


sound.addEventListener(
"click",
event=>{

event.stopPropagation();

video.muted =
!video.muted;

sound.textContent =
video.muted
?
"🔇"
:
"🔊";

});


reel.querySelector(
".likeBtn"
).addEventListener(
"click",
event=>
likeReel(
reel,
event
)
);


reel.querySelector(
".commentBtn"
).addEventListener(
"click",
event=>
openComments(
reel,
event
)
);


reel.querySelector(
".shareBtn"
).addEventListener(
"click",
event=>
shareReel(
reel,
event
)
);


checkLike(reel);

loadLikeCount(reel);

loadCommentCount(reel);

});


/* AUTO PLAY */

const observer =
new IntersectionObserver(
entries=>{

entries.forEach(
entry=>{

const video =
entry.target.querySelector(
"video"
);


if(entry.isIntersecting){

video.play()
.catch(()=>{});

}
else{

video.pause();

}

});

},
{
threshold:.7
}
);


reels.forEach(
reel=>
observer.observe(reel)
);


/* CHECK LIKE */

async function checkLike(
reel
){

try{

const id =
reel.dataset.reelId+
"_"+uid;


const response =
await fetch(
collectionUrl(
"reelLikes",
id
),
{
headers:{
Authorization:
"Bearer "+token
}
}
);


if(response.ok){

reel.querySelector(
".likeBtn"
).textContent="♥";

}

}
catch(error){}

}


/* LIKE COUNT */

async function loadLikeCount(
reel
){

try{

const response =
await fetch(
collectionUrl(
"reelLikes"
)+
"?pageSize=300",
{
headers:{
Authorization:
"Bearer "+token
}
}
);


const data =
await response.json();

let count=0;


(data.documents || [])
.forEach(
doc=>{

if(
readValue(
doc.fields?.reelId
)
===
reel.dataset.reelId
){

count++;

}

});


reel.querySelector(
".likeCount"
).textContent=count;

}
catch(error){}

}


/* LIKE */

async function likeReel(
reel,
event
){

event.stopPropagation();


const id =
reel.dataset.reelId+
"_"+uid;


const url =
collectionUrl(
"reelLikes",
id
);


const button =
reel.querySelector(
".likeBtn"
);


try{

const check =
await fetch(
url,
{
headers:{
Authorization:
"Bearer "+token
}
}
);


if(check.ok){

await fetch(
url,
{
method:"DELETE",

headers:{
Authorization:
"Bearer "+token
}
}
);

button.textContent="♡";

}
else{

await fetch(
url,
{
method:"PATCH",

headers:{
"Content-Type":
"application/json",

Authorization:
"Bearer "+token
},

body:JSON.stringify({

fields:{

reelId:{
stringValue:
reel.dataset.reelId
},

userId:{
stringValue:uid
},

createdAt:{
timestampValue:
new Date().toISOString()
}

}

})

}
);

button.textContent="♥";

}


loadLikeCount(reel);

}
catch(error){

console.log(error);

}

}


/* COMMENT COUNT */

async function loadCommentCount(
reel
){

try{

const response =
await fetch(
collectionUrl(
"comments"
)+
"?pageSize=300",
{
headers:{
Authorization:
"Bearer "+token
}
}
);


const data =
await response.json();

let count=0;


(data.documents || [])
.forEach(
doc=>{

if(
readValue(
doc.fields?.reelId
)
===
reel.dataset.reelId
){

count++;

}

});


reel.querySelector(
".commentCount"
).textContent=count;

}
catch(error){}

}


/* OPEN COMMENTS */

async function openComments(
reel,
event
){

event.stopPropagation();

currentReelId =
reel.dataset.reelId;


document.getElementById(
"commentsOverlay"
).style.display="block";


document.getElementById(
"commentsList"
).innerHTML=
'<div class="noComments">Loading comments...</div>';


await loadComments();


document.getElementById(
"commentInput"
).focus();

}


function closeComments(){

document.getElementById(
"commentsOverlay"
).style.display="none";

currentReelId="";

}


document.getElementById(
"closeComments"
).onclick=
closeComments;


/* LOAD COMMENTS */

async function loadComments(){

try{

const response =
await fetch(
collectionUrl(
"comments"
)+
"?pageSize=300",
{
headers:{
Authorization:
"Bearer "+token
}
}
);


const data =
await response.json();


let comments=[];


(data.documents || [])
.forEach(
doc=>{

const fields =
doc.fields || {};


if(
readValue(
fields.reelId
)
===
currentReelId
){

comments.push({

id:
doc.name
.split("/")
.pop(),

userId:
readValue(
fields.userId
),

username:
readValue(
fields.username
) || "User",

text:
readValue(
fields.text
),

createdAt:
readValue(
fields.createdAt
)

});

}

});


comments.sort(
(a,b)=>
new Date(
a.createdAt || 0
)
-
new Date(
b.createdAt || 0
)
);


renderComments(
comments
);


const reel =
document.querySelector(
`.reel[data-reel-id="${currentReelId}"]`
);


if(reel){

reel.querySelector(
".commentCount"
).textContent =
comments.length;

}

}
catch(error){

document.getElementById(
"commentsList"
).innerHTML=
'<div class="noComments">Comments load nahi hue.</div>';

}

}


/* RENDER */

function renderComments(
comments
){

const list =
document.getElementById(
"commentsList"
);


document.getElementById(
"commentsNumber"
).textContent =
"("+comments.length+")";


if(!comments.length){

list.innerHTML=
'<div class="noComments">Abhi koi comment nahi hai.<br>Pehla comment karo!</div>';

return;

}


list.innerHTML =
comments.map(
comment=>`

<div class="commentItem">

<div class="avatar">

${safeText(
(comment.username || "U")
.charAt(0)
.toUpperCase()
)}

</div>


<div class="commentBody">

<div class="commentUser">

@${safeText(
comment.username
)}

</div>


<div class="commentText">

${safeText(
comment.text
)}

</div>


${
comment.userId===uid
?
`
<button
class="deleteComment"
data-id="${safeText(comment.id)}">

Delete

</button>
`
:
""
}

</div>

</div>

`
).join("");


list
.querySelectorAll(
".deleteComment"
)
.forEach(
button=>{

button.onclick=()=>
deleteComment(
button.dataset.id
);

});

}


/* SEND COMMENT */

async function sendComment(){

const input =
document.getElementById(
"commentInput"
);


const text =
input.value.trim();


if(
!text ||
!currentReelId
){

return;

}


const button =
document.getElementById(
"sendComment"
);


button.disabled=true;


try{

let username="User";


const profileResponse =
await fetch(
collectionUrl(
"users",
uid
),
{
headers:{
Authorization:
"Bearer "+token
}
}
);


if(profileResponse.ok){

const profile =
await profileResponse.json();


username =
readValue(
profile.fields?.username
)
||
readValue(
profile.fields?.name
)
||
"User";

}


const commentId =
uid+
"_"+Date.now()+
"_"+Math.random()
.toString(36)
.slice(2,7);


await fetch(
collectionUrl(
"comments",
commentId
),
{
method:"PATCH",

headers:{
"Content-Type":
"application/json",

Authorization:
"Bearer "+token
},

body:JSON.stringify({

fields:{

reelId:{
stringValue:
currentReelId
},

userId:{
stringValue:
uid
},

username:{
stringValue:
username
},

text:{
stringValue:
text
},

createdAt:{
timestampValue:
new Date()
.toISOString()
}

}

})

}
);


input.value="";


await loadComments();

}
catch(error){

console.log(error);

}


button.disabled=false;

}


document.getElementById(
"sendComment"
).onclick=
sendComment;


document.getElementById(
"commentInput"
).addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

sendComment();

}

});


/* DELETE COMMENT */

async function deleteComment(
id
){

try{

await fetch(
collectionUrl(
"comments",
id
),
{
method:"DELETE",

headers:{
Authorization:
"Bearer "+token
}
}
);


await loadComments();

}
catch(error){

console.log(error);

}

}


/* SHARE */

async function shareReel(
reel,
event
){

event.stopPropagation();


const url =
location.origin+
location.pathname+
"#"+
reel.dataset.reelId;


try{

if(navigator.share){

await navigator.share({

title:
