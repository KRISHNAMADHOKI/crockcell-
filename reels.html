<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CROCKCELL Reels</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* =========================
   REELS CONTAINER
========================= */

#reelsContainer{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  background:#000;
  scrollbar-width:none;
}

#reelsContainer::-webkit-scrollbar{
  display:none;
}

/* =========================
   REEL
========================= */

.reel{
  position:relative;
  width:100%;
  height:100%;
  min-height:100%;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  background:#000;
  overflow:hidden;
}

.reel video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#000;
}

/* =========================
   TOP
========================= */

.topBar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:75px;
  padding:
    calc(14px + env(safe-area-inset-top))
    16px
    14px;
  z-index:30;
  display:flex;
  align-items:center;
  pointer-events:none;
}

.reelsTitle{
  font-size:22px;
  font-weight:800;
  text-shadow:
    0 2px 8px rgba(0,0,0,.9);
}

/* =========================
   SOUND
========================= */

.soundBtn{
  position:absolute;
  top:82px;
  right:15px;
  width:44px;
  height:44px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:50%;
  background:rgba(0,0,0,.48);
  color:#fff;
  font-size:19px;
  z-index:35;
  display:none;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(8px);
}

/* =========================
   PAUSE
========================= */

.pauseIcon{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(0,0,0,.48);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:30px;
  z-index:25;
  backdrop-filter:blur(5px);
}

/* =========================
   ACTIONS
========================= */

.actions{
  position:absolute;
  right:12px;
  bottom:112px;
  z-index:35;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.actionBox{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.actionBtn{
  width:49px;
  height:49px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:50%;
  background:rgba(0,0,0,.48);
  color:#fff;
  font-size:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(8px);
  transition:transform .15s ease,background .15s ease;
}

.actionBtn:active{
  transform:scale(.88);
}

.actionCount{
  font-size:12px;
  font-weight:600;
  text-shadow:0 1px 5px #000;
}

/* =========================
   REEL INFO
========================= */

.reelInfo{
  position:absolute;
  left:15px;
  right:82px;
  bottom:91px;
  z-index:30;
  text-shadow:0 2px 7px rgba(0,0,0,.95);
}

.username{
  font-size:18px;
  font-weight:bold;
  margin-bottom:7px;
}

.caption{
  font-size:15px;
  line-height:1.35;
}

/* =========================
   BOTTOM NAVIGATION
   NO BLACK SCREEN AROUND IT
========================= */

.bottomNav{
  position:fixed;
  left:10px;
  right:10px;
  bottom:
    calc(8px + env(safe-area-inset-bottom));
  height:60px;

  /* transparent outer area */
  background:transparent;
  border:0;
  box-shadow:none;

  display:flex;
  align-items:center;
  justify-content:space-around;

  z-index:5000;
  pointer-events:auto;
}

/* individual navigation buttons */

.navItem{
  width:22%;
  max-width:82px;
  height:55px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-decoration:none;
  color:rgba(255,255,255,.72);

  font-size:10px;
  font-weight:700;

  border-radius:17px;

  background:rgba(10,10,10,.38);
  border:1px solid rgba(255,255,255,.10);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  transition:
    transform .18s ease,
    background .18s ease,
    color .18s ease;
}

.navItem.active{
  color:#fff;
  background:rgba(255,255,255,.17);
  border-color:rgba(255,255,255,.24);
}

.navItem:active{
  transform:scale(.90);
}

.navIcon{
  width:28px;
  height:27px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;
  line-height:1;

  margin-bottom:2px;
}

.navItem.active .navIcon{
  transform:scale(1.08);
}

/* PROFILE PHOTO */

.profileNavPhoto{
  width:27px;
  height:27px;

  border-radius:50%;
  object-fit:cover;

  background:#333;
  border:2px solid rgba(255,255,255,.8);
}

/* =========================
   COMMENTS
========================= */

#commentsOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  z-index:10000;
  display:none;
}

.commentsPanel{
  position:absolute;
  left:0;
  right:0;
  bottom:0;

  height:70vh;

  background:#111;

  border-radius:22px 22px 0 0;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

.commentsHeader{
  height:60px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  border-bottom:1px solid #333;
}

.commentsTitle{
  font-size:18px;
  font-weight:bold;
}

.closeBtn{
  width:42px;
  height:42px;

  border:0;
  background:none;
  color:#fff;

  font-size:28px;
}

.commentsList{
  flex:1;
  overflow-y:auto;
  padding:10px 15px;
}

.commentItem{
  display:flex;
  gap:10px;

  padding:12px 0;

  border-bottom:1px solid #292929;
}

.avatar{
  width:38px;
  height:38px;

  flex-shrink:0;

  border-radius:50%;

  background:#333;

  display:flex;
  justify-content:center;
  align-items:center;

  font-weight:bold;
}

.commentBody{
  flex:1;
  min-width:0;
}

.commentUser{
  font-weight:bold;
  font-size:14px;
  margin-bottom:4px;
}

.commentText{
  font-size:14px;
  color:#ddd;
  word-break:break-word;
}

.deleteComment{
  margin-top:6px;
  padding:0;

  border:0;
  background:none;

  color:#ff5555;
  font-size:12px;
}

.noComments{
  text-align:center;
  color:#aaa;
  padding:35px 10px;
}

.commentInputArea{
  display:flex;
  gap:8px;

  padding:12px;

  border-top:1px solid #333;
}

#commentInput{
  flex:1;
  min-width:0;
  height:44px;

  border-radius:22px;
  border:1px solid #444;

  background:#222;
  color:#fff;

  padding:0 16px;

  outline:none;
  font-size:14px;
}

#sendComment{
  width:44px;
  height:44px;

  flex-shrink:0;

  border:0;
  border-radius:50%;

  background:#fff;
  color:#000;

  font-size:18px;
}

/* =========================
   SMALL PHONES
========================= */

@media(max-width:380px){

  .bottomNav{
    left:7px;
    right:7px;
  }

  .navItem{
    font-size:9px;
    height:53px;
  }

  .actions{
    right:9px;
    bottom:108px;
  }

  .actionBtn{
    width:46px;
    height:46px;
  }

  .reelInfo{
    bottom:88px;
  }
}
</style>
</head>

<body>

     REELS
========================= -->

<!-- REEL 1 -->

<script>

/* =========================
   FIREBASE
========================= */

const PROJECT_ID =
"crockcell-cd2e6";

const token =
localStorage.getItem("crockcellIdToken");

const uid =
localStorage.getItem("crockcellUid");


if(!token || !uid){

window.location.href="index.html";

}


/* =========================
   PROFILE PHOTO
========================= */

function readProfileValue(field){

if(!field)
return "";

if(field.stringValue !== undefined)
return field.stringValue;

return "";

}


async function loadNavProfile(){

const img =
document.getElementById(
"navProfilePhoto"
);

try{

let saved=null;

try{

saved=JSON.parse(
localStorage.getItem(
"crockcellProfile"
)||"null"
);

}catch(e){}


if(saved && saved.photoURL){

img.src=saved.photoURL;

return;

}


const url=
"https://firestore.googleapis.com/v1/projects/"
+PROJECT_ID
+"/databases/(default)/documents/users/"
+encodeURIComponent(uid);


const response=
await fetch(
url,
{
headers:{
"Authorization":
"Bearer "+token
}
});


if(!response.ok)
return;


const data=
await response.json();


const photo=
readProfileValue(
data.fields?.photoURL
);


if(photo){

img.src=photo;


let profile=saved || {};

profile.photoURL=photo;
profile.uid=uid;


localStorage.setItem(
"crockcellProfile",
JSON.stringify(profile)
);

}

}catch(error){

console.log(
"PROFILE PHOTO ERROR",
error
);

}

}


loadNavProfile();


/* =========================
   CURRENT REEL
========================= */

let currentReelId="";


/* =========================
   FIRESTORE URL
========================= */

function collectionUrl(collection){

return "https://firestore.googleapis.com/v1/projects/"
+PROJECT_ID
+"/databases/(default)/documents/"
+collection;

}


/* =========================
   READ FIRESTORE VALUE
========================= */

function readValue(field){

if(!field)
return "";

if(field.stringValue !== undefined)
return field.stringValue;

if(field.integerValue !== undefined)
return Number(field.integerValue);

if(field.timestampValue !== undefined)
return field.timestampValue;

if(field.booleanValue !== undefined)
return field.booleanValue;

return "";

}


/* =========================
   SAFE TEXT
========================= */

function safeText(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   VIDEO SYSTEM
========================= */

const reels =
document.querySelectorAll(".reel");


reels.forEach(function(reel){

const video =
reel.querySelector("video");

const soundBtn =
reel.querySelector(".soundBtn");

const pauseIcon =
reel.querySelector(".pauseIcon");


video.addEventListener(
"click",
function(){

if(video.paused){

video.play()
.catch(function(error){

console.log(
"PLAY ERROR",
error
);

});

}else{

video.pause();

}

});


video.addEventListener(
"play",
function(){

soundBtn.style.display="none";
pauseIcon.style.display="none";

});


video.addEventListener(
"pause",
function(){

soundBtn.style.display="flex";
pauseIcon.style.display="flex";

});

});


/* =========================
   SOUND
========================= */

function toggleSound(
button,
event
){

event.stopPropagation();


const reel =
button.closest(".reel");


const video =
reel.querySelector("video");


if(video.muted){

video.muted=false;
video.volume=1;

button.innerText="🔊";

}else{

video.muted=true;

button.innerText="🔇";

}

}


/* =========================
   AUTO PLAY
========================= */

const observer =
new IntersectionObserver(
function(entries){

entries.forEach(
function(entry){

const reel =
entry.target;

const video =
reel.querySelector("video");


if(entry.isIntersecting){

video.play()
.catch(function(error){

console.log(
"AUTOPLAY ERROR",
error
);

});

}else{

video.pause();

}

});

},
{
threshold:0.7
});


reels.forEach(
function(reel){

observer.observe(reel);

});


/* =========================
   LIKE
========================= */

async function likeReel(
button,
event
){

event.stopPropagation();


const reel =
button.closest(".reel");


const reelId =
reel.dataset.reelId;


const likeId =
reelId+"_"+uid;


const url =
collectionUrl("reelLikes")
+"/"+encodeURIComponent(
likeId
);


try{

const check =
await fetch(
url,
{
headers:{
"Authorization":
"Bearer "+token
}
});


if(check.ok){

await fetch(
url,
{
method:"DELETE",
headers:{
"Authorization":
"Bearer "+token
}
});

button.innerText="♡";

}else{

await fetch(
url,
{
method:"PATCH",
headers:{
"Authorization":
"Bearer "+token,
"Content-Type":
"application/json"
},
body:JSON.stringify({

fields:{

reelId:{
stringValue:reelId
},

userId:{
stringValue:uid
},

createdAt:{
timestampValue:
new Date().toISOString()
}

}

})
});

button.innerText="♥";

}


await loadLikeCount(
reelId,
reel
);


}catch(error){

console.log(
"LIKE ERROR",
error
);

}

}


/* =========================
   LIKE COUNT
========================= */

async function loadLikeCount(
reelId,
reel
){

try{

const response =
await fetch(
collectionUrl("reelLikes")
+"?pageSize=300",
{
headers:{
"Authorization":
"Bearer "+token
}
});


const data =
await response.json();


let count=0;


(data.documents || [])
.forEach(
function(doc){

const fields =
doc.fields || {};


if(
readValue(fields.reelId)
===
reelId
){

count++;

}

});


reel.querySelector(
".likeCount"
).innerText=count;


}catch(error){

console.log(
"LIKE COUNT ERROR",
error
);

}

}


/* =========================
   CHECK LIKE
========================= */

async function checkLike(
reel
){

const reelId =
reel.dataset.reelId;


const likeId =
reelId+"_"+uid;


try{

const response =
await fetch(
collectionUrl("reelLikes")
+"/"+encodeURIComponent(
likeId
),
{
headers:{
"Authorization":
"Bearer "+token
}
});


if(response.ok){

reel.querySelector(
".likeBtn"
).innerText="♥";

}

}catch(error){

console.log(error);

}

}


/* =========================
   COMMENTS
========================= */

async function openComments(
button,
event
){

event.stopPropagation();


const reel =
button.closest(".reel");


currentReelId =
reel.dataset.reelId;


document.getElementById(
"commentsOverlay"
).style.display="block";


document.getElementById(
"commentsList"
).innerHTML=
'<div class="noComments">Loading comments...</div>';


await loadComments();


document.getElementById(
"commentInput"
).focus();

}


function closeComments(){

document.getElementById(
"commentsOverlay"
).style.display="none";


currentReelId="";

}


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(){

try{

const response =
await fetch(
collectionUrl("comments")
+"?pageSize=300",
{
headers:{
"Authorization":
"Bearer "+token
}
});


const data =
await response.json();


if(!response.ok){

throw new Error(
"Comments load failed"
);

}


let comments=[];


(data.documents || [])
.forEach(
function(doc){

const fields =
doc.fields || {};


if(
readValue(fields.reelId)
===
currentReelId
){

comments.push({

id:
doc.name.split("/").pop(),

userId:
readValue(fields.userId),

username:
readValue(fields.username),

text:
readValue(fields.text),

createdAt:
readValue(fields.createdAt)

});

}

});


comments.sort(
function(a,b){

return new Date(
a.createdAt || 0
)
-
new Date(
b.createdAt || 0
);

});


renderComments(
comments
);


const reel =
document.querySelector(
'.reel[data-reel-id="'
+
currentReelId
+
'"]'
);


if(reel){

reel.querySelector(
".commentCount"
).innerText=
comments.length;

}


}catch(error){

console.log(
"COMMENTS ERROR",
error
);


document.getElementById(
"commentsList"
).innerHTML=
'<div class="noComments">Comments load nahi hue.</div>';

}

}


/* =========================
   RENDER COMMENTS
========================= */

function renderComments(
comments
){

const list =
document.getElementById(
"commentsList"
);


document.getElementById(
"commentsNumber"
).innerText=
"("+comments.length+")";


if(comments.length===0){

list.innerHTML=
'<div class="noComments">'
+
'Abhi koi comment nahi hai.'
+
'<br>Pehla comment karo!'
+
'</div>';

return;

}


let html="";


comments.forEach(
function(comment){

const username =
comment.username || "User";


const first =
username
.charAt(0)
.toUpperCase();


html+=`

<div class="commentItem">

<div class="avatar">
${safeText(first)}
</div>

<div class="commentBody">

<div class="commentUser">
@${safeText(username)}
</div>

<div class="commentText">
${safeText(comment.text)}
</div>

${
comment.userId === uid
?
`
<button
class="deleteComment"
onclick="deleteComment('${safeText(comment.id)}')">
Delete
</button>
`
:
""
}

</div>

</div>

`;

});


list.innerHTML=html;

}


/* =========================
   SEND COMMENT
========================= */

async function sendComment(){

const input =
document.getElementById(
"commentInput"
);


const text =
input.value.trim();


if(!text || !currentReelId)
return;


const button =
document.getElementById(
"sendComment"
);


button.disabled=true;


try{

let username="User";


const profileResponse =
await fetch(
collectionUrl("users")
+"/"
+encodeURIComponent(uid),
{
headers:{
"Authorization":
"Bearer "+token
}
});


if(profileResponse.ok){

const profile =
await profileResponse.json();


username =
readValue(
profile.fields?.username
)
||
readValue(
profile.fields?.name
)
||
"User";

}


const response =
await fetch(
collectionUrl("comments"),
{
method:"POST",
