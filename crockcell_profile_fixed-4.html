<script>


/* =========================================
   FIREBASE
========================================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================================
   SESSION
========================================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let currentUID =
localStorage.getItem(
  "crockcell_uid"
);


if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}

if(!currentUID){

  currentUID =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}


if(!token || !currentUID){

  window.location.replace(
    "index.html"
  );

}


/* =========================================
   URL
========================================= */

const params =
new URLSearchParams(
  window.location.search
);

const requestedUID =
params.get("uid");

const requestedUsername =
params.get("username");

const requestedName =
params.get("name");

const requestedPhoto =
params.get("photo");


/* =========================================
   SESSION PROFILE FROM SEARCH
========================================= */

let savedTarget = null;


try{

  const saved =
  sessionStorage.getItem(
    "crockcell_profile_target"
  );

  if(saved){

    savedTarget =
    JSON.parse(saved);

  }

}
catch(error){

  console.log(
    "Saved profile unavailable"
  );

}


/* =========================================
   PROFILE UID
========================================= */

const profileUID =
requestedUID ||
(savedTarget?.uid) ||
currentUID;


/* =========================================
   ELEMENTS
========================================= */

const profileArea =
document.getElementById(
  "profileArea"
);

const listModal =
document.getElementById(
  "listModal"
);

const listTitle =
document.getElementById(
  "listTitle"
);

const listContent =
document.getElementById(
  "listContent"
);

const closeList =
document.getElementById(
  "closeList"
);


/* =========================================
   CURRENT PROFILE
========================================= */

let currentProfile = null;


/* =========================================
   FIRESTORE BASE
========================================= */

function firestoreBase(){

  return (
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents"
  );

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

  try{

    /*
      IMPORTANT:

      Search se profile open hone par
      savedTarget me already user data hota hai.

      Isliye Firebase ka wait nahi.
    */

    if(
      savedTarget &&
      savedTarget.uid === profileUID
    ){

      currentProfile = {

        uid:
        savedTarget.uid,

        username:
        savedTarget.username ||
        requestedUsername ||
        "user",

        name:
        savedTarget.name ||
        requestedName ||
        savedTarget.username ||
        "User",

        photoURL:
        savedTarget.photoURL ||
        requestedPhoto ||
        "",

        bio:""

      };


      renderProfile();


      /*
        Firebase se bio/counts background me.
      */

      loadExtraProfileData();

      return;

    }


    /*
      URL se profile data available ho
      to bhi turant show.
    */

    if(
      requestedUID &&
      (
        requestedUsername ||
        requestedName ||
        requestedPhoto
      )
    ){

      currentProfile = {

        uid:
        requestedUID,

        username:
        requestedUsername ||
        "user",

        name:
        requestedName ||
        requestedUsername ||
        "User",

        photoURL:
        requestedPhoto ||
        "",

        bio:""

      };


      renderProfile();

      loadExtraProfileData();

      return;

    }


    /*
      Apni profile ho to Firebase se load.
    */

    const user =
    await getUserByUID(
      profileUID
    );


    if(!user){

      throw new Error(
        "USER_NOT_FOUND"
      );

    }


    currentProfile =
    user;


    renderProfile();

    loadExtraProfileData();

  }
  catch(error){

    console.error(
      "PROFILE ERROR:",
      error
    );


    profileArea.innerHTML = `

      <div class="error-box">

        Profile load nahi ho paayi.

        <br><br>

        <button
          class="retry-btn"
          onclick="location.reload()"
        >
          Retry
        </button>

      </div>

    `;

  }

}


/* =========================================
   EXTRA PROFILE DATA
========================================= */

async function loadExtraProfileData(){

  /*
    Firebase se actual profile data
    background me lene ki koshish.
  */

  try{

    const user =
    await getUserByUID(
      profileUID
    );


    if(user){

      currentProfile.name =
      user.name ||
      currentProfile.name;

      currentProfile.username =
      user.username ||
      currentProfile.username;

      currentProfile.photoURL =
      user.photoURL ||
      currentProfile.photoURL;

      currentProfile.bio =
      user.bio ||
      "";


      updateProfileDisplay();

    }

  }
  catch(error){

    console.log(
      "Extra profile data skipped"
    );

  }


  /*
    Follow information.
  */

  loadFollowCounts();


  if(
    currentProfile.uid !==
    currentUID
  ){

    updateFollowButton();

  }

}

   UPDATE PROFILE DISPLAY
========================================= */

  );

  const bioElement =

    "profileBio"
  );

  const photoElement =
  document.getElementById(
    "profilePhoto"
  );


  if(nameElement){

    nameElement.textContent =
    currentProfile.name ||
    "User";

  }


  if(usernameElement){

    usernameElement.textContent =
    "@" +
    (
      currentProfile.username ||
      "user"
    );

  }


  if(bioElement){

    bioElement.textContent =
    currentProfile.bio ||
    "No bio yet.";

  }


  if(photoElement){

    photoElement.src =
    currentProfile.photoURL ||
    placeholderPhoto();

  }

}

    <!-- STATS -->

    <div class="stats">

      >

        <div

          0
        </div>

        <div class="stat-label">

        </div>

      </div>


      <div
        id="followingStat"

      >

        <div

        </div>

        </div>

      </div>


      <div class="stat">

        <div
          id="postsCount"

        >

        </div>

    <!-- BIO -->

    <div

    >

    <!-- BUTTONS -->

    ${

        <button

        </button>

        >

        </button>

      </div>
      `

    }

    <section class="cloud-section">
      <div class="cloud-head"><b>Stories</b><a href="story_cloud.html">See all</a></div>
      <div id="profileStories" class="cloud-row"><div class="cloud-empty">Loading Stories...</div></div>
    </section>

    <section class="cloud-section">
      <div class="cloud-head"><b>Notes</b><a href="notes_cloud.html">See all</a></div>
      <div id="profileNotes" class="cloud-row"><div class="cloud-empty">Loading Notes...</div></div>
    </section>

  `;


  /*
    FOLLOWERS
  */

  document
  .getElementById(
    "followersStat"
  )
  .onclick =
  function(){

    openUserList(
      "Followers"
    );

  };


  /*
    FOLLOWING
  */

  document
  .getElementById(
    "followingStat"
  )
  .onclick =
  function(){

    openUserList(
      "Following"
    );

  };


  /*
    OWN PROFILE
  */

  if(isOwn){

    document
    .getElementById(
      "editButton"
    )
    .onclick =
    function(){

      window.location.assign(
        "edit-profile.html"
      );

  else{

    /*
      FOLLOW
    */

    document
    .getElementById(
      "followButton"
    )
    .onclick =
    toggleFollow;


    /*
      MESSAGE
    */

    document
    .getElementById(
      "messageButton"
    )
    .onclick =
    function(){

      openMessage(
        currentProfile
      );

    };

  }

  if(isOwn){
    const settingsButton=document.getElementById("settingsButton");
    if(settingsButton)settingsButton.onclick=function(){window.location.assign("settings.html");};
  }

  loadCounts();
  loadProfileCloud();

}


/* =========================================
   GET USER BY UID
========================================= */

async function getUserByUID(
  targetUID
){

  /*
    METHOD 1:
    Document ID = UID
  */

  try{

    const url =
    firestoreBase() +
    "/users/" +
    encodeURIComponent(
      targetUID
    ) +
    "?key=" +
    API_KEY;


    const response =
    await fetch(
      url,
      {

        headers:{
          Authorization:
          "Bearer " + token
        }

      }
    );


    if(response.ok){

      const data =
      await response.json();


      return convertUser(
        targetUID,
        data.fields || {}
      );

    }

  }
  catch(error){

    console.log(
      "Direct user lookup failed"
    );

  }


  /*
    METHOD 2:
    Search users where uid == targetUID
  */

  try{

    const url =
    firestoreBase() +
    ":runQuery?key=" +
    API_KEY;


    const body = {

      structuredQuery:{

        from:[
          {
            collectionId:"users"
          }
        ],

        where:{

          fieldFilter:{

            field:{
              fieldPath:"uid"
            },

            op:"EQUAL",

            value:{
              stringValue:
              targetUID
            }

          }

        },

        limit:1

      }

    };


    const response =
    await fetch(
      url,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify(body)

      }
    );


    if(response.ok){

      const rows =
      await response.json();


      for(
        const row of rows
      ){

        if(row.document){

          return convertUser(
            targetUID,
            row.document.fields || {}
          );

        }

      }

    }

  }
  catch(error){

    console.log(
      "UID field search failed"
    );

  }


  return null;

}


/* =========================================
   CONVERT USER
========================================= */

function convertUser(
  uid,
  f
){

  return {

    uid:
    f.uid?.stringValue ||
    uid,

    name:
    f.name?.stringValue ||
    f.username?.stringValue ||
    "User",

    username:
    f.username?.stringValue ||
    "user",

    photoURL:
    f.photoURL?.stringValue ||
    "",

    bio:
    f.bio?.stringValue ||
    ""

  };

}


/* =========================================
   FOLLOW STATUS
========================================= */

async function updateFollowButton(){

  const button =
  document.getElementById(
    "followButton"
  );


  if(!button)return;


  try{

    const following =
    await checkFollowing(
      currentUID,
      currentProfile.uid
    );


    button.textContent =
    following
    ?
    "Following"
    :
    "Follow";


    button.classList.toggle(
      "following-btn",
      following
    );

  }
  catch(error){

    console.log(
      "Follow status unavailable"
    );

  }

}


/* =========================================
   CHECK FOLLOWING
========================================= */

async function checkFollowing(
  followerID,
  followingID
){

  const id =
  followerID +
  "_" +
  followingID;


  const url =
  firestoreBase() +
  "/follows/" +
  encodeURIComponent(id) +
  "?key=" +
  API_KEY;


  const response =
  await fetch(
    url,
    {

      headers:{
        Authorization:
        "Bearer " + token
      }

    }
  );


  return response.ok;

}


/* =========================================
   FOLLOW / UNFOLLOW
========================================= */

async function toggleFollow(){
  const button=document.getElementById("followButton");
  if(!button || !currentProfile || currentProfile.uid===currentUID)return;
  button.disabled=true;
  try{
    const already=await checkFollowing(currentUID,currentProfile.uid);
    const id=currentUID+"_"+currentProfile.uid;
    const url=firestoreBase()+"/follows/"+encodeURIComponent(id)+"?key="+API_KEY;
    if(already){
      const response=await fetch(url,{method:"DELETE",headers:{Authorization:"Bearer "+token}});
      if(!response.ok)throw new Error("UNFOLLOW_FAILED");
      button.textContent="Follow"; button.classList.remove("following-btn"); changeFollowerCount(-1);
    }else{
      const body={fields:{followerId:{stringValue:currentUID},followingId:{stringValue:currentProfile.uid},createdAt:{timestampValue:new Date().toISOString()}}};
      const response=await fetch(url,{method:"PATCH",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(!response.ok)throw new Error("FOLLOW_FAILED");
      button.textContent="Following"; button.classList.add("following-btn"); changeFollowerCount(1);
    }
  }catch(error){console.error("FOLLOW ERROR",error); alert("Follow action failed. Please try again.");}
  button.disabled=false;
}

function changeFollowerCount(delta){
  const el=document.getElementById("followersCount");
  if(!el)return;
  const n=Math.max(0,(Number(el.textContent)||0)+delta);
  el.textContent=String(n);
}

async function queryFollowUsers(type,uid){
  const field=type==="Followers"?"followingId":"followerId";
  const value=type==="Followers"?uid:uid;
  const url=firestoreBase()+":runQuery?key="+API_KEY;
  const body={structuredQuery:{from:[{collectionId:"follows"}],where:{fieldFilter:{field:{fieldPath:field},op:"EQUAL",value:{stringValue:value}}},limit:100}};
  const response=await fetch(url,{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!response.ok)throw new Error("FOLLOW_LIST_FAILED");
  const rows=await response.json();
  const ids=[];
  for(const row of rows){
    const f=row.document?.fields||{};
    const id=f[type==="Followers"?"followerId":"followingId"]?.stringValue;
    if(id && !ids.includes(id))ids.push(id);
  }
  return ids;
}

async function openUserList(type){
  listTitle.textContent=type;
  listContent.innerHTML='<div class="list-empty">Loading...</div>';
  listModal.style.display="flex";
  try{
    const ids=await queryFollowUsers(type,profileUID);
    if(!ids.length){listContent.innerHTML='<div class="list-empty">No users yet.</div>';return;}
    const users=[];
    for(const id of ids.slice(0,50)){
      try{const u=await getUserByUID(id);if(u)users.push(u);}catch(e){}
    }
    if(!users.length){listContent.innerHTML='<div class="list-empty">No users found.</div>';return;}
    listContent.innerHTML=users.map(u=>`<div class="user-row" data-uid="${escapeAttribute(u.uid)}"><img class="user-avatar" src="${escapeAttribute(u.photoURL||placeholderPhoto())}" alt=""><div class="user-details"><div class="user-name">${escapeHTML(u.name||"User")}</div><div class="user-username">@${escapeHTML(u.username||"user")}</div></div><div class="user-arrow">›</div></div>`).join("");
    listContent.querySelectorAll(".user-row").forEach(row=>row.onclick=()=>{
      const id=row.getAttribute("data-uid");
      const u=users.find(x=>x.uid===id);
      if(u){sessionStorage.setItem("crockcell_profile_target",JSON.stringify(u));location.href="profile.html";}
    });
  }catch(error){console.error(error);listContent.innerHTML='<div class="list-empty">List load nahi hui.</div>';}
}

function updateProfileDisplay(){
  if(!currentProfile)return;
  const photo=document.getElementById("profilePhoto");
  const name=document.getElementById("profileName");
  const username=document.getElementById("profileUsername");
  const bio=document.getElementById("profileBio");
  if(photo)photo.src=currentProfile.photoURL||placeholderPhoto();
  if(name)name.textContent=currentProfile.name||"User";
  if(username)username.textContent="@"+(currentProfile.username||"user");
  if(bio)bio.textContent=currentProfile.bio||"No bio yet.";
}

async function loadCounts(){
  if(!currentProfile)return;
  try{
    const followers=await queryFollowUsers("Followers",currentProfile.uid);
    const following=await queryFollowUsers("Following",currentProfile.uid);
    const fc=document.getElementById("followersCount");
    const fg=document.getElementById("followingCount");
    if(fc)fc.textContent=String(followers.length);
    if(fg)fg.textContent=String(following.length);
    const posts=document.getElementById("postsCount");
    if(posts){
      const r=await fetch(firestoreBase()+"/posts?pageSize=100&key="+API_KEY,{headers:{Authorization:"Bearer "+token}});
      if(r.ok){const d=await r.json();const n=(d.documents||[]).filter(x=>(x.fields?.uid?.stringValue||"")===currentProfile.uid).length;posts.textContent=String(n);}
    }
    if(currentProfile.uid!==currentUID)updateFollowButton();
  }catch(error){console.log("Counts unavailable",error);}
}

function cloudString(fields,name){return fields?.[name]?.stringValue||"";}
function cloudTime(fields,name){const f=fields?.[name];if(!f)return 0;if(f.integerValue!==undefined)return Number(f.integerValue)||0;if(f.doubleValue!==undefined)return Number(f.doubleValue)||0;if(f.timestampValue){const n=Date.parse(f.timestampValue);return Number.isNaN(n)?0:n;}return 0;}
async function canViewCloud(uid,privacy){
  if(uid===currentUID)return true;
  const p=String(privacy||"Everyone").toLowerCase();
  if(p==="everyone")return true;
  if(p==="followers")return await checkFollowing(currentUID,uid);
  return false;
}

async function loadProfileStories(){
  const box=document.getElementById("profileStories"); if(!box||!currentProfile)return;
  try{
    const r=await fetch(firestoreBase()+"/stories?pageSize=100&key="+API_KEY,{headers:{Authorization:"Bearer "+token}});
    if(!r.ok)throw new Error("STORIES_FAILED");
    const d=await r.json(); const now=Date.now(); const arr=[];
    for(const doc of d.documents||[]){
      const f=doc.fields||{}; const uid=cloudString(f,"uid"); const data=cloudString(f,"data"); const exp=cloudTime(f,"expiresAt");
      if(uid!==currentProfile.uid||!data||(exp&&exp<=now))continue;
      if(await canViewCloud(uid,cloudString(f,"privacy")))arr.push({data,type:cloudString(f,"type")||"image",username:cloudString(f,"username")||currentProfile.username,createdAt:cloudTime(f,"createdAt")});
    }
    arr.sort((a,b)=>b.createdAt-a.createdAt); const items=arr.slice(0,8);
    if(!items.length){box.innerHTML='<div class="cloud-empty">No active stories.</div>';return;}
    box.innerHTML=items.map(x=>{const media=x.type.toLowerCase().includes("video")?`<video class="cloud-thumb" src="${escapeAttribute(x.data)}" muted playsinline></video>`:`<img class="cloud-thumb" src="${escapeAttribute(x.data)}" alt="Story">`;return `<a class="cloud-card" href="story_cloud.html">${media}<div class="cloud-label">@${escapeHTML(x.username)}</div></a>`}).join("");
  }catch(e){console.error(e);box.innerHTML='<div class="cloud-empty">Stories load nahi hui.</div>';}
}

async function loadProfileNotes(){
  const box=document.getElementById("profileNotes"); if(!box||!currentProfile)return;
  try{
    const r=await fetch(firestoreBase()+"/notes?pageSize=100&key="+API_KEY,{headers:{Authorization:"Bearer "+token}});
    if(!r.ok)throw new Error("NOTES_FAILED");
    const d=await r.json(); const arr=[];
    for(const doc of d.documents||[]){
      const f=doc.fields||{}; const uid=cloudString(f,"uid"); const text=cloudString(f,"text");
      if(uid!==currentProfile.uid||!text)continue;
      if(await canViewCloud(uid,cloudString(f,"privacy")))arr.push({text,createdAt:cloudTime(f,"updatedAt")||cloudTime(f,"createdAt")});
    }
    arr.sort((a,b)=>b.createdAt-a.createdAt); const items=arr.slice(0,8);
    if(!items.length){box.innerHTML='<div class="cloud-empty">No notes yet.</div>';return;}
    box.innerHTML=items.map(x=>`<a class="cloud-card" href="notes_cloud.html"><div class="cloud-note">${escapeHTML(x.text)}</div><div class="cloud-label">Note</div></a>`).join("");
  }catch(e){console.error(e);box.innerHTML='<div class="cloud-empty">Notes load nahi hui.</div>';}
}
function loadProfileCloud(){loadProfileStories();loadProfileNotes();}

function openMessage(profile){
  try{sessionStorage.setItem("crockcell_chat_target",JSON.stringify(profile));}catch(e){}
  location.href="messages.html";
}

if(closeList){closeList.onclick=function(){listModal.style.display="none";};}
if(listModal){listModal.addEventListener("click",function(e){if(e.target===listModal)listModal.style.display="none";});}

async function start(){
  if(!token||!currentUID){window.location.replace("index.html");return;}
  await loadProfile();
}
start();
