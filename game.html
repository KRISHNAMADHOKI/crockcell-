<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10101a;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        #status {
            margin: 20px;
            font-size: 20px;
        }

        .board {
            width: 300px;
            height: 300px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .cell {
            background: #1d1d30;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 45px;
            font-weight: bold;
        }

        .cell:active {
            background: #30304b;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: #ffffff;
            color: #111;
        }
    </style>
</head>

<body>

    <h1>❌⭕ Tic Tac Toe</h1>

    <div id="status">Player X की चाल</div>

    <div class="board">

        <button class="cell" onclick="play(0)"></button>
        <button class="cell" onclick="play(1)"></button>
        <button class="cell" onclick="play(2)"></button>

        <button class="cell" onclick="play(3)"></button>
        <button class="cell" onclick="play(4)"></button>
        <button class="cell" onclick="play(5)"></button>

        <button class="cell" onclick="play(6)"></button>
        <button class="cell" onclick="play(7)"></button>
        <button class="cell" onclick="play(8)"></button>

    </div>

    <button onclick="restart()">🔄 Restart</button>


    <script>

        let board = ["", "", "", "", "", "", "", "", ""];
        let player = "X";
        let gameOver = false;

        const cells = document.querySelectorAll(".cell");
        const status = document.getElementById("status");

        function play(index) {

            if (board[index] !== "" || gameOver) {
                return;
            }

            board[index] = player;
            cells[index].textContent = player;

            checkWinner();

            if (!gameOver) {

                player = player === "X" ? "O" : "X";

                status.textContent =
                    "Player " + player + " की चाल";
            }
        }


        function checkWinner() {

            const wins = [

                [0,1,2],
                [3,4,5],
                [6,7,8],

                [0,3,6],
                [1,4,7],
                [2,5,8],

                [0,4,8],
                [2,4,6]

            ];


            for (let combination of wins) {

                const a = combination[0];
                const b = combination[1];
                const c = combination[2];

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[a] === board[c]
                ) {

                    status.textContent =
                        "🎉 Player " + player + " जीत गया!";

                    gameOver = true;

                    return;
                }
            }


            if (!board.includes("")) {

                status.textContent = "🤝 Game Draw!";

                gameOver = true;
            }
        }


        function restart() {

            board = ["", "", "", "", "", "", "", "", ""];

            player = "X";

            gameOver = false;

            status.textContent = "Player X की चाल";

            cells.forEach(function(cell) {
                cell.textContent = "";
            });
        }

    </script>

</body>
</html>
