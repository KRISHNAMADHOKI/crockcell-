<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CROCKCELL Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#000;
  color:white;
  font-family:Georgia,serif;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:100%;
  max-width:620px;
  padding:35px;
  text-align:center;
}

.logo{
  font-size:55px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:8px;
}

.tagline{
  color:#aaa;
  font-size:21px;
  font-weight:bold;
  margin-bottom:65px;
}

input{
  width:100%;
  padding:22px;
  margin-bottom:12px;
  border-radius:22px;
  border:1px solid #333;
  background:#111;
  color:white;
  font-size:20px;
  font-family:Georgia,serif;
  outline:none;
}

input:first-of-type{
  background:#e8efff;
  color:#111;
}

.passwordBox{
  position:relative;
}

.passwordBox input{
  padding-right:90px;
}

.showPassword{
  position:absolute;
  right:22px;
  top:20px;
  color:#aaa;
  font-weight:bold;
  cursor:pointer;
  font-size:17px;
}

button{
  width:100%;
  padding:21px;
  margin-top:22px;
  border:none;
  border-radius:22px;
  background:white;
  color:#000;
  font-size:22px;
  font-weight:bold;
  font-family:Georgia,serif;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

.forgot{
  display:block;
  margin-top:35px;
  color:white;
  text-decoration:none;
  font-size:19px;
  font-weight:bold;
}

.signup{
  margin-top:45px;
  font-size:20px;
  color:#aaa;
}

.signup a{
  color:white;
  font-weight:bold;
  text-decoration:none;
}

#message{
  margin-top:22px;
  font-size:18px;
  font-weight:bold;
  color:#ff7777;
  line-height:1.4;
}

.loading{
  color:#aaa !important;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">CROCKCELL</div>

  <div class="tagline">
    Connect. Share. Create.
  </div>

  <input
    id="username"
    type="text"
    placeholder="Username"
    autocomplete="username"
  >

  <div class="passwordBox">

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <span
      class="showPassword"
      id="showPassword"
    >
      Show
    </span>

  </div>

  <button id="loginBtn">
    Login
  </button>

  <a class="forgot" href="forgot-password.html">
    Forgot Password?
  </a>

  <div id="message"></div>

  <div class="signup">
    Don't have an account?
    <a href="signup.html">Sign Up</a>
  </div>

</div>


<script>

/* ==============================
   CROCKCELL FIREBASE SETTINGS
   ============================== */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* ==============================
   ELEMENTS
   ============================== */

const usernameInput =
document.getElementById("username");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");

const showPassword =
document.getElementById("showPassword");


/* ==============================
   SHOW / HIDE PASSWORD
   ============================== */

showPassword.addEventListener("click", function(){

  if(passwordInput.type === "password"){

    passwordInput.type = "text";
    showPassword.textContent = "Hide";

  }else{

    passwordInput.type = "password";
    showPassword.textContent = "Show";

  }

});


/* ==============================
   MESSAGE
   ============================== */

function showMessage(text, loading=false){

  message.textContent = text;

  if(loading){

    message.classList.add("loading");

  }else{

    message.classList.remove("loading");

  }

}


/* ==============================
   CLEAR OLD LOGIN DATA
   ============================== */

function clearOldLoginData(){

  const keys = [

    "crockcell_idToken",
    "crockcell_refreshToken",
    "crockcell_uid",
    "crockcell_profile",

    "crockcellIdToken",
    "crockcellRefreshToken",
    "crockcellUid",
    "crockcellProfile"

  ];

  keys.forEach(function(key){

    localStorage.removeItem(key);

  });

}


/* ==============================
   FIRESTORE USERNAME LOOKUP
   ============================== */

async function findUserByUsername(username){

  const documentId =
    encodeURIComponent(username);

  const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/" +
    "usernameIndex/" +
    documentId +
    "?key=" +
    API_KEY;


  const response =
    await fetch(url);


  const data =
    await response.json();


  console.log("Username lookup:", data);


  if(!response.ok){

    let errorText =
      data?.error?.message ||
      "Unknown Firebase error";

    throw new Error(
      "Firebase username lookup failed: " +
      errorText
    );

  }


  if(!data.fields){

    throw new Error(
      "Username Firebase me nahi mila."
    );

  }


  return {

    username:
      data.fields.username?.stringValue || "",

    email:
      data.fields.email?.stringValue || "",

    uid:
      data.fields.uid?.stringValue || ""

  };

}


/* ==============================
   FIREBASE EMAIL/PASSWORD LOGIN
   ============================== */

async function firebaseLogin(email, password){

  const url =
    "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" +
    API_KEY;


  const response =
    await fetch(url, {

      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        email:email,

        password:password,

        returnSecureToken:true

      })

    });


  const data =
    await response.json();


  console.log("Login response:", data);


  if(!response.ok){

    let errorCode =
      data?.error?.message || "UNKNOWN_ERROR";

    throw new Error(
      "LOGIN_ERROR:" + errorCode
    );

  }


  return data;

}


/* ==============================
   LOAD USER PROFILE
   ============================== */

async function loadUserProfile(uid, idToken, basicUser){

  const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/" +
    "users/" +
    encodeURIComponent(uid);


  const response =
    await fetch(url, {

      headers:{

        "Authorization":
        "Bearer " + idToken

      }

    });


  const data =
    await response.json();


  console.log("Profile response:", data);


  if(!response.ok){

    return {

      uid:uid,

      name:"",

      username:basicUser.username,

      email:basicUser.email,

      photoURL:"",

      bio:"",

      phoneNumber:"",

      phoneVerified:false

    };

  }


  const fields =
    data.fields || {};


  return {

    uid:uid,

    name:
      fields.name?.stringValue || "",

    username:
      fields.username?.stringValue ||
      basicUser.username,

    email:
      fields.email?.stringValue ||
      basicUser.email,

    photoURL:
      fields.photoURL?.stringValue || "",

    bio:
      fields.bio?.stringValue || "",

    phoneNumber:
      fields.phoneNumber?.stringValue || "",

    phoneVerified:
      fields.phoneVerified?.booleanValue || false

  };

}


/* ==============================
   LOGIN
   ============================== */

loginBtn.addEventListener("click", async function(){

  const username =
    usernameInput.value.trim()
      .toLowerCase();

  const password =
    passwordInput.value;


  /* VALIDATION */

  if(!username){

    showMessage(
      "Username enter karo."
    );

    return;

  }


  if(!password){

    showMessage(
      "Password enter karo."
    );

    return;

  }


  loginBtn.disabled = true;

  loginBtn.textContent = "Logging in...";

  showMessage(
    "Username Firebase me search ho raha hai...",
    true
  );


  try{

    /* STEP 1
       USERNAME SEARCH */

    const user =
      await findUserByUsername(username);


    if(!user.email){

      throw new Error(
        "Is username ke saath email nahi mili."
      );

    }


    if(!user.uid){

      throw new Error(
        "Is username ke saath UID nahi mili."
      );

    }


    showMessage(
      "Username mil gaya. Login ho raha hai...",
      true
    );


    /* STEP 2
       FIREBASE AUTH */

    const auth =
      await firebaseLogin(
        user.email,
        password
      );


    /* STEP 3
       UID VERIFY */

    if(auth.localId !== user.uid){

      throw new Error(
        "Account UID match nahi hui. Firebase usernameIndex check karo."
      );

    }


    /* STEP 4
       PROFILE LOAD */

    const profile =
      await loadUserProfile(
        auth.localId,
        auth.idToken,
        user
      );


    /* STEP 5
       OLD ACCOUNT DATA CLEAR */

    clearOldLoginData();


    /* STEP 6
       SAVE CURRENT ACCOUNT */

    localStorage.setItem(
      "crockcell_idToken",
      auth.idToken
    );

    localStorage.setItem(
      "crockcell_refreshToken",
      auth.refreshToken
    );

    localStorage.setItem(
      "crockcell_uid",
      auth.localId
    );

    localStorage.setItem(
      "crockcell_profile",
      JSON.stringify(profile)
    );


    /* STEP 7 */

    showMessage(
      "Login successful...",
      true
    );


    setTimeout(function(){

      window.location.href =
        "home.html";

    },500);


  }catch(error){

    console.error(
      "CROCKCELL LOGIN ERROR:",
      error
    );


    let errorMessage =
      error.message || "Unknown error";


    /* Firebase Auth errors */

    if(errorMessage.includes(
      "EMAIL_NOT_FOUND"
    )){

      errorMessage =
        "Is username ka account Firebase Auth me nahi mila.";

    }

    else if(errorMessage.includes(
      "INVALID_PASSWORD"
    )){

      errorMessage =
        "Password galat hai.";

    }

    else if(errorMessage.includes(
      "INVALID_LOGIN_CREDENTIALS"
    )){

      errorMessage =
        "Username ya password galat hai.";

    }

    else if(errorMessage.includes(
      "TOO_MANY_ATTEMPTS_TRY_LATER"
    )){

      errorMessage =
        "Bahut attempts ho gaye. Thodi der baad try karo.";

    }

    else if(errorMessage.includes(
      "Firebase username lookup failed"
    )){

      errorMessage =
        errorMessage.replace(
          "Firebase username lookup failed: ",
          ""
        );

    }


    showMessage(
      errorMessage
    );


    loginBtn.disabled = false;

    loginBtn.textContent = "Login";

  }

});


/* ==============================
   ENTER KEY LOGIN
   ============================== */

passwordInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      loginBtn.click();

    }

  }
);

</script>

</body>
</html>
