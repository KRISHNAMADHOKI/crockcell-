<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROCKCELL Login</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
padding:20px
}
.box{
width:100%;
max-width:380px;
background:#111;
border:1px solid #222;
border-radius:16px;
padding:28px
}
.logo{
text-align:center;
font-size:28px;
font-weight:bold;
letter-spacing:2px;
margin-bottom:25px
}
input{
width:100%;
padding:13px;
margin:7px 0;
background:#050505;
border:1px solid #333;
border-radius:9px;
color:#fff;
outline:none
}
button{
width:100%;
padding:13px;
margin-top:10px;
border:0;
border-radius:9px;
background:#fff;
color:#000;
font-weight:bold;
cursor:pointer
}
p{
text-align:center;
color:#999;
font-size:14px
}
a{color:#fff}
#msg{
text-align:center;
margin-top:12px;
font-size:14px
}
</style>
</head>

<body>

<div class="box">

<div class="logo">CROCKCELL</div>

<input
id="email"
type="email"
placeholder="Email"
autocomplete="email"
>

<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button onclick="login()">Login</button>

<div id="msg"></div>

<p>
Don't have an account?
<a href="signup.html">Sign up</a>
</p>

</div>

<script>

const API_KEY=
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

async function login(){

const email=
document.getElementById("email").value.trim();

const password=
document.getElementById("password").value;

const msg=
document.getElementById("msg");

if(!email||!password){

msg.style.color="#ff7777";
msg.textContent="Enter email and password.";
return;

}

msg.style.color="#aaa";
msg.textContent="Logging in...";

try{

const r=await fetch(
`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
password:password,
returnSecureToken:true
})
}
);

const data=await r.json();

if(!r.ok){

let error=data.error?.message||"Login failed.";

if(
error==="INVALID_LOGIN_CREDENTIALS"||
error==="EMAIL_NOT_FOUND"||
error==="INVALID_PASSWORD"
){
error="Email or password is incorrect.";
}

if(error==="USER_DISABLED"){
error="This account has been disabled.";
}

msg.style.color="#ff7777";
msg.textContent=error;
return;

}

/* Save login session */

localStorage.setItem(
"crockcellIdToken",
data.idToken
);

localStorage.setItem(
"crockcellRefreshToken",
data.refreshToken
);

localStorage.setItem(
"crockcellUid",
data.localId
);

localStorage.setItem(
"crockcellProfile",
JSON.stringify({
email:data.email,
uid:data.localId
})
);

msg.style.color="#55ff88";
msg.textContent="Login successful!";

setTimeout(()=>{
location.href="home.html";
},300);

}catch(e){

msg.style.color="#ff7777";
msg.textContent=
"Network error. Please try again.";

}

}

document.addEventListener("keydown",e=>{

if(e.key==="Enter")login();

});

</script>

</body>
</html>
