<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CROCKCELL - Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Georgia, "Times New Roman", serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:100%;
  max-width:650px;
  padding:35px 25px 50px;
  text-align:center;
}

.logo{
  font-size:64px;
  font-weight:bold;
  letter-spacing:3px;
  margin-bottom:15px;
  white-space:nowrap;
}

.tagline{
  font-size:30px;
  font-weight:bold;
  color:#aaa;
  margin-bottom:110px;
}

.input-box{
  width:100%;
  height:120px;
  border-radius:38px;
  border:none;
  background:#e7edfc;
  padding:0 40px;
  font-size:34px;
  font-family:Georgia, "Times New Roman", serif;
  color:#333;
  outline:none;
  margin-bottom:25px;
}

.password-wrap{
  position:relative;
}

.password-wrap .input-box{
  padding-right:150px;
}

.show-btn{
  position:absolute;
  right:40px;
  top:50%;
  transform:translateY(-50%);
  border:none;
  background:none;
  font-family:Georgia, "Times New Roman", serif;
  font-size:27px;
  font-weight:bold;
  color:#888;
  cursor:pointer;
}

.login-btn{
  width:100%;
  height:120px;
  border-radius:38px;
  border:none;
  background:#fff;
  color:#000;
  font-family:Georgia, "Times New Roman", serif;
  font-size:38px;
  font-weight:bold;
  cursor:pointer;
  margin-top:35px;
}

.login-btn:active{
  transform:scale(.98);
}

.forgot{
  display:block;
  margin-top:60px;
  color:#fff;
  font-size:29px;
  font-weight:bold;
  text-decoration:none;
}

.signup{
  margin-top:80px;
  font-size:29px;
  color:#aaa;
}

.signup a{
  color:#fff;
  font-weight:bold;
  text-decoration:none;
}

.message{
  min-height:35px;
  margin-top:25px;
  font-size:20px;
  font-weight:bold;
}

@media(max-width:600px){

  .container{
    padding:30px 30px 45px;
  }

  .logo{
    font-size:52px;
  }

  .tagline{
    font-size:25px;
    margin-bottom:90px;
  }

  .input-box{
    height:120px;
    font-size:30px;
    padding:0 38px;
  }

  .password-wrap .input-box{
    padding-right:125px;
  }

  .show-btn{
    right:35px;
    font-size:25px;
  }

  .login-btn{
    height:120px;
    font-size:34px;
  }

  .forgot,
  .signup{
    font-size:25px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">CROCKCELL</div>

  <div class="tagline">
    Connect. Share. Create.
  </div>

  <input
    id="username"
    class="input-box"
    type="text"
    placeholder="Username"
    autocomplete="username"
    autocapitalize="none"
  >

  <div class="password-wrap">

    <input
      id="password"
      class="input-box"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      type="button"
      class="show-btn"
      onclick="togglePassword()"
    >
      Show
    </button>

  </div>

  <button
    type="button"
    class="login-btn"
    id="loginBtn"
    onclick="login()"
  >
    Login
  </button>

  <div id="message" class="message"></div>

  <a class="forgot" href="forgot-password.html">
    Forgot Password?
  </a>

  <div class="signup">
    Don't have an account?
    <a href="signup.html">Sign Up</a>
  </div>

</div>

<script>

/* ================================
   CROCKCELL FIREBASE CONFIG
================================ */

const API_KEY = "AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID = "crockcell-cd2e6";


/* ================================
   ELEMENTS
================================ */

const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");


/* ================================
   MESSAGE
================================ */

function showMessage(text, color="#fff"){
  message.textContent = text;
  message.style.color = color;
}


/* ================================
   PASSWORD SHOW/HIDE
================================ */

function togglePassword(){

  if(passwordInput.type === "password"){

    passwordInput.type = "text";

    document.querySelector(".show-btn").textContent = "Hide";

  }else{

    passwordInput.type = "password";

    document.querySelector(".show-btn").textContent = "Show";

  }

}


/* ================================
   FIREBASE USERNAME LOOKUP
================================ */

async function findUserByUsername(username){

  const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/usernameIndex/" +
    encodeURIComponent(username) +
    "?key=" +
    API_KEY;

  const response = await fetch(url);

  if(!response.ok){

    if(response.status === 404){
      throw new Error("USERNAME_NOT_FOUND");
    }

    throw new Error("USERNAME_LOOKUP_FAILED");
  }

  const data = await response.json();

  if(!data.fields){
    throw new Error("USERNAME_NOT_FOUND");
  }

  const fields = data.fields;

  return {
    username: fields.username?.stringValue || username,
    email: fields.email?.stringValue || "",
    uid: fields.uid?.stringValue || ""
  };

}


/* ================================
   LOAD USER PROFILE
================================ */

async function loadUserProfile(uid, idToken, basicUser){

  const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/users/" +
    encodeURIComponent(uid);

  const response = await fetch(url,{
    headers:{
      "Authorization":"Bearer " + idToken
    }
  });

  if(!response.ok){

    return {
      uid:uid,
      name:basicUser.username,
      username:basicUser.username,
      email:basicUser.email,
      photoURL:"",
      bio:""
    };

  }

  const data = await response.json();

  if(!data.fields){

    return {
      uid:uid,
      name:basicUser.username,
      username:basicUser.username,
      email:basicUser.email,
      photoURL:"",
      bio:""
    };

  }

  const f = data.fields;

  return {

    uid:uid,

    name:
      f.name?.stringValue ||
      basicUser.username,

    username:
      f.username?.stringValue ||
      basicUser.username,

    email:
      f.email?.stringValue ||
      basicUser.email,

    photoURL:
      f.photoURL?.stringValue || "",

    bio:
      f.bio?.stringValue || "",

    phoneNumber:
      f.phoneNumber?.stringValue || "",

    phoneVerified:
      f.phoneVerified?.booleanValue || false

  };

}


/* ================================
   CLEAR OLD LOGIN DATA
================================ */

function clearOldSession(){

  const keys = [

    "crockcell_idToken",
    "crockcell_refreshToken",
    "crockcell_uid",
    "crockcell_profile",

    "crockcellIdToken",
    "crockcellRefreshToken",
    "crockcellUid",
    "crockcellProfile"

  ];

  keys.forEach(key => {

    localStorage.removeItem(key);

    sessionStorage.removeItem(key);

  });

}


/* ================================
   SAVE SESSION
================================ */

function saveSession(idToken, refreshToken, uid, profile){

  const profileText = JSON.stringify(profile);

  /* LOCAL STORAGE */

  localStorage.setItem(
    "crockcell_idToken",
    idToken
  );

  localStorage.setItem(
    "crockcell_refreshToken",
    refreshToken
  );

  localStorage.setItem(
    "crockcell_uid",
    uid
  );

  localStorage.setItem(
    "crockcell_profile",
    profileText
  );


  /* SESSION STORAGE */

  sessionStorage.setItem(
    "crockcell_idToken",
    idToken
  );

  sessionStorage.setItem(
    "crockcell_refreshToken",
    refreshToken
  );

  sessionStorage.setItem(
    "crockcell_uid",
    uid
  );

  sessionStorage.setItem(
    "crockcell_profile",
    profileText
  );


  /* OLD KEY COMPATIBILITY */

  localStorage.setItem(
    "crockcellIdToken",
    idToken
  );

  localStorage.setItem(
    "crockcellRefreshToken",
    refreshToken
  );

  localStorage.setItem(
    "crockcellUid",
    uid
  );

  localStorage.setItem(
    "crockcellProfile",
    profileText
  );

}


/* ================================
   LOGIN
================================ */

async function login(){

  const username =
    usernameInput.value
      .trim()
      .toLowerCase();

  const password =
    passwordInput.value;


  if(!username){

    showMessage(
      "Username enter karo.",
      "#ff6b6b"
    );

    return;

  }


  if(!password){

    showMessage(
      "Password enter karo.",
      "#ff6b6b"
    );

    return;

  }


  loginBtn.disabled = true;

  loginBtn.textContent = "Logging in...";

  showMessage("Please wait...","#aaa");


  try{

    /* ================================
       STEP 1
       FIND USERNAME
    ================================= */

    const user =
      await findUserByUsername(username);


    if(!user.email || !user.uid){

      throw new Error(
        "USERNAME_DATA_INVALID"
      );

    }


    /* ================================
       STEP 2
       FIREBASE EMAIL LOGIN
    ================================= */

    const loginURL =
      "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" +
      API_KEY;


    const authResponse =
      await fetch(loginURL,{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          email:user.email,

          password:password,

          returnSecureToken:true

        })

      });


    const authData =
      await authResponse.json();


    if(!authResponse.ok){

      if(
        authData.error &&
        authData.error.message ===
        "INVALID_PASSWORD"
      ){

        throw new Error(
          "INVALID_PASSWORD"
        );

      }

      if(
        authData.error &&
        authData.error.message ===
        "EMAIL_NOT_FOUND"
      ){

        throw new Error(
          "EMAIL_NOT_FOUND"
        );

      }

      throw new Error(
        authData.error?.message ||
        "LOGIN_FAILED"
      );

    }


    /* ================================
       STEP 3
       VERIFY UID
    ================================= */

    if(authData.localId !== user.uid){

      throw new Error(
        "ACCOUNT_MISMATCH"
      );

    }


    /* ================================
       STEP 4
       LOAD PROFILE
    ================================= */

    const profile =
      await loadUserProfile(
        user.uid,
        authData.idToken,
        user
      );


    /* ================================
       STEP 5
       CLEAR OLD SESSION
    ================================= */

    clearOldSession();


    /* ================================
       STEP 6
       SAVE NEW SESSION
    ================================= */

    saveSession(

      authData.idToken,

      authData.refreshToken,

      authData.localId,

      profile

    );


    /* ================================
       STEP 7
       VERIFY SESSION WAS SAVED
    ================================= */

    const savedUID =
      localStorage.getItem(
        "crockcell_uid"
      );

    const savedToken =
      localStorage.getItem(
        "crockcell_idToken"
      );


    if(!savedUID || !savedToken){

      throw new Error(
        "SESSION_SAVE_FAILED"
      );

    }


    showMessage(
      "Login successful. Opening CROCKCELL...",
      "#6cff8d"
    );


    loginBtn.textContent =
      "Opening...";


    /* ================================
       STEP 8
       OPEN HOME
    ================================= */

    setTimeout(function(){

      window.location.replace(
        "./home.html"
      );

    },500);


  }catch(error){

    console.error(
      "CROCKCELL LOGIN ERROR:",
      error
    );


    let text =
      "Login failed.";


    if(error.message === "USERNAME_NOT_FOUND"){

      text =
        "Username nahi mila.";

    }
    else if(
      error.message === "INVALID_PASSWORD"
    ){

      text =
        "Password galat hai.";

    }
    else if(
      error.message === "EMAIL_NOT_FOUND"
    ){

      text =
        "Account nahi mila.";

    }
    else if(
      error.message === "ACCOUNT_MISMATCH"
    ){

      text =
        "Account verification failed.";

    }
    else if(
      error.message === "SESSION_SAVE_FAILED"
    ){

      text =
        "Login session save nahi ho paaya.";

    }
    else{

      text =
        error.message || "Login failed.";

    }


    showMessage(
      text,
      "#ff6b6b"
    );


    loginBtn.disabled = false;

    loginBtn.textContent = "Login";

  }

}


/* ================================
   ENTER KEY LOGIN
================================ */

usernameInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      passwordInput.focus();

    }

  }
);


passwordInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      login();

    }

  }
);

</script>

</body>
</html>
