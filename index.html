<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROCKCELL - Login</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#fafafa;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

.box{
  width:92%;
  max-width:380px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:18px;
  padding:30px 22px;
  text-align:center;
}

.logo{
  font-size:34px;
  font-weight:900;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.forgot{
  display:block;
  margin-top:18px;
  color:#111;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
}

.signup{
  display:block;
  margin-top:22px;
  padding-top:20px;
  border-top:1px solid #eee;
  color:#111;
  text-decoration:none;
  font-size:14px;
}

#msg{
  margin-top:15px;
  font-size:14px;
  line-height:1.4;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">CROCKCELL</div>

  <input
    id="email"
    type="email"
    placeholder="Email address"
    autocomplete="email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button id="loginBtn">
    Login
  </button>

  <a class="forgot" href="forgot-password.html">
    Forgot Password?
  </a>

  <a class="signup" href="signup.html">
    Don't have an account? Sign Up
  </a>

  <div id="msg"></div>

</div>

<script>

const API_KEY=
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const email=document.getElementById("email");
const password=document.getElementById("password");
const loginBtn=document.getElementById("loginBtn");
const msg=document.getElementById("msg");

loginBtn.onclick=async function(){

  const e=email.value.trim();
  const p=password.value;

  msg.innerText="";
  msg.style.color="#111";

  if(!e||!p){
    msg.innerText="Email and password enter karo.";
    return;
  }

  loginBtn.disabled=true;
  loginBtn.innerText="Logging in...";

  try{

    const r=await fetch(
      "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+
      API_KEY,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email:e,
          password:p,
          returnSecureToken:true
        })
      }
    );

    const data=await r.json();

    if(!r.ok){

      let error=data.error?.message||"Login failed.";

      if(error==="INVALID_LOGIN_CREDENTIALS"){
        error="Email ya password galat hai.";
      }

      if(error==="EMAIL_NOT_FOUND"){
        error="Is email se account nahi mila.";
      }

      if(error==="INVALID_PASSWORD"){
        error="Password galat hai.";
      }

      throw new Error(error);
    }

    localStorage.setItem(
      "crockcellIdToken",
      data.idToken
    );

    localStorage.setItem(
      "crockcellRefreshToken",
      data.refreshToken
    );

    localStorage.setItem(
      "crockcellUid",
      data.localId
    );

    localStorage.setItem(
      "crockcellProfile",
      JSON.stringify({
        email:data.email,
        uid:data.localId
      })
    );

    msg.style.color="green";
    msg.innerText="Login successful!";

    setTimeout(()=>{
      location.href="home.html";
    },500);

  }catch(e){

    msg.style.color="#c00";
    msg.innerText=e.message;

    loginBtn.disabled=false;
    loginBtn.innerText="Login";
  }

};

password.addEventListener("keydown",function(e){

  if(e.key==="Enter"){
    loginBtn.click();
  }

});

</script>

</body>
</html>
