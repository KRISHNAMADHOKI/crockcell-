<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CROCKCELL - Login</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      min-height:100vh;
      background:#000;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .box{
      width:100%;
      max-width:400px;
      text-align:center;
    }

    .logo{
      font-size:42px;
      font-weight:800;
      letter-spacing:2px;
      margin-bottom:10px;
    }

    .tagline{
      color:#aaa;
      margin-bottom:35px;
      font-size:14px;
    }

    .input-box{
      position:relative;
      margin-bottom:15px;
    }

    input{
      width:100%;
      padding:16px;
      padding-right:55px;
      border:1px solid #333;
      border-radius:12px;
      background:#111;
      color:#fff;
      font-size:16px;
      outline:none;
    }

    input:focus{
      border-color:#777;
    }

    .password-toggle{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:transparent;
      color:#aaa;
      font-size:14px;
      cursor:pointer;
      padding:8px;
    }

    .login-btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:12px;
      background:#fff;
      color:#000;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      margin-top:5px;
    }

    .login-btn:disabled{
      opacity:.5;
    }

    .forgot{
      display:block;
      margin:20px 0;
      color:#fff;
      text-decoration:none;
      font-size:14px;
    }

    .forgot:hover{
      text-decoration:underline;
    }

    .message{
      min-height:22px;
      margin-top:15px;
      font-size:14px;
      color:#ff7777;
    }

    .signup{
      margin-top:25px;
      color:#aaa;
      font-size:14px;
    }

    .signup a{
      color:#fff;
      text-decoration:none;
      font-weight:bold;
    }

    .signup a:hover{
      text-decoration:underline;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">CROCKCELL</div>

    <div class="tagline">
      Connect. Share. Create.
    </div>

    <form id="loginForm">

      <div class="input-box">
        <input
          type="text"
          id="username"
          placeholder="Username"
          autocomplete="username"
          required
        >
      </div>

      <div class="input-box">

        <input
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="password-toggle"
          id="togglePassword"
        >
          Show
        </button>

      </div>

      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Login
      </button>

    </form>

    <a class="forgot" href="forgot-password.html">
      Forgot Password?
    </a>

    <div class="message" id="message"></div>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Sign Up</a>
    </div>

  </div>


<script>

const API_KEY = "AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID = "crockcell-cd2e6";


const loginForm = document.getElementById("loginForm");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");


/* SHOW / HIDE PASSWORD */

togglePassword.addEventListener("click", function(){

  if(passwordInput.type === "password"){

    passwordInput.type = "text";
    togglePassword.textContent = "Hide";

  }else{

    passwordInput.type = "password";
    togglePassword.textContent = "Show";

  }

});


/* FIRESTORE USERNAME LOOKUP */

async function findUserByUsername(username){

  const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents:runQuery?key=" +
    API_KEY;


  const requestBody = {

    structuredQuery:{

      from:[
        {
          collectionId:"usernameIndex"
        }
      ],

      where:{
        fieldFilter:{
          field:{
            fieldPath:"username"
          },

          op:"EQUAL",

          value:{
            stringValue:username
          }
        }
      },

      limit:1

    }

  };


  const response = await fetch(url,{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify(requestBody)

  });


  const data = await response.json();


  if(!response.ok){

    throw new Error(
      "Username search nahi ho pa rahi. Firestore settings check karo."
    );

  }


  if(!data || !data.length){

    return null;

  }


  const document = data[0].document;

  if(!document){

    return null;

  }


  const fields = document.fields || {};


  return {

    uid: fields.uid?.stringValue || "",

    email: fields.email?.stringValue || "",

    username: fields.username?.stringValue || username

  };

}


/* LOGIN */

loginForm.addEventListener("submit", async function(e){

  e.preventDefault();


  const username =
    usernameInput.value.trim().toLowerCase();

  const password =
    passwordInput.value;


  message.textContent = "";

  loginBtn.disabled = true;

  loginBtn.textContent = "Logging in...";


  try{

    if(username.length < 3){

      throw new Error(
        "Username kam se kam 3 characters ka hona chahiye."
      );

    }


    /* FIND USERNAME */

    const user = await findUserByUsername(username);


    if(!user){

      throw new Error(
        "Ye username registered nahi hai."
      );

    }


    /*
      UsernameIndex me email saved hai
      to us email se Firebase login hoga.
    */

    if(!user.email){

      throw new Error(
        "Is account ka username login setup complete nahi hai. Pehle account ko update karna hoga."
      );

    }


    /* FIREBASE AUTH LOGIN */

    const response = await fetch(

      "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" +
      API_KEY,

      {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          email:user.email,

          password:password,

          returnSecureToken:true

        })

      }

    );


    const data = await response.json();


    if(!response.ok){

      if(
        data.error &&
        data.error.message === "INVALID_LOGIN_CREDENTIALS"
      ){

        throw new Error(
          "Username ya password galat hai."
        );

      }


      if(
        data.error &&
        data.error.message === "EMAIL_NOT_FOUND"
      ){

        throw new Error(
          "Ye account registered nahi hai."
        );

      }


      if(
        data.error &&
        data.error.message === "INVALID_PASSWORD"
      ){

        throw new Error(
          "Password galat hai."
        );

      }


      throw new Error(
        data.error?.message || "Login failed."
      );

    }


    /* SAVE LOGIN INFORMATION */

    localStorage.setItem(
      "crockcellIdToken",
      data.idToken
    );


    localStorage.setItem(
      "crockcellRefreshToken",
      data.refreshToken
    );


    localStorage.setItem(
      "crockcellUid",
      data.localId
    );


    localStorage.setItem(

      "crockcellProfile",

      JSON.stringify({

        email:data.email,

        uid:data.localId,

        username:user.username

      })

    );


    message.style.color = "#77ff99";

    message.textContent =
      "Login successful!";


    setTimeout(function(){

      location.href = "home.html";

    },500);


  }catch(error){

    message.style.color = "#ff7777";

    message.textContent =
      error.message;


    loginBtn.disabled = false;

    loginBtn.textContent =
      "Login";

  }

});

</script>

</body>
</html>
