<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROCKCELL</title><link rel="stylesheet" href="style.css">
</head><body>
<main class="app">
<section class="hero">
<div class="brand">CROCKCELL</div><h1>Connect. Create. Share.</h1><p>Your clean social space.</p>
</section>
<section class="card stack">
<input id="email" class="input" placeholder="Email" type="email">
<input id="password" class="input" placeholder="Password" type="password">
<button id="login" class="btn primary">Login</button>
<button id="signup" class="btn">Create account</button>
<div id="msg" class="notice hidden"></div>
</section>
</main>
<script src="core.js"></script>
<script>
const API=CrockCell.API_KEY;
const $=id=>document.getElementById(id);
function msg(t){$("msg").textContent=t;$("msg").classList.remove("hidden")}
async function auth(mode){
 const email=$("email").value.trim(), password=$("password").value;
 if(!email||!password)return msg("Email aur password enter karo.");
 const endpoint=mode==="login"?"accounts:signInWithPassword":"accounts:signUp";
 const r=await fetch(`https://identitytoolkit.googleapis.com/v1/${endpoint}?key=${API}`,{
 method:"POST",headers:{"Content-Type":"application/json"},
 body:JSON.stringify({email,password,returnSecureToken:true})
 });
 const d=await r.json();
 if(!r.ok)return msg(d.error?.message||"Login error.");
 CrockCell.setSession({idToken:d.idToken,refreshTokenValue:d.refreshToken,userId:d.localId});
 location.href="home.html";
}
$("login").onclick=()=>auth("login");$("signup").onclick=()=>auth("signup");
</script></body></html>
