<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CROCKCELL - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111, #252525);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #181818;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.5);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: none;
      outline: none;
      border-radius: 10px;
      background: #292929;
      color: white;
      font-size: 15px;
    }

    input::placeholder {
      color: #999;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #result {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
      color: #aaa;
    }

    .signup a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">CROCKCELL</div>

  <div class="tagline">
    Connect • Create • Share
  </div>

  <input
    type="email"
    id="email"
    placeholder="Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button id="loginBtn">
    Log In
  </button>

  <div id="result"></div>

  <div class="signup">
    Don't have an account?
    <a href="signup.html">Sign Up</a>
  </div>

</div>

<script>

const apiKey =
  "AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const loginBtn =
  document.getElementById("loginBtn");

const result =
  document.getElementById("result");


loginBtn.addEventListener("click", async () => {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if (!email || !password) {

    result.style.color = "#ff7777";

    result.innerText =
      "Please enter email and password.";

    return;
  }


  loginBtn.disabled = true;

  loginBtn.innerText =
    "Logging in...";

  result.style.color = "#aaa";

  result.innerText =
    "Please wait...";


  try {

    const response = await fetch(
      "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + apiKey,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          email: email,

          password: password,

          returnSecureToken: true

        })
      }
    );


    const data =
      await response.json();


    if (!response.ok) {

      let message =
        "Login failed.";

      if (data.error &&
          data.error.message) {

        if (
          data.error.message ===
          "EMAIL_NOT_FOUND"
        ) {

          message =
            "Account not found.";

        } else if (
          data.error.message ===
          "INVALID_PASSWORD"
        ) {

          message =
            "Incorrect password.";

        } else if (
          data.error.message ===
          "INVALID_LOGIN_CREDENTIALS"
        ) {

          message =
            "Email or password is incorrect.";

        } else {

          message =
            data.error.message;

        }
      }

      throw new Error(message);
    }


    localStorage.setItem(
      "crockcellIdToken",
      data.idToken
    );

    localStorage.setItem(
      "crockcellUid",
      data.localId
    );


    localStorage.setItem(
      "crockcellProfile",
      JSON.stringify({

        email: data.email,

        uid: data.localId

      })
    );


    result.style.color =
      "#7CFF8A";

    result.innerText =
      "Login successful! ✅";


    setTimeout(() => {

      window.location.replace(
        "home.html"
      );

    }, 500);

  }


  catch (error) {

    console.log(error);

    result.style.color =
      "#ff7777";

    result.innerText =
      error.message;

    loginBtn.disabled =
      false;

    loginBtn.innerText =
      "Log In";

  }

});

</script>

</body>
</html>
