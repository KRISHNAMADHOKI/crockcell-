<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CROCKCELL Reels</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}button{font:inherit}#reelsContainer{position:fixed;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}#reelsContainer::-webkit-scrollbar{display:none}.reel{position:relative;width:100%;height:100%;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111;display:block}.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.4),transparent 25%,transparent 55%,rgba(0,0,0,.55));pointer-events:none}.topBar{position:absolute;top:0;left:0;right:0;height:80px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;z-index:20;pointer-events:none}.reelsTitle{font-size:22px;font-weight:800;text-shadow:0 2px 8px #000}.playBtn,.soundBtn{position:absolute;z-index:30;border:1px solid rgba(255,255,255,.22);border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer}.playBtn{left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;font-size:30px}.playBtn.hidden{display:none}.soundBtn{right:15px;top:82px;width:46px;height:46px;font-size:19px}.actions{position:absolute;right:12px;bottom:112px;z-index:35;display:flex;flex-direction:column;gap:14px}.actionBox{display:flex;flex-direction:column;align-items:center;gap:3px}.actionBtn{width:49px;height:49px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(0,0,0,.48);color:#fff;font-size:23px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px)}.actionBtn:active,.playBtn:active,.soundBtn:active{transform:scale(.9)}.playBtn:active{transform:translate(-50%,-50%) scale(.9)}.actionCount{font-size:12px;font-weight:700;text-shadow:0 1px 5px #000}.likeBtn.liked{color:#ff3b6b}.reelInfo{position:absolute;left:15px;right:82px;bottom:91px;z-index:25;text-shadow:0 2px 7px #000}.username{font-size:18px;font-weight:700;margin-bottom:7px}.caption{font-size:15px;line-height:1.35}.audioLabel{margin-top:8px;font-size:12px;color:#ddd}.bottomNav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:60px;z-index:5000;display:flex;align-items:center;justify-content:space-around;pointer-events:auto}.navItem{width:19%;max-width:82px;height:55px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:rgba(255,255,255,.75);font-size:10px;font-weight:700;border-radius:17px;background:rgba(10,10,10,.42);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.navItem.active{color:#fff;background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.24)}.navIcon{width:28px;height:27px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:2px}.profileNavPhoto{width:27px;height:27px;border-radius:50%;object-fit:cover;background:#333;border:2px solid rgba(255,255,255,.8)}#commentsOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;display:none}.commentsPanel{position:absolute;left:0;right:0;bottom:0;height:70vh;background:#111;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}.commentsHeader{height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #333}.commentsTitle{font-size:18px;font-weight:700}.closeBtn{width:42px;height:42px;border:0;background:none;color:#fff;font-size:28px;cursor:pointer}.commentsList{flex:1;overflow-y:auto;padding:10px 15px}.commentItem{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #292929}.avatar{width:38px;height:38px;flex-shrink:0;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-weight:700}.commentBody{flex:1;min-width:0}.commentUser{font-weight:700;font-size:14px;margin-bottom:4px}.commentText{font-size:14px;color:#ddd;word-break:break-word}.deleteComment{margin-top:6px;padding:0;border:0;background:none;color:#ff5555;font-size:12px;cursor:pointer}.noComments{text-align:center;color:#aaa;padding:35px 10px}.commentInputArea{display:flex;gap:8px;padding:12px;border-top:1px solid #333}.commentInputArea input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid #444;background:#222;color:#fff;padding:0 16px;outline:none;font-size:14px}.commentInputArea button{width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#000;font-size:18px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:20000;background:rgba(20,20,20,.92);border:1px solid #444;border-radius:20px;padding:10px 15px;font-size:13px;display:none}@media(max-width:380px){.actions{right:9px;bottom:108px}.actionBtn{width:46px;height:46px}.reelInfo{bottom:88px}.navItem{font-size:9px;height:53px}}
</style>
</head>
<body>
<div id="reelsContainer">
<script>
const DEMO_REELS=[
 {id:'demo_reel_1',src:'https://www.w3schools.com/html/mov_bbb.mp4',user:'@CROCKCELL',caption:'Welcome to CROCKCELL Reels 🎬',audio:'Demo video • original audio'},
 {id:'demo_reel_2',src:'https://www.w3schools.com/html/mov_bbb.mp4',user:'@CROCKCELL',caption:'Create • Share • Connect',audio:'Demo video • original audio'},
 {id:'demo_reel_3',src:'https://www.w3schools.com/html/mov_bbb.mp4',user:'@CROCKCELL',caption:'Your next Reel starts here ✨',audio:'Demo video • original audio'},
 {id:'demo_reel_4',src:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',user:'@CROCKCELL',caption:'Enjoy the Reel experience 🌸',audio:'Demo video audio'},
 {id:'demo_reel_5',src:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',user:'@CROCKCELL',caption:'Scroll for the next Reel 👆',audio:'Demo video audio'},
 {id:'demo_reel_6',src:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',user:'@CROCKCELL',caption:'CROCKCELL — Connect • Create • Share',audio:'Demo video audio'}
];
function reelHTML(r){return `<section class="reel" data-reel-id="${r.id}"><video preload="metadata" playsinline loop muted src="${r.src}"></video><div class="shade"></div><div class="topBar"><div class="reelsTitle">CROCKCELL Reels</div></div><button class="playBtn" type="button" onclick="togglePlay(this,event)">▶</button><button class="soundBtn" type="button" onclick="toggleSound(this,event)">🔇</button><div class="actions"><div class="actionBox"><button class="actionBtn likeBtn" type="button" onclick="likeReel(this,event)">♡</button><span class="actionCount likeCount">0</span></div><div class="actionBox"><button class="actionBtn" type="button" onclick="openComments(this,event)">💬</button><span class="actionCount commentCount">0</span></div><div class="actionBox"><button class="actionBtn" type="button" onclick="shareReel(this,event)">↗</button><span class="actionCount">Share</span></div></div><div class="reelInfo"><div class="username">${r.user}</div><div class="caption">${r.caption}</div><div class="audioLabel">🎵 ${r.audio}</div></div></section>`}
document.getElementById('reelsContainer').innerHTML=DEMO_REELS.map(reelHTML).join('');
</script>
</div>
<nav class="bottomNav"><a href="home.html" class="navItem"><div class="navIcon">⌂</div><div>Home</div></a><a href="search.html" class="navItem"><div class="navIcon">⌕</div><div>Search</div></a><a href="reels.html" class="navItem active"><div class="navIcon">▶</div><div>Reels</div></a><a href="messages.html" class="navItem"><div class="navIcon">✉</div><div>Messages</div></a><a href="profile.html" class="navItem"><div class="navIcon"><img id="navProfilePhoto" class="profileNavPhoto" src="" alt="Profile"></div><div>Profile</div></a></nav>
<div id="commentsOverlay"><div class="commentsPanel"><div class="commentsHeader"><div class="commentsTitle">Comments <span id="commentsNumber">(0)</span></div><button class="closeBtn" type="button" onclick="closeComments()">×</button></div><div id="commentsList" class="commentsList"><div class="noComments">Loading...</div></div><div class="commentInputArea"><input id="commentInput" maxlength="300" placeholder="Write a comment..."><button id="sendComment" type="button" onclick="sendComment()">➤</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const PROJECT_ID='crockcell-cd2e6';
const token=localStorage.getItem('crockcellIdToken')||localStorage.getItem('crockcell_idToken')||sessionStorage.getItem('crockcellIdToken')||sessionStorage.getItem('crockcell_idToken')||'';
const uid=localStorage.getItem('crockcellUid')||localStorage.getItem('crockcell_uid')||sessionStorage.getItem('crockcellUid')||sessionStorage.getItem('crockcell_uid')||'';
if(!token||!uid){location.href='index.html';}
let currentReelId='';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const val=f=>!f?'':f.stringValue!==undefined?f.stringValue:f.integerValue!==undefined?Number(f.integerValue):f.timestampValue!==undefined?f.timestampValue:f.booleanValue!==undefined?f.booleanValue:'';
const url=c=>'https://firestore.googleapis.com/v1/projects/'+PROJECT_ID+'/databases/(default)/documents/'+c;
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.style.display='none',1800)}
async function api(path,opts={}){opts.headers=Object.assign({'Authorization':'Bearer '+token,'Content-Type':'application/json'},opts.headers||{});const r=await fetch(path,opts);let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error?.message||'Request failed');return d}
function reelOf(el){return el.closest('.reel')}
function setPlayUI(reel){const v=reel.querySelector('video'),p=reel.querySelector('.playBtn');p.textContent=v.paused?'▶':'❚❚';p.classList.toggle('hidden',!v.paused)}
function togglePlay(btn,e){e?.stopPropagation();const r=reelOf(btn),v=r.querySelector('video');if(v.paused)v.play().catch(()=>toast('Play ke liye dobara tap karo'));else v.pause();setPlayUI(r)}
function toggleSound(btn,e){e?.stopPropagation();const r=reelOf(btn),v=r.querySelector('video');v.muted=!v.muted;btn.textContent=v.muted?'🔇':'🔊';if(!v.muted)v.play().catch(()=>{});}
function setupVideos(){document.querySelectorAll('.reel').forEach(r=>{const v=r.querySelector('video');v.addEventListener('play',()=>setPlayUI(r));v.addEventListener('pause',()=>setPlayUI(r));v.addEventListener('ended',()=>setPlayUI(r));v.addEventListener('error',()=>toast('Video load nahi hua. Internet check karo.'));v.addEventListener('click',e=>{if(e.target===v)togglePlay(r.querySelector('.playBtn'),e)});setPlayUI(r)})}
const observer=new IntersectionObserver(entries=>entries.forEach(e=>{const r=e.target,v=r.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>.65){document.querySelectorAll('.reel video').forEach(x=>{if(x!==v){x.pause();x.currentTime=0}});v.play().catch(()=>{});}else{v.pause();}}),{threshold:[.65]});
setupVideos();document.querySelectorAll('.reel').forEach(r=>observer.observe(r));
async function loadNavProfile(){try{const img=document.getElementById('navProfilePhoto');let p=null;try{p=JSON.parse(localStorage.getItem('crockcellProfile')||'null')}catch(e){}if(p?.photoURL){img.src=p.photoURL;return}const d=await api(url('users')+'/'+encodeURIComponent(uid));const photo=val(d.fields?.photoURL);if(photo)img.src=photo}catch(e){}}
loadNavProfile();
async function likeReel(btn,e){e?.stopPropagation();const r=reelOf(btn),id=r.dataset.reelId,key=id+'_'+uid;try{const existing=await fetch(url('reelLikes')+'/'+encodeURIComponent(key),{headers:{Authorization:'Bearer '+token}});if(existing.ok){await api(url('reelLikes')+'/'+encodeURIComponent(key),{method:'DELETE'});btn.textContent='♡';}else{await api(url('reelLikes')+'/'+encodeURIComponent(key),{method:'PATCH',body:JSON.stringify({fields:{reelId:{stringValue:id},userId:{stringValue:uid},createdAt:{timestampValue:new Date().toISOString()}}})});btn.textContent='♥';}await loadLikeCount(r)}catch(e){toast('Like save nahi hua')}}
async function loadLikeCount(r){try{const d=await api(url('reelLikes')+'?pageSize=300');let n=0;(d.documents||[]).forEach(x=>{if(val(x.fields?.reelId)===r.dataset.reelId)n++});r.querySelector('.likeCount').textContent=n}catch(e){}}
async function checkLike(r){try{const x=await fetch(url('reelLikes')+'/'+encodeURIComponent(r.dataset.reelId+'_'+uid),{headers:{Authorization:'Bearer '+token}});if(x.ok)r.querySelector('.likeBtn').textContent='♥';loadLikeCount(r)}catch(e){}}
document.querySelectorAll('.reel').forEach(checkLike);
async function shareReel(btn,e){e?.stopPropagation();const r=reelOf(btn),text=r.querySelector('.caption').textContent;try{if(navigator.share)await navigator.share({title:'CROCKCELL Reel',text});else{await navigator.clipboard?.writeText(text);toast('Reel text copied')}}catch(e){}}
async function openComments(btn,e){e?.stopPropagation();const r=reelOf(btn);currentReelId=r.dataset.reelId;document.getElementById('commentsOverlay').style.display='block';document.getElementById('commentsList').innerHTML='<div class="noComments">Loading comments...</div>';await loadComments();document.getElementById('commentInput').focus()}
function closeComments(){document.getElementById('commentsOverlay').style.display='none';currentReelId=''}
async function loadComments(){try{const d=await api(url('comments')+'?pageSize=300');const a=[];(d.documents||[]).forEach(x=>{const f=x.fields||{};if(val(f.reelId)===currentReelId)a.push({id:x.name.split('/').pop(),userId:val(f.userId),username:val(f.username)||'User',text:val(f.text),createdAt:val(f.createdAt)})});a.sort((x,y)=>new Date(x.createdAt||0)-new Date(y.createdAt||0));renderComments(a);const r=document.querySelector('.reel[data-reel-id="'+CSS.escape(currentReelId)+'"]');if(r)r.querySelector('.commentCount').textContent=a.length}catch(e){document.getElementById('commentsList').innerHTML='<div class="noComments">Comments load nahi hue.</div>'}}
function renderComments(a){document.getElementById('commentsNumber').textContent='('+a.length+')';const list=document.getElementById('commentsList');if(!a.length){list.innerHTML='<div class="noComments">Abhi koi comment nahi hai.<br>Pehla comment karo!</div>';return}list.innerHTML=a.map(c=>`<div class="commentItem"><div class="avatar">${esc((c.username||'U')[0].toUpperCase())}</div><div class="commentBody"><div class="commentUser">@${esc(c.username)}</div><div class="commentText">${esc(c.text)}</div>${c.userId===uid?`<button class="deleteComment" onclick="deleteComment('${esc(c.id)}')">Delete</button>`:''}</div></div>`).join('')}
async function sendComment(){const input=document.getElementById('commentInput'),text=input.value.trim();if(!text||!currentReelId)return;const b=document.getElementById('sendComment');b.disabled=true;try{let username='User';try{const p=await api(url('users')+'/'+encodeURIComponent(uid));username=val(p.fields?.username)||val(p.fields?.name)||'User'}catch(e){}const id=currentReelId+'_'+uid+'_'+Date.now();await api(url('comments')+'/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({fields:{reelId:{stringValue:currentReelId},userId:{stringValue:uid},username:{stringValue:username},text:{stringValue:text},createdAt:{timestampValue:new Date().toISOString()}}})});input.value='';await loadComments()}catch(e){toast('Comment save nahi hua')}finally{b.disabled=false}}
async function deleteComment(id){try{await api(url('comments')+'/'+encodeURIComponent(id),{method:'DELETE'});await loadComments()}catch(e){toast('Delete nahi hua')}}
document.getElementById('commentsOverlay').addEventListener('click',e=>{if(e.target.id==='commentsOverlay')closeComments()});
document.getElementById('commentInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendComment()});
</script>
</body>
</html>
