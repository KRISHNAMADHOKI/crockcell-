<script>

/* ==================================================
   FIREBASE
================================================== */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";

const BASE =
"https://firestore.googleapis.com/v1/projects/"
+
PROJECT_ID
+
"/databases/(default)/documents";


/* ==================================================
   SESSION
================================================== */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let myUID =
localStorage.getItem(
  "crockcell_uid"
);


if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}


if(!myUID){

  myUID =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}


if(!token || !myUID){

  location.replace(
    "index.html"
  );

}


/* ==================================================
   VARIABLES
================================================== */

let selectedUser = null;

let chatTimer = null;


/* ==================================================
   ELEMENTS
================================================== */

const listPage =
document.getElementById(
  "listPage"
);

const chatPage =
document.getElementById(
  "chat"
);

const list =
document.getElementById(
  "list"
);

const searchInput =
document.getElementById(
  "searchInput"
);

const chatMessages =
document.getElementById(
  "chatMessages"
);

const messageInput =
document.getElementById(
  "messageInput"
);

const inputBar =
document.getElementById(
  "inputBar"
);


/* ==================================================
   URL PARAMETERS
================================================== */

/*
   Profile page se URL:

   messages.html?uid=UID
   &username=USERNAME
   &name=NAME

   yahan receive honge.
*/

const params =
new URLSearchParams(
  window.location.search
);


const urlUID =
params.get("uid");

const urlUsername =
params.get("username");

const urlName =
params.get("name");


/* ==================================================
   START
================================================== */

/*
   Agar profile se direct Message
   button se aaye hain to pehle
   target account open hoga.
*/

if(urlUID){

  openURLUser();

}else{

  loadRecentChats();

}


/* ==================================================
   OPEN USER FROM PROFILE URL
================================================== */

async function openURLUser(){

  /*
     Pehle URL se temporary user
     bana dete hain.

     Isse Firebase profile load
     hone ka wait nahi karna padega.
  */

  const temporaryUser = {

    uid:urlUID,

    name:
    urlName ||
    "User",

    username:
    urlUsername ||
    "user",

    photoURL:""

  };


  /*
     DIRECT CHAT OPEN
  */

  openChat(
    temporaryUser
  );


  /*
     Firebase se actual profile
     information load karo.
  */

  try{

    const actualUser =
    await getUserByUID(
      urlUID
    );


    if(actualUser){

      /*
         Agar profile mil gayi to
         actual name/photo update.
      */

      selectedUser =
      actualUser;


      document.getElementById(
        "chatName"
      ).textContent =
      actualUser.name;


      document.getElementById(
        "chatUsername"
      ).textContent =
      "@"+
      actualUser.username;


      document.getElementById(
        "chatAvatar"
      ).src =
      actualUser.photoURL ||
      placeholder();


    }


  }catch(error){

    console.log(
      "Profile update error:",
      error
    );

  }

}


/* ==================================================
   GET USER BY UID
================================================== */

async function getUserByUID(
  uid
){

  if(!uid){

    return null;

  }


  const response =
  await fetch(

    BASE+
    "/users/"+
    encodeURIComponent(uid),

    {

      headers:{

        Authorization:
        "Bearer "+token

      }

    }

  );


  if(!response.ok){

    return null;

  }


  const data =
  await response.json();


  const f =
  data.fields ||
  {};


  return {

    uid:uid,

    name:
    f.name?.stringValue ||
    f.username?.stringValue ||
    "User",

    username:
    f.username?.stringValue ||
    "user",

    photoURL:
    f.photoURL?.stringValue ||
    "",

    bio:
    f.bio?.stringValue ||
    ""

  };

}


/* ==================================================
   FIRESTORE MESSAGE QUERY
================================================== */

async function queryMessages(
  field,
  value
){

  const response =
  await fetch(

    BASE+
    ":runQuery?key="+
    API_KEY,

    {

      method:"POST",

      headers:{

        Authorization:
        "Bearer "+token,

        "Content-Type":
        "application/json"

      },

      body:
      JSON.stringify({

        structuredQuery:{

          from:[

            {
              collectionId:
              "messages"
            }

          ],

          where:{

            fieldFilter:{

              field:{

                fieldPath:
                field

              },

              op:
              "EQUAL",

              value:{

                stringValue:
                value

              }

            }

          },

          limit:100

        }

      })

    }

  );


  const text =
  await response.text();


  if(!response.ok){

    throw new Error(
      text
    );

  }


  let data;


  try{

    data =
    JSON.parse(
      text
    );

  }catch{

    data =
    text
    .split("\n")
    .filter(Boolean)
    .map(
      x =>
      JSON.parse(x)
    );

  }


  if(!Array.isArray(data)){

    data=[
      data
    ];

  }


  return data;

}


/* ==================================================
   RECENT CHATS
================================================== */

async function loadRecentChats(){

  list.innerHTML =
  `<div class="empty">
    Messages load ho rahe hain...
  </div>`;


  try{

    const sent =
    await queryMessages(
      "senderId",
      myUID
    );


    const received =
    await queryMessages(
      "receiverId",
      myUID
    );


    const all =
    [
      ...sent,
      ...received
    ];


    const users =
    new Map();


    all.forEach(
      row => {

        if(!row.document){

          return;

        }


        const f =
        row.document.fields ||
        {};


        const sender =
        f.senderId?.stringValue ||
        "";


        const receiver =
        f.receiverId?.stringValue ||
        "";


        const other =
        sender === myUID
        ? receiver
        : sender;


        if(!other){

          return;

        }


        const created =
        f.createdAt?.timestampValue ||
        "";


        const old =
        users.get(
          other
        );


        if(

          !old ||

          new Date(created) >
          new Date(old.createdAt)

        ){

          users.set(

            other,

            {

              uid:other,

              text:
              f.text?.stringValue ||
              "",

              createdAt:
              created

            }

          );

        }

      }

    );


    if(!users.size){

      list.innerHTML =
      `<div class="empty">
        Abhi koi chat nahi hai.<br><br>
        Search karke kisi user ko message karo.
      </div>`;

      return;

    }


    list.innerHTML =
    "";


    for(
      const chat of users.values()
    ){

      const row =
      createLoadingUser(
        chat
      );


      loadUserAndUpdateRow(
        chat.uid,
        row,
        chat.text
      );

    }


  }catch(error){

    console.error(
      error
    );


    list.innerHTML =
    `<div class="error">
      Messages error:<br><br>
      ${escapeHTML(
        error.message
      )}
    </div>`;

  }

}


/* ==================================================
   CREATE LOADING USER
================================================== */

function createLoadingUser(
  chat
){

  const row =
  document.createElement(
    "div"
  );


  row.className =
  "user";


  row.innerHTML = `

    <img
      class="avatar"
      src="${placeholder()}"
      alt=""
    >

    <div class="info">

      <div class="name">
        Loading account...
      </div>

      <div class="username">
        Please wait
      </div>

      <div class="last">
        ${escapeHTML(
          chat.text
        )}
      </div>

    </div>

    <button
      class="open"
      type="button"
    >
      Open
    </button>

  `;


  row.onclick =
  function(){

    openChat({

      uid:chat.uid,

      name:"User",

      username:"user",

      photoURL:""

    });

  };


  row.querySelector(
    ".open"
  ).onclick =
  function(e){

    e.stopPropagation();


    openChat({

      uid:chat.uid,

      name:"User",

      username:"user",

      photoURL:""

    });

  };


  list.appendChild(
    row
  );


  return row;

}


/* ==================================================
   LOAD USER FOR RECENT CHAT
================================================== */

async function loadUserAndUpdateRow(
  uid,
  row,
  lastText
){

  try{

    const user =
    await getUserByUID(
      uid
    );


    if(!user){

      throw new Error(
        "User profile not found"
      );

    }


    row.querySelector(
      ".name"
    ).textContent =
    user.name;


    row.querySelector(
      ".username"
    ).textContent =
    "@"+
    user.username;


    row.querySelector(
      ".last"
    ).textContent =
    lastText;


    const avatar =
    row.querySelector(
      ".avatar"
    );


    avatar.src =
    user.photoURL ||
    placeholder();


    row.onclick =
    function(){

      openChat(
        user
      );

    };


    row.querySelector(
      ".open"
    ).onclick =
    function(e){

      e.stopPropagation();

      openChat(
        user
      );

    };


  }catch(error){

    console.error(
      error
    );


    row.querySelector(
      ".name"
    ).textContent =
    "Account";


    row.querySelector(
      ".username"
    ).textContent =
    "Open chat";


    row.onclick =
    function(){

      openChat({

        uid:uid,

        name:"Account",

        username:"user",

        photoURL:""

      });

    };

  }

}


/* ==================================================
   SEARCH
================================================== */

document.getElementById(
  "searchBtn"
).onclick =
searchUsers;


searchInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      searchUsers();

    }

  }
);


/* ==================================================
   SEARCH USERS
================================================== */

async function searchUsers(){

  const q =
  searchInput.value
  .trim()
  .toLowerCase();


  if(!q){

    loadRecentChats();

    return;

  }


  list.innerHTML =
  `<div class="empty">
    Searching...
  </div>`;


  try{

    const response =
    await fetch(

      BASE+
      ":runQuery?key="+
      API_KEY,

      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer "+token,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify({

          structuredQuery:{

            from:[

              {
                collectionId:
                "users"
              }

            ],

            orderBy:[

              {

                field:{

                  fieldPath:
                  "username"

                },

                direction:
                "ASCENDING"

              }

            ],

            limit:100

          }

        })

      }

    );


    const text =
    await response.text();


    if(!response.ok){

      throw new Error(
        text
      );

    }


    let rows =
    JSON.parse(
      text
    );


    if(!Array.isArray(rows)){

      rows=[
        rows
      ];

    }


    list.innerHTML =
    "";


    let count=0;


    rows.forEach(
      row => {

        if(!row.document){

          return;

        }


        const f =
        row.document.fields ||
        {};


        const username =
        (
          f.username?.stringValue ||
          ""
        ).toLowerCase();


        const name =
        (
          f.name?.stringValue ||
          ""
        ).toLowerCase();


        if(

          !username.includes(q) &&

          !name.includes(q)

        ){

          return;

        }


        const uid =
        f.uid?.stringValue ||
        "";


        if(

          !uid ||

          uid === myUID

        ){

          return;

        }


        count++;


        createSearchRow({

          uid:uid,

          name:
          f.name?.stringValue ||
          f.username?.stringValue ||
          "User",

          username:
          f.username?.stringValue ||
          "user",

          photoURL:
          f.photoURL?.stringValue ||
          ""

        });

      }

    );


    if(!count){

      list.innerHTML =
      `<div class="empty">
        Koi user nahi mila.
      </div>`;

    }


  }catch(error){

    console.error(
      error
    );


    list.innerHTML =
    `<div class="error">
      Search error:<br><br>
      ${escapeHTML(
        error.message
      )}
    </div>`;

  }

}


/* ==================================================
   SEARCH RESULT ROW
================================================== */

function createSearchRow(
  user
){

  const row =
  document.createElement(
    "div"
  );


  row.className =
  "user";


  row.innerHTML = `

    <img
      class="avatar"
      src="${
        user.photoURL ||
        placeholder()
      }"
      alt=""
    >

    <div class="info">
