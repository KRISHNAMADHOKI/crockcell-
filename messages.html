<script>

/* =================================================

================================================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";

const BASE =
"https://firestore.googleapis.com/v1/projects/" +
PROJECT_ID +
"/databases/(default)/documents";


/* =================================================
   SESSION
================================================= */

let token =
localStorage.getItem(

let currentUID =
localStorage.getItem(

);

  );

/* =================================================

const searchInput =
document.getElementById(

const results =

const status =
document.getElementById(

const listPage =
document.getElementById(

);

const chatPage =
document.getElementById(

);

const inputBar =
document.getElementById(
  "inputBar"
);

const messageInput =
document.getElementById(
  "messageInput"
);

const messageList =
document.getElementById(
  "messageList"
);

const sendBtn =
document.getElementById(
  "sendBtn"
);

let selectedUser =
null;

let refreshTimer =
null;


/* =================================================
   START
================================================= */

loadRecentChats();


/* =================================================
   FIRESTORE QUERY HELPER
================================================= */

async function runQuery(
  fieldPath,
  value
){

  const response =
  await fetch(
    BASE +
    ":runQuery?key=" +
    API_KEY,
    {

      method:"POST",

      headers:{

        Authorization:
        "Bearer " + token,

        "Content-Type":
        "application/json"

      },

      body:JSON.stringify({

        structuredQuery:{

          from:[

            {
              collectionId:
              "messages"
            }

          ],

          where:{

            fieldFilter:{

              field:{
                fieldPath:
                fieldPath
              },

              op:"EQUAL",

              value:{
                stringValue:
                value
              }

            }

          },

          limit:500

        }

      })

    }
  );


  const raw =
  await response.text();


  if(!response.ok){

    throw new Error(
      raw
    );

  }


  /*
    Firestore REST kabhi array
    aur kabhi line-separated JSON
    return kar sakta hai.
  */

  let rows=[];


  try{

    const parsed =
    JSON.parse(raw);


    if(Array.isArray(parsed)){

      rows=parsed;

    }else{

      rows=[parsed];

    }

  }catch{

    rows =
    raw
    .split("\n")
    .filter(Boolean)
    .map(line=>{

      try{

        return JSON.parse(
          line
        );

      }catch{

        return null;

      }

    })
    .filter(Boolean);

  }


  return rows;

}


/* =================================================
   MESSAGE DOCUMENT
================================================= */

function messageFromRow(
  row
){

  if(!row || !row.document){

    return null;

  }


  const f =
  row.document.fields ||
  {};


  return{

    senderId:
    f.senderId?.stringValue ||
    "",

    receiverId:
    f.receiverId?.stringValue ||
    "",

    text:
    f.text?.stringValue ||
    "",

    createdAt:
    f.createdAt?.timestampValue ||
    ""

  };

}


/* =================================================
   GET CURRENT USER'S MESSAGES
================================================= */

async function getMyMessages(){

  /*
    Current user ke sent messages.
  */

  const sentRows =
  await runQuery(
    "senderId",
    currentUID
  );


  /*
    Current user ke received messages.
  */

  const receivedRows =
  await runQuery(
    "receiverId",
    currentUID
  );


  const messages=[];


  sentRows.forEach(
    row=>{

      const message =
      messageFromRow(
        row
      );

      if(message){

        messages.push(
          message
        );

      }

    }
  );


  receivedRows.forEach(
    row=>{

      const message =
      messageFromRow(
        row
      );

      if(message){

        messages.push(
          message
        );

      }

    }
  );


  /*
    Duplicate documents hatao.
  */

  const unique=[];

  const seen =
  new Set();


  messages.forEach(
    message=>{

      const key =
      message.senderId +
      "|" +
      message.receiverId +
      "|" +
      message.createdAt +
      "|" +
      message.text;


      if(!seen.has(key)){

        seen.add(key);

        unique.push(
          message
        );

      }

    }
  );


  unique.sort(
    (a,b)=>
    new Date(
      b.createdAt
    ) -
    new Date(
      a.createdAt
    )
  );


  return unique;

}


/* =================================================
   GET USER
================================================= */

async function getUser(
  uid
){

  const response =
  await fetch(
    BASE +
    "/users/" +
    encodeURIComponent(
      uid
    ),
    {

      headers:{

        Authorization:
        "Bearer " + token

      }

    }
  );


  if(!response.ok){

    return null;

  }


  const data =
  await response.json();


  const f =
  data.fields ||
  {};


  return{

    uid:uid,

    name:
    f.name?.stringValue ||
    f.username?.stringValue ||
    "User",

    username:
    f.username?.stringValue ||
    "user",

    photoURL:
    f.photoURL?.stringValue ||
    ""

  };

}


/* =================================================
   RECENT CHATS
================================================= */

async function loadRecentChats(){

  try{

    status.textContent =
    "Loading...";


    results.innerHTML =
    `<div class="empty">
      Messages load ho rahe hain...
    </div>`;


    const messages =
    await getMyMessages();


    /*
      Latest message per user.
    */

    const latest =
    new Map();


    messages.forEach(
      message=>{

        const otherUID =
        message.senderId === currentUID
        ? message.receiverId
        : message.senderId;


        if(!otherUID){

          return;

        }


        if(
          !latest.has(
            otherUID
          )
        ){

          latest.set(
            otherUID,
            message
          );

        }

      }
    );


    if(!latest.size){

      status.textContent =
      "";

      results.innerHTML =
      `<div class="empty">
        Abhi koi chat nahi hai.<br><br>
        Search karke kisi user ko message karo.
      </div>`;

      return;

    }


    results.innerHTML="";


    for(
      const [
        uid,
        lastMessage
      ]
      of latest
    ){

      const user =
      await getUser(
        uid
      );


      if(!user){

        continue;

      }


      user.lastMessage =
      lastMessage.text;


      createUserRow(
        user
      );

    }


    status.textContent =
    latest.size +
    " chat" +
    (
      latest.size===1
      ? ""
      : "s"
    );


  }catch(error){

    console.error(
      "RECENT CHAT ERROR:",
      error
    );


    status.textContent =
    "";


    results.innerHTML =
    `<div class="error">
      <b>Firebase message error:</b><br><br>
      ${escapeHTML(
        error.message
      )}
    </div>`;

  }

}


/* =================================================
   USER ROW
================================================= */

function createUserRow(
  user
){

  const row =
  document.createElement(
    "div"
  );

  row.className =
  "user";


  row.onclick =
  ()=>openChat(
    user
  );


  const img =
  document.createElement(
    "img"
  );

  img.className =
  "avatar";

  img.src =
  user.photoURL ||
  placeholder();


  const info =
  document.createElement(
    "div"
  );

  info.className =
  "info";


  const name =
  document.createElement(
    "div"
  );

  name.className =
  "name";

  name.textContent =
  user.name;


  const username =
  document.createElement(
    "div"
  );

  username.className =
  "username";

  username.textContent =
  "@" +
  user.username;


  info.appendChild(
    name
  );

  info.appendChild(
    username
  );


  if(user.lastMessage){

    const last =
    document.createElement(
      "div"
    );

    last.className =
    "last";

    last.textContent =
    user.lastMessage;

    info.appendChild(
      last
    );

  }


  const button =
  document.createElement(
    "button"
  );

  button.className =
  "messageBtn";

  button.textContent =
  "Message";


  button.onclick =
  event=>{

    event.stopPropagation();

    openChat(
      user
    );

  };


  row.appendChild(
    img
  );

  row.appendChild(
    info
  );

  row.appendChild(
    button
  );


  results.appendChild(
    row
  );

}


/* =================================================
   SEARCH
================================================= */

async function searchUsers(){

  const text =
  searchInput.value
  .trim()
  .toLowerCase();


  if(!text){

    loadRecentChats();

    return;

  }


  status.textContent =
  "Searching...";


  results.innerHTML =
  `<div class="empty">
    Searching...
  </div>`;


  try{

    const endText =
    text +
    "\uf8ff";


    const response =
    await fetch(
      BASE +
      ":runQuery?key=" +
      API_KEY,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"

        },

        body:JSON.stringify({

          structuredQuery:{

            from:[

              {
                collectionId:
                "users"
              }

            ],

            where:{

              compositeFilter:{

                op:"AND",

                filters:[

                  {
                    fieldFilter:{

                      field:{
                        fieldPath:
                        "username"
                      },

                      op:
                      "GREATER_THAN_OR_EQUAL",

                      value:{
                        stringValue:
                        text
                      }

                    }

                  },

                  {
                    fieldFilter:{

                      field:{
                        fieldPath:
                        "username"
                      },

                      op:"LESS_THAN",

                      value:{
                        stringValue:
                        endText
                      }

                    }

                  }

                ]

              }

            },

            orderBy:[

              {
                field:{
                  fieldPath:
                  "username"
                },

                direction:
                "ASCENDING"
              }

            ],

            limit:30

          }

        })

      }
    );


    const raw =
    await response.text();


    if(!response.ok){

      throw new Error(
        raw
      );

    }


    let rows;


    try{

      rows =
      JSON.parse(
        raw
      );

    }catch{

      rows =
      raw
      .split("\n")
      .filter(Boolean)
      .map(
        x=>JSON.parse(x)
      );

    }


    results.innerHTML="";


    let count=0;


    rows.forEach(
      row=>{

        if(!row.document){

          return;

        }


        const f =
        row.document.fields ||
        {};


        const uid =
        f.uid?.stringValue ||
        "";


        if(
          !uid ||
          uid===currentUID
        ){

          return;

        }


        count++;


        createUserRow({

          uid,

          name:
          f.name?.stringValue ||
          f.username?.stringValue ||
          "User",

          username:
          f.username?.stringValue ||
          "user",

          photoURL:
          f.photoURL?.stringValue ||
          ""

        });

      }
    );


    status.textContent =
    count +
    " users found";


    if(!count){

      results.innerHTML =
      `<div class="empty">
        Koi user nahi mila.
      </div>`;

    }


  }catch(error){

    console.error(
      "SEARCH ERROR:",
      error
    );


    results.innerHTML =
    `<div class="error">
      ${escapeHTML(
        error.message
      )}
    </div>`;

  }

}


/* =================================================
   OPEN CHAT
================================================= */

function openChat(
  user
){

  selectedUser =
  user;


  listPage.style.display =
  "none";


  chatPage.style.display =
  "block";


  inputBar.style.display =
  "flex";


  document.getElementById(
    "chatName"
  ).textContent =
  user.name;


  document.getElementById(
    "chatUsername"
  ).textContent =
  "@" +
  user.username;


  document.getElementById(
    "chatAvatar"
  ).src =
  user.photoURL ||
  placeholder();


  loadChatMessages();


  clearInterval(
    refreshTimer
  );


  refreshTimer =
  setInterval(
    loadChatMessages,
    2500
  );

}


/* =================================================
   LOAD CHAT
================================================= */

async function loadChatMessages(){

  if(!selectedUser){

    return;

  }


  try{

    const messages =
    await getMyMessages();


    const chat =
    messages.filter(
      message=>

      (
        message.senderId===
        currentUID &&

        message.receiverId===
        selectedUser.uid

      )

      ||

      (
        message.senderId===
        selectedUser.uid &&

        message.receiverId===
        currentUID
      )

    );


    chat.sort(
      (a,b)=>
      new Date(
        a.createdAt
      ) -
      new Date(
        b.createdAt
      )
    );


    renderMessages(
      chat
