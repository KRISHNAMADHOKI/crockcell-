<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CROCKCELL Messages</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

.header{
  padding:20px 18px 15px;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(0,0,0,.95);
  backdrop-filter:blur(15px);
}

.title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:15px;
}

.search-row{
  display:flex;
  gap:8px;
}

.search-input{
  flex:1;
  height:50px;
  border:0;
  outline:none;
  border-radius:20px;
  background:#191919;
  color:#fff;
  padding:0 17px;
  font-size:16px;
}

.search-btn{
  width:55px;
  height:50px;
  border:0;
  border-radius:20px;
  background:#fff;
  color:#000;
  font-size:22px;
}

.main{
  padding:15px 15px 105px;
}

.empty{
  text-align:center;
  color:#777;
  padding:55px 20px;
}

.user-card{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 5px;
  border-bottom:1px solid #181818;
  cursor:pointer;
}

.user-card:active{
  background:#111;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  flex-shrink:0;
}

.user-info{
  flex:1;
  min-width:0;
}

.name{
  font-size:17px;
  font-weight:bold;
}

.username{
  color:#888;
  margin-top:4px;
  font-size:14px;
}

.arrow{
  color:#777;
  font-size:25px;
}


/* CHAT */

.chat{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:50;
}

.chat-header{
  height:75px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 15px;
  border-bottom:1px solid #222;
  background:#111;
}

.chat-back{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:22px;
}

.chat-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#333;
}

.chat-user{
  flex:1;
  min-width:0;
}

.chat-name{
  font-weight:bold;
  font-size:16px;
}

.chat-username{
  color:#888;
  font-size:13px;
  margin-top:3px;
}

.chat-body{
  position:absolute;
  top:75px;
  bottom:75px;
  left:0;
  right:0;
  overflow-y:auto;
  padding:15px;
}

.chat-empty{
  color:#666;
  text-align:center;
  margin-top:45%;
}

.bubble{
  max-width:78%;
  padding:10px 13px;
  margin:7px 0;
  border-radius:18px;
  line-height:1.4;
  word-break:break-word;
}

.mine{
  margin-left:auto;
  background:#fff;
  color:#000;
  border-bottom-right-radius:5px;
}

.theirs{
  margin-right:auto;
  background:#202020;
  color:#fff;
  border-bottom-left-radius:5px;
}

.chat-input{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:75px;
  display:flex;
  gap:8px;
  padding:12px;
  background:#111;
  border-top:1px solid #222;
}

.message-input{
  flex:1;
  border:0;
  outline:none;
  border-radius:20px;
  background:#222;
  color:#fff;
  padding:0 16px;
  font-size:15px;
}

.send-btn{
  width:55px;
  border:0;
  border-radius:20px;
  background:#fff;
  color:#000;
  font-size:20px;
}


/* NAV */

.bottom-nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:20;
  display:flex;
  padding:8px;
  border-radius:24px;
  background:rgba(25,25,25,.92);
  backdrop-filter:blur(18px);
  border:1px solid #333;
}

.nav-item{
  flex:1;
  text-align:center;
  padding:8px 4px;
  border-radius:17px;
  color:#999;
  text-decoration:none;
  font-size:11px;
}

.nav-item.active{
  background:#fff;
  color:#000;
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

</style>

</head>

<body>


<!-- MAIN -->

<div id="mainPage">

  <div class="header">

    <div class="title">
      Messages
    </div>

    <div class="search-row">

      <input
        id="searchInput"

        type="text"
        placeholder="Search people..."
        autocomplete="off"
      >

      <button
        id="searchButton"
        class="search-btn"
        type="button"
      >
        ⌕

    </div>

  </div>


  <div id="mainContent" class="main">

    <div class="empty">
      Search karke kisi user ko message karo.
    </div>

</div>


<!-- CHAT -->

<div id="chatPage" class="chat">

  <div class="chat-header">

    <button
      id="chatBack"
      class="chat-back"
      type="button"
    >
      ‹
    </button>

    <img
      id="chatAvatar"
      class="chat-avatar"
      src=""
      alt=""
    >

    <div class="chat-user">

      <div
        id="chatName"
        class="chat-name"

      </div>

      </div>

    id="chatBody"
    class="chat-body"

      No messages yet.
    </div>

    <input
      id="messageInput"
      class="message-input"
      type="text"
      placeholder="Message..."
      autocomplete="off"

      id="sendButton"
      class="send-btn"
      type="button"

  <a class="nav-item" href="home.html">
    <span class="nav-icon">⌂</span>

  </a>

  <a class="nav-item" href="search.html">
    <span class="nav-icon">⌕</span>
    Search
  </a>

  <a class="nav-item" href="reels.html">
    <span class="nav-icon">▶</span>
    Reels
  </a>

  <a class="nav-item active" href="messages.html">
    <span class="nav-icon">♡</span>
    Messages
  </a>

  <a class="nav-item" href="profile.html">
    <span class="nav-icon">◯</span>
    Profile
  </a>

</div>


<script>

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================
   SESSION
========================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let currentUID =
localStorage.getItem(
  "crockcell_uid"
);


if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}

if(!currentUID){

  currentUID =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}


if(!token || !currentUID){

  window.location.replace(
    "index.html"
  );

}


/* =========================
   ELEMENTS
========================= */

const mainContent =
document.getElementById(
  "mainContent"
);

const searchInput =
document.getElementById(
  "searchInput"
);

const searchButton =
document.getElementById(
  "searchButton"
);

const chatPage =
document.getElementById(
  "chatPage"
);

const chatBack =
document.getElementById(
  "chatBack"
);

const chatName =
document.getElementById(
  "chatName"
);

const chatUsername =
document.getElementById(
  "chatUsername"
);

const chatAvatar =
document.getElementById(
  "chatAvatar"
);

const chatBody =
document.getElementById(
  "chatBody"
);

const messageInput =
document.getElementById(
  "messageInput"
);

const sendButton =
document.getElementById(
  "sendButton"
);


let selectedUser = null;


/* =========================
   START
========================= */

startMessages();


async function startMessages(){

  /*
    FIRST:
    sessionStorage target check
  */

  let target = null;


  try{

    const saved =
    sessionStorage.getItem(
      "crockcell_chat_target"
    );


    if(saved){

      target =
      JSON.parse(saved);

    }

  }
  catch(error){

    target = null;

  }


  /*
    SECOND:
    URL target check
  */

  const params =
  new URLSearchParams(
    window.location.search
  );


  const urlUID =
  params.get("uid");


  const urlUsername =
  params.get("username");


  const urlName =
  params.get("name");


  /*
    URL se target mila to
    usko priority.
  */

  if(urlUID){

    target = {

      uid:
      urlUID,

      username:
      urlUsername || "",

      name:
      urlName ||
      urlUsername ||
      "User",

      photoURL:
      target?.photoURL || ""

    };

  }


  /*
    TARGET MIL GAYA
  */

  if(target && target.uid){

    await openTargetUser(
      target
    );

    return;

  }


  /*
    Normal messages page
  */

  showEmpty();

}


/* =========================
   OPEN TARGET USER
========================= */

async function openTargetUser(target){

  /*
    Temporary data immediately show
    kar do.
  */

  selectedUser = {

    uid:
    target.uid,

    username:
    target.username || "user",

    name:
    target.name ||
    target.username ||
    "User",

    photoURL:
    target.photoURL || ""

  };


  showChat();


  /*
    Firebase se exact profile
    dobara load karenge.
  */

  try{

    const user =
    await getUserByUID(
      target.uid
    );


    if(user){

      selectedUser = user;

      updateChatHeader();

    }

  }
  catch(error){

    console.error(
      "Target user load error:",
      error
    );

  }


  loadMessages();

}


/* =========================
   GET USER BY UID
========================= */

async function getUserByUID(targetUID){

  const url =
  "https://firestore.googleapis.com/v1/projects/" +
  PROJECT_ID +
  "/databases/(default)/documents/users/" +
  encodeURIComponent(
    targetUID
  ) +
  "?key=" +
  API_KEY;


  const response =
  await fetch(
    url,
    {
      headers:{
        Authorization:
        "Bearer " + token
      }
    }
  );


  if(!response.ok){

    return null;

  }


  const data =
  await response.json();


  const f =
  data.fields || {};


  return {

    uid:
    targetUID,

    name:
    f.name?.stringValue ||
    f.username?.stringValue ||
    "User",

    username:
    f.username?.stringValue ||
    "user",

    photoURL:
    f.photoURL?.stringValue ||
    ""

  };

}


/* =========================
   SHOW CHAT
========================= */

function showChat(){

  document.getElementById(
    "mainPage"
  ).style.display="none";


  chatPage.style.display="block";


  updateChatHeader();

}


/* =========================
   HEADER
========================= */

function updateChatHeader(){

  if(!selectedUser){

    return;

  }


  chatName.textContent =
  selectedUser.name ||
  "User";


  chatUsername.textContent =
  "@" +
  (
    selectedUser.username ||
    "user"
  );


  chatAvatar.src =
  selectedUser.photoURL ||
  placeholderPhoto();

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  if(!selectedUser){

    return;

  }


  chatBody.innerHTML = `

    <div class="chat-empty">
      Loading messages...
    </div>

  `;


  try{

    const sent =
    await queryMessages(
      currentUID,
      selectedUser.uid
    );


    const received =
    await queryMessages(
      selectedUser.uid,
      currentUID
    );


    const all = [

      ...sent,

      ...received

    ];


    all.sort(
      (a,b)=>
      getTime(a.createdAt) -
      getTime(b.createdAt)
    );


    renderMessages(
      all
    );


  }
  catch(error){

    console.error(
      error
    );


    chatBody.innerHTML = `

      <div class="chat-empty">
        Messages load nahi ho paaye.
      </div>

    `;

  }

}


/* =========================
   QUERY MESSAGES
========================= */

async function queryMessages(
  sender,
  receiver
){

  const url =
  "https://firestore.googleapis.com/v1/projects/" +
  PROJECT_ID +
  "/databases/(default)/documents:runQuery" +
  "?key=" +
  API_KEY;


  const body = {

    structuredQuery: {

      from: [

        {
          collectionId:
          "messages"
        }

      ],

      where: {

        compositeFilter: {

          op:"AND",

          filters:[

            {

              fieldFilter:{

                field:{
                  fieldPath:
                  "senderId"
                },

                op:
                "EQUAL",

                value:{
                  stringValue:
                  sender
                }

              }

            },

            {

              fieldFilter:{

                field:{
                  fieldPath:
                  "receiverId"
                },

                op:
                "EQUAL",

                value:{
                  stringValue:
                  receiver
                }

              }

            }

          ]

        }

      },

      limit:100

    }

  };


  const response =
  await fetch(
    url,
    {

      method:"POST",

      headers:{

        Authorization:
        "Bearer " + token,

        "Content-Type":
        "application/json"

      },

      body:
      JSON.stringify(body)

    }
  );


  if(!response.ok){

    throw new Error(
      "MESSAGE_QUERY_FAILED"
    );

  }


  const rows =
  await response.json();


  const messages=[];


  rows.forEach(row=>{

    if(!row.document){

      return;

    }


    const f =
    row.document.fields || {};


    messages.push({

      senderId:
      f.senderId?.stringValue ||
      "",

      receiverId:
      f.receiverId?.stringValue ||
      "",

      text:
      f.text?.stringValue ||
      "",

      createdAt:
      f.createdAt?.timestampValue ||
      ""

    });

  });


  return messages;

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(messages){

  chatBody.innerHTML="";


  if(!messages.length){

    chatBody.innerHTML = `

      <div class="chat-empty">
        No messages yet.
      </div>

    `;

    return;

  }


  messages.forEach(message=>{

    const bubble =
    document.createElement(
      "div"
    );


    bubble.className =
    "bubble " +
    (
      message.senderId === currentUID
      ?
      "mine"
      :
      "theirs"
    );


    bubble.textContent =
    message.text;


    chatBody.appendChild(
      bubble
    );

  });


  chatBody.scrollTop =
  chatBody.scrollHeight;

}


/* =========================
   SEND
========================= */

sendButton.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      e.preventDefault();

      sendMessage();

    }

  }
);


async function sendMessage(){

  if(!selectedUser){

    return;

  }


  const text =
  messageInput.value.trim();


  if(!text){

    return;

  }


  sendButton.disabled=true;


  try{

    const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/messages" +
    "?key=" +
    API_KEY;


    const body={

      fields:{

        senderId:{
          stringValue:
          currentUID
        },

        receiverId:{
          stringValue:
          selectedUser.uid
        },

        text:{
          stringValue:
          text
        },

        createdAt:{
          timestampValue:
          new Date().toISOString()
        }

      }

    };


    const response =
    await fetch(
      url,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify(body)

      }
    );


    if(!response.ok){

      throw new Error(
        "SEND_FAILED"
      );

    }


    messageInput.value="";


    await loadMessages();

  }
  catch(error){

    console.error(
      error
    );


    alert(
      "Message send nahi ho paaya."
    );

  }


  sendButton.disabled=false;

}


/* =========================
   BACK
========================= */

chatBack.addEventListener(
  "click",
  function(){

    chatPage.style.display="none";


    document.getElementById(
      "mainPage"
    ).style.display="block";


    selectedUser=null;


    /*
      Target clear
    */

    sessionStorage.removeItem(
      "crockcell_chat_target"
    );


    history.replaceState(
      {},
      "",
      "messages.html"
    );


    showEmpty();

  }
);


/* =========================
   SEARCH
========================= */

searchButton.addEventListener(
  "click",
  searchUsers
);


searchInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      e.preventDefault();

      searchUsers();

    }

  }
);


async function searchUsers(){

  const text =
  searchInput.value
    .trim()
    .toLowerCase();


  if(!text){

    return;

  }


  mainContent.innerHTML = `

    <div class="empty">
      Searching...
    </div>

  `;


  try{

    const endText =
    text + "\uf8ff";


    const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents:runQuery" +
    "?key=" +
    API_KEY;


    const body={

      structuredQuery:{

        from:[

          {
            collectionId:
            "users"
          }

        ],

        where:{

          compositeFilter:{

            op:"AND",

            filters:[

              {

                fieldFilter:{

                  field:{
                    fieldPath:
                    "username"
                  },

                  op:
                  "GREATER_THAN_OR_EQUAL",

                  value:{
                    stringValue:
                    text
                  }

                }

              },

              {

                fieldFilter:{

                  field:{
                    fieldPath:
                    "username"
                  },

                  op:
                  "LESS_THAN",

                  value:{
                    stringValue:
                    endText
                  }

                }

              }

            ]

          }

        },

        orderBy:[

          {

            field:{

              fieldPath:
              "username"

            },

            direction:
            "ASCENDING"

          }

        ],

        limit:30

      }

    };


    const response =
    await fetch(
      url,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify(body)

      }
    );


    if(!response.ok){

      throw new Error(
        "SEARCH_FAILED"
      );

    }


    const rows =
    await response.json();


    const users=[];


    rows.forEach(row=>{

      if(!row.document){

        return;

      }


      const f =
      row.document.fields || {};


      const foundUID =
      f.uid?.stringValue || "";


      const foundUsername =
      f.username?.stringValue || "";


      if(!foundUID ||
         !foundUsername){

        return;

      }


      if(foundUID === currentUID){

        return;

      }


      users.push({

        uid:
        foundUID,

        username:
        foundUsername,

        name:
        f.name?.stringValue ||
        foundUsername,

        photoURL:
        f.photoURL?.stringValue ||
        ""

      });

    });


    renderSearchUsers(
      users
    );

  }
  catch(error){

    console.error(
      error
    );


    mainContent.innerHTML = `

      <div class="empty">
        Search nahi ho paayi.
      </div>

    `;

  }

}


/* =========================
   SEARCH RESULTS
========================= */

function renderSearchUsers(users){

  mainContent.innerHTML="";


  if(!users.length){

    mainContent.innerHTML = `

      <div class="empty">
        Koi user nahi mila.
      </div>

    `;

    return;

  }


  users.forEach(user=>{

    const card =
    document.createElement(
      "div"
    );


    card.className=
    "user-card";


    card.innerHTML = `

      <img
        class="avatar"
        src="${
          escapeAttribute(
            user.photoURL ||
            placeholderPhoto()
          )
        }"
        alt=""
      >

      <div class="user-info">

        <div class="name">
          ${escapeHTML(
            user.name
          )}
        </div>

        <div class="username">
          @${escapeHTML(
            user.us
