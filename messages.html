  background:#1d1d1d;
  color:#fff;

}

.chatAvatar{
  width:43px;

  border-radius:50%;

}

.chatInfo{
  flex:1;
  min-width:0;
}

.chatName{

}

.chatUsername{

}

#messageList{

}

.messageRow{
  display:flex;

}

.mine{

}

.bubble{

.mine .bubble{

}

.theirs .bubble{
  background:#202020;
  color:#fff;
  border-bottom-left-radius:5px;
}

.time{
  font-size:9px;
  opacity:.5;
  margin-top:4px;
}

/* MESSAGE INPUT */

.inputBar{
  display:none;
  position:fixed;
  left:10px;
  right:10px;
  bottom:75px;
  z-index:20;
  padding:7px;
  gap:7px;
  background:#191919;
  border:1px solid #333;
  border-radius:21px;
}

#messageInput{
  flex:1;
  min-width:0;
  height:43px;
  border:0;
  outline:none;
  border-radius:16px;
  background:#0e0e0e;
  color:#fff;
  padding:0 13px;
  font-size:15px;
}

#sendBtn{
  width:45px;
  height:43px;
  border:0;
  border-radius:16px;

  color:#000;

}

/* NAV */

.nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:30;
  display:flex;
  padding:8px;

  border:1px solid #333;

.nav a{
  flex:1;

  color:#999;

  border-radius:17px;

}

.nav a.active{
  background:#fff;

}

.icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

<script>

/* =================================================
   FIREBASE
================================================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";

const BASE =
"https://firestore.googleapis.com/v1/projects/" +
PROJECT_ID +
"/databases/(default)/documents";


/* =================================================
   LOGIN SESSION
================================================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let currentUID =
localStorage.getItem(
  "crockcell_uid"
);


if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}

if(!currentUID){

  currentUID =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}


if(!token || !currentUID){

  location.replace(
    "index.html"
  );

}


/* =================================================
   ELEMENTS
================================================= */

const searchInput =
document.getElementById(
  "searchInput"
);

const searchBtn =
document.getElementById(
  "searchBtn"
);

const status =
document.getElementById(
  "status"
);

const results =
document.getElementById(
  "results"
);

const listPage =
document.getElementById(
  "listPage"
);

const chatPage =
document.getElementById(
  "chatPage"
);

const inputBar =
document.getElementById(
  "inputBar"
);

const messageInput =
document.getElementById(
  "messageInput"
);

const sendBtn =
document.getElementById(
  "sendBtn"
);

const messageList =
document.getElementById(
  "messageList"
);


let selectedUser =
null;

let refreshTimer =
null;


/* =================================================
   START
================================================= */

start();


async function start(){

  /*
    Page khulte hi recent chats
    load hongi.
  */

  await loadRecentChats();

}


/* =================================================
   GET ALL MESSAGES
================================================= */

async function getAllMessages(){

  const response =
  await fetch(
    BASE +
    ":runQuery?key=" +
    API_KEY,
    {

      method:"POST",

      headers:{

        Authorization:
        "Bearer " + token,

        "Content-Type":
        "application/json"

      },

      body:JSON.stringify({

        structuredQuery:{

          from:[

            {
              collectionId:
              "messages"
            }

          ],

          limit:500

        }

      })

    }
  );


  const raw =
  await response.text();


  if(!response.ok){

    throw new Error(raw);

  }


  const rows =
  JSON.parse(raw);


  const messages=[];


  rows.forEach(row=>{

    if(!row.document){

      return;

    }


    const f =
    row.document.fields ||
    {};


    const senderId =
    f.senderId?.stringValue ||
    "";

    const receiverId =
    f.receiverId?.stringValue ||
    "";

    const text =
    f.text?.stringValue ||
    "";

    const createdAt =
    f.createdAt?.timestampValue ||
    "";


    if(
      !senderId ||
      !receiverId
    ){

      return;

    }


    /*
      Sirf wahi messages rakho
      jisme current user involved hai.
    */

    if(
      senderId!==currentUID &&
      receiverId!==currentUID
    ){

      return;

    }


    messages.push({

      senderId,
      receiverId,
      text,
      createdAt

    });

  });


  return messages;

}


/* =================================================
   LOAD RECENT CHATS
================================================= */

async function loadRecentChats(){

  try{

    status.textContent =
    "Loading...";


    results.innerHTML =
    `<div class="empty">
      Messages load ho rahe hain...
    </div>`;


    const messages =
    await getAllMessages();


    if(!messages.length){

      status.textContent =
      "";

      results.innerHTML =
      `<div class="empty">
        Abhi koi chat nahi hai.<br><br>
        Search karke kisi user ko message karo.
      </div>`;

      return;

    }


    /*
      Har user ki latest message
      find karo.
    */

    const chatMap =
    new Map();


    messages.forEach(message=>{

      const otherUID =
      message.senderId === currentUID
      ? message.receiverId
      : message.senderId;


      if(!otherUID){

        return;

      }


      const old =
      chatMap.get(
        otherUID
      );


      if(
        !old ||
        new Date(
          message.createdAt
        ) >
        new Date(
          old.createdAt
        )
      ){

        chatMap.set(
          otherUID,
          message
        );

      }

    });


    const chats =
    Array.from(
      chatMap.entries()
    );


    /*
      Latest chat sabse upar.
    */

    chats.sort(
      (a,b)=>
      new Date(
        b[1].createdAt
      ) -
      new Date(
        a[1].createdAt
      )
    );


    const users=[];


    for(
      const [uid,lastMessage]
      of chats
    ){

      try{

        const user =
        await getUser(
          uid
        );


        if(user){

          users.push({

            ...user,

            lastMessage:
            lastMessage.text,

            lastTime:
            lastMessage.createdAt

          });

        }

      }catch(error){

        console.log(
          "USER LOAD ERROR:",
          uid,
          error
        );

      }

    }


    showRecentChats(
      users
    );


  }catch(error){

    console.error(
      "RECENT CHAT ERROR:",
      error
    );


    status.textContent =
    "";


    results.innerHTML =
    `<div class="empty">
      Messages load nahi ho paaye.<br>
      Search se user ko message kar sakte ho.
    </div>`;

  }

}


/* =================================================
   GET USER
================================================= */

async function getUser(uid){

  const response =
  await fetch(
    BASE +
    "/users/" +
    encodeURIComponent(
      uid
    ),
    {

      headers:{

        Authorization:
        "Bearer " + token

      }

    }
  );


  if(!response.ok){

    return null;

  }


  const data =
  await response.json();


  const f =
  data.fields ||
  {};


  return{

    uid:uid,

    username:
    f.username?.stringValue ||
    "user",

    name:
    f.name?.stringValue ||
    f.username?.stringValue ||
    "User",

    photoURL:
    f.photoURL?.stringValue ||
    ""

  };

}


/* =================================================
   SHOW RECENT CHATS
================================================= */

function showRecentChats(
  users
){

  results.innerHTML="";


  if(!users.length){

    results.innerHTML =
    `<div class="empty">
      Abhi koi chat nahi hai.
    </div>`;

    return;

  }


  status.textContent =
  users.length +
  " chat" +
  (
    users.length===1
    ? ""
    : "s"
  );


  users.forEach(
    user=>{

      createUserRow(
        user,
        true
      );

    }
  );

}


/* =================================================
   SEARCH USERS
================================================= */

async function searchUsers(){

  const text =
  searchInput.value
  .trim()
  .toLowerCase();


  if(!text){

    await loadRecentChats();

    return;

  }


  status.textContent =
  "Searching...";


  results.innerHTML =
  `<div class="empty">
    Searching...
  </div>`;


  try{

    const endText =
    text +
    "\uf8ff";


    const response =
    await fetch(
      BASE +
      ":runQuery?key=" +
      API_KEY,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"

        },

        body:JSON.stringify({

          structuredQuery:{

            from:[

              {
                collectionId:
                "users"
              }

            ],

            where:{

              compositeFilter:{

                op:"AND",

                filters:[

                  {
                    fieldFilter:{

                      field:{
                        fieldPath:
                        "username"
                      },

                      op:
                      "GREATER_THAN_OR_EQUAL",

                      value:{
                        stringValue:
                        text
                      }

                    }

                  },

                  {
                    fieldFilter:{

                      field:{
                        fieldPath:
                        "username"
                      },

                      op:"LESS_THAN",

                      value:{
                        stringValue:
                        endText
                      }

                    }

                  }

                ]

              }

            },

            orderBy:[

              {
                field:{
                  fieldPath:
                  "username"
                },

                direction:
                "ASCENDING"
              }

            ],

            limit:30

          }

        })

      }
    );


    const raw =
    await response.text();


    if(!response.ok){

      throw new Error(raw);

    }


    const rows =
    JSON.parse(raw);


    const users=[];


    rows.forEach(
      row=>{

        if(!row.document){

          return;

        }


        const f =
        row.document.fields ||
        {};


        const uid =
        f.uid?.stringValue ||
        "";

        const username =
        f.username?.stringValue ||
        "";


        if(
          !uid ||
          !username
        ){

          return;

        }


        if(
          uid===currentUID
        ){

          return;

        }


        users.push({

          uid,

          username,

          name:
          f.name?.stringValue ||
          username,

          photoURL:
          f.photoURL?.stringValue ||
          ""

        });

      }
    );


    results.innerHTML="";


    if(!users.length){

      status.textContent =
      "0 users found";


      results.innerHTML =
      `<div class="empty">
        Koi user nahi mila.
      </div>`;

      return;

    }


    status.textContent =
    users.length +
    " users found";


    users.forEach(
      user=>{

        createUserRow(
          user,
          false
        );

      }
    );


  }catch(error){

    console.error(
      "SEARCH ERROR:",
      error
    );


    status.textContent =
    "Search failed";


    results.innerHTML =
    `<div class="empty">
      User search nahi ho paayi.
    </div>`;

  }

}


/* =================================================
   CREATE USER ROW
================================================= */

function createUserRow(
  user,
  recent
){

  const item =
  document.createElement(
    "div"
  );


  item.className =
  "user";


  item.onclick =
  function(){

    openChat(
      user
    );

  };


  const img =
  document.createElement(
    "img"
  );


  img.className =
  "avatar";


  img.src =
  user.photoURL ||
  placeholder();


  const info =
  document.createElement(
    "div"
  );


  info.className =
  "info";


  const name =
  document.createElement(
    "div"
  );


  name.className =
  "name";


  name.textContent =
  user.name;


  const username =
  document.createElement(
    "div"
  );


  username.className =
  "username";


  username.textContent =
  "@" +
  user.username;


  info.appendChild(
    name
  );

  info.appendChild(
    username
  );


  if(
    recent &&
    user.lastMessage
  ){

    const last =
    document.createElement(
      "div"
    );


    last.className =
    "lastMessage";


    last.textContent =
    user.lastMessage;


    info.appendChild(
      last
    );

  }


  const button =
  document.createElement(
    "button"
  );


  button.className =
  "messageBtn";


  button.textContent =
  "Message";


  button.onclick =
  function(event){

    event.stopPropagation();

    openChat(
      user
    );

  };


  item.appendChild(
    img
  );

  item.appendChild(
    info
  );

  item.appendChild(
    button
  );


  results.appendChild(
    item
  );

}


/* =================================================
   OPEN CHAT
================================================= */

function openChat(
  user
){

  selectedUser =
  user;


  listPage.style.display =
  "none";


  chatPage.style.display =
  "block";


  inputBar.style.display =
  "flex";


  document.getElementById(
    "chatName"
  ).textContent =
  user.name;


  document.getElementById(
    "chatUsername"
  ).textContent =
  "@" +
  user.username;


  document.getElementById(
    "chatAvatar"
  ).src =
  user.photoURL ||
  placeholder();


  loadMessages();


  clearInterval(
    refreshTimer
  );


  /*
    Har 2.5 second me chat
    refresh hogi.
  */

  refreshTimer =
  setInterval(
    loadMessages,
    2500
  );

}


/* =================================================
   LOAD CHAT MESSAGES
================================================= */

async function loadMessages(){

  if(!selectedUser){

    return;

  }


  try{

    const all =
    await getAllMessages();


    const chat =
    all.filter(
      message=>{

        return(

          (
            message.senderId ===
            currentUID &&

            message.receiverId ===
            selectedUser.uid

          )

          ||

          (

            message.senderId ===
            selectedUser.uid &&

            message.receiverId ===
            currentUID

          )

        );

      }
    );


    chat.sort(
      (a,b)=>
      new Date(
        a.createdAt
      ) -
      new Date(
        b.createdAt
      )
    );


    renderMessages(
      chat
    );


  }catch(error){

    console.error(
      "CHAT LOAD ERROR:",
      error
    );

  }

}


/* =================================================
   RENDER CHAT
================================================= */

function renderMessages(
  messages
){

  messageList.innerHTML="";
