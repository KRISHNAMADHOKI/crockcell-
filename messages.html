<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CROCKCELL Messages</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
  padding-bottom:90px;
}

.header{
  padding:20px 16px 14px;
  border-bottom:1px solid #222;
}

.title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:15px;
}

.searchBox{
  display:flex;
  gap:8px;
}

#searchInput{
  flex:1;
  height:50px;
  border:0;
  outline:none;
  border-radius:20px;
  background:#191919;
  color:white;
  padding:0 16px;
  font-size:16px;
}

#searchBtn{
  width:55px;
  height:50px;
  border:0;
  border-radius:20px;
  background:white;
  color:black;
  font-size:22px;
}

#searchStatus{
  color:#888;
  font-size:14px;
  padding:12px 16px 0;
}

#results{
  padding:5px 15px 20px;
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 4px;
  border-bottom:1px solid #1c1c1c;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
  background:#292929;
}

.info{
  flex:1;
  min-width:0;
}

.name{
  font-size:17px;
  font-weight:bold;
}

.username{
  color:#888;
  margin-top:4px;
  font-size:14px;
}

.msgBtn{
  border:0;
  border-radius:15px;
  background:white;
  color:black;
  padding:10px 14px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#666;
  padding:50px 15px;
}


/* CHAT */

#chat{
  display:none;
}

.chatHeader{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 15px;
  border-bottom:1px solid #222;
}

.back{
  width:40px;
  height:40px;
  border:0;
  border-radius:14px;
  background:#1c1c1c;
  color:white;
  font-size:23px;
}

.chatAvatar{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
}

.chatInfo{
  flex:1;
}

.chatName{
  font-weight:bold;
  font-size:16px;
}

.chatUsername{
  color:#888;
  font-size:12px;
  margin-top:3px;
}

#messages{
  padding:18px 12px 90px;
}

.row{
  display:flex;
  margin:8px 0;
}

.mine{
  justify-content:flex-end;
}

.other{
  justify-content:flex-start;
}

.bubble{
  max-width:78%;
  padding:10px 13px;
  border-radius:18px;
  word-break:break-word;
}

.mine .bubble{
  background:white;
  color:black;
  border-bottom-right-radius:5px;
}

.other .bubble{
  background:#202020;
  color:white;
  border-bottom-left-radius:5px;
}

.inputBar{
  display:none;
  position:fixed;
  left:10px;
  right:10px;
  bottom:75px;
  z-index:20;
  padding:7px;
  gap:7px;
  background:#191919;
  border:1px solid #333;
  border-radius:21px;
}

#messageInput{
  flex:1;
  height:43px;
  border:0;
  outline:none;
  border-radius:16px;
  background:#0e0e0e;
  color:white;
  padding:0 13px;
  font-size:15px;
}

#send{
  width:45px;
  height:43px;
  border:0;
  border-radius:16px;
  background:white;
  color:black;
  font-size:18px;
}


/* NAV */

.nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:30;
  display:flex;
  padding:8px;
  background:rgba(25,25,25,.94);
  border:1px solid #333;
  border-radius:24px;
}

.nav a{
  flex:1;
  text-align:center;
  text-decoration:none;
  color:#999;
  padding:8px 3px;
  border-radius:17px;
  font-size:11px;
}

.nav a.active{
  background:white;
  color:black;
}

.icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}
</style>
</head>

<body>

<!-- =====================
     MESSAGE LIST
===================== -->

<div id="listPage">

  <div class="header">

    <div class="title">
      Messages
    </div>

    <div class="searchBox">

      <input
        id="searchInput"
        type="text"
        placeholder="Search username..."
        autocomplete="off"
        autocapitalize="none"
      >

      <button id="searchBtn">
        ⌕
      </button>

    </div>

  </div>

  <div id="searchStatus"></div>

  <div id="results">

    <div class="empty">
      Kisi user ko message karne ke liye
      upar username ya alphabet search karo.
    </div>

  </div>

</div>


<!-- =====================
     CHAT
===================== -->

<div id="chat">

  <div class="chatHeader">

    <button
      class="back"
      id="back"
    >
      ‹
    </button>

    <img
      id="chatAvatar"
      class="chatAvatar"
      src=""
    >

    <div class="chatInfo">

      <div
        id="chatName"
        class="chatName"
      ></div>

      <div
        id="chatUsername"
        class="chatUsername"
      ></div>

    </div>

  </div>


  <div id="messages"></div>

</div>


<!-- INPUT -->

<div
  id="inputBar"
  class="inputBar"
>

  <input
    id="messageInput"
    type="text"
    placeholder="Message..."
  >

  <button id="send">
    ➤
  </button>

</div>


<!-- NAV -->

<div class="nav">

  <a href="home.html">
    <span class="icon">⌂</span>
    Home
  </a>

  <a href="search.html">
    <span class="icon">⌕</span>
    Search
  </a>

  <a href="reels.html">
    <span class="icon">▶</span>
    Reels
  </a>

  <a
    href="messages.html"
    class="active"
  >
    <span class="icon">♡</span>
    Messages
  </a>

  <a href="profile.html">
    <span class="icon">◯</span>
    Profile
  </a>

</div>


<script>

/* =========================
   FIREBASE
========================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================
   LOGIN
========================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let currentUID =
localStorage.getItem(
  "crockcell_uid"
);


if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}

if(!currentUID){

  currentUID =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}


if(!token || !currentUID){

  location.replace(
    "index.html"
  );

}


/* =========================
   FIRESTORE
========================= */

const base =
"https://firestore.googleapis.com/v1/projects/" +
PROJECT_ID +
"/databases/(default)/documents";


/* =========================
   ELEMENTS
========================= */

const searchInput =
document.getElementById(
  "searchInput"
);

const searchBtn =
document.getElementById(
  "searchBtn"
);

const results =
document.getElementById(
  "results"
);

const status =
document.getElementById(
  "searchStatus"
);

const listPage =
document.getElementById(
  "listPage"
);

const chat =
document.getElementById(
  "chat"
);

const messagesBox =
document.getElementById(
  "messages"
);

let selectedUser =
null;


/* =========================
   SEARCH
========================= */

async function searchUsers(){

  const text =
  searchInput.value
    .trim()
    .toLowerCase();


  if(!text){

    status.textContent="";

    results.innerHTML =
    `<div class="empty">
      Username ya alphabet type karo.
    </div>`;

    return;

  }


  status.textContent =
  "Searching...";


  results.innerHTML =
  `<div class="empty">
    Searching...
  </div>`;


  try{

    const end =
    text + "\uf8ff";


    const url =
    base +
    ":runQuery?key=" +
    API_KEY;


    const body={

      structuredQuery:{

        from:[
          {
            collectionId:"users"
          }
        ],

        where:{

          compositeFilter:{

            op:"AND",

            filters:[

              {
                fieldFilter:{

                  field:{
                    fieldPath:"username"
                  },

                  op:
                  "GREATER_THAN_OR_EQUAL",

                  value:{
                    stringValue:text
                  }

                }

              },

              {
                fieldFilter:{

                  field:{
                    fieldPath:"username"
                  },

                  op:"LESS_THAN",

                  value:{
                    stringValue:end
                  }

                }

              }

            ]

          }

        },

        orderBy:[

          {
            field:{
              fieldPath:"username"
            },

            direction:
            "ASCENDING"
          }

        ],

        limit:30

      }

    };


    const response =
    await fetch(
      url,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify(body)

      }
    );


    const raw =
    await response.text();


    console.log(
      "SEARCH RESPONSE:",
      raw
    );


    if(!response.ok){

      throw new Error(
        raw
      );

    }


    const rows =
    JSON.parse(raw);


    const users=[];


    rows.forEach(row=>{

      if(!row.document){

        return;

      }


      const f =
      row.document.fields ||
      {};


      const uid =
      f.uid?.stringValue ||
      "";


      const username =
      f.username?.stringValue ||
      "";


      if(
        !uid ||
        !username
      ){

        return;

      }


      /*
        Apna account hide.
      */

      if(uid===currentUID){

        return;

      }


      users.push({

        uid:uid,

        username:username,

        name:
        f.name?.stringValue ||
        username,

        photoURL:
        f.photoURL?.stringValue ||
        ""

      });

    });


    showUsers(users);


  }catch(error){

    console.error(
      "SEARCH ERROR:",
      error
    );


    status.textContent =
    "Search error";


    results.innerHTML =
    `<div class="empty">
      User search nahi ho paayi.
      <br><br>
      Console error check karo.
    </div>`;

  }

}


/* =========================
   SHOW USERS
========================= */

function showUsers(users){

  results.innerHTML="";


  if(!users.length){

    status.textContent =
    "0 users found";


    results.innerHTML =
    `<div class="empty">
      Is naam se koi user nahi mila.
    </div>`;

    return;

  }


  status.textContent =
  users.length +
  " users found";


  users.forEach(user=>{

    const item =
    document.createElement(
      "div"
    );

    item.className =
    "user";


    const img =
    document.createElement(
      "img"
    );

    img.className =
    "avatar";

    img.src =
    user.photoURL ||
    placeholder();


    const info =
    document.createElement(
      "div"
    );

    info.className =
    "info";


    const name =
    document.createElement(
      "div"
    );

    name.className =
    "name";

    name.textContent =
    user.name;


    const username =
    document.createElement(
      "div"
    );

    username.className =
    "username";

    username.textContent =
    "@" + user.username;


    info.appendChild(
      name
    );

    info.appendChild(
      username
    );


    const button =
    document.createElement(
      "button"
    );

    button.className =
    "msgBtn";

    button.textContent =
    "Message";


    button.onclick=function(){

      openChat(user);

    };


    item.appendChild(
      img
    );

    item.appendChild(
      info
    );

    item.appendChild(
      button
    );


    results.appendChild(
      item
    );

  });

}


/* =========================
   OPEN CHAT
========================= */

function openChat(user){

  selectedUser =
  user;


  listPage.style.display =
  "none";


  chat.style.display =
  "block";


  document.getElementById(
    "inputBar"
  ).style.display =
  "flex";


  document.getElementById(
    "chatName"
  ).textContent =
  user.name;


  document.getElementById(
    "chatUsername"
  ).textContent =
  "@" + user.username;


  document.getElementById(
    "chatAvatar"
  ).src =
  user.photoURL ||
  placeholder();


  loadMessages();

}


/* =========================
   SEND
========================= */

document.getElementById(
  "send"
).onclick =
sendMessage;


document.getElementById(
  "messageInput"
).addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      sendMessage();

    }

  }
);


async function sendMessage(){

  if(!selectedUser){

    return;

  }


  const input =
  document.getElementById(
    "messageInput"
  );


  const text =
  input.value.trim();


  if(!text){

    return;

  }


  try{

    const response =
    await fetch(
      base +
      "/messages?key=" +
      API_KEY,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify({

          fields:{

            senderId:{
              stringValue:
              currentUID
            },

            receiverId:{
              stringValue:
              selectedUser.uid
            },

            text:{
              stringValue:
              text
            },

            createdAt:{
              timestampValue:
              new Date()
              .toISOString()
            }

          }

        })

      }
    );


    if(!response.ok){

      console.error(
        await response.text()
      );

      alert(
        "Message send nahi hua."
      );

      return;

    }


    input.value="";

    loadMessages();


  }catch(error){

    console.error(error);

    alert(
      "Message send nahi hua."
    );

  }

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  if(!selectedUser){

    return;

  }


  const url =
  base +
  ":runQuery?key=" +
  API_KEY;


  const body={

    structuredQuery:{

      from:[
        {
          collectionId:"messages"
        }
      ],

      where:{

        compositeFilter:{

          op:"OR",

          filters:[

            {
              compositeFilter:{

                op:"AND",

                filters:[

                  {
                    fieldFilter:{

                      field:{
                        fieldPath:
                        "senderId"
                      },

                      op:"EQUAL",

                      value:{
                        stringValue:
                        currentUID
                      }

                    }

                  },

                  {
                    fieldFilter:{

                      field:{
                        fieldPath:
                        "receiverId"
                      },

                      op:"EQUAL",

                      value:{
                        stringValue:
                        selectedUser.uid
                      }

                    }

                  }

                ]

              }

            },

            {
              compositeFilter:{

                op:"AND",

                filters:[

                  {
                    fieldFilter:{

                      field:{
                        fieldPath:
                        "senderId"
                      },

                      op:"EQUAL",

                      value:{
                        stringValue:
                        selectedUser.uid
                      }

                    }

                  },

                  {
                    fieldFilter:{

                      field:{
                        fieldPath:
                        "receiverId"
                      },

                      op:"EQUAL",

                      value:{
                        stringValue:
                        currentUID
                      }

                    }

                  }

                ]

              }

            }

          ]

        }

      },

      orderBy:[

        {
          field:{
            fieldPath:"createdAt"
          },

          direction:"ASCENDING"

        }

      ],

      limit:100

    }

  };


  try{

    const response =
    await fetch(
      url,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify(body)

      }
    );


    if(!response.ok){

      console.error(
        await response.text()
      );

      return;

    }


    const rows =
    await response.json();


    messagesBox.innerHTML="";


    let count=0;


    rows.forEach(row=>{

      if(!row.document){

        return;

      }


      const f =
      row.document.fields ||
      {};


      const sender =
      f.senderId?.stringValue ||
      "";


      const text =
      f.text?.stringValue ||
      "";


      if(!text){

        return;

      }


      count++;


      const rowBox =
      document.createElement(
        "div"
      );


      rowBox.className =
      "row " +
      (
        sender===currentUID
        ? "mine"
        : "other"
      );


      const bubble =
      document.createElement(
        "div"
      );


      bubble.className =
      "bubble";


      bubble.textContent =
      text;


      rowBox.appendChild(
        bubble
      );


      messagesBox.appendChild(
        rowBox
      );

    });


    if(!count){

      messagesBox.innerHTML =
      `<div class="empty">
        Abhi koi message nahi hai.<br>
        Pehla message bhejo 👋
      </div>`;

    }


    window.scrollTo(
      0,
      document.body.scrollHeight
    );


  }catch(error){

    console.error(
      error
    );

  }

}


/* =========================
   BACK
========================= */

document.getElementById(
  "back"
).onclick=function(){

  selectedUser=null;

  chat.style.display =
  "none";

  document.getElementById(
    "inputBar"
  ).style.display =
  "none";

  listPage.style.display =
  "block";

};


/* =========================
   SEARCH BUTTON
========================= */

searchBtn.onclick =
searchUsers;


/* =========================
   LIVE SEARCH
========================= */

searchInput.addEventListener(
  "input",
  function(){

    clearTimeout(
      window.searchTimer
    );


    window.searchTimer =
    setTimeout(
      searchUsers,
      300
    );

  }
);


/* =========================
   ENTER
========================= */

searchInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      searchUsers();

    }

  }
);


/* =========================
   PROFILE → MESSAGE
========================= */

const params =
new URLSearchParams(
  location.search
);


const urlUID =
params.get("uid");

const urlUsername =
params.get("username");


if(urlUID){

  loadUserFromURL();

}


async function loadUserFromURL(){

  try{

    const response =
    await fetch(
      base +
      "/users/" +
      encodeURIComponent(
        urlUID
      ),
      {

        headers:{

          Authorization:
          "Bearer " + token

        }

      }
    );


    if(response.ok){

      const data =
      await response.json();


      const f =
      data.fields ||
      {};


      openChat({

        uid:urlUID,

        username:
        f.username?.stringValue ||
        urlUsername ||
        "",

        name:
        f.name?.stringValue ||
        f.username?.stringValue ||
        urlUsername ||
        "User",

        photoURL:
        f.photoURL?.stringValue ||
        ""

      });


      return;

    }


  }catch(error){

    console.error(error);

  }

}


/* =========================
   PLACEHOLDER
========================= */

function placeholder(){

  return "data:image/svg+xml,"+

  "<svg xmlns='http://www.w3.org/2000/svg' " +

  "width='100' height='100'>" +

  "<rect width='100' height='100' " +

  "fill='%23333333'/>" +

  "</svg>";

}

</script>

</body>
  </html>
