<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>CROCKCELL Messages</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.header{padding:18px 16px 14px;border-bottom:1px solid #222;position:sticky;top:0;z-index:10;background:rgba(0,0,0,.96);backdrop-filter:blur(16px)}.title{font-size:28px;font-weight:800;margin-bottom:14px}.search-row{display:flex;gap:8px}.search-input{flex:1;height:50px;border:0;outline:0;border-radius:18px;background:#191919;color:#fff;padding:0 16px;font-size:16px}.search-btn{width:52px;height:50px;border:0;border-radius:18px;background:#fff;color:#000;font-size:21px}.main{padding:14px 14px 105px}.section-title{font-size:13px;color:#888;margin:6px 4px 10px}.user-card{display:flex;align-items:center;gap:12px;padding:13px 5px;border-bottom:1px solid #181818}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#222;flex-shrink:0}.user-info{flex:1;min-width:0}.name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.username{color:#888;margin-top:4px;font-size:13px}.preview{color:#777;font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.open-btn{border:0;background:#171717;color:#fff;border-radius:12px;padding:9px 11px;font-weight:700}.empty{text-align:center;color:#777;padding:55px 20px}.chat{display:none;position:fixed;inset:0;background:#000;z-index:50}.chat-header{height:76px;display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid #222;background:#111}.chat-back,.chat-more{width:40px;height:40px;border:0;border-radius:50%;background:#222;color:#fff;font-size:22px}.chat-more{font-size:20px}.chat-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#333}.chat-user{flex:1;min-width:0}.chat-name{font-weight:700;font-size:16px}.chat-username{color:#888;font-size:12px;margin-top:3px}.chat-body{position:absolute;top:76px;bottom:75px;left:0;right:0;overflow-y:auto;padding:14px}.chat-empty{color:#666;text-align:center;margin-top:45%}.bubble{max-width:78%;padding:10px 13px;margin:7px 0;border-radius:18px;line-height:1.4;word-break:break-word}.mine{margin-left:auto;background:#fff;color:#000;border-bottom-right-radius:5px}.theirs{margin-right:auto;background:#202020;color:#fff;border-bottom-left-radius:5px}.time{font-size:10px;opacity:.55;margin-top:4px}.chat-input{position:absolute;bottom:0;left:0;right:0;height:75px;display:flex;gap:8px;padding:12px;background:#111;border-top:1px solid #222}.message-input{flex:1;border:0;outline:0;border-radius:20px;background:#222;color:#fff;padding:0 16px;font-size:15px}.send-btn{width:55px;border:0;border-radius:20px;background:#fff;color:#000;font-size:20px}.menu{display:none;position:absolute;right:12px;top:64px;width:185px;background:#151515;border:1px solid #333;border-radius:16px;padding:7px;z-index:80}.menu button{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:12px;border-radius:10px;font-weight:700}.menu button:active{background:#252525}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#222;border:1px solid #444;border-radius:14px;padding:10px 14px;display:none;z-index:100;font-size:13px}.bottom-nav{position:fixed;left:12px;right:12px;bottom:12px;z-index:20;display:flex;padding:8px;border-radius:24px;background:rgba(25,25,25,.94);backdrop-filter:blur(18px);border:1px solid #333}.nav-item{flex:1;text-align:center;padding:8px 4px;border-radius:17px;color:#999;text-decoration:none;font-size:11px}.nav-item.active{background:#fff;color:#000}.nav-icon{display:block;font-size:20px;margin-bottom:3px}
</style>
</head>
<body>
<div id="mainPage"><div class="header"><div class="title">Messages</div><div class="search-row"><input id="searchInput" class="search-input" placeholder="Search people..." autocomplete="off"><button id="searchButton" class="search-btn" type="button">⌕</button></div></div><main id="mainContent" class="main"><div class="empty">Loading messages...</div></main></div>
<div id="chatPage" class="chat"><div class="chat-header"><button id="chatBack" class="chat-back">‹</button><img id="chatAvatar" class="chat-avatar" alt=""><div class="chat-user"><div id="chatName" class="chat-name">User</div><div id="chatUsername" class="chat-username">@user</div></div><button id="chatMore" class="chat-more">⋮</button><div id="chatMenu" class="menu"><button id="hideChatBtn">Hide chat</button><button id="messageSettingsBtn">Message Settings</button></div></div><div id="chatBody" class="chat-body"></div><div class="chat-input"><input id="messageInput" class="message-input" placeholder="Message..." autocomplete="off"><button id="sendButton" class="send-btn">➤</button></div></div>
<div id="toast" class="toast"></div>
<nav class="bottom-nav"><a class="nav-item" href="home.html"><span class="nav-icon">⌂</span>Home</a><a class="nav-item" href="search.html"><span class="nav-icon">⌕</span>Search</a><a class="nav-item" href="reels.html"><span class="nav-icon">▶</span>Reels</a><a class="nav-item active" href="messages.html"><span class="nav-icon">♡</span>Messages</a><a class="nav-item" href="profile.html"><span class="nav-icon">◯</span>Profile</a></nav>
<script>
const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk",PROJECT_ID="crockcell-cd2e6",BASE=`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;
let token=localStorage.getItem('crockcell_idToken')||sessionStorage.getItem('crockcell_idToken')||localStorage.getItem('crockcellIdToken')||sessionStorage.getItem('crockcellIdToken')||'';
let currentUID=localStorage.getItem('crockcell_uid')||sessionStorage.getItem('crockcell_uid')||localStorage.getItem('crockcellUid')||sessionStorage.getItem('crockcellUid')||'';
if(!token||!currentUID)location.replace('index.html');
const $=id=>document.getElementById(id),mainContent=$('mainContent'),searchInput=$('searchInput'),searchButton=$('searchButton'),chatPage=$('chatPage'),chatBack=$('chatBack'),chatName=$('chatName'),chatUsername=$('chatUsername'),chatAvatar=$('chatAvatar'),chatBody=$('chatBody'),messageInput=$('messageInput'),sendButton=$('sendButton'),chatMore=$('chatMore'),chatMenu=$('chatMenu'),toast=$('toast');
let selectedUser=null;
function placeholderPhoto(){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#222"/><circle cx="50" cy="40" r="18" fill="#666"/><path d="M20 90c4-22 56-22 60 0" fill="#666"/></svg>')}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toastMsg(t){toast.textContent=t;toast.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.style.display='none',1800)}
function hidden(){try{return JSON.parse(localStorage.getItem('crockcellHiddenChats')||'[]')}catch{return[]}}
function isHidden(uid){return hidden().some(x=>x.uid===uid)}
function hideSelected(){if(!selectedUser)return;const a=hidden().filter(x=>x.uid!==selectedUser.uid);a.push({uid:selectedUser.uid,name:selectedUser.name,username:selectedUser.username,photoURL:selectedUser.photoURL||''});localStorage.setItem('crockcellHiddenChats',JSON.stringify(a));chatMenu.style.display='none';toastMsg('Chat hidden');closeChat();loadInbox()}
function closeChat(){chatPage.style.display='none';$('mainPage').style.display='block';selectedUser=null;chatMenu.style.display='none'}
async function getUserByUID(uid){const r=await fetch(`${BASE}/users/${encodeURIComponent(uid)}?key=${API_KEY}`,{headers:{Authorization:'Bearer '+token}});if(!r.ok)return null;const f=(await r.json()).fields||{};return {uid,name:f.name?.stringValue||f.username?.stringValue||'User',username:f.username?.stringValue||'user',photoURL:f.photoURL?.stringValue||''}}
async function getUsernameIndex(username){const r=await fetch(`${BASE}/usernameIndex/${encodeURIComponent(username.toLowerCase())}?key=${API_KEY}`);if(!r.ok)return null;const f=(await r.json()).fields||{};return {uid:f.uid?.stringValue||'',username:f.username?.stringValue||username}}
function fsVal(v){if(v?.stringValue!==undefined)return v.stringValue;if(v?.timestampValue!==undefined)return v.timestampValue;if(v?.integerValue!==undefined)return Number(v.integerValue);return null}
async function runQuery(body){const r=await fetch(`${BASE}:runQuery?key=${API_KEY}`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});if(!r.ok)throw new Error('query failed');const arr=await r.json();return arr.filter(x=>x.document).map(x=>{const f=x.document.fields||{};const o={};for(const k in f)o[k]=fsVal(f[k]);return o})}
async function queryMessages(sender,receiver){return runQuery({structuredQuery:{from:[{collectionId:'messages'}],where:{compositeFilter:{op:'AND',filters:[{fieldFilter:{field:{fieldPath:'senderId'},op:'EQUAL',value:{stringValue:sender}}},{fieldFilter:{field:{fieldPath:'receiverId'},op:'EQUAL',value:{stringValue:receiver}}}]}},orderBy:[{field:{fieldPath:'createdAt'},direction:'ASCENDING'}]}})}
async function loadInbox(){mainContent.innerHTML='<div class="empty">Loading messages...</div>';try{const sent=await runQuery({structuredQuery:{from:[{collectionId:'messages'}],where:{fieldFilter:{field:{fieldPath:'senderId'},op:'EQUAL',value:{stringValue:currentUID}}}}});const rec=await runQuery({structuredQuery:{from:[{collectionId:'messages'}],where:{fieldFilter:{field:{fieldPath:'receiverId'},op:'EQUAL',value:{stringValue:currentUID}}}}});const all=[...sent,...rec].sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));const map=new Map();for(const m of all){const partner=m.senderId===currentUID?m.receiverId:m.senderId;if(!map.has(partner))map.set(partner,m)}const rows=[];for(const [uid,m] of map){if(isHidden(uid))continue;const u=await getUserByUID(uid);if(u)rows.push({u,m})}if(!rows.length){mainContent.innerHTML='<div class="empty">Search karke kisi user ko message karo.</div>';return}mainContent.innerHTML='<div class="section-title">Your chats</div>'+rows.map(({u,m})=>`<div class="user-card" data-uid="${esc(u.uid)}"><img class="avatar" src="${esc(u.photoURL||placeholderPhoto())}" alt=""><div class="user-info"><div class="name">${esc(u.name)}</div><div class="username">@${esc(u.username)}</div><div class="preview">${m.senderId===currentUID?'You: ':''}${esc(m.text||'')}</div></div><button class="open-btn" type="button">Open</button></div>`).join('');mainContent.querySelectorAll('.user-card').forEach(c=>c.onclick=()=>openChatByUID(c.dataset.uid));}catch(e){console.error(e);mainContent.innerHTML='<div class="empty">Messages load nahi ho paaye.</div>'}}
async function openChatByUID(uid){const u=await getUserByUID(uid);if(u)openChat(u)}
async function openChat(u){selectedUser=u;sessionStorage.setItem('crockcell_chat_target',JSON.stringify(u));$('mainPage').style.display='none';chatPage.style.display='block';chatMenu.style.display='none';chatName.textContent=u.name;chatUsername.textContent='@'+u.username;chatAvatar.src=u.photoURL||placeholderPhoto();await loadChat()}
async function loadChat(){chatBody.innerHTML='<div class="chat-empty">Loading messages...</div>';try{const [a,b]=await Promise.all([queryMessages(currentUID,selectedUser.uid),queryMessages(selectedUser.uid,currentUID)]);const all=[...a,...b].sort((x,y)=>new Date(x.createdAt||0)-new Date(y.createdAt||0));if(!all.length){chatBody.innerHTML='<div class="chat-empty">No messages yet.</div>';return}chatBody.innerHTML=all.map(m=>`<div class="bubble ${m.senderId===currentUID?'mine':'theirs'}">${esc(m.text||'')}<div class="time">${new Date(m.createdAt||Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>`).join('');chatBody.scrollTop=chatBody.scrollHeight}catch(e){console.error(e);chatBody.innerHTML='<div class="chat-empty">Messages load nahi ho paaye.</div>'}}
async function sendMessage(){if(!selectedUser)return;const text=messageInput.value.trim();if(!text)return;const settings=JSON.parse(localStorage.getItem('crockcellMessageSettings')||'{"allow":"everyone"}');if(settings.allow==='no_one'){toastMsg('Message sending is disabled in your settings');return}sendButton.disabled=true;const id=currentUID+'_'+selectedUser.uid+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);const url=`${BASE}/messages/${encodeURIComponent(id)}?key=${API_KEY}`;try{const now=new Date().toISOString();const r=await fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({fields:{senderId:{stringValue:currentUID},receiverId:{stringValue:selectedUser.uid},text:{stringValue:text},createdAt:{timestampValue:now}}})});if(!r.ok)throw new Error('send failed');messageInput.value='';await loadChat()}catch(e){console.error(e);toastMsg('Message send nahi hua')}finally{sendButton.disabled=false}}
async function searchPeople(){const q=searchInput.value.trim().toLowerCase();if(!q){loadInbox();return}mainContent.innerHTML='<div class="empty">Searching...</div>';try{const idx=await getUsernameIndex(q);if(!idx?.uid){mainContent.innerHTML='<div class="empty">User nahi mila.</div>';return}const u=await getUserByUID(idx.uid);if(!u){mainContent.innerHTML='<div class="empty">User nahi mila.</div>';return}mainContent.innerHTML=`<div class="section-title">Search result</div><div class="user-card" id="searchUser"><img class="avatar" src="${esc(u.photoURL||placeholderPhoto())}" alt=""><div class="user-info"><div class="name">${esc(u.name)}</div><div class="username">@${esc(u.username)}</div></div><button class="open-btn">Message</button></div>`;$('searchUser').onclick=()=>openChat(u)}catch(e){mainContent.innerHTML='<div class="empty">Search nahi ho paayi.</div>'}}
searchButton.onclick=searchPeople;searchInput.addEventListener('keydown',e=>{if(e.key==='Enter')searchPeople()});chatBack.onclick=()=>{sessionStorage.removeItem('crockcell_chat_target');closeChat();loadInbox()};sendButton.onclick=sendMessage;messageInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});chatMore.onclick=()=>chatMenu.style.display=chatMenu.style.display==='block'?'none':'block';$('hideChatBtn').onclick=hideSelected;$('messageSettingsBtn').onclick=()=>location.href='message-settings.html';document.addEventListener('click',e=>{if(!e.target.closest('.chat-header'))chatMenu.style.display='none'});
(async()=>{let target=null;try{target=JSON.parse(sessionStorage.getItem('crockcell_chat_target')||'null')}catch{}if(target?.uid){const u=await getUserByUID(target.uid);if(u)openChat(u);else loadInbox()}else loadInbox()})();
</script>
</body></html>
