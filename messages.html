<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>CROCKCELL Messages</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  background:#000;

  color:#fff;

  font-family:
  Arial,
  Helvetica,
  sans-serif;

  min-height:100vh;

}


/* =========================
   HEADER
========================= */

.header{

  position:sticky;

  top:0;

  z-index:10;

  padding:18px 18px 12px;

  background:
  rgba(0,0,0,.92);

  backdrop-filter:
  blur(15px);

  border-bottom:
  1px solid #222;

}

.header h1{

  margin:0;

  font-size:27px;

}


/* =========================
   SEARCH
========================= */

.search-box{

  display:flex;

  gap:8px;

  margin-top:15px;

}

.search-input{

  flex:1;

  height:48px;

  border:0;

  outline:none;

  border-radius:18px;

  padding:0 16px;

  background:#191919;

  color:#fff;

  font-size:16px;

}

.search-btn{

  width:52px;

  border:0;

  border-radius:18px;

  background:#fff;

  color:#000;

  font-size:20px;

}


/* =========================
   SEARCH RESULT
========================= */

.result{

  display:none;

  margin-top:12px;

  padding:12px;

  border-radius:18px;

  background:#151515;

  align-items:center;

  gap:12px;

}

.result img{

  width:48px;

  height:48px;

  border-radius:50%;

  object-fit:cover;

  background:#333;

}

.result-info{

  flex:1;

}

.result-name{

  font-weight:bold;

  font-size:16px;

}

.result-username{

  color:#888;

  font-size:14px;

  margin-top:3px;

}

.chat-btn{

  border:0;

  border-radius:14px;

  padding:10px 14px;

  background:#fff;

  color:#000;

  font-weight:bold;

}


/* =========================
   CHAT LIST
========================= */

.section-title{

  padding:18px 18px 8px;

  color:#999;

  font-size:14px;

  font-weight:bold;

  text-transform:uppercase;

}

.chat-list{

  padding-bottom:90px;

}

.chat-item{

  display:flex;

  align-items:center;

  gap:13px;

  padding:14px 18px;

  cursor:pointer;

}

.chat-item:active{

  background:#111;

}

.chat-avatar{

  width:56px;

  height:56px;

  border-radius:50%;

  object-fit:cover;

  background:#222;

}

.chat-info{

  flex:1;

  min-width:0;

}

.chat-name{

  font-size:17px;

  font-weight:bold;

}

.chat-last{

  color:#888;

  margin-top:5px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}

.chat-time{

  color:#666;

  font-size:12px;

}


/* =========================
   CHAT SCREEN
========================= */

.chat-screen{

  display:none;

  position:fixed;

  inset:0;

  z-index:50;

  background:#000;

  flex-direction:column;

}

.chat-header{

  display:flex;

  align-items:center;

  gap:12px;

  padding:15px;

  border-bottom:1px solid #222;

  background:#050505;

}

.back-btn{

  width:42px;

  height:42px;

  border:0;

  border-radius:50%;

  background:#171717;

  color:#fff;

  font-size:22px;

}

.chat-avatar-small{

  width:43px;

  height:43px;

  border-radius:50%;

  object-fit:cover;

  background:#222;

}

.chat-header-info{

  flex:1;

}

.chat-header-name{

  font-size:17px;

  font-weight:bold;

}

.chat-header-username{

  color:#777;

  font-size:13px;

}


/* =========================
   MESSAGES
========================= */

.messages{

  flex:1;

  overflow-y:auto;

  padding:18px 14px;

  display:flex;

  flex-direction:column;

  gap:8px;

}

.bubble{

  max-width:78%;

  padding:11px 14px;

  border-radius:18px;

  font-size:16px;

  line-height:1.35;

  word-wrap:break-word;

}

.mine{

  align-self:flex-end;

  background:#fff;

  color:#000;

  border-bottom-right-radius:5px;

}

.theirs{

  align-self:flex-start;

  background:#202020;

  color:#fff;

  border-bottom-left-radius:5px;

}

.msg-time{

  display:block;

  font-size:10px;

  opacity:.5;

  margin-top:4px;

}


/* =========================
   SEND
========================= */

.send-area{

  display:flex;

  gap:8px;

  padding:10px;

  border-top:1px solid #222;

  background:#050505;

}

.message-input{

  flex:1;

  min-width:0;

  height:48px;

  border:0;

  outline:none;

  border-radius:20px;

  background:#191919;

  color:#fff;

  padding:0 16px;

  font-size:16px;

}

.send-btn{

  width:52px;

  height:48px;

  border:0;

  border-radius:20px;

  background:#fff;

  color:#000;

  font-size:20px;

  font-weight:bold;

}


/* =========================
   EMPTY
========================= */

.empty{

  text-align:center;

  color:#666;

  padding:50px 20px;

  font-size:15px;

}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{

  position:fixed;

  left:12px;

  right:12px;

  bottom:12px;

  z-index:20;

  display:flex;

  justify-content:space-around;

  padding:8px;

  border-radius:24px;

  background:
  rgba(25,25,25,.88);

  backdrop-filter:
  blur(18px);

  border:1px solid #333;

}

.nav-item{

  flex:1;

  text-align:center;

  padding:9px 5px;

  border-radius:17px;

  color:#999;

  text-decoration:none;

  font-size:12px;

}

.nav-item.active{

  background:#fff;

  color:#000;

}

.nav-icon{

  display:block;

  font-size:20px;

  margin-bottom:3px;

}

</style>

</head>

<div

      onclick="closeChat()"

    </button>

      src=""

        id="chatName"
        class="chat-header-name"
      ></div>

</div>

<div class="bottom-nav">

    href="search.html"

    class="nav-item"
    href="reels.html"
  >

    Reels
  </a>

<script>

/* =========================
   FIREBASE
========================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================
   SESSION
========================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let uid =
localStorage.getItem(
  "crockcell_uid"
);

if(!token || !uid){

  window.location.replace(
    "index.html"
  );

}


/* =========================
   STATE
========================= */

let currentChatId=null;

let currentUser=null;

let searchedUser=null;

let refreshTimer=null;


/* =========================
   FIRESTORE VALUE HELPERS
========================= */

function str(value){

  return {
    stringValue:String(value ?? "")
  };

}

function num(value){

  return {
    integerValue:String(value)
  };

}

function bool(value){

  return {
    booleanValue:!!value
  };

}


/* =========================
   LOAD CURRENT USER
========================= */

async function loadCurrentUser(){

  try{

    const url=
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/users/" +
    uid;

    const response=
    await fetch(url,{

      headers:{
        Authorization:"Bearer "+token
      }

    });

    if(!response.ok)return;

    const data=
    await response.json();

    const f=data.fields || {};

    currentUser={

      uid,

      name:
      f.name?.stringValue || "User",

      username:
      f.username?.stringValue || "",

      email:
      f.email?.stringValue || "",

      photoURL:
      f.photoURL?.stringValue || ""

    };

  }catch(error){

    console.error(error);

  }

}


/* =========================
   USERNAME SEARCH
========================= */

async function searchUser(){

  const input=
  document.getElementById(
    "searchInput"
  );

  const username=
  input.value.trim().toLowerCase();

  if(!username)return;

  const result=
  document.getElementById(
    "searchResult"
  );

  result.style.display="none";

  try{

    const url=
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/usernameIndex/" +
    encodeURIComponent(username);

    const response=
    await fetch(
      url + "?key=" + API_KEY
    );

    if(!response.ok){

      alert("User nahi mila.");

      return;

    }

    const data=
    await response.json();

    const f=data.fields || {};

    const foundUID=
    f.uid?.stringValue || "";

    const foundUsername=
    f.username?.stringValue || username;

    const foundEmail=
    f.email?.stringValue || "";


    if(foundUID===uid){

      alert("Ye tumhara khud ka account hai.");

      return;

    }


    searchedUser={

      uid:foundUID,

      username:foundUsername,

      email:foundEmail,

      name:foundUsername,

      photoURL:""

    };


    /* Load profile photo/name */

    try{

      const profileURL=
      "https://firestore.googleapis.com/v1/projects/" +
      PROJECT_ID +
      "/databases/(default)/documents/users/" +
      foundUID;

      const profileResponse=
      await fetch(profileURL,{

        headers:{
          Authorization:"Bearer "+token
        }

      });

      if(profileResponse.ok){

        const profile=
        await profileResponse.json();

        const pf=
        profile.fields || {};

        searchedUser.name=
        pf.name?.stringValue ||
        foundUsername;

        searchedUser.photoURL=
        pf.photoURL?.stringValue || "";

      }

    }catch(e){}


    document.getElementById(
      "resultName"
    ).textContent=
    searchedUser.name;


    document.getElementById(
      "resultUsername"
    ).textContent=
    "@"+searchedUser.username;


    document.getElementById(
      "resultPhoto"
    ).src=
    searchedUser.photoURL ||
    "data:image/svg+xml,"+
    "<svg xmlns='http://www.w3.org/2000/svg'"+
    " width='100' height='100'>"+
    "<rect width='100' height='100' fill='%23333'/>"+
    "</svg>";


    result.style.display="flex";


  }catch(error){

    console.error(error);

    alert("Search failed.");

  }

}


/* =========================
   CHAT ID
========================= */

function makeChatId(uid1,uid2){

  return [uid1,uid2]
    .sort()
    .join("_");

}


/* =========================
   CREATE / UPDATE CHAT
========================= */

async function ensureChat(otherUser){

  const chatId=
  makeChatId(uid,otherUser.uid);

  const url=
  "https://firestore.googleapis.com/v1/projects/" +
  PROJECT_ID +
  "/databases/(default)/documents/chats/" +
  chatId;


  const body={

    fields:{

      participants:{
        arrayValue:{
          values:[
            str(uid),
            str(otherUser.uid)
          ]
        }
      },

      participantNames:{
        mapValue:{
          fields:{

            [uid]:str(
              currentUser?.username || "User"
            ),

            [otherUser.uid]:str(
              otherUser.username
            )

          }
        }
      },

      lastMessage:str(""),

      lastMessageAt:num(
        Date.now()
      )

    }

  };


  await fetch(
    url + "?updateMask.fieldPaths=participants" +
    "&updateMask.fieldPaths=participantNames" +
    "&updateMask.fieldPaths=lastMessage" +
    "&updateMask.fieldPaths=lastMessageAt",
    {

      method:"PATCH",

      headers:{

        Authorization:"Bearer "+token,

        "Content-Type":
        "application/json"

      },

      body:JSON.stringify(body)

    }

  );


  return chatId;

}


/* =========================
   OPEN SEARCHED CHAT
========================= */

async function openSearchedChat(){

  if(!searchedUser)return;

  const chatId=
  await ensureChat(
    searchedUser
  );

  openChat(
    chatId,
    searchedUser
  );

}


/* =========================
   LOAD CHATS
========================= */

async function loadChats(){

  const list=
  document.getElementById(
    "chatList"
  );

  try{

    const url=
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents:runQuery";


    const body={

      structuredQuery:{

        from:[
          {
            collectionId:"chats"
          }
        ],

        where:{

          fieldFilter:{

            field:{
              fieldPath:"participants"
            },

            op:"ARRAY_CONTAINS",

            value:str(uid)

          }

        },

        orderBy:[

          {

            field:{
              fieldPath:"lastMessageAt"
            },

            direction:"DESCENDING"

          }

        ],

        limit:50

      }

    };


    const response=
    await fetch(
      url+"?key="+API_KEY,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer "+token,

          "Content-Type":
          "application/json"

        },

        body:JSON.stringify(body)

      }

    );


    if(!response.ok){

      throw new Error(
        "Chat query failed"
      );

    }


    const rows=
    await response.json();


    list.innerHTML="";


    if(!rows.length){

      list.innerHTML=
      `<div class="empty">
        Abhi koi chat nahi hai.<br>
        Upar username search karke message bhejo.
      </div>`;

      return;

    }


    for(const row of rows){

      if(!row.document)continue;

      const f=
      row.document.fields || {};

      const participants=
      f.participants?.arrayValue?.values
      || [];

      const otherUID=
      participants
      .map(x=>x.stringValue)
      .find(x=>x!==uid);


      if(!otherUID)continue;


      const other=
      await getUserByUID(otherUID);


      if(!other)continue;


      const lastMessage=
      f.lastMessage?.stringValue || "";


      const time=
      Number(
        f.lastMessageAt?.integerValue || 0
      );


      const item=
      document.createElement("div");

      item.className="chat-item";


      item.innerHTML=`

        <img
          class="chat-avatar"
          src="${escapeHTML(
            other.photoURL ||
            placeholderPhoto()
          )}"
        >

        <div class="chat-info">

          <div class="chat-name">
            ${escapeHTML(
              other.name ||
              other.username
            )}
          </div>

          <div class="chat-last">
            ${escapeHTML(
              lastMessage ||
              "Start chatting"
            )}
          </div>

        </div>

        <div class="chat-time">
          ${formatTime(time)}
        </div>

      `;


      item.onclick=()=>{

        openChat(
          makeChatId(uid,otherUID),
          other
        );

      };


      list.appendChild(item);

    }


  }catch(error){

    console.error(error);

    list.innerHTML=
    `<div class="empty">
      Chats load nahi ho pa rahe.
    </div>`;

  }

}


/* =========================
   GET USER
========================= */

async function getUserByUID(otherUID){

  try{

    const url=
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/users/" +
    otherUID;


    const response=
    await fetch(url,{

      headers:{
        Authorization:"Bearer "+token
      }

    });


    if(!response.ok)return null;


    const data=
    await response.json();

    const f=data.fields || {};


    return {

      uid:otherUID,

      name:
      f.name?.stringValue ||
      f.username?.stringValue ||
      "User",

      username:
      f.username?.stringValue || "",

      photoURL:
      f.photoURL?.stringValue || ""

    };

  }catch(error){

    return null;

  }

}


/* =========================
   OPEN CHAT
========================= */

async function openChat(chatId,otherUser){

  currentChatId=chatId;

  document.getElementById(
    "chatName"
  ).textContent=
  otherUser.name ||
  otherUser.username;


  document.getElementById(
    "chatUsername"
  ).textContent=
  "@"+otherUser.username;


  document.getElementById(
    "chatPhoto"
  ).src=
  otherUser.photoURL ||
  placeholderPhoto();


  document.getElementById(
    "chatScreen"
  ).style.display="flex";


  document.getElementById(
    "messageInput"
  ).focus();


  await loadMessages();


  if(refreshTimer){

    clearInterval(refreshTimer);

  }


  refreshTimer=
  setInterval(
    loadMessages,
    3000
  );

}


/* =========================
   CLOSE CHAT
========================= */

function closeChat(){

  if(refreshTimer){

    clearInterval(refreshTimer);

    refreshTimer=null;

  }

  currentChatId=null;

  document.getElementById(
    "chatScreen"
  ).style.display="none";


  loadChats();

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  if(!currentChatId)return;


  const box=
  document.getElementById(
    "messages"
  );


  try{

    const url=
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents:runQuery";


    const body={

      structuredQuery:{

        from:[

          {
            collectionId:"messages",
            allDescendants:false
          }

        ],

        orderBy:[

          {
            field:{
              fieldPath:"createdAt"
            },

            direction:"ASCENDING"

          }

        ],

        limit:100

      }

    };


    /*
      Subcollection query ko direct
      parent document ke andar karne
      ke liye parent path use karenge.
    */

    const parentURL=
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/chats/" +
    currentChatId +
    "/messages";


    const directURL=
    parentURL+"?key="+API_KEY;


    const response=
    await fetch(directURL);


    /*
      Agar direct list available nahi,
      runQuery fallback.
    */

    if(!response.ok){

      box.innerHTML=
      `<div class="empty">
        Messages load nahi ho pa rahe.
      </div>`;

      return;

    }


    const data=
    await response.json();


    const docs=
