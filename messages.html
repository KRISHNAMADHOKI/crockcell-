<script>

/* =========================
   FIREBASE CONFIG
========================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================
   SESSION
========================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
) ||
sessionStorage.getItem(
  "crockcell_idToken"
) ||
localStorage.getItem(
  "crockcellIdToken"
) ||
sessionStorage.getItem(
  "crockcellIdToken"
);


let currentUID =
localStorage.getItem(
  "crockcell_uid"
) ||
sessionStorage.getItem(
  "crockcell_uid"
) ||
localStorage.getItem(
  "crockcellUid"
) ||
sessionStorage.getItem(
  "crockcellUid"
);


if(
  !token ||
  !currentUID
){

  window.location.replace(
    "index.html"
  );

}


/* =========================
   ELEMENTS
========================= */

const mainPage =
document.getElementById(
  "mainPage"
);

const mainContent =
document.getElementById(
  "mainContent"
);

const searchInput =
document.getElementById(
  "searchInput"
);

const searchButton =
document.getElementById(
  "searchButton"
);

const chatPage =
document.getElementById(
  "chatPage"
);

const chatBack =
document.getElementById(
  "chatBack"
);

const chatName =
document.getElementById(
  "chatName"
);

const chatUsername =
document.getElementById(
  "chatUsername"
);

const chatAvatar =
document.getElementById(
  "chatAvatar"
);

const chatBody =
document.getElementById(
  "chatBody"
);

const messageInput =
document.getElementById(
  "messageInput"
);

const sendButton =
document.getElementById(
  "sendButton"
);


let selectedUser = null;


/* =========================
   START
========================= */

startMessages();


async function startMessages(){

  let target = null;


  try{

    const saved =
    sessionStorage.getItem(
      "crockcell_chat_target"
    );


    if(saved){

      target =
      JSON.parse(saved);

    }

  }
  catch(error){

    target = null;

  }


  /*
    Agar kisi specific chat se
    messages page khula hai
  */

  if(
    target &&
    target.uid
  ){

    await openTargetUser(
      target
    );

    return;

  }


  /*
    Normal Messages page
    par inbox load hoga
  */

  await loadInbox();

}


/* =========================
   PLACEHOLDER PHOTO
========================= */

function placeholderPhoto(){

  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(

      '<svg xmlns="http://www.w3.org/2000/svg" ' +
      'width="100" height="100">' +

      '<rect width="100" height="100" fill="#222"/>' +

      '<circle ' +
      'cx="50" cy="38" r="18" fill="#777"/>' +

      '<path ' +
      'd="M20 88c4-22 56-22 60 0" ' +
      'fill="#777"/>' +

      '</svg>'

    )
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =========================
   PARSE USER
========================= */

function parseUser(
  documentData
){

  const fields =
  documentData.fields ||
  {};

  const pathParts =
  documentData.name
    ? documentData.name.split("/")
    : [];

  const pathUID =
  pathParts.length
    ? pathParts[pathParts.length - 1]
    : "";


  return {

    uid:
    fields.uid?.stringValue ||
    pathUID ||
    "",

    username:
    fields.username?.stringValue ||
    "user",

    name:
    fields.name?.stringValue ||
    fields.username?.stringValue ||
    "User",

    photoURL:
    fields.photoURL?.stringValue ||
    ""

  };

}


/* =========================
   GET USER
========================= */

async function getUserByUID(
  uid
){

  const url =
  "https://firestore.googleapis.com/v1/projects/" +
  PROJECT_ID +
  "/databases/(default)/documents/users/" +
  encodeURIComponent(uid) +
  "?key=" +
  API_KEY;


  const response =
  await fetch(
    url,
    {

      headers:{
        Authorization:
        "Bearer " +
        token
      }

    }
  );


  if(
    !response.ok
  ){

    return null;

  }


  const data =
  await response.json();


  return parseUser(
    data
  );

}


/* =========================
   GET MESSAGES FOR ONE SIDE
========================= */

async function queryMessages(
  sender,
  receiver
){

  const url =
  "https://firestore.googleapis.com/v1/projects/" +
  PROJECT_ID +
  "/databases/(default)/documents:runQuery" +
  "?key=" +
  API_KEY;


  const body = {

    structuredQuery: {

      from:[
        {
          collectionId:
          "messages"
        }
      ],

      where:{

        compositeFilter:{

          op:"AND",

          filters:[

            {

              fieldFilter:{

                field:{
                  fieldPath:
                  "senderId"
                },

                op:
                "EQUAL",

                value:{
                  stringValue:
                  sender
                }

              }

            },


            {

              fieldFilter:{

                field:{
                  fieldPath:
                  "receiverId"
                },

                op:
                "EQUAL",

                value:{
                  stringValue:
                  receiver
                }

              }

            }

          ]

        }

      },

      limit:200

    }

  };


  const response =
  await fetch(
    url,
    {

      method:"POST",

      headers:{

        Authorization:
        "Bearer " +
        token,

        "Content-Type":
        "application/json"

      },

      body:
      JSON.stringify(
        body
      )

    }
  );


  if(
    !response.ok
  ){

    throw new Error(
      "MESSAGE_QUERY_FAILED"
    );

  }


  const rows =
  await response.json();


  const messages = [];


  rows.forEach(
    row => {

      if(
        !row.document
      ){

        return;

      }


      const fields =
      row.document.fields ||
      {};


      messages.push({

        senderId:
        fields.senderId?.stringValue ||
        "",

        receiverId:
        fields.receiverId?.stringValue ||
        "",

        text:
        fields.text?.stringValue ||
        "",

        createdAt:
        fields.createdAt?.timestampValue ||
        ""

      });

    }
  );


  return messages;

}


/* =========================
   LOAD INBOX
========================= */

async function loadInbox(){

  mainContent.innerHTML = `

    <div class="empty">
      Messages loading...
    </div>

  `;


  try{

    /*
      Current user ne jo messages
      bheje hain
    */

    const sent =
    await queryMessagesForInbox(
      currentUID,
      "senderId"
    );


    /*
      Current user ko jo messages
      mile hain
    */

    const received =
    await queryMessagesForInbox(
      currentUID,
      "receiverId"
    );


    const allMessages = [
      ...sent,
      ...received
    ];


    const chats =
    new Map();


    /*
      Har user ke liye sirf
      latest message rakhenge.
    */

    allMessages.forEach(
      message => {

        let partnerId = "";


        if(
          message.senderId ===
          currentUID
        ){

          partnerId =
          message.receiverId;

        }
        else if(
          message.receiverId ===
          currentUID
        ){

          partnerId =
          message.senderId;

        }


        if(
          !partnerId ||
          partnerId === currentUID
        ){

          return;

        }


        const old =
        chats.get(
          partnerId
        );


        if(
          !old ||
          getTime(
            message.createdAt
          ) >
          getTime(
            old.createdAt
          )
        ){

          chats.set(
            partnerId,
            message
          );

        }

      }
    );


    const chatItems =
    Array.from(
      chats.entries()
    )
    .map(
      ([uid,message]) => ({

        uid:uid,

        lastText:
        message.text || "",

        lastTime:
        message.createdAt || ""

      })
    );


    chatItems.sort(
      (a,b) =>
      getTime(
        b.lastTime
      ) -
      getTime(
        a.lastTime
      )
    );


    if(
      !chatItems.length
    ){

      mainContent.innerHTML = `

        <div class="empty">

          Abhi koi chat nahi hai.<br><br>

          Search karke kisi user ko message karo.

        </div>

      `;

      return;

    }


    /*
      Firebase se sab users
      ek saath load karenge
    */

    const users =
    await Promise.all(

      chatItems.map(
        async item => {

          const user =
          await getUserByUID(
            item.uid
          );


          if(
            !user
          ){

            return null;

          }


          return {

            ...user,

            lastText:
            item.lastText,

            lastTime:
            item.lastTime

          };

        }
      )

    );


    const validUsers =
    users.filter(
      user => user !== null
    );


    renderInbox(
      validUsers
    );

  }
  catch(error){

    console.error(
      "Inbox error:",
      error
    );


    mainContent.innerHTML = `

      <div class="empty">

        Messages list load nahi ho paayi.<br><br>

        Page refresh karke dobara try karo.

      </div>

    `;

  }

}


/* =========================
   INBOX QUERY
========================= */

async function queryMessagesForInbox(
  uid,
  fieldName
){

  const url =
  "https://firestore.googleapis.com/v1/projects/" +
  PROJECT_ID +
  "/databases/(default)/documents:runQuery" +
  "?key=" +
  API_KEY;


  const body = {

    structuredQuery:{

      from:[
        {
          collectionId:
          "messages"
        }
      ],

      where:{

        fieldFilter:{

          field:{
            fieldPath:
            fieldName
          },

          op:
          "EQUAL",

          value:{
            stringValue:
            uid
          }

        }

      },

      limit:500

    }

  };


  const response =
  await fetch(
    url,
    {

      method:"POST",

      headers:{

        Authorization:
        "Bearer " +
        token,

        "Content-Type":
        "application/json"

      },

      body:
      JSON.stringify(
        body
      )

    }
  );


  if(
    !response.ok
  ){

    throw new Error(
      "INBOX_QUERY_FAILED"
    );

  }


  const rows =
  await response.json();


  const messages = [];


  rows.forEach(
    row => {

      if(
        !row.document
      ){

        return;

      }


      const fields =
      row.document.fields ||
      {};


      messages.push({

        senderId:
        fields.senderId?.stringValue ||
        "",

        receiverId:
        fields.receiverId?.stringValue ||
        "",

        text:
        fields.text?.stringValue ||
        "",

        createdAt:
        fields.createdAt?.timestampValue ||
        ""

      });

    }
  );


  return messages;

}


/* =========================
   RENDER INBOX
========================= */

function renderInbox(
  users
){

  mainContent.innerHTML = `

    <div class="section-title">
      Chats
    </div>

  `;


  users.forEach(
    user => {

      const card =
      document.createElement(
        "div"
      );


      card.className =
      "user-card";


      const time =
      formatTime(
        user.lastTime
      );


      card.innerHTML = `

        <img
          class="avatar"
          src="${
            escapeHTML(
              user.photoURL ||
              placeholderPhoto()
            )
          }"
          alt=""
        >


        <div class="user-info">

          <div class="name">
            ${
              escapeHTML(
                user.name
              )
            }
          </div>


          <div class="username">
            @
            ${
              escapeHTML(
                user.username
              )
            }
          </div>


          <div class="preview">

            ${
              escapeHTML(
                user.lastText ||
                "Message"
              )
            }

            <span class="time">
              ${
                escapeHTML(
                  time
                )
              }
            </span>

          </div>

        </div>


        <div class="arrow">
          ›
        </div>

      `;


      card.addEventListener(
        "click",
        () => {

          openTargetUser(
            user
          );

        }
      );


      mainContent.appendChild(
        card
      );

    }
  );

}


/* =========================
   TIME
========================= */

function getTime(
  value
){

  const time =
  Date.parse(
    value || ""
  );


  if(
    Number.isNaN(
      time
    )
  ){

    return 0;

  }


  return time;

}


function formatTime(
  value
){

  if(
    !value
  ){

    return "";

  }


  cons
