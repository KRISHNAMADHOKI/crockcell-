/* =====================================================

===================================================== */

function stringField(value){

    stringValue:String(value)
  };

}


function timestampField(){

  return {

  };

/* =====================================================
   LOAD USER PROFILE
===================================================== */

async function getUserProfile(uid){

  try{

      documentsURL +

/* =====================================================
   LOAD CONVERSATION
===================================================== */

async function loadConversation(){

  if(!currentChatUser){

    return;

  }


  try{

    /*
      Firebase REST runQuery ek query me
      sirf ek condition ke liye use hoga.

      Isliye sender aur receiver dono
      directions alag-alag query karenge.
    */


    const sent =
    await getMessagesQuery(
      "senderId",
      currentUID,
      currentChatUser.uid
    );


    const received =
    await getMessagesQuery(
      "receiverId",
      currentUID,
      currentChatUser.uid
    );


    /*
      Dono arrays ko combine karke
      current conversation filter karenge.
    */

    const all = [];


    sent.forEach(item=>{

      if(
        item.senderId===currentUID &&
        item.receiverId===
        currentChatUser.uid
      ){

        all.push(item);

      }

    });


    received.forEach(item=>{

      if(
        item.senderId===
        currentChatUser.uid &&
        item.receiverId===
        currentUID
      ){

        all.push(item);

      }

    });


    /*
      Newest/oldest order.
    */

    all.sort(
      (a,b)=>
      new Date(a.createdAt) -
      new Date(b.createdAt)
    );


    renderMessages(all);


  }catch(error){

    console.error(
      "Conversation error:",
      error
    );

    messagesArea.innerHTML =
    `<div class="empty">
      Messages load nahi ho paaye.
    </div>`;

  }

}


/* =====================================================
   FIRESTORE MESSAGE QUERY
===================================================== */

async function getMessagesQuery(
  fieldName,
  userUID,
  otherUID
){

  const queryURL =
  documentsURL +
  ":runQuery?key=" +
  API_KEY;


  const body={

    structuredQuery:{

      from:[
        {
          collectionId:
          "messages"
        }
      ],

      where:{

        fieldFilter:{

          field:{
            fieldPath:
            fieldName
          },

          op:"EQUAL",

          value:{
            stringValue:
            userUID
          }

        }

      },

      orderBy:[

        {
          field:{
            fieldPath:
            "createdAt"
          },

          direction:
          "ASCENDING"

        }

      ],

      limit:100

    }

  };


  const response =
  await fetch(
    queryURL,
    {

      method:"POST",

      headers:{

        Authorization:
        "Bearer " + token,

        "Content-Type":
        "application/json"

      },

      body:
      JSON.stringify(body)

    }
  );


  if(!response.ok){

    return [];

  }


  const rows =
  await response.json();


  const messages=[];


  rows.forEach(row=>{

    if(!row.document){

      return;

    }


    const f =
    row.document.fields || {};


    const senderId =
    f.senderId?.stringValue ||
    "";


    const receiverId =
    f.receiverId?.stringValue ||
    "";


    const text =
    f.text?.stringValue ||
    "";


    const createdAt =
    f.createdAt?.timestampValue ||
    f.createdAt?.stringValue ||
    "";


    if(
      text &&
      (
        (
          senderId===userUID &&
          receiverId===otherUID
        )
        ||
        (
          senderId===otherUID &&
          receiverId===userUID
        )
      )
    ){

      messages.push({

        id:
        row.document.name,

        senderId:
        senderId,

        receiverId:
        receiverId,

        text:
        text,

        createdAt:
        createdAt

      });

    }

  });


  return messages;

}


/* =====================================================
   SHOW MESSAGES
===================================================== */

function renderMessages(messages){

  messagesArea.innerHTML="";


  if(!messages.length){

    messagesArea.innerHTML =
    `<div class="empty">
      Say hi 👋
      <br>
      Abhi koi message nahi hai.
    </div>`;

    return;

  }


  messages.forEach(message=>{

    const row =
    document.createElement(
      "div"
    );


    row.className =
    "message-row " +
    (
      message.senderId===currentUID
      ? "mine"
      : "theirs"
    );


    const bubble =
    document.createElement(
      "div"
    );


    bubble.className =
    "message-bubble";


    const text =
    document.createElement(
      "div"
    );


    text.textContent =
    message.text;


    bubble.appendChild(
      text
    );


    const time =
    document.createElement(
      "div"
    );


    time.className =
    "message-time";


    time.textContent =
    formatTime(
      message.createdAt
    );


    bubble.appendChild(
      time
    );


    row.appendChild(
      bubble
    );


    messagesArea.appendChild(
      row
    );

  });


  /*
    Neeche scroll.
  */

  messagesArea.scrollTop =
  messagesArea.scrollHeight;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(!currentChatUser){

    return;

  }


  const text =
  messageInput.value.trim();


  if(!text){

    return;

  }


  sendBtn.disabled =
  true;


  try{

    const response =
    await fetch(
      documentsURL +
      "/messages?key=" +
      API_KEY,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify({

          fields:{

            senderId:
            stringField(
              currentUID
            ),

            receiverId:
            stringField(
              currentChatUser.uid
            ),

            text:
            stringField(
              text
            ),

            createdAt:
            timestampField()

          }

        })

      }
    );


    if(!response.ok){

      const errorText =
      await response.text();

      console.error(
        errorText
      );

      alert(
        "Message send nahi hua."
      );

      return;

    }


    messageInput.value =
    "";


    await loadConversation();


  }catch(error){

    console.error(error);

    alert(
      "Message send nahi hua."
    );

  }finally{

    sendBtn.disabled =
    false;

    messageInput.focus();

  }

}
