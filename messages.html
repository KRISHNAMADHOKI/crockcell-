<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CROCKCELL Messages</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
min-height:100vh;
}

.header{
padding:20px 16px 14px;
border-bottom:1px solid #222;
position:sticky;
top:0;
z-index:10;
background:#000;
}

.title{
font-size:27px;
font-weight:800;
margin-bottom:14px;
}

.search-row{
display:flex;
gap:8px;
}

.search-input{
flex:1;
height:50px;
border:0;
border-radius:20px;
background:#191919;
color:#fff;
padding:0 16px;
font-size:16px;
outline:none;
}

.search-btn{
width:54px;
height:50px;
border:0;
border-radius:20px;
background:#fff;
color:#000;
font-size:22px;
}

.main{
padding:12px 14px 105px;
}

.empty{
text-align:center;
color:#777;
padding:55px 15px;
}

.user-card{
display:flex;
align-items:center;
gap:12px;
padding:13px 5px;
border-bottom:1px solid #191919;
cursor:pointer;
}

.avatar{
width:54px;
height:54px;
border-radius:50%;
object-fit:cover;
background:#222;
flex-shrink:0;
}

.user-info{
flex:1;
min-width:0;
}

.name{
font-size:16px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.username{
color:#888;
margin-top:4px;
font-size:14px;
}

.arrow{
color:#777;
font-size:24px;
}

/* CHAT */

.chat{
display:none;
position:fixed;
inset:0;
background:#000;
z-index:50;
}

.chat-header{
height:74px;
display:flex;
align-items:center;
gap:10px;
padding:9px 13px;
border-bottom:1px solid #222;
background:#111;
}

.chat-back{
width:42px;
height:42px;
border:0;
border-radius:50%;
background:#222;
color:#fff;
font-size:25px;
}

.chat-avatar{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
background:#333;
}

.chat-user{
flex:1;
min-width:0;
}

.chat-name{
font-weight:700;
font-size:16px;
}

.chat-username{
color:#888;
font-size:13px;
margin-top:3px;
}

.chat-body{
position:absolute;
top:74px;
bottom:73px;
left:0;
right:0;
overflow-y:auto;
padding:14px;
}

.chat-empty{
text-align:center;
color:#666;
margin-top:35%;
line-height:1.5;
}

.bubble{
max-width:78%;
padding:10px 13px;
margin:7px 0;
border-radius:18px;
line-height:1.4;
word-break:break-word;
white-space:pre-wrap;
}

.mine{
margin-left:auto;
background:#fff;
color:#000;
border-bottom-right-radius:5px;
}

.theirs{
margin-right:auto;
background:#202020;
color:#fff;
border-bottom-left-radius:5px;
}

.chat-input{
position:absolute;
bottom:0;
left:0;
right:0;
height:73px;
display:flex;
gap:8px;
padding:11px;
background:#111;
border-top:1px solid #222;
}

.message-input{
flex:1;
border:0;
outline:none;
border-radius:20px;
background:#222;
color:#fff;
padding:0 16px;
font-size:15px;
}

.send-btn{
width:56px;
border:0;
border-radius:20px;
background:#fff;
color:#000;
font-size:20px;
}

.send-btn:disabled{
opacity:.5;
}

/* NAV */

.bottom-nav{
position:fixed;
left:12px;
right:12px;
bottom:12px;
z-index:20;
display:flex;
padding:8px;
border-radius:24px;
background:rgba(25,25,25,.94);
border:1px solid #333;
}

.nav-item{
flex:1;
text-align:center;
padding:8px 3px;
border-radius:17px;
color:#999;
text-decoration:none;
font-size:10px;
}

.nav-item.active{
background:#fff;
color:#000;
}

.nav-icon{
display:block;
font-size:19px;
margin-bottom:3px;
}
</style>
</head>

<body>

<div id="mainPage">

<div class="header">

<div class="title">
Messages
</div>

<div class="search-row">

<input
id="searchInput"
class="search-input"
placeholder="Search people..."
autocomplete="off"
>

<button
id="searchButton"
class="search-btn"
type="button"
>
⌕
</button>

</div>

</div>

<div id="mainContent" class="main">

<div class="empty">
Search karke kisi user ko message karo.
</div>

</div>

</div>


<!-- CHAT -->

<div id="chatPage" class="chat">

<div class="chat-header">

<button
id="chatBack"
class="chat-back"
type="button"
>
‹
</button>

<img
id="chatAvatar"
class="chat-avatar"
alt=""
>

<div class="chat-user">

<div
id="chatName"
class="chat-name"
>
User
</div>

<div
id="chatUsername"
class="chat-username"
>
@user
</div>

</div>

</div>


<div
id="chatBody"
class="chat-body"
>

<div class="chat-empty">
No messages yet.
</div>

</div>


<div class="chat-input">

<input
id="messageInput"
class="message-input"
placeholder="Message..."
autocomplete="off"
maxlength="2000"
>

<button
id="sendButton"
class="send-btn"
type="button"
>
➤
</button>

</div>

</div>


<!-- NAV -->

<div class="bottom-nav">

<a
class="nav-item"
href="home.html"
>
<span class="nav-icon">⌂</span>
Home
</a>

<a
class="nav-item"
href="search.html"
>
<span class="nav-icon">⌕</span>
Search
</a>

<a
class="nav-item"
href="reels.html"
>
<span class="nav-icon">▶</span>
Reels
</a>

<a
class="nav-item active"
href="messages.html"
>
<span class="nav-icon">♡</span>
Messages
</a>

<a
class="nav-item"
href="profile.html"
>
<span class="nav-icon">◯</span>
Profile
</a>

</div>


<script>

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


function getStored(a,b){

return localStorage.getItem(a)
|| sessionStorage.getItem(a)
|| localStorage.getItem(b)
|| sessionStorage.getItem(b);

}


let token =
getStored(
"crockcell_idToken",
"crockcellIdToken"
);

let currentUID =
getStored(
"crockcell_uid",
"crockcellUid"
);


if(!token || !currentUID){

location.replace("index.html");

}


const mainPage =
document.getElementById("mainPage");

const mainContent =
document.getElementById("mainContent");

const searchInput =
document.getElementById("searchInput");

const searchButton =
document.getElementById("searchButton");

const chatPage =
document.getElementById("chatPage");

const chatBack =
document.getElementById("chatBack");

const chatName =
document.getElementById("chatName");

const chatUsername =
document.getElementById("chatUsername");

const chatAvatar =
document.getElementById("chatAvatar");

const chatBody =
document.getElementById("chatBody");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");


let selectedUser = null;


function esc(v){

return String(v ?? "").replace(
/[&<>"']/g,
c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);

}


function placeholder(){

return "data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(
'<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">'+
'<rect width="100" height="100" fill="#222"/>'+
'<circle cx="50" cy="38" r="20" fill="#777"/>'+
'<path d="M18 92c5-23 19-34 32-34s27 11 32 34" fill="#777"/>'+
'</svg>'
);

}


function fsString(f,k){

return f?.[k]?.stringValue || "";

}


function docUser(d){

let f = d.fields || {};

return {

uid:
fsString(f,"uid") ||
d.name.split("/").pop(),

username:
fsString(f,"username"),

name:
fsString(f,"name") ||
fsString(f,"username") ||
"User",

photoURL:
fsString(f,"photoURL")

};

}


async function listUsers(){

let url =
"https://firestore.googleapis.com/v1/projects/"
+PROJECT_ID+
"/databases/(default)/documents/users?pageSize=1000&key="
+API_KEY;

let r =
await fetch(
url,
{
headers:{
Authorization:"Bearer "+token
}
}
);

if(!r.ok){

throw Error("USER_LIST_FAILED");

}

let data = await r.json();

return data.documents || [];

}


async function getUser(uid){

let url =
"https://firestore.googleapis.com/v1/projects/"
+PROJECT_ID+
"/databases/(default)/documents/users/"
+encodeURIComponent(uid)
+"?key="+API_KEY;

let r =
await fetch(
url,
{
headers:{
Authorization:"Bearer "+token
}
}
);

if(!r.ok){

return null;

}

return docUser(
await r.json()
);

}


function saveTarget(u){

sessionStorage.setItem(
"crockcell_chat_target",
JSON.stringify(u)
);

}


function readTarget(){

try{

return JSON.parse(
sessionStorage.getItem(
"crockcell_chat_target"
)||"null"
);

}catch(e){

return null;

}

}


async function searchUsers(){

let q =
searchInput.value.trim().toLowerCase();

if(!q){

mainContent.innerHTML =
'<div class="empty">Username search karo.</div>';

return;

}

mainContent.innerHTML =
'<div class="empty">Searching...</div>';


try{

let users =
(await listUsers())
.map(docUser)
.filter(
u =>
u.uid &&
u.uid !== currentUID &&
(u.username || "")
.toLowerCase()
.startsWith(q)
)
.slice(0,30);


mainContent.innerHTML = "";


if(!users.length){

mainContent.innerHTML =
'<div class="empty">Koi user nahi mila.</div>';

return;

}


users.forEach(u => {

let c =
document.createElement("div");

c.className =
"user-card";

c.innerHTML =
'<img class="avatar" src="'+
esc(u.photoURL || placeholder())+
'" alt="">'+

'<div class="user-info">'+

'<div class="name">'+
esc(u.name)+
'</div>'+

'<div class="username">@'+
esc(u.username)+
'</div>'+

'</div>'+

'<div class="arrow">›</div>';


c.onclick =
() => openChat(u);

mainContent.appendChild(c);

});


}catch(e){

console.error(e);

mainContent.innerHTML =
'<div class="empty">Search nahi ho paayi.</div>';

}

}


async function openChat(u){

if(!u?.uid || u.uid === currentUID){

return;

}


selectedUser = {

uid:u.uid,

username:u.username || "user",

name:u.name || u.username || "User",

photoURL:u.photoURL || ""

};


saveTarget(selectedUser);

mainPage.style.display =
"none";

chatPage.style.display =
"block";

updateHeader();

messageInput.focus();


let fresh =
await getUser(selectedUser.uid);


if(fresh){

selectedUser =
fresh;

saveTarget(selectedUser);

updateHeader();

}


await loadMessages();

}


function updateHeader(){

chatName.textContent =
selectedUser.name;

chatUsername.textContent =
"@"+selectedUser.username;

chatAvatar.src =
selectedUser.photoURL ||
placeholder();

}


async function loadMessages(){

if(!selectedUser){

return;

}


chatBody.innerHTML =
'<div class="chat-empty">Loading messages...</div>';


try{

let url =
"https://firestore.googleapis.com/v1/projects/"
+PROJECT_ID+
"/databases/(default)/documents:runQuery?key="
+API_KEY;


let r =
await fetch(
url,
{
method:"POST",

headers:{
"Content-Type":
"application/json",

Authorization:
"Bearer "+token
},

body:JSON.stringify({

structuredQuery:{

from:[
{
collectionId:"messages"
}
],

orderBy:[
{
field:{
fieldPath:"createdAt"
},

direction:
"ASCENDING"
}
],

limit:200

}

})
}
);


if(!r.ok){

throw Error("QUERY_FAILED");

}


let rows =
await r.json();

let arr = [];


rows.forEach(row => {

if(!row.document){

return;

}

let f =
row.document.fields || {};

let s =
fsString(f,"senderId");

let rc =
fsString(f,"receiverId");


if(
(s === currentUID &&
rc === selectedUser.uid)
||
(s === selectedUser.uid &&
rc === currentUID)
){

arr.push({

senderId:s,

text:fsString(f,"text")

});

}

});


chatBody.innerHTML = "";


if(!arr.length){

chatBody.innerHTML =
'<div class="chat-empty">'+
'No messages yet.<br>'+
'Sabse pehle message bhejo.'+
'</div>';

return;

}


arr.forEach(m => {

let b =
document.createElement("div");

b.className =
"bubble "+
(
m.senderId === currentUID
?
"mine"
:
"theirs"
);

b.textContent =
m.text;

chatBody.appendChild(b);

});


chatBody.scrollTop =
chatBody.scrollHeight;


}catch(e){

console.error(e);

chatBody.innerHTML =
'<div class="chat-empty">'+
'Messages load nahi ho paaye.'+
'</div>';

}

}


async function sendMessage(){

if(!selectedUser){

return;

}


let text =
messageInput.value.trim();


if(!text){

return;

}


sendButton.disabled = true;


try{

let url =
"https://firestore.googleapis.com/v1/projects/"
+PROJECT_ID+
"/databases/(default)/documents/messages?key="
+API_KEY;


let r =
await fetch(
url,
{
method:"POST",

headers:{
"Content-Type":
"application/json",

Authorization:
"Bearer "+token
},

body:JSON.stringify({

fields:{

senderId:{
stringValue:currentUID
},

receiverId:{
stringValue:selectedUser.uid
},

text:{
stringValue:text
},

createdAt:{
timestampValue:
new Date().toISOString()
}

}

})
}
);


if(!r.ok){

throw Error("SEND_FAILED");

}


messageInput.value = "";

await loadMessages();


}catch(e){

console.error(e);

alert(
"Message send nahi ho paaya."
);


}finally{

sendButton.disabled = false;

messageInput.focus();

}

}


function back(){

selectedUser = null;

sessionStorage.removeItem(
"crockcell_chat_target"
);

chatPage.style.display =
"none";

mainPage.style.display =
"block";

mainContent.innerHTML =
'<div class="empty">'+
'Search karke kisi user ko message karo.'+
'</div>';

}


searchButton.onclick =
searchUsers;


searchInput.onkeydown =
e => {

if(e.key === "Enter"){

e.preventDefault();

searchUsers();

}

};


sendButton.onclick =
sendMessage;


messageInput.onkeydown =
e => {

if(e.key === "Enter"){

e.preventDefault();

sendMessage();

}

};


chatBack.onclick =
back;


let target =
readTarget();


if(target?.uid){

openChat(target);

}

</script>

</body>
</html>
