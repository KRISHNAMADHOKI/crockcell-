<script>

/* =================================================
   FIREBASE
================================================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";

const BASE =
"https://firestore.googleapis.com/v1/projects/" +
PROJECT_ID +
"/databases/(default)/documents";


/* =================================================
   LOGIN
================================================= */

let token =
localStorage.getItem("crockcell_idToken");

let currentUID =
localStorage.getItem("crockcell_uid");


if(!token){

  token =
  sessionStorage.getItem("crockcell_idToken");

}

if(!currentUID){

  currentUID =
  sessionStorage.getItem("crockcell_uid");

}


if(!token || !currentUID){

  location.replace("index.html");

}


/* =================================================
   ELEMENTS
================================================= */

const searchInput =
document.getElementById("searchInput");

const searchBtn =
document.getElementById("searchBtn");

const status =
document.getElementById("status");

const results =
document.getElementById("results");

const listPage =
document.getElementById("listPage");

const chatPage =
document.getElementById("chatPage");

const inputBar =
document.getElementById("inputBar");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const messageList =
document.getElementById("messageList");


let selectedUser = null;

let messageTimer = null;

let loadingMessages = false;


/* =================================================
   SEARCH USERS
================================================= */

async function searchUsers(){

  const text =
  searchInput.value
  .trim()
  .toLowerCase();


  if(!text){

    status.textContent = "";

    results.innerHTML =
    `<div class="empty">
      Username ya alphabet type karo.
    </div>`;

    return;

  }


  status.textContent =
  "Searching...";


  results.innerHTML =
  `<div class="empty">
    Searching...
  </div>`;


  try{

    const endText =
    text + "\uf8ff";


    const response =
    await fetch(
      BASE + ":runQuery?key=" + API_KEY,
      {

        method:"POST",

        headers:{
          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          structuredQuery:{

            from:[
              {
                collectionId:"users"
              }
            ],

            where:{

              compositeFilter:{

                op:"AND",

                filters:[

                  {
                    fieldFilter:{

                      field:{
                        fieldPath:"username"
                      },

                      op:
                      "GREATER_THAN_OR_EQUAL",

                      value:{
                        stringValue:text
                      }

                    }

                  },

                  {
                    fieldFilter:{

                      field:{
                        fieldPath:"username"
                      },

                      op:"LESS_THAN",

                      value:{
                        stringValue:endText
                      }

                    }

                  }

                ]

              }

            },

            orderBy:[

              {
                field:{
                  fieldPath:"username"
                },

                direction:"ASCENDING"
              }

            ],

            limit:30

          }

        })

      }
    );


    const raw =
    await response.text();


    if(!response.ok){

      throw new Error(raw);

    }


    const rows =
    JSON.parse(raw);

    const users=[];


    rows.forEach(row=>{

      if(!row.document) return;


      const f =
      row.document.fields || {};


      const uid =
      f.uid?.stringValue || "";


      const username =
      f.username?.stringValue || "";


      if(!uid || !username) return;


      if(uid===currentUID) return;


      users.push({

        uid,

        username,

        name:
        f.name?.stringValue ||
        username,

        photoURL:
        f.photoURL?.stringValue ||
        ""

      });

    });


    showUsers(users);


  }catch(error){

    console.error(
      "SEARCH ERROR:",
      error
    );


    status.textContent =
    "Search failed";


    results.innerHTML =
    `<div class="empty">
      User search nahi ho paayi.
    </div>`;

  }

}


/* =================================================
   SHOW USERS
================================================= */

function showUsers(users){

  results.innerHTML="";


  if(!users.length){

    status.textContent =
    "0 users found";


    results.innerHTML =
    `<div class="empty">
      Koi user nahi mila.
    </div>`;

    return;

  }


  status.textContent =
  users.length + " users found";


  users.forEach(user=>{

    const item =
    document.createElement("div");

    item.className="user";


    const img =
    document.createElement("img");

    img.className="avatar";

    img.src =
    user.photoURL ||
    placeholder();


    const info =
    document.createElement("div");

    info.className="info";


    const name =
    document.createElement("div");

    name.className="name";

    name.textContent =
    user.name;


    const username =
    document.createElement("div");

    username.className="username";

    username.textContent =
    "@" + user.username;


    info.appendChild(name);
    info.appendChild(username);


    const button =
    document.createElement("button");

    button.className="messageBtn";

    button.textContent="Message";


    button.onclick=()=>{

      openChat(user);

    };


    item.appendChild(img);
    item.appendChild(info);
    item.appendChild(button);


    results.appendChild(item);

  });

}


/* =================================================
   OPEN CHAT
================================================= */

function openChat(user){

  selectedUser=user;


  listPage.style.display="none";

  chatPage.style.display="block";

  inputBar.style.display="flex";


  document.getElementById(
    "chatName"
  ).textContent =
  user.name;


  document.getElementById(
    "chatUsername"
  ).textContent =
  "@" + user.username;


  document.getElementById(
    "chatAvatar"
  ).src =
  user.photoURL ||
  placeholder();


  loadMessages();


  clearInterval(messageTimer);


  messageTimer =
  setInterval(
    loadMessages,
    2500
  );

}


/* =================================================
   LOAD REAL MESSAGES
================================================= */

async function loadMessages(){

  if(!selectedUser) return;

  if(loadingMessages) return;

  loadingMessages=true;


  try{

    /*
      Query 1:
      Current user -> selected user
    */

    const sent =
    await queryMessages(
      currentUID,
      selectedUser.uid
    );


    /*
      Query 2:
      Selected user -> current user
    */

    const received =
    await queryMessages(
      selectedUser.uid,
      currentUID
    );


    const all =
    [...sent,...received];


    /*
      Time ke according sort
    */

    all.sort(
      (a,b)=>
      new Date(a.createdAt) -
      new Date(b.createdAt)
    );


    renderMessages(all);


  }catch(error){

    console.error(
      "LOAD MESSAGE ERROR:",
      error
    );

  }finally{

    loadingMessages=false;

  }

}


/* =================================================
   QUERY MESSAGES
================================================= */

async function queryMessages(
  sender,
  receiver
){

  const response =
  await fetch(
    BASE + ":runQuery?key=" + API_KEY,
    {

      method:"POST",

      headers:{

        Authorization:
        "Bearer " + token,

        "Content-Type":
        "application/json"

      },

      body:JSON.stringify({

        structuredQuery:{

          from:[

            {
              collectionId:
              "messages"
            }

          ],

          where:{

            compositeFilter:{

              op:"AND",

              filters:[

                {
                  fieldFilter:{

                    field:{
                      fieldPath:
                      "senderId"
                    },

                    op:"EQUAL",

                    value:{
                      stringValue:
                      sender
                    }

                  }

                },

                {
                  fieldFilter:{

                    field:{
                      fieldPath:
                      "receiverId"
                    },

                    op:"EQUAL",

                    value:{
                      stringValue:
                      receiver
                    }

                  }

                }

              ]

            }

          },

          orderBy:[

            {
              field:{
                fieldPath:
                "createdAt"
              },

              direction:
              "ASCENDING"
            }

          ],

          limit:100

        }

      })

    }
  );


  const raw =
  await response.text();


  if(!response.ok){

    throw new Error(raw);

  }


  const rows =
  JSON.parse(raw);


  const messages=[];


  rows.forEach(row=>{

    if(!row.document) return;


    const f =
    row.document.fields || {};


    messages.push({

      senderId:
      f.senderId?.stringValue ||
      "",

      receiverId:
      f.receiverId?.stringValue ||
      "",

      text:
      f.text?.stringValue ||
      "",

      createdAt:
      f.createdAt?.timestampValue ||
      ""

    });

  });


  return messages;

}


/* =================================================
   RENDER MESSAGES
================================================= */

function renderMessages(messages){

  messageList.innerHTML="";


  if(!messages.length){

    messageList.innerHTML =
    `<div class="empty">
      Abhi koi message nahi hai.<br>
      Pehla message bhejo 👋
    </div>`;

    return;

  }


  messages.forEach(message=>{

    const row =
    document.createElement("div");


    row.className =
    "messageRow " +
    (
      message.senderId===currentUID
      ? "mine"
      : "theirs"
    );


    const bubble =
    document.createElement("div");


    bubble.className="bubble";


    bubble.textContent =
    message.text;


    if(message.createdAt){

      const time =
      document.createElement("div");

      time.className="time";

      time.textContent =
      formatTime(
        message.createdAt
      );


      bubble.appendChild(time);

    }


    row.appendChild(bubble);

    messageList.appendChild(row);

  });


  /*
    Chat ke bottom par jao
  */

  window.scrollTo(
    0,
    document.body.scrollHeight
  );

}


/* =================================================
   SEND MESSAGE
================================================= */

async function sendMessage(){

  if(!selectedUser){

    return;

  }


  const text =
  messageInput.value.trim();


  if(!text){

    return;

  }


  sendBtn.disabled=true;


  try{

    const response =
    await fetch(
      BASE +
      "/messages?key=" +
      API_KEY,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"

        },

        body:JSON.stringify({

          fields:{

            senderId:{
              stringValue:
              currentUID
            },

            receiverId:{
              stringValue:
              selectedUser.uid
            },

            text:{
              stringValue:
              text
            },

            createdAt:{
              timestampValue:
              new Date().toISOString()
            }

          }

        })

      }
    );


    const raw =
    await response.text();


    console.log(
      "SEND RESPONSE:",
      raw
    );


    if(!response.ok){

      throw new Error(raw);

    }


    messageInput.value="";


    await loadMessages();


  }catch(error){

    console.error(
      "SEND ERROR:",
      error
    );


    alert(
      "Message send nahi hua."
    );

  }finally{

    sendBtn.disabled=false;

  }

}


/* =================================================
   BACK
================================================= */

document
.getElementById("backBtn")
.onclick=function(){

  clearInterval(
    messageTimer
  );


  selectedUser=null;


  chatPage.style.display="none";

  inputBar.style.display="none";

  listPage.style.display="block";

};


/* =================================================
   EVENTS
================================================= */

searchBtn.onclick =
searchUsers;


searchInput.addEventListener(
  "input",
  function(){

    clearTimeout(
      window.searchTimer
    );


    window.searchTimer =
    setTimeout(
      searchUsers,
      300
    );

  }
);


searchInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      searchUsers();

    }

  }
);


sendBtn.onclick =
sendMessage;


messageInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      e.preventDefault();

      sendMessage();

    }

  }
);


/* =================================================
   PROFILE -> MESSAGE
================================================= */

const params =
new URLSearchParams(
  location.search
);

const urlUID =
params.get("uid");

const urlUsername =
params.get("username");


if(urlUID){

  loadProfileChat();

}


async function loadProfileChat(){

  try{

    const response =
    await fetch(
      BASE +
      "/users/" +
      encodeURIComponent(
        urlUID
      ),
      {

        headers:{
          Authorization:
          "Bearer " + token
        }

      }
    );


    if(response.ok){

      const data =
      await response.json();


      const f =
      data.fields || {};


      openChat({

        uid:urlUID,

        username:
        f.username?.stringValue ||
        urlUsername ||
        "user",

        name:
        f.name?.stringValue ||
        f.username?.stringValue ||
        urlUsername ||
        "User",

        photoURL:
        f.photoURL?.stringValue ||
        ""

      });

    }

  }catch(error){

    console.error(error);

  }

}


/* =================================================
   TIME
================================================= */

function formatTime(value){

  try{

    const date =
    new Date(value);


    return date.toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute
