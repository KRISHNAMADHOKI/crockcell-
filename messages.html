<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CROCKCELL Messages</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
  padding-bottom:100px;
}

.header{
  padding:20px 16px 15px;
  border-bottom:1px solid #222;
}

.title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:15px;
}

.searchRow{
  display:flex;
  gap:8px;
}

#searchInput{
  flex:1;
  height:50px;
  border:0;
  outline:none;
  border-radius:20px;
  background:#191919;
  color:#fff;
  padding:0 16px;
  font-size:16px;
}

#searchBtn{
  width:55px;
  height:50px;
  border:0;
  border-radius:20px;
  background:#fff;
  color:#000;
  font-size:22px;
}

#status{
  padding:12px 16px 0;
  color:#888;
  font-size:14px;
}

#results{
  padding:5px 15px 100px;
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 4px;
  border-bottom:1px solid #1c1c1c;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
  background:#292929;
  flex-shrink:0;
}

.info{
  flex:1;
  min-width:0;
}

.name{
  font-size:17px;
  font-weight:bold;
}

.username{
  color:#888;
  margin-top:4px;
  font-size:14px;
}

.messageBtn{
  border:0;
  border-radius:15px;
  background:#fff;
  color:#000;
  padding:10px 13px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#666;
  padding:55px 15px;
}


/* CHAT */

#chatPage{
  display:none;
}

.chatHeader{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 15px;
  border-bottom:1px solid #222;
}

.backBtn{
  width:40px;
  height:40px;
  border:0;
  border-radius:14px;
  background:#1d1d1d;
  color:#fff;
  font-size:23px;
}

.chatAvatar{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
  background:#292929;
}

.chatInfo{
  flex:1;
}

.chatName{
  font-size:16px;
  font-weight:bold;
}

.chatUsername{
  color:#888;
  font-size:12px;
  margin-top:3px;
}

#messageList{
  padding:18px 12px 100px;
}

.messageRow{
  display:flex;
  margin:8px 0;
}

.mine{
  justify-content:flex-end;
}

.theirs{
  justify-content:flex-start;
}

.bubble{
  max-width:78%;
  padding:10px 13px;
  border-radius:18px;
  word-break:break-word;
}

.mine .bubble{
  background:#fff;
  color:#000;
  border-bottom-right-radius:5px;
}

.theirs .bubble{
  background:#202020;
  color:#fff;
  border-bottom-left-radius:5px;
}

.inputBar{
  display:none;
  position:fixed;
  left:10px;
  right:10px;
  bottom:75px;
  z-index:20;
  padding:7px;
  gap:7px;
  background:#191919;
  border:1px solid #333;
  border-radius:21px;
}

#messageInput{
  flex:1;
  min-width:0;
  height:43px;
  border:0;
  outline:none;
  border-radius:16px;
  background:#0e0e0e;
  color:#fff;
  padding:0 13px;
  font-size:15px;
}

#sendBtn{
  width:45px;
  height:43px;
  border:0;
  border-radius:16px;
  background:#fff;
  color:#000;
  font-size:18px;
}


/* NAV */

.nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:30;
  display:flex;
  padding:8px;
  background:rgba(25,25,25,.94);
  border:1px solid #333;
  border-radius:24px;
}

.nav a{
  flex:1;
  text-align:center;
  text-decoration:none;
  color:#999;
  padding:8px 3px;
  border-radius:17px;
  font-size:11px;
}

.nav a.active{
  background:#fff;
  color:#000;
}

.icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

</style>

</head>

<body>


<!-- =========================
     SEARCH PAGE
========================= -->

<div id="listPage">

  <div class="header">

    <div class="title">
      Messages
    </div>

    <div class="searchRow">

      <input
        id="searchInput"
        type="text"
        placeholder="Search people..."
        autocomplete="off"
        autocapitalize="none"
      >

      <button
        id="searchBtn"
        type="button"
      >
        ⌕
      </button>

    </div>

  </div>


  <div id="status"></div>


  <div id="results">

    <div class="empty">
      Kisi user ko message karne ke liye
      username ya alphabet search karo.
    </div>

  </div>

</div>


<!-- =========================
     CHAT PAGE
========================= -->

<div id="chatPage">

  <div class="chatHeader">

    <button
      id="backBtn"
      class="backBtn"
      type="button"
    >
      ‹
    </button>


    <img
      id="chatAvatar"
      class="chatAvatar"
      src=""
      alt=""
    >


    <div class="chatInfo">

      <div
        id="chatName"
        class="chatName"
      ></div>

      <div
        id="chatUsername"
        class="chatUsername"
      ></div>

    </div>

  </div>


  <div id="messageList">

    <div class="empty">
      Loading chat...
    </div>

  </div>

</div>


<!-- =========================
     MESSAGE INPUT
========================= -->

<div
  id="inputBar"
  class="inputBar"
>

  <input
    id="messageInput"
    type="text"
    placeholder="Message..."
    autocomplete="off"
  >

  <button
    id="sendBtn"
    type="button"
  >
    ➤
  </button>

</div>


<!-- =========================
     NAV
========================= -->

<div class="nav">

  <a href="home.html">
    <span class="icon">⌂</span>
    Home
  </a>

  <a href="search.html">
    <span class="icon">⌕</span>
    Search
  </a>

  <a href="reels.html">
    <span class="icon">▶</span>
    Reels
  </a>

  <a
    href="messages.html"
    class="active"
  >
    <span class="icon">♡</span>
    Messages
  </a>

  <a href="profile.html">
    <span class="icon">◯</span>
    Profile
  </a>

</div>


<script>

/* =================================================
   FIREBASE
================================================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =================================================
   LOGIN SESSION
================================================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let currentUID =
localStorage.getItem(
  "crockcell_uid"
);


if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}

if(!currentUID){

  currentUID =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}


if(!token || !currentUID){

  location.replace(
    "index.html"
  );

}


/* =================================================
   FIRESTORE BASE
================================================= */

const BASE =
"https://firestore.googleapis.com/v1/projects/" +
PROJECT_ID +
"/databases/(default)/documents";


/* =================================================
   ELEMENTS
================================================= */

const searchInput =
document.getElementById(
  "searchInput"
);

const searchBtn =
document.getElementById(
  "searchBtn"
);

const status =
document.getElementById(
  "status"
);

const results =
document.getElementById(
  "results"
);

const listPage =
document.getElementById(
  "listPage"
);

const chatPage =
document.getElementById(
  "chatPage"
);

const inputBar =
document.getElementById(
  "inputBar"
);

const messageInput =
document.getElementById(
  "messageInput"
);

const messageList =
document.getElementById(
  "messageList"
);

let selectedUser =
null;


/* =================================================
   SEARCH USERS
================================================= */

async function searchUsers(){

  const text =
  searchInput.value
    .trim()
    .toLowerCase();


  if(!text){

    status.textContent="";

    results.innerHTML =
    `<div class="empty">
      Username ya alphabet type karo.
    </div>`;

    return;

  }


  status.textContent =
  "Searching...";


  results.innerHTML =
  `<div class="empty">
    Searching...
  </div>`;


  try{

    const endText =
    text + "\uf8ff";


    const url =
    BASE +
    ":runQuery?key=" +
    API_KEY;


    const body={

      structuredQuery:{

        from:[
          {
            collectionId:
            "users"
          }
        ],

        where:{

          compositeFilter:{

            op:"AND",

            filters:[

              {
                fieldFilter:{

                  field:{
                    fieldPath:
                    "username"
                  },

                  op:
                  "GREATER_THAN_OR_EQUAL",

                  value:{
                    stringValue:
                    text
                  }

                }

              },

              {
                fieldFilter:{

                  field:{
                    fieldPath:
                    "username"
                  },

                  op:
                  "LESS_THAN",

                  value:{
                    stringValue:
                    endText
                  }

                }

              }

            ]

          }

        },

        orderBy:[

          {
            field:{
              fieldPath:
              "username"
            },

            direction:
            "ASCENDING"
          }

        ],

        limit:30

      }

    };


    const response =
    await fetch(
      url,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify(body)

      }
    );


    const textResponse =
    await response.text();


    console.log(
      "MESSAGES SEARCH:",
      textResponse
    );


    if(!response.ok){

      throw new Error(
        textResponse
      );

    }


    const rows =
    JSON.parse(
      textResponse
    );


    const users=[];


    rows.forEach(row=>{

      if(!row.document){

        return;

      }


      const f =
      row.document.fields ||
      {};


      const uid =
      f.uid?.stringValue ||
      "";


      const username =
      f.username?.stringValue ||
      "";


      if(
        !uid ||
        !username
      ){

        return;

      }


      if(uid===currentUID){

        return;

      }


      users.push({

        uid:uid,

        username:username,

        name:
        f.name?.stringValue ||
        username,

        photoURL:
        f.photoURL?.stringValue ||
        ""

      });

    });


    showUsers(users);


  }catch(error){

    console.error(
      "MESSAGE SEARCH ERROR:",
      error
    );


    status.textContent =
    "Search failed";


    results.innerHTML =
    `<div class="empty">
      User search nahi ho paayi.
    </div>`;

  }

}


/* =================================================
   SHOW USERS
================================================= */

function showUsers(users){

  results.innerHTML="";


  if(!users.length){

    status.textContent =
    "0 users found";


    results.innerHTML =
    `<div class="empty">
      Koi user nahi mila.
    </div>`;

    return;

  }


  status.textContent =
  users.length +
  " users found";


  users.forEach(user=>{

    const item =
    document.createElement(
      "div"
    );


    item.className =
    "user";


    const img =
    document.createElement(
      "img"
    );

    img.className =
    "avatar";

    img.src =
    user.photoURL ||
    placeholder();


    const info =
    document.createElement(
      "div"
    );

    info.className =
    "info";


    const name =
    document.createElement(
      "div"
    );

    name.className =
    "name";

    name.textContent =
    user.name;


    const username =
    document.createElement(
      "div"
    );

    username.className =
    "username";

    username.textContent =
    "@" + user.username;


    info.appendChild(
      name
    );

    info.appendChild(
      username
    );


    const button =
    document.createElement(
      "button"
    );

    button.className =
    "messageBtn";

    button.textContent =
    "Message";


    button.onclick=function(){

      openChat(user);

    };


    item.appendChild(
      img
    );

    item.appendChild(
      info
    );

    item.appendChild(
      button
    );


    results.appendChild(
      item
    );

  });

}


/* =================================================
   OPEN CHAT
================================================= */

function openChat(user){

  selectedUser =
  user;


  listPage.style.display =
  "none";


  chatPage.style.display =
  "block";


  inputBar.style.display =
  "flex";


  document.getElementById(
    "chatName"
  ).textContent =
  user.name;


  document.getElementById(
    "chatUsername"
  ).textContent =
  "@" + user.username;


  document.getElementById(
    "chatAvatar"
  ).src =
  user.photoURL ||
  placeholder();


  messageList.innerHTML =
  `<div class="empty">
    Abhi koi message nahi hai.<br>
    Pehla message bhejo 👋
  </div>`;

}


/* =================================================
   SEND MESSAGE
================================================= */

async function sendMessage(){

  if(!selectedUser){

    return;

  }


  const text =
  messageInput.value.trim();


  if(!text){

    return;

  }


  const button =
  document.getElementById(
    "sendBtn"
  );


  button.disabled=true;


  try{

    const response =
    await fetch(
      BASE +
      "/messages?key=" +
      API_KEY,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer " + token,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify({

          fields:{

            senderId:{
              stringValue:
              currentUID
            },

            receiverId:{
              stringValue:
              selectedUser.uid
            },

            text:{
              stringValue:
              text
            },

            createdAt:{
              timestampValue:
              new Date()
              .toISOString()
            }

          }

        })

      }
    );


    const result =
    await response.text();


    console.log(
      "SEND MESSAGE:",
      result
    );


    if(!response.ok){

      alert(
        "Message send nahi hua."
      );

      return;

    }


    messageInput.value="";


    addMessage(
      text,
      true
    );


  }catch(error){

    console.error(error);

    alert(
      "Message send nahi hua."
    );

  }finally{

    button.disabled=false;

  }

}


/* =================================================
   SHOW SENT MESSAGE
================================================= */

function addMessage(
  text,
  mine
){

  /*
    First message ke time
    empty text hatao.
  */

  const empty =
  messageList.querySelector(
    ".empty"
  );

  if(empty){

    empty.remove();

  }


  const row =
  document.createElement(
    "div"
  );


  row.className =
  "messageRow " +
  (
    mine
    ? "mine"
    : "theirs"
  );


  const bubble =
  document.createElement(
    "div"
  );


  bubble.className =
  "bubble";


  bubble.textContent =
  text;


  row.appendChild(
    bubble
  );


  messageList.appendChild(
    row
  );


  window.scrollTo(
    0,
    document.body.scrollHeight
  );

}


/* =================================================
   BACK
================================================= */

document
  .getElementById(
    "backBtn"
  )
  .onclick=function(){

    selectedUser =
    null;

    chatPage.style.display =
    "none";

    inputBar.style.display =
    "none";

    listPage.style.display =
    "block";

  };


/* =================================================
   EVENTS
================================================= */

searchBtn.onclick =
searchUsers;


searchInput.addEventListener(
  "input",
  function(){

    clearTimeout(
      window.searchTimer
    );


    window.searchTimer =
    setTimeout(
      searchUsers,
      300
    );

  }
);


searchInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      searchUsers();

    }

  }
);


document
  .getElementById(
    "sendBtn"
  )
  .onclick =
  sendMessage;


messageInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      e.preventDefault();

      sendMessage();

    }

  }
);


/* =================================================
   PROFILE → MESSAGE
================================================= */

const params =
new URLSearchParams(
  location.search
);

const urlUID =
params.get("uid");

const urlUsername =
params.get("username");


if(urlUID){

  openChat({

    uid:urlUID,

    username:
    urlUsername ||
    "user",

    name:
    urlUsername ||
    "User",

    photoURL:""

  });

}


/* =================================================
   PLACEHOLDER
================================================= */

function placeholder(){

  return "data:image/svg+xml,"+

  "<svg xmlns='http://www.w3.org/2000/svg' " +

  "width='100' height='100'>" +

  "<rect width='100' height='100' " +

  "fill='%23333333'/>" +

  "</svg>";

}

</script>

</body>
</html>
