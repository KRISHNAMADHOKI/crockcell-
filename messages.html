<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROCKCELL Messages</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#000;color:#fff;
 font-family:Arial,Helvetica,sans-serif;
 min-height:100vh
}
.header{
 padding:18px 14px 14px;
 border-bottom:1px solid #222;
 position:sticky;top:0;z-index:10;
 background:rgba(0,0,0,.96);
 backdrop-filter:blur(15px)
}
.title{font-size:28px;font-weight:bold;margin-bottom:14px}
.search{display:flex;gap:8px}
.search input{
 flex:1;height:48px;border:0;outline:0;
 border-radius:18px;background:#191919;
 color:#fff;padding:0 16px;font-size:16px
}
.search button{
 width:52px;border:0;border-radius:18px;
 background:#fff;color:#000;font-size:22px
}
.main{padding:8px 14px 100px}
.empty{text-align:center;color:#777;padding:55px 20px}
.section{
 color:#999;font-size:13px;font-weight:bold;
 padding:12px 4px 6px;text-transform:uppercase
}
.card{
 display:flex;align-items:center;gap:12px;
 padding:13px 5px;border-bottom:1px solid #181818;
 cursor:pointer
}
.card:active{background:#111}
.avatar{
 width:54px;height:54px;border-radius:50%;
 object-fit:cover;background:#222;flex-shrink:0
}
.info{flex:1;min-width:0}
.name{
 font-size:16px;font-weight:bold;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.username{
 color:#888;font-size:13px;margin-top:4px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.preview{
 color:#777;font-size:13px;margin-top:5px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.time{color:#666;font-size:11px;margin-left:6px}
.arrow{font-size:23px;color:#666}

.chat{
 display:none;position:fixed;inset:0;
 background:#000;z-index:50
}
.chatHead{
 height:72px;display:flex;align-items:center;
 gap:10px;padding:9px 14px;
 border-bottom:1px solid #222;background:#111
}
.back{
 width:40px;height:40px;border:0;border-radius:50%;
 background:#222;color:#fff;font-size:23px
}
.chatAvatar{
 width:45px;height:45px;border-radius:50%;
 object-fit:cover;background:#333
}
.chatInfo{flex:1;min-width:0}
.chatName{font-weight:bold;font-size:16px}
.chatUsername{color:#888;font-size:12px;margin-top:3px}
.body{
 position:absolute;top:72px;bottom:72px;left:0;right:0;
 overflow-y:auto;padding:15px
}
.noMsg{text-align:center;color:#666;margin-top:40%}
.bubble{
 max-width:78%;padding:10px 13px;margin:7px 0;
 border-radius:18px;line-height:1.4;
 word-break:break-word
}
.mine{
 margin-left:auto;background:#fff;color:#000;
 border-bottom-right-radius:5px
}
.theirs{
 margin-right:auto;background:#202020;color:#fff;
 border-bottom-left-radius:5px
}
.inputBar{
 position:absolute;bottom:0;left:0;right:0;
 height:72px;display:flex;gap:8px;
 padding:11px;background:#111;border-top:1px solid #222
}
.inputBar input{
 flex:1;border:0;outline:0;border-radius:20px;
 background:#222;color:#fff;padding:0 16px;font-size:15px
}
.inputBar button{
 width:54px;border:0;border-radius:20px;
 background:#fff;color:#000;font-size:20px
}
.nav{
 position:fixed;left:12px;right:12px;bottom:12px;
 z-index:20;display:flex;padding:8px;
 border-radius:24px;background:rgba(25,25,25,.94);
 backdrop-filter:blur(18px);border:1px solid #333
}
.nav a{
 flex:1;text-align:center;padding:8px 3px;
 border-radius:17px;color:#999;text-decoration:none;
 font-size:11px
}
.nav a.active{background:#fff;color:#000}
.icon{display:block;font-size:20px;margin-bottom:3px}
</style>
</head>

<body>

<div id="mainPage">
  <div class="header">
    <div class="title">Messages</div>

    <div class="search">
      <input id="searchInput" placeholder="Search people..." autocomplete="off">
      <button id="searchBtn">⌕</button>
    </div>
  </div>

  <div id="mainContent" class="main">
    <div class="empty">Messages loading...</div>
  </div>
</div>

<div id="chatPage" class="chat">

  <div class="chatHead">
    <button id="backBtn" class="back">‹</button>

    <img id="chatAvatar" class="chatAvatar" src="" alt="">

    <div class="chatInfo">
      <div id="chatName" class="chatName">User</div>
      <div id="chatUsername" class="chatUsername">@user</div>
    </div>
  </div>

  <div id="chatBody" class="body">
    <div class="noMsg">No messages yet.</div>
  </div>

  <div class="inputBar">
    <input id="messageInput" placeholder="Message..." autocomplete="off">
    <button id="sendBtn">➤</button>
  </div>

</div>

<div class="nav">
  <a href="home.html">
    <span class="icon">⌂</span>Home
  </a>
  <a href="search.html">
    <span class="icon">⌕</span>Search
  </a>
  <a href="reels.html">
    <span class="icon">▶</span>Reels
  </a>
  <a href="messages.html" class="active">
    <span class="icon">♡</span>Messages
  </a>
  <a href="profile.html">
    <span class="icon">◯</span>Profile
  </a>
</div>

<script>
const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";
const PROJECT_ID="crockcell-cd2e6";

const token=
 localStorage.getItem("crockcell_idToken")||
 sessionStorage.getItem("crockcell_idToken")||
 localStorage.getItem("crockcellIdToken")||
 sessionStorage.getItem("crockcellIdToken");

const currentUID=
 localStorage.getItem("crockcell_uid")||
 sessionStorage.getItem("crockcell_uid")||
 localStorage.getItem("crockcellUid")||
 sessionStorage.getItem("crockcellUid");

if(!token||!currentUID){
 location.replace("index.html");
}

const $=id=>document.getElementById(id);

const mainContent=$("mainContent");
const searchInput=$("searchInput");
const searchBtn=$("searchBtn");
const chatPage=$("chatPage");
const backBtn=$("backBtn");
const chatAvatar=$("chatAvatar");
const chatName=$("chatName");
const chatUsername=$("chatUsername");
const chatBody=$("chatBody");
const messageInput=$("messageInput");
const sendBtn=$("sendBtn");

let selectedUser=null;

function escapeHTML(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function placeholder(){
 return "data:image/svg+xml;charset=UTF-8,"+
 encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">'+
  '<rect width="100" height="100" fill="#222"/>'+
  '<circle cx="50" cy="38" r="18" fill="#777"/>'+
  '<path d="M20 88c4-22 56-22 60 0" fill="#777"/>'+
  '</svg>'
 );
}

function parseUser(data){
 const f=data.fields||{};
 const p=(data.name||"").split("/");
 return {
  uid:f.uid?.stringValue||p[p.length-1]||"",
  username:f.username?.stringValue||"user",
  name:f.name?.stringValue||f.username?.stringValue||"User",
  photoURL:f.photoURL?.stringValue||""
 };
}

async function getUser(uid){
 const url=
 "https://firestore.googleapis.com/v1/projects/"+
 PROJECT_ID+
 "/databases/(default)/documents/users/"+
 encodeURIComponent(uid)+
 "?key="+API_KEY;

 const r=await fetch(url,{
  headers:{Authorization:"Bearer "+token}
 });

 if(!r.ok)return null;

 return parseUser(await r.json());
}

async function runQuery(body){
 const url=
 "https://firestore.googleapis.com/v1/projects/"+
 PROJECT_ID+
 "/databases/(default)/documents:runQuery?key="+API_KEY;

 const r=await fetch(url,{
  method:"POST",
  headers:{
   Authorization:"Bearer "+token,
   "Content-Type":"application/json"
  },
  body:JSON.stringify(body)
 });

 if(!r.ok)throw new Error("QUERY_FAILED");

 return await r.json();
}

function readMessages(rows){
 return rows.filter(x=>x.document).map(x=>{
  const f=x.document.fields||{};
  return {
   senderId:f.senderId?.stringValue||"",
   receiverId:f.receiverId?.stringValue||"",
   text:f.text?.stringValue||"",
   createdAt:f.createdAt?.timestampValue||""
  };
 });
}

async function inboxMessages(field){
 const rows=await runQuery({
  structuredQuery:{
   from:[{collectionId:"messages"}],
   where:{
    fieldFilter:{
     field:{fieldPath:field},
     op:"EQUAL",
     value:{stringValue:currentUID}
    }
   },
   limit:500
  }
 });
 return readMessages(rows);
}

function time(v){
 const n=Date.parse(v||"");
 return Number.isNaN(n)?0:n;
}

function showTime(v){
 if(!v)return"";
 const d=new Date(v);
 const now=new Date();

 if(d.toDateString()===now.toDateString()){
  return d.toLocaleTimeString([],{
   hour:"numeric",
   minute:"2-digit"
  });
 }

 return d.toLocaleDateString([],{
  day:"numeric",
  month:"short"
 });
}

async function loadInbox(){
 mainContent.innerHTML=
 '<div class="empty">Messages loading...</div>';

 try{
  const sent=await inboxMessages("senderId");
  const received=await inboxMessages("receiverId");

  const map=new Map();

  [...sent,...received].forEach(m=>{
   const partner=
    m.senderId===currentUID?
    m.receiverId:m.senderId;

   if(!partner||partner===currentUID)return;

   const old=map.get(partner);

   if(!old||time(m.createdAt)>time(old.createdAt)){
    map.set(partner,m);
   }
  });

  const list=[...map.entries()]
   .map(([uid,m])=>({
    uid,
    text:m.text,
    createdAt:m.createdAt
   }))
   .sort((a,b)=>time(b.createdAt)-time(a.createdAt));

  if(!list.length){
   mainContent.innerHTML=
   '<div class="empty">Abhi koi chat nahi hai.<br><br>'+
   'Search karke kisi user ko message karo.</div>';
   return;
  }

  const users=await Promise.all(
   list.map(async item=>{
    const u=await getUser(item.uid);
    if(!u)return null;
    return {...u,lastText:item.text,lastTime:item.createdAt};
   })
  );

  renderInbox(users.filter(Boolean));

 }catch(e){
  console.error(e);
  mainContent.innerHTML=
  '<div class="empty">Messages list load nahi ho paayi.<br><br>'+
  'Page refresh karke dobara try karo.</div>';
 }
}

function renderInbox(users){
 mainContent.innerHTML=
 '<div class="section">Chats</div>';

 users.forEach(user=>{
  const card=document.createElement("div");
  card.className="card";

  card.innerHTML=`
   <img class="avatar"
    src="${escapeHTML(user.photoURL||placeholder())}"
    alt="">

   <div class="info">
    <div class="name">${escapeHTML(user.name)}</div>
    <div class="username">@${escapeHTML(user.username)}</div>
    <div class="preview">
     ${escapeHTML(user.lastText||"Message")}
     <span class="time">${escapeHTML(showTime(user.lastTime))}</span>
    </div>
   </div>

   <div class="arrow">›</div>
  `;

  card.onclick=()=>openChat(user);
  mainContent.appendChild(card);
 });
}

async function searchUsers(){
 const q=searchInput.value.trim().toLowerCase();

 if(!q){
  loadInbox();
  return;
 }

 mainContent.innerHTML=
 '<div class="empty">Searching...</div>';

 try{
  const rows=await runQuery({
   structuredQuery:{
    from:[{collectionId:"users"}],
    orderBy:[
     {field:{fieldPath:"username"},direction:"ASCENDING"}
    ],
    where:{
     fieldFilter:{
      field:{fieldPath:"username"},
      op:"GREATER_THAN_OR_EQUAL",
      value:{stringValue:q}
     }
    },
    limit:30
   }
  });

  const users=readUsers(rows)
   .filter(u=>u.username.toLowerCase().startsWith(q));

  if(!users.length){
   mainContent.innerHTML=
   '<div class="empty">User nahi mila.</div>';
   return;
  }

  renderSearch(users);

 }catch(e){
  console.error(e);
  mainContent.innerHTML=
  '<div class="empty">Search failed.</div>';
 }
}

function readUsers(rows){
 return rows.filter(x=>x.document).map(x=>parseUser(x.document));
}

function renderSearch(users){
 mainContent.innerHTML=
 '<div class="section">People</div>';

 users.forEach(user=>{
  const card=document.createElement("div");
  card.className="card";

  card.innerHTML=`
   <img class="avatar"
    src="${escapeHTML(user.photoURL||placeholder())}"
    alt="">

   <div class="info">
    <div class="name">${escapeHTML(user.name)}</div>
    <div class="username">@${escapeHTML(user.username)}</div>
   </div>

   <div class="arrow">›</div>
  `;

  card.onclick=()=>openChat(user);
  mainContent.appendChild(card);
 });
}

async function getChatMessages(otherUID){
 const rows=await runQuery({
  structuredQuery:{
   from:[{collectionId:"messages"}],
   where:{
    compositeFilter:{
     op:"AND",
     filters:[
      {
       fieldFilter:{
        field:{fieldPath:"senderId"},
        op:"EQUAL",
        value:{stringValue:currentUID}
       }
      },
      {
       fieldFilter:{
        field:{fieldPath:"receiverId"},
        op:"EQUAL",
        value:{stringValue:otherUID}
       }
      }
     ]
    }
   },
   limit:500
  }
 });

 const a=readMessages(rows);

 const rows2=await runQuery({
  structuredQuery:{
   from:[{collectionId:"messages"}],
   where:{
    compositeFilter:{
     op:"AND",
     filters:[
      {
       fieldFilter:{
        field:{fieldPath:"senderId"},
        op:"EQUAL",
        value:{stringValue:otherUID}
       }
      },
      {
       fieldFilter:{
        field:{fieldPath:"receiverId"},
        op:"EQUAL",
        value:{stringValue:currentUID}
       }
      }
     ]
    }
   },
   limit:500
  }
 });

 return [...a,...readMessages(rows2)]
  .sort((a,b)=>time(a.createdAt)-time(b.createdAt));
}

async function openChat(user){
 selectedUser=user;

 sessionStorage.setItem(
  "crockcell_chat_target",
  JSON.stringify(user)
 );

 chatName.textContent=user.name;
 chatUsername.textContent="@"+user.username;
 chatAvatar.src=user.photoURL||placeholder();

 chatPage.style.display="block";
 chatBody.innerHTML=
 '<div class="noMsg">Loading...</div>';

 try{
  const messages=await getChatMessages(user.uid);

  if(!messages.length){
   chatBody.innerHTML=
   '<div class="noMsg">No messages yet.</div>';
  }else{
   chatBody.innerHTML="";

   messages.forEach(m=>{
    const div=document.createElement("div");
    div.className=
     "bubble "+
     (m.senderId===currentUID?"mine":"theirs");

    div.textContent=m.text;
    chatBody.appendChild(div);
   });

   chatBody.scrollTop=chatBody.scrollHeight;
  }

 }catch(e){
  console.error(e);
  chatBody.innerHTML=
  '<div class="noMsg">Messages load nahi hue.</div>';
 }

 messageInput.focus();
}

async function sendMessage(){
 const text=messageInput.value.trim();

 if(!text||!selectedUser)return;

 sendBtn.disabled=true;

 try{
  const id=
   currentUID+"_"+Date.now()+"_"+
   Math.random().toString(36).slice(2,7);

  const url=
   "https://firestore.googleapis.com/v1/projects/"+
   PROJECT_ID+
   "/databases/(default)/documents/messages/"+
   id+"?key="+API_KEY;

  const body={
   fields:{
    senderId:{stringValue:currentUID},
    receiverId:{stringValue:selectedUser.uid},
    text:{stringValue:text},
    createdAt:{
     timestampValue:new Date().toISOString()
    }
   }
  };

  const r=await fetch(url,{
   method:"PATCH",
   headers:{
    Authorization:"Bearer "+token,
    "Content-Type":"application/json"
   },
   body:JSON.stringify(body)
  });

  if(!r.ok)throw new Error("SEND_FAILED");

  messageInput.value="";
  await openChat(selectedUser);

 }catch(e){
  console.error(e);
  alert("Message send nahi hua.");
 }

 sendBtn.disabled=false;
}

backBtn.onclick=()=>{
 chatPage.style.display="none";
 selectedUser=null;
 sessionStorage.removeItem("crockcell_chat_target");
 loadInbox();
};

searchBtn.onclick=searchUsers;

searchInput.addEventListener("keydown",e=>{
 if(e.key==="Enter")searchUsers();
});

sendBtn.onclick=sendMessage;

messageInput.addEventListener("keydown",e=>{
 if(e.key==="Enter"){
  e.preventDefault();
  sendMessage();
 }
});

(async function start(){
 try{
  const saved=sessionStorage.getItem("crockcell_chat_target");

  if(saved){
   const user=JSON.parse(saved);

   if(user&&user.uid){
    await openChat(user);
    return;
   }
  }
 }catch(e){
  sessionStorage.removeItem("crockcell_chat_target");
 }

 loadInbox();
})();
</script>

</body>
</html>
