<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message Settings - CROCKCELL</title><style>body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:20px}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{border:0;background:#171717;color:#fff;border-radius:12px;padding:10px 14px;font-size:18px}.card{background:#111;border:1px solid #242424;border-radius:18px;padding:16px;margin:12px 0}.title{font-size:24px;font-weight:700}.muted{color:#999;font-size:13px}.label{font-weight:700;margin-bottom:10px}.choices{display:grid;gap:9px}.choice{display:flex;align-items:center;gap:10px;background:#181818;padding:12px;border-radius:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid #252525}.row:last-child{border-bottom:0}.switch{width:48px;height:27px;border-radius:20px;background:#333;border:0;position:relative}.switch:after{content:'';position:absolute;width:21px;height:21px;top:3px;left:3px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:#4caf50}.switch.on:after{left:24px}.btn{width:100%;border:0;border-radius:13px;padding:13px;background:#fff;color:#000;font-weight:700;margin-top:10px}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">‹</button><div><div class="title">Message Settings</div><div class="muted">Control who can message you</div></div></div><section class="card"><div class="label">Allow Messages From</div><div class="choices"><label class="choice"><input type="radio" name="allow" value="everyone"> Everyone</label><label class="choice"><input type="radio" name="allow" value="followers"> Followers</label><label class="choice"><input type="radio" name="allow" value="no_one"> No one</label></div></section><section class="card"><div class="row"><div><b>Message Requests</b><div class="muted">Move messages from non-followers to requests.</div></div><button id="requests" class="switch" aria-label="Message Requests"></button></div><div class="row"><div><b>Message Notifications</b><div class="muted">Show notifications for new messages.</div></div><button id="notifications" class="switch" aria-label="Message Notifications"></button></div></section><button class="btn" onclick="location.href='hidden-chats.html'">Hidden Chats</button><script>const key='crockcellMessageSettings';let s=JSON.parse(localStorage.getItem(key)||'null')||{allow:'everyone',requests:true,notifications:true};document.querySelectorAll('input[name=allow]').forEach(x=>{x.checked=x.value===s.allow;x.onchange=save});function paint(){document.getElementById('requests').classList.toggle('on',!!s.requests);document.getElementById('notifications').classList.toggle('on',!!s.notifications)}function save(){s.allow=document.querySelector('input[name=allow]:checked').value;localStorage.setItem(key,JSON.stringify(s));paint()}document.getElementById('requests').onclick=()=>{s.requests=!s.requests;save()};document.getElementById('notifications').onclick=()=>{s.notifications=!s.notifications;save()};paint();</script></main></body></html>
