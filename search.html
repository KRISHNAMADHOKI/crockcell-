<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CROCKCELL Search</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

.header{
  padding:20px 18px 15px;
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(0,0,0,.95);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #222;
}

.title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:15px;
}

.search-row{
  display:flex;
  gap:8px;
}

.search-input{
  flex:1;
  height:50px;
  border:0;
  outline:none;
  border-radius:20px;
  background:#191919;
  color:#fff;
  padding:0 17px;
  font-size:16px;
}

.search-btn{
  width:55px;
  height:50px;
  border:0;
  border-radius:20px;
  background:#fff;
  color:#000;
  font-size:22px;
}

.message{
  min-height:25px;
  padding:12px 18px 0;
  color:#888;
  font-size:14px;
}

.results{
  padding:8px 15px 100px;
}

.user-card{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 5px;
  border-bottom:1px solid #181818;
  cursor:pointer;
}

.user-card:active{
  background:#111;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  flex-shrink:0;
}

.user-info{
  flex:1;
  min-width:0;
}

.name{
  font-size:17px;
  font-weight:bold;
}

.username{
  margin-top:4px;
  color:#888;
  font-size:14px;
}

.profile-arrow{
  color:#777;
  font-size:25px;
}

.empty{
  text-align:center;
  color:#666;
  padding:55px 20px;
}

.bottom-nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:20;
  display:flex;
  justify-content:space-around;
  padding:8px;
  border-radius:24px;
  background:rgba(25,25,25,.9);
  backdrop-filter:blur(18px);
  border:1px solid #333;
}

.nav-item{
  flex:1;
  text-align:center;
  padding:8px 4px;
  border-radius:17px;
  color:#999;
  text-decoration:none;
  font-size:11px;
}

.nav-item.active{
  background:#fff;
  color:#000;
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}
</style>
</head>

<body>

<div class="header">

  <div class="title">Search</div>

  <div class="search-row">

    <input
      id="searchInput"
      class="search-input"
      type="text"
      placeholder="Search people..."
      autocomplete="off"
      autocapitalize="none"
    >

    <button
      id="searchButton"
      class="search-btn"
      type="button"
    >
      ⌕
    </button>

  </div>

</div>

<div id="message" class="message"></div>

<div id="results" class="results">

  <div class="empty">
    Username ya alphabet type karke search karo
  </div>

</div>


<div class="bottom-nav">

  <a class="nav-item" href="home.html">
    <span class="nav-icon">⌂</span>
    Home
  </a>

  <a class="nav-item active" href="search.html">
    <span class="nav-icon">⌕</span>
    Search
  </a>

  <a class="nav-item" href="reels.html">
    <span class="nav-icon">▶</span>
    Reels
  </a>

  <a class="nav-item" href="messages.html">
    <span class="nav-icon">♡</span>
    Messages
  </a>

  <a class="nav-item" href="profile.html">
    <span class="nav-icon">◯</span>
    Profile
  </a>

</div>


<script src="core.js"></script>

<script>

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


let token =
localStorage.getItem("crockcell_idToken");

let uid =
localStorage.getItem("crockcell_uid");


if(!token){
  token =
  sessionStorage.getItem("crockcell_idToken");
}

if(!uid){
  uid =
  sessionStorage.getItem("crockcell_uid");
}


if(!token || !uid){
  window.location.replace("index.html");
}


const searchInput =
document.getElementById("searchInput");

const searchButton =
document.getElementById("searchButton");

const results =
document.getElementById("results");

const message =
document.getElementById("message");


let searchTimer=null;


searchInput.addEventListener(
  "input",
  function(){

    clearTimeout(searchTimer);

    const text =
    searchInput.value.trim().toLowerCase();

    if(!text){

      results.innerHTML =
      `<div class="empty">
        Username ya alphabet type karo
      </div>`;

      message.textContent="";
      return;

    }

    searchTimer =
    setTimeout(searchUsers,250);

  }
);


searchButton.onclick =
searchUsers;


searchInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){
      searchUsers();
    }

  }
);


async function searchUsers(){

  const text =
  searchInput.value.trim().toLowerCase();

  if(!text)return;


  message.textContent="Searching...";

  results.innerHTML =
  `<div class="empty">Searching...</div>`;


  try{

    const endText =
    text + "\uf8ff";


    const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents:runQuery" +
    "?key=" +
    API_KEY;


    const body={

      structuredQuery:{

        from:[
          {
            collectionId:"users"
          }
        ],

        where:{

          compositeFilter:{

            op:"AND",

            filters:[

              {
                fieldFilter:{

                  field:{
                    fieldPath:"username"
                  },

                  op:"GREATER_THAN_OR_EQUAL",

                  value:{
                    stringValue:text
                  }

                }

              },

              {
                fieldFilter:{

                  field:{
                    fieldPath:"username"
                  },

                  op:"LESS_THAN",

                  value:{
                    stringValue:endText
                  }

                }

              }

            ]

          }

        },

        orderBy:[

          {
            field:{
              fieldPath:"username"
            },

            direction:"ASCENDING"
          }

        ],

        limit:30

      }

    };


    const response =
    await fetch(
      url,
      {

        method:"POST",

        headers:{
          Authorization:"Bearer "+token,
          "Content-Type":"application/json"
        },

        body:JSON.stringify(body)

      }
    );


    if(!response.ok){
      throw new Error("SEARCH_FAILED");
    }


    const rows =
    await response.json();


    const users=[];


    rows.forEach(row=>{

      if(!row.document)return;


      const f =
      row.document.fields || {};


      const foundUID =
      f.uid?.stringValue || "";


      const foundUsername =
      f.username?.stringValue || "";


      if(!foundUID || !foundUsername)return;


      if(foundUID===uid)return;


      users.push({

        uid:foundUID,

        username:foundUsername,

        name:
        f.name?.stringValue ||
        foundUsername,

        photoURL:
        f.photoURL?.stringValue || ""

      });

    });


    renderUsers(users);

  }
  catch(error){

    console.error(error);

    message.textContent="Search failed.";

    results.innerHTML =
    `<div class="empty">
      Search nahi ho paayi.
    </div>`;

  }

}


function renderUsers(users){

  results.innerHTML="";


  if(!users.length){

    message.textContent="No users found.";

    results.innerHTML =
    `<div class="empty">
      Koi user nahi mila.
    </div>`;

    return;

  }


  message.textContent =
  users.length+" users found";


  users.forEach(user=>{

    const card =
    document.createElement("div");


    card.className="user-card";


    card.innerHTML=`

      <img
        class="avatar"
        src="${
          escapeAttribute(
            user.photoURL ||
            placeholderPhoto()
          )
        }"
        alt=""
      >

      <div class="user-info">

        <div class="name">
          ${escapeHTML(user.name)}
        </div>

        <div class="username">
          @${escapeHTML(user.username)}
        </div>

      </div>

      <div class="profile-arrow">
        ›
      </div>

    `;


    /*
      USER CARD PAR DIRECT CLICK
      OPEN PROFILE
    */

    card.onclick =
    function(){

      openProfile(user);

    };


    results.appendChild(card);

  });

}


function openProfile(user){

  /*
    Sabse important:
    poora user object sessionStorage me save.

    Ab profile ko Firebase se user details
    dobara lene ka wait nahi karna padega.
  */

  try{

    sessionStorage.setItem(
      "crockcell_profile_target",
      JSON.stringify(user)
    );

  }
  catch(error){

    console.error(error);

  }


  const url =
    "profile.html" +
    "?uid=" +
    encodeURIComponent(user.uid) +
    "&username=" +
    encodeURIComponent(user.username) +
    "&name=" +
    encodeURIComponent(user.name) +
    "&photo=" +
    encodeURIComponent(user.photoURL || "") +
    "&v=" +
    Date.now();


  window.location.assign(url);

}


function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

}


function placeholderPhoto(){

  return "data:image/svg+xml,"+
  "<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'>"+
  "<rect width='100' height='100' fill='%23333333'/>"+
  "</svg>";

}

</script>

</body>
</html>
