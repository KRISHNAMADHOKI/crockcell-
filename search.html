<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CROCKCELL Search</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}.header{padding:20px 18px 15px;position:sticky;top:0;background:#000;border-bottom:1px solid #222;z-index:5}.title{font-size:28px;font-weight:700;margin-bottom:15px}.row{display:flex;gap:8px}.input{flex:1;height:50px;border:0;border-radius:20px;background:#191919;color:#fff;padding:0 17px;font-size:16px;outline:none}.btn{width:55px;border:0;border-radius:20px;background:#fff;font-size:22px}.msg{padding:12px 18px;color:#888;font-size:14px}.results{padding:8px 15px 100px}.card{display:flex;align-items:center;gap:13px;padding:14px 5px;border-bottom:1px solid #181818;cursor:pointer}.avatar{width:55px;height:55px;border-radius:50%;object-fit:cover;background:#222}.info{flex:1;min-width:0}.name{font-size:17px;font-weight:700}.username{margin-top:4px;color:#888;font-size:14px}.arrow{font-size:25px;color:#777}.empty{text-align:center;color:#666;padding:55px 20px}.nav{position:fixed;left:12px;right:12px;bottom:12px;display:flex;padding:8px;border-radius:24px;background:rgba(25,25,25,.94);border:1px solid #333}.nav a{flex:1;text-align:center;padding:8px 4px;color:#999;text-decoration:none;font-size:11px}.nav a.active{background:#fff;color:#000;border-radius:17px}.icon{display:block;font-size:20px;margin-bottom:3px}</style></head><body><div class="header"><div class="title">Search</div><div class="row"><input id="q" class="input" placeholder="Search people..." autocomplete="off" autocapitalize="none"><button id="go" class="btn">⌕</button></div></div><div id="msg" class="msg"></div><div id="results" class="results"><div class="empty">Username ya alphabet type karke search karo</div></div><div class="nav"><a href="home.html"><span class="icon">⌂</span>Home</a><a class="active" href="search.html"><span class="icon">⌕</span>Search</a><a href="reels.html"><span class="icon">▶</span>Reels</a><a href="messages.html"><span class="icon">♡</span>Messages</a><a href="profile.html"><span class="icon">◯</span>Profile</a></div><script>
const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk",PROJECT_ID="crockcell-cd2e6";let token=localStorage.getItem("crockcell_idToken")||sessionStorage.getItem("crockcell_idToken"),uid=localStorage.getItem("crockcell_uid")||sessionStorage.getItem("crockcell_uid");if(!token||!uid)location.replace("index.html");const q=document.getElementById("q"),go=document.getElementById("go"),msg=document.getElementById("msg"),results=document.getElementById("results");function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function ph(){return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="#222"/><text x="50%" y="62%" text-anchor="middle" fill="#777" font-size="55">👤</text></svg>')}async function search(){let text=q.value.trim().toLowerCase();if(!text)return;msg.textContent="Searching...";results.innerHTML='<div class="empty">Searching...</div>';try{let body={structuredQuery:{from:[{collectionId:"users"}],where:{compositeFilter:{op:"AND",filters:[{fieldFilter:{field:{fieldPath:"username"},op:"GREATER_THAN_OR_EQUAL",value:{stringValue:text}}},{fieldFilter:{field:{fieldPath:"username"},op:"LESS_THAN",value:{stringValue:text+"\uf8ff"}}}]}},orderBy:[{field:{fieldPath:"username"},direction:"ASCENDING"}],limit:30}};let url=`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents:runQuery?key=${API_KEY}`;let r=await fetch(url,{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw 0;let rows=await r.json(),users=[];rows.forEach(x=>{let f=x.document?.fields||{},u=f.uid?.stringValue||"",un=f.username?.stringValue||"";if(u&&un&&u!==uid)users.push({uid:u,username:un,name:f.name?.stringValue||un,photoURL:f.photoURL?.stringValue||""})});render(users)}catch(e){msg.textContent="Search failed.";results.innerHTML='<div class="empty">Search nahi ho paayi.</div>'}}function render(users){if(!users.length){msg.textContent="No users found.";results.innerHTML='<div class="empty">Koi user nahi mila.</div>';return}msg.textContent=users.length+" users found";results.innerHTML="";users.forEach(u=>{let c=document.createElement("div");c.className="card";c.innerHTML=`<img class="avatar" src="${esc(u.photoURL||ph())}"><div class="info"><div class="name">${esc(u.name)}</div><div class="username">@${esc(u.username)}</div></div><div class="arrow">›</div>`;c.onclick=()=>openProfile(u);results.appendChild(c)})}function openProfile(u){sessionStorage.setItem("crockcell_profile_target",JSON.stringify({uid:u.uid,username:u.username,name:u.name,photoURL:u.photoURL||""}));location.assign("profile.html")}q.addEventListener("input",()=>{clearTimeout(window.t);window.t=setTimeout(search,300)});q.addEventListener("keydown",e=>{if(e.key==="Enter")search()});go.onclick=search;</script></body></html>
