<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROCKCELL - Search</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;font-family:Arial,sans-serif;color:#111}
.top{height:60px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 15px;position:sticky;top:0;z-index:5}
.logo{font-size:23px;font-weight:800}
.searchbox{padding:12px;background:#fff;border-bottom:1px solid #ddd}
input{width:100%;padding:12px 15px;border:1px solid #ccc;border-radius:12px;font-size:16px;outline:none}
.results{padding:10px}
.user{display:flex;align-items:center;padding:12px 8px;border-bottom:1px solid #eee;cursor:pointer}
.user:active{background:#eee}
.photo{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#ddd;margin-right:13px}
.info{flex:1}
.name{font-weight:700;font-size:16px}
.username{color:#777;font-size:14px;margin-top:3px}
.empty{text-align:center;color:#777;padding:40px 10px}
</style>
</head>

<body>

<div class="top">
  <div class="logo">CROCKCELL</div>
</div>

<div class="searchbox">
  <input id="search" type="text" placeholder="Search users...">
</div>

<div id="results" class="results">
  <div class="empty">Search for a user</div>
</div>

<script>
const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";
const PROJECT_ID="crockcell-cd2e6";
const BASE="https://firestore.googleapis.com/v1/projects/"+PROJECT_ID+"/databases/(default)/documents";

const token=localStorage.getItem("crockcellIdToken");
const myUid=localStorage.getItem("crockcellUid");

if(!token||!myUid){
  location.href="index.html";
}

function val(x){
  if(!x)return "";
  if(x.stringValue!==undefined)return x.stringValue;
  if(x.integerValue!==undefined)return x.integerValue;
  if(x.doubleValue!==undefined)return x.doubleValue;
  if(x.booleanValue!==undefined)return x.booleanValue;
  return "";
}

function esc(s){
  return String(s||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function userFromDoc(doc){
  const f=doc.fields||{};
  const docId=doc.name.split("/").pop();

  // IMPORTANT:
  // Firebase UID field ko priority milegi.
  // Document ID ko UID nahi maana jayega.
  const uid=val(f.uid)||"";

  return {
    docId:docId,
    uid:uid,
    name:val(f.name)||"User",
    username:val(f.username)||"",
    photoURL:val(f.photoURL)||"",
    bio:val(f.bio)||""
  };
}

async function searchUsers(q){

  const box=document.getElementById("results");

  if(!q.trim()){
    box.innerHTML='<div class="empty">Search for a user</div>';
    return;
  }

  box.innerHTML='<div class="empty">Searching...</div>';

  try{

    const body={
      structuredQuery:{
        from:[{collectionId:"users"}],
        where:{
          compositeFilter:{
            op:"OR",
            filters:[
              {
                fieldFilter:{
                  field:{fieldPath:"username"},
                  op:"GREATER_THAN_OR_EQUAL",
                  value:{stringValue:q}
                }
              },
              {
                fieldFilter:{
                  field:{fieldPath:"name"},
                  op:"GREATER_THAN_OR_EQUAL",
                  value:{stringValue:q}
                }
              }
            ]
          }
        },
        limit:30
      }
    };

    const r=await fetch(
      BASE+":runQuery?key="+API_KEY,
      {
        method:"POST",
        headers:{
          "Authorization":"Bearer "+token,
          "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
      }
    );

    const data=await r.json();

    if(!r.ok){
      throw new Error(data.error?.message||"Search failed");
    }

    const users=[];

    for(const item of data){

      if(!item.document)continue;

      const u=userFromDoc(item.document);

      // Actual Firebase UID zaroor hona chahiye.
      if(!u.uid)continue;

      if(u.uid===myUid)continue;

      const text=(u.name+" "+u.username).toLowerCase();
      if(!text.includes(q.toLowerCase()))continue;

      users.push(u);
    }

    if(!users.length){
      box.innerHTML='<div class="empty">No users found</div>';
      return;
    }

    box.innerHTML="";

    users.forEach(u=>{

      const row=document.createElement("div");
      row.className="user";

      row.innerHTML=`
        <img class="photo"
          src="${u.photoURL||""}"
          onerror="this.style.visibility='hidden'">

        <div class="info">
          <div class="name">${esc(u.name)}</div>
          <div class="username">@${esc(u.username)}</div>
        </div>
      `;

      row.onclick=()=>{

        // Actual Firebase UID pass hoga.
        // Document ID alag se bhi pass kar rahe hain.
        localStorage.setItem("crockcellViewedUser",u.uid);

        location.href=
          "profile.html?uid="+
          encodeURIComponent(u.uid)+
          "&doc="+
          encodeURIComponent(u.docId);
      };

      box.appendChild(row);
    });

  }catch(e){

    console.error(e);

    box.innerHTML=
      '<div class="empty">Search error: '+esc(e.message)+'</div>';
  }
}

let timer;

document.getElementById("search").addEventListener("input",function(){

  clearTimeout(timer);

  const q=this.value.trim();

  timer=setTimeout(()=>{
    searchUsers(q);
  },350);

});
</script>

</body>
</html>
