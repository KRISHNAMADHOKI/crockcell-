<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROCKCELL - Search</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;font-family:Arial,sans-serif;color:#111}
.top{height:60px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 15px}
.logo{font-size:23px;font-weight:800}
.searchbox{padding:12px;background:#fff;border-bottom:1px solid #ddd}
input{width:100%;padding:12px 15px;border:1px solid #ccc;border-radius:12px;font-size:16px;outline:none}
.results{padding:10px}
.user{display:flex;align-items:center;padding:12px 8px;border-bottom:1px solid #eee;cursor:pointer}
.photo{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#ddd;margin-right:13px}
.info{flex:1}
.name{font-weight:700;font-size:16px}
.username{color:#777;font-size:14px;margin-top:3px}
.empty{text-align:center;color:#777;padding:40px 10px;line-height:1.5}
.error{color:#c00;word-break:break-word}
</style>
</head>

<body>

<div class="top">
  <div class="logo">CROCKCELL</div>
</div>

<div class="searchbox">
  <input id="search" type="text" placeholder="Search users...">
</div>

<div id="results" class="results">
  <div class="empty">Search for a user</div>
</div>

<script>

const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";
const PROJECT_ID="crockcell-cd2e6";

const BASE=
"https://firestore.googleapis.com/v1/projects/"+
PROJECT_ID+
"/databases/(default)/documents";

let token=localStorage.getItem("crockcellIdToken");
const myUid=localStorage.getItem("crockcellUid");

if(!token||!myUid){
  location.href="index.html";
}

function val(x){
  if(!x)return "";
  if(x.stringValue!==undefined)return x.stringValue;
  if(x.integerValue!==undefined)return x.integerValue;
  if(x.doubleValue!==undefined)return x.doubleValue;
  if(x.booleanValue!==undefined)return x.booleanValue;
  return "";
}

function esc(s){
  return String(s||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function makeUser(doc){

  const f=doc.fields||{};
  const docId=doc.name.split("/").pop();

  return {
    docId:docId,
    uid:val(f.uid),
    name:val(f.name)||"User",
    username:val(f.username)||"",
    photoURL:val(f.photoURL)||"",
    bio:val(f.bio)||""
  };
}

async function getAllUsers(){

  const url=
    BASE+
    "/users?pageSize=1000&key="+
    encodeURIComponent(API_KEY);

  console.log("REQUEST:",url);
  console.log("TOKEN EXISTS:",!!token);
  console.log("MY UID:",myUid);

  const r=await fetch(url,{
    method:"GET",
    headers:{
      "Authorization":"Bearer "+token
    }
  });

  const text=await r.text();

  console.log("HTTP STATUS:",r.status);
  console.log("RESPONSE:",text);

  let data={};

  try{
    data=JSON.parse(text);
  }catch(e){
    data={raw:text};
  }

  if(!r.ok){

    throw new Error(
      "HTTP "+r.status+
      " | "+
      (data.error?.status||"UNKNOWN")+
      " | "+
      (data.error?.message||text||"Unknown Firebase error")
    );
  }

  return data.documents||[];
}

async function searchUsers(q){

  const box=document.getElementById("results");

  q=q.trim().toLowerCase();

  if(!q){
    box.innerHTML='<div class="empty">Search for a user</div>';
    return;
  }

  box.innerHTML='<div class="empty">Searching...</div>';

  try{

    const documents=await getAllUsers();

    const users=[];

    documents.forEach(doc=>{

      const u=makeUser(doc);

      if(!u.uid)return;
      if(u.uid===myUid)return;

      const name=u.name.toLowerCase();
      const username=u.username.toLowerCase();

      if(
        name.includes(q) ||
        username.includes(q)
      ){
        users.push(u);
      }

    });

    if(!users.length){
      box.innerHTML='<div class="empty">No users found</div>';
      return;
    }

    box.innerHTML="";

    users.forEach(u=>{

      const row=document.createElement("div");
      row.className="user";

      row.innerHTML=`
        <img class="photo"
        src="${esc(u.photoURL)}"
        onerror="this.style.visibility='hidden'">

        <div class="info">
          <div class="name">${esc(u.name)}</div>
          <div class="username">@${esc(u.username)}</div>
        </div>
      `;

      row.onclick=()=>{

        localStorage.setItem(
          "crockcellViewedUser",
          u.uid
        );

        location.href=
          "profile.html?uid="+
          encodeURIComponent(u.uid)+
          "&doc="+
          encodeURIComponent(u.docId);
      };

      box.appendChild(row);

    });

  }catch(e){

    console.error("SEARCH ERROR:",e);

    box.innerHTML=
      '<div class="empty error">'+
      '<b>Firebase Search Error</b><br><br>'+
      esc(e.message)+
      '</div>';
  }
}

let timer;

document.getElementById("search")
.addEventListener("input",function(){

  clearTimeout(timer);

  const q=this.value;

  timer=setTimeout(()=>{
    searchUsers(q);
  },300);

});

</script>

</body>
</html>
