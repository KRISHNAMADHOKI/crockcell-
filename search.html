<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search - CROCKCELL</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<header class="topbar"><div class="brand">Search</div></header><section class="card stack"><input id="q" class="input" placeholder="Search username..."><button id="go" class="btn primary">Search</button><div id="results"></div></section></main>
<nav class="nav"><div class="navinner"><a href="home.html"><span>⌂</span>Home</a><a class="active" href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>✉</span>Messages</a><a href="profile.html"><span>●</span>Profile</a></div></nav>
<script src="core.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("go").onclick=async()=>{const q=$("q").value.trim().toLowerCase();if(!q)return;$("results").textContent="Searching...";const r=await CrockCell.request("users?pageSize=100");const d=await r.json().catch(()=>({}));const rows=(d.documents||[]).filter(x=>(x.fields?.username?.stringValue||"").toLowerCase().includes(q));$("results").innerHTML=rows.length?rows.map(x=>{const f=x.fields||{},id=x.name.split("/").pop();return `<a class="card row" style="display:flex;margin-top:10px" href="profile.html?uid=${encodeURIComponent(id)}"><img class="avatar" src="${f.profilePhoto?.stringValue||"https://via.placeholder.com/80"}"><b>${esc(f.username?.stringValue||"User")}</b></a>`}).join(""):"<div class='empty'>User nahi mila.</div>"};
</script></body></html>
