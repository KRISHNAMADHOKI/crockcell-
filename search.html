<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Search - CROCKCELL</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
padding-bottom:70px
}

.header{
height:64px;
display:flex;
align-items:center;
padding:0 16px;
border-bottom:1px solid #222
}

.back{
font-size:28px;
margin-right:14px;
cursor:pointer
}

.title{
font-size:21px;
font-weight:bold
}

.searchArea{
padding:14px 16px;
background:#000;
position:sticky;
top:0;
z-index:5
}

.searchBox{
height:52px;
display:flex;
align-items:center;
background:#1b1b1b;
border:1px solid #333;
border-radius:16px;
padding:4px 5px
}

.searchIcon{
width:40px;
text-align:center;
font-size:21px;
color:#aaa
}

#searchInput{
flex:1;
height:42px;
border:0;
outline:0;
background:transparent;
color:#fff;
font-size:16px;
padding:0 5px
}

#searchInput::placeholder{
color:#888
}

#clearBtn{
width:38px;
height:38px;
border:0;
background:transparent;
color:#aaa;
font-size:22px;
display:none
}

#searchBtn{
width:44px;
height:44px;
border:0;
border-radius:13px;
background:#fff;
color:#000;
font-size:20px;
cursor:pointer
}

.section{
padding:0 16px
}

.heading{
font-size:14px;
color:#999;
margin:5px 0 10px
}

.user{
display:flex;
align-items:center;
padding:12px 0;
border-bottom:1px solid #202020;
cursor:pointer
}

.avatar{
width:52px;
height:52px;
border-radius:50%;
object-fit:cover;
background:#292929;
margin-right:12px
}

.info{
flex:1;
min-width:0
}

.name{
font-size:16px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.username{
font-size:14px;
color:#999;
margin-top:4px
}

.follow{
border:0;
border-radius:10px;
padding:8px 13px;
background:#fff;
color:#000;
font-weight:bold
}

.following{
background:#292929;
color:#fff
}

.empty{
text-align:center;
color:#888;
padding:40px 10px
}

.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
height:60px;
background:#000;
border-top:1px solid #222;
display:flex;
justify-content:space-around;
align-items:center;
z-index:10
}

.bottom a{
color:#aaa;
text-decoration:none;
font-size:23px
}

.bottom a.active{
color:#fff
}
</style>
</head>

<body>

<div class="header">
<div class="back" onclick="history.back()">‹</div>
<div class="title">Search</div>
</div>

<div class="searchArea">

<div class="searchBox">

<div class="searchIcon">⌕</div>

<input
id="searchInput"
type="text"
placeholder="Search people..."
autocomplete="off"
>

<button id="clearBtn">×</button>

<button id="searchBtn">⌕</button>

</div>

</div>

<div class="section">

<div id="heading" class="heading">
Search people
</div>

<div id="results"></div>

</div>

<div class="bottom">
<a href="home.html">⌂</a>
<a href="search.html" class="active">⌕</a>
<a href="create.html">＋</a>
<a href="activity.html">♡</a>
<a href="profile.html">◉</a>
</div>

<script>

const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";
const PROJECT_ID="crockcell-cd2e6";

const BASE=
`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

let token=localStorage.getItem("crockcellIdToken");
let uid=localStorage.getItem("crockcellUid");
let refreshToken=localStorage.getItem("crockcellRefreshToken");

let timer=null;

const input=document.getElementById("searchInput");
const results=document.getElementById("results");
const heading=document.getElementById("heading");
const clearBtn=document.getElementById("clearBtn");

if(!token || !uid){
location.href="index.html";
}

function esc(v){
return String(v||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function value(f){
if(!f)return"";
if(f.stringValue!==undefined)return f.stringValue;
return"";
}

async function refresh(){

if(!refreshToken)return false;

try{

const r=await fetch(
`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:
"grant_type=refresh_token&refresh_token="+
encodeURIComponent(refreshToken)
}
);

const d=await r.json();

if(!r.ok || !d.id_token)return false;

token=d.id_token;

if(d.refresh_token)
refreshToken=d.refresh_token;

localStorage.setItem(
"crockcellIdToken",
token
);

localStorage.setItem(
"crockcellRefreshToken",
refreshToken
);

return true;

}catch(e){
return false;
}
}

async function firestore(path,options={}){

options.headers=Object.assign(
{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
options.headers||{}
);

let r=await fetch(BASE+path,options);

if((r.status===401||r.status===403)&&refreshToken){

const ok=await refresh();

if(ok){

options.headers.Authorization=
"Bearer "+token;

r=await fetch(BASE+path,options);

}
}

const text=await r.text();

let data=null;

try{
data=text?JSON.parse(text):null
}catch(e){}

if(!r.ok){

throw new Error(
data?.error?.message ||
("Firebase error "+r.status)
);

}

return data;
}

function makeUser(doc){

const f=doc.fields||{};

return{
id:doc.name.split("/").pop(),
name:value(f.name),
username:value(f.username),
photoURL:value(f.photoURL),
bio:value(f.bio),
email:value(f.email)
};

}

async function queryField(field,prefix){

if(!prefix)return[];

const end=prefix+"\uf8ff";

const query={
structuredQuery:{

from:[
{collectionId:"users"}
],

where:{
fieldFilter:{
field:{
fieldPath:field
},
op:"GREATER_THAN_OR_EQUAL",
value:{
stringValue:prefix
}
}
},

orderBy:[
{
field:{
fieldPath:field
},
direction:"ASCENDING"
}
],

limit:20

}
};

try{

const data=await firestore(
":runQuery",
{
method:"POST",
body:JSON.stringify(query)
}
);

return(data||[])
.filter(x=>x.document)
.map(x=>makeUser(x.document))
.filter(u=>{

const v=(field==="username"
?u.username
:u.name).toLowerCase();

return v.startsWith(prefix.toLowerCase());

});

}catch(e){

console.log(field,e);
return[];

}

}

async function searchUsers(){

const q=input.value.trim();

clearBtn.style.display=
q?"block":"none";

if(!q){

heading.textContent="Search people";

results.innerHTML=
`<div class="empty">
Type a name or username
</div>`;

return;
}

heading.textContent="Searching...";

results.innerHTML=
`<div class="empty">Searching...</div>`;

const usernameResults=
await queryField(
"username",
q.toLowerCase()
);

const nameResults=
await queryField(
"name",
q.toUpperCase()
);

const map=new Map();

[...usernameResults,...nameResults]
.forEach(u=>map.set(u.id,u));

const list=[...map.values()];

heading.textContent="People";

renderUsers(list);

}

function renderUsers(list){

if(!list.length){

results.innerHTML=
`<div class="empty">
No users found
</div>`;

return;
}

results.innerHTML=list.map(u=>{

const photo=
u.photoURL ||
"https://via.placeholder.com/100";

return`

<div
class="user"
data-id="${esc(u.id)}"
>

<img
class="avatar"
src="${esc(photo)}"
onerror="this.src='https://via.placeholder.com/100'"
>

<div class="info">

<div class="name">
${esc(u.name||u.username||"User")}
</div>

<div class="username">
${u.username?"@"+esc(u.username):""}
</div>

</div>

${
u.id!==uid
?
`<button
class="follow"
data-id="${esc(u.id)}"
>
Follow
</button>`
:""
}

</div>

`;

}).join("");

document.querySelectorAll(".user")
.forEach(row=>{

row.addEventListener("click",e=>{

if(e.target.closest(".follow"))
return;

const userId=row.dataset.id;

localStorage.setItem(
"crockcellViewedUser",
userId
);

location.href=
"profile.html?uid="+
encodeURIComponent(userId);

});

});

document.querySelectorAll(".follow")
.forEach(btn=>{

btn.addEventListener("click",async e=>{

e.stopPropagation();

await toggleFollow(
btn.dataset.id,
btn
);

});

});

}

async function toggleFollow(target,button){

const followId=
uid+"_"+target;

try{

let exists=true;

try{

await firestore(
"/follows/"+followId,
{method:"GET"}
);

}catch(e){

exists=false;

}

if(exists){

await firestore(
"/follows/"+followId,
{method:"DELETE"}
);

button.textContent="Follow";
button.classList.remove("following");

}else{

await firestore(
"/follows/"+followId,
{
method:"PATCH",
body:JSON.stringify({
fields:{
followerId:{
stringValue:uid
},
followingId:{
stringValue:target
},
createdAt:{
timestampValue:
new Date().toISOString()
}
}
})
}
);

button.textContent="Following";
button.classList.add("following");

}

}catch(e){

alert("Follow update nahi ho paya.");

}

}

input.addEventListener("input",()=>{

clearTimeout(timer);

timer=setTimeout(
searchUsers,
200
);

});

document.getElementById("searchBtn")
.addEventListener(
"click",
searchUsers
);

clearBtn.addEventListener(
"click",
()=>{

input.value="";
clearBtn.style.display="none";

results.innerHTML=
`<div class="empty">
Type a name or username
</div>`;

input.focus();

});

input.addEventListener(
"keydown",
e=>{

if(e.key==="Enter"){
searchUsers();
}

});

</script>

</body>
</html>
