<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Search - CROCKCELL</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}
.header{
  height:64px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  border-bottom:1px solid #222;
}
.back{
  font-size:27px;
  cursor:pointer;
}
.title{
  font-size:21px;
  font-weight:bold;
}
.searchArea{
  padding:16px;
  position:sticky;
  top:0;
  background:#000;
  z-index:5;
}
.searchBox{
  display:flex;
  align-items:center;
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:16px;
  padding:5px;
}
.searchIcon{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  color:#aaa;
}
input{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:16px;
  padding:11px 5px;
}
input::placeholder{
  color:#888;
}
.searchBtn{
  width:44px;
  height:44px;
  border:0;
  border-radius:13px;
  background:#fff;
  color:#000;
  font-size:19px;
  cursor:pointer;
}
.clearBtn{
  display:none;
  border:0;
  background:transparent;
  color:#aaa;
  font-size:20px;
  cursor:pointer;
  padding:8px;
}
.section{
  padding:0 16px 20px;
}
.heading{
  color:#aaa;
  font-size:14px;
  margin:5px 0 12px;
}
.user{
  display:flex;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid #1e1e1e;
  cursor:pointer;
}
.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  background:#292929;
  margin-right:12px;
}
.info{
  flex:1;
  min-width:0;
}
.name{
  font-weight:bold;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.username{
  color:#999;
  margin-top:4px;
  font-size:14px;
}
.followBtn{
  border:0;
  border-radius:10px;
  padding:8px 13px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
.following{
  background:#292929;
  color:#fff;
}
.empty{
  text-align:center;
  color:#888;
  padding:35px 10px;
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:60px;
  background:#000;
  border-top:1px solid #222;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:10;
}
.bottom a{
  color:#aaa;
  text-decoration:none;
  font-size:23px;
}
.bottom a.active{
  color:#fff;
}
.spacer{
  height:70px;
}
</style>
</head>

<body>

<div class="header">
  <div class="back" onclick="history.back()">‹</div>
  <div class="title">Search</div>
</div>

<div class="searchArea">
  <div class="searchBox">

    <div class="searchIcon">⌕</div>

    <input
      id="searchInput"
      type="text"
      placeholder="Search people..."
      autocomplete="off"
    >

    <button id="clearBtn" class="clearBtn">×</button>

    <button id="searchBtn" class="searchBtn">⌕</button>

  </div>
</div>

<div class="section">
  <div id="heading" class="heading">Suggested people</div>
  <div id="results"></div>
</div>

<div class="spacer"></div>

<div class="bottom">
  <a href="home.html">⌂</a>
  <a href="search.html" class="active">⌕</a>
  <a href="create.html">＋</a>
  <a href="activity.html">♡</a>
  <a href="profile.html">◉</a>
</div>

<script>
const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";
const PROJECT_ID="crockcell-cd2e6";
const BASE=`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

let token=localStorage.getItem("crockcellIdToken");
let uid=localStorage.getItem("crockcellUid");
let refreshToken=localStorage.getItem("crockcellRefreshToken");

let allUsers=[];
let timer=null;

const input=document.getElementById("searchInput");
const results=document.getElementById("results");
const heading=document.getElementById("heading");
const clearBtn=document.getElementById("clearBtn");

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function refresh(){
  if(!refreshToken)return false;

  try{
    const r=await fetch(
      `https://securetoken.googleapis.com/v1/token?key=${API_KEY}`,
      {
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:
          "grant_type=refresh_token&refresh_token="+
          encodeURIComponent(refreshToken)
      }
    );

    const d=await r.json();

    if(!r.ok || !d.id_token)return false;

    token=d.id_token;
    refreshToken=d.refresh_token||refreshToken;

    localStorage.setItem("crockcellIdToken",token);
    localStorage.setItem("crockcellRefreshToken",refreshToken);

    return true;
  }catch(e){
    return false;
  }
}

async function firestore(path,opt={}){
  opt.headers=Object.assign(
    {"Content-Type":"application/json"},
    opt.headers||{}
  );

  opt.headers.Authorization="Bearer "+token;

  let r=await fetch(BASE+path,opt);

  if((r.status===401||r.status===403) && refreshToken){
    const ok=await refresh();

    if(ok){
      opt.headers.Authorization="Bearer "+token;
      r=await fetch(BASE+path,opt);
    }
  }

  const text=await r.text();

  let data=null;
  try{
    data=text?JSON.parse(text):null;
  }catch(e){}

  if(!r.ok){
    throw new Error(
      data?.error?.message || ("Firebase error "+r.status)
    );
  }

  return data;
}

function val(field){
  if(!field)return "";
  if(field.stringValue!==undefined)return field.stringValue;
  if(field.integerValue!==undefined)return field.integerValue;
  if(field.doubleValue!==undefined)return field.doubleValue;
  return "";
}

function docToUser(doc){
  const f=doc.fields||{};

  return{
    id:doc.name.split("/").pop(),
    name:val(f.name),
    username:val(f.username),
    bio:val(f.bio),
    photoURL:val(f.photoURL),
    email:val(f.email)
  };
}

async function loadUsers(){

  if(!token){
    location.href="index.html";
    return;
  }

  try{

    const q={
      structuredQuery:{
        from:[
          {collectionId:"users"}
        ]
      }
    };

    const data=await firestore(
      ":runQuery",
      {
        method:"POST",
        body:JSON.stringify(q)
      }
    );

    allUsers=(data||[])
      .filter(x=>x.document)
      .map(x=>docToUser(x.document));

    showSuggestions("");

  }catch(e){

    results.innerHTML=
      `<div class="empty">Users load nahi ho paaye.</div>`;

  }
}

function showSuggestions(query){

  query=query.trim().toLowerCase();

  clearBtn.style.display=query?"block":"none";

  let users=[...allUsers];

  if(query){

    users=users
      .map(u=>{

        const username=(u.username||"").toLowerCase();
        const name=(u.name||"").toLowerCase();

        let score=10;

        if(username===query)score=0;
        else if(username.startsWith(query))score=1;
        else if(name.startsWith(query))score=2;
        else if(username.includes(query))score=3;
        else if(name.includes(query))score=4;
        else score=99;

        return {...u,score};

      })
      .filter(u=>u.score<99)
      .sort((a,b)=>a.score-b.score);

    heading.textContent="People";

  }else{

    users=users.slice(0,8);
    heading.textContent="Suggested people";

  }

  renderUsers(users);
}

function renderUsers(users){

  if(!users.length){

    results.innerHTML=
      `<div class="empty">No users found</div>`;

    return;
  }

  results.innerHTML=users.map(u=>{

    const photo=u.photoURL ||
      "https://via.placeholder.com/100";

    const displayName=u.name || u.username || "User";
    const username=u.username || "";

    return `
      <div class="user" data-id="${esc(u.id)}">

        <img
          class="avatar"
          src="${esc(photo)}"
          onerror="this.src='https://via.placeholder.com/100'"
        >

        <div class="info">
          <div class="name">${esc(displayName)}</div>
          <div class="username">
            ${username ? "@"+esc(username) : ""}
          </div>
        </div>

        ${
          u.id!==uid
          ? `<button
               class="followBtn"
               data-follow="${esc(u.id)}"
             >Follow</button>`
          : ""
        }

      </div>
    `;

  }).join("");

  document.querySelectorAll(".user").forEach(row=>{

    row.addEventListener("click",e=>{

      if(e.target.closest(".followBtn"))return;

      const id=row.dataset.id;

      localStorage.setItem(
        "crockcellViewedUser",
        id
      );

      location.href="profile.html?uid="+encodeURIComponent(id);

    });

  });

  document.querySelectorAll(".followBtn").forEach(btn=>{

    btn.addEventListener("click",async e=>{

      e.stopPropagation();

      const target=btn.dataset.follow;

      await toggleFollow(target,btn);

    });

  });

}

async function toggleFollow(target,btn){

  const followId=uid+"_"+target;

  try{

    const path="/follows/"+followId;

    try{

      await firestore(
        path,
        {method:"GET"}
      );

      await firestore(
        path,
        {method:"DELETE"}
      );

      btn.textContent="Follow";
      btn.classList.remove("following");

    }catch(e){

      await firestore(
        path,
        {
          method:"PATCH",
          body:JSON.stringify({
            fields:{
              followerId:{stringValue:uid},
              followingId:{stringValue:target},
              createdAt:{
                timestampValue:new Date().toISOString()
              }
            }
          })
        }
      );

      btn.textContent="Following";
      btn.classList.add("following");

    }

  }catch(e){

    alert("Follow update nahi ho paya.");

  }
}

input.addEventListener("input",()=>{

  clearTimeout(timer);

  timer=setTimeout(()=>{

    showSuggestions(input.value);

  },180);

});

document.getElementById("searchBtn").addEventListener("click",()=>{

  showSuggestions(input.value);

  input.focus();

});

clearBtn.addEventListener("click",()=>{

  input.value="";
  showSuggestions("");
  input.focus();

});

input.addEventListener("keydown",e=>{

  if(e.key==="Enter"){
    showSuggestions(input.value);
  }

});

loadUsers();
</script>

</body>
</html>
