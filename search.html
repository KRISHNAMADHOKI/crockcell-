<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CROCKCELL Search</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

.header{
  padding:20px 18px 15px;
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(0,0,0,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #222;
}

.title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:16px;
}

.search-row{
  display:flex;
  gap:8px;
}

.search-input{
  flex:1;
  height:50px;
  border:0;
  outline:none;
  border-radius:20px;
  background:#191919;
  color:#fff;
  padding:0 17px;
  font-size:16px;
}

.search-btn{
  width:55px;
  height:50px;
  border:0;
  border-radius:20px;
  background:#fff;
  color:#000;
  font-size:22px;
  font-weight:bold;
}

.message{
  min-height:25px;
  padding:12px 18px 0;
  color:#888;
  font-size:14px;
}

.results{
  padding:8px 15px 100px;
}

.user-card{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 5px;
  border-bottom:1px solid #181818;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  flex-shrink:0;
}

.user-info{
  flex:1;
  min-width:0;
}

.name{
  font-size:17px;
  font-weight:bold;
}

.username{
  margin-top:4px;
  color:#888;
  font-size:14px;
}

.open-btn{
  border:0;
  border-radius:15px;
  background:#fff;
  color:#000;
  padding:10px 14px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#666;
  padding:55px 20px;
}

.bottom-nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:20;
  display:flex;
  justify-content:space-around;
  padding:8px;
  border-radius:24px;
  background:rgba(25,25,25,.9);
  backdrop-filter:blur(18px);
  border:1px solid #333;
}

.nav-item{
  flex:1;
  text-align:center;
  padding:8px 4px;
  border-radius:17px;
  color:#999;
  text-decoration:none;
  font-size:11px;
}

.nav-item.active{
  background:#fff;
  color:#000;
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

@media(max-width:380px){

  .title{
    font-size:25px;
  }

  .search-input{
    font-size:15px;
  }

}
</style>
</head>

<body>

<div class="header">

  <div class="title">
    Search
  </div>

  <div class="search-row">

    <input
      id="searchInput"
      class="search-input"
      type="text"
      placeholder="Search username..."
      autocomplete="off"
      autocapitalize="none"
    >

    <button
      id="searchBtn"
      class="search-btn"
      type="button"
      onclick="searchUser()"
    >
      ⌕
    </button>

  </div>

</div>

<div
  id="message"
  class="message"
></div>

<div
  id="results"
  class="results"
>
  <div class="empty">
    Search for a username
  </div>
</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <a
    class="nav-item"
    href="home.html"
  >
    <span class="nav-icon">⌂</span>
    Home
  </a>

  <a
    class="nav-item active"
    href="search.html"
  >
    <span class="nav-icon">⌕</span>
    Search
  </a>

  <a
    class="nav-item"
    href="reels.html"
  >
    <span class="nav-icon">▶</span>
    Reels
  </a>

  <a
    class="nav-item"
    href="messages.html"
  >
    <span class="nav-icon">♡</span>
    Messages
  </a>

  <a
    class="nav-item"
    href="profile.html"
  >
    <span class="nav-icon">◯</span>
    Profile
  </a>

</div>


<script>

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================
   NEW SESSION KEYS
========================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let uid =
localStorage.getItem(
  "crockcell_uid"
);


/* SESSION STORAGE FALLBACK */

if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}

if(!uid){

  uid =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}


/* =========================
   LOGIN CHECK
========================= */

if(!token || !uid){

  window.location.replace(
    "index.html"
  );

}


/* =========================
   SEARCH
========================= */

async function searchUser(){

  const input =
  document.getElementById(
    "searchInput"
  );

  const results =
  document.getElementById(
    "results"
  );

  const message =
  document.getElementById(
    "message"
  );

  const username =
  input.value
    .trim()
    .toLowerCase();


  if(!username){

    message.textContent =
    "Username enter karo.";

    results.innerHTML =
    `<div class="empty">
      Username search karo
    </div>`;

    return;

  }


  message.textContent =
  "Searching...";


  results.innerHTML =
  `<div class="empty">
    Searching...
  </div>`;


  try{

    const url =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents/usernameIndex/" +
    encodeURIComponent(username) +
    "?key=" +
    API_KEY;


    const response =
    await fetch(url);


    if(response.status===404){

      message.textContent =
      "User nahi mila.";

      results.innerHTML =
      `<div class="empty">
        No user found
      </div>`;

      return;

    }


    if(!response.ok){

      throw new Error(
        "Search failed"
      );

    }


    const data =
    await response.json();


    const f =
    data.fields || {};


    const foundUID =
    f.uid?.stringValue || "";


    const foundUsername =
    f.username?.stringValue ||
    username;


    if(!foundUID){

      throw new Error(
        "Invalid user data"
      );

    }


    /* =========================
       LOAD PROFILE
    ========================= */

    let name =
    foundUsername;

    let photoURL =
    "";


    try{

      const profileURL =
      "https://firestore.googleapis.com/v1/projects/" +
      PROJECT_ID +
      "/databases/(default)/documents/users/" +
      encodeURIComponent(foundUID);


      const profileResponse =
      await fetch(
        profileURL,
        {
          headers:{
            Authorization:
            "Bearer " + token
          }
        }
      );


      if(profileResponse.ok){

        const profile =
        await profileResponse.json();

        const pf =
        profile.fields || {};


        name =
        pf.name?.stringValue ||
        foundUsername;


        photoURL =
        pf.photoURL?.stringValue ||
        "";

      }

    }catch(error){

      console.log(
        "Profile load skipped"
      );

    }


    message.textContent =
    "1 result";


    results.innerHTML = "";


    const card =
    document.createElement(
      "div"
    );

    card.className =
    "user-card";


    card.innerHTML = `

      <img
        class="avatar"
        src="${photoURL || placeholderPhoto()}"
        alt=""
      >

      <div class="user-info">

        <div class="name">
          ${escapeHTML(name)}
        </div>

        <div class="username">
          @${escapeHTML(foundUsername)}
        </div>

      </div>

      <button
        class="open-btn"
        type="button"
      >
        Open
      </button>

    `;


    card
      .querySelector(".open-btn")
      .onclick = function(){

        /*
          Profile page ko UID aur username
          ke saath open kar rahe hain.
        */

        window.location.href =
        "profile.html?uid=" +
        encodeURIComponent(foundUID) +
        "&username=" +
        encodeURIComponent(foundUsername);

      };


    results.appendChild(card);


  }catch(error){

    console.error(error);

    message.textContent =
    "Search failed.";

    results.innerHTML =
    `<div class="empty">
      Search nahi ho paayi.
    </div>`;

  }

}


/* =========================
   ENTER SEARCH
========================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key==="Enter"){

        searchUser();

      }

    }
  );


/* =========================
   HELPERS
========================= */

function escapeHTML(text){

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function placeholderPhoto(){

  return "data:image/svg+xml," +

    "<svg xmlns='http://www.w3.org/2000/svg' " +

    "width='100' height='100'>" +

    "<rect width='100' height='100' " +

    "fill='%23333333'/>" +

    "</svg>";

}

</script>

</body>
</html>
