<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search - CROCKCELL</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
padding-bottom:75px
}

header{
height:65px;
border-bottom:1px solid #222;
display:flex;
align-items:center;
padding:0 20px;
font-size:24px;
font-weight:bold
}

main{
max-width:650px;
margin:auto;
padding:20px
}

.searchBox{
display:flex;
gap:10px
}

input{
flex:1;
background:#111;
border:1px solid #333;
color:#fff;
border-radius:10px;
padding:14px;
font-size:16px;
outline:none
}

.searchBtn{
border:0;
border-radius:10px;
padding:0 18px;
background:#fff;
color:#000;
font-weight:bold
}

.results{
margin-top:25px
}

.user{
display:flex;
align-items:center;
gap:14px;
padding:15px 5px;
border-bottom:1px solid #222
}

.avatar{
width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
background:#222
}

.userInfo{
flex:1;
min-width:0
}

.name{
font-size:17px;
font-weight:bold
}

.username{
color:#999;
margin-top:4px
}

.follow{
border:0;
border-radius:8px;
padding:9px 15px;
background:#fff;
color:#000;
font-weight:bold
}

.following{
background:#222;
color:#fff;
border:1px solid #444
}

.msg{
text-align:center;
color:#777;
padding:35px 10px
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:65px;
background:#000;
border-top:1px solid #222;
display:flex;
justify-content:space-around;
align-items:center
}

nav a{
color:#fff;
text-decoration:none;
font-size:25px
}
</style>
</head>

<body>

<header>Search</header>

<main>

<div class="searchBox">
<input id="searchInput"
type="text"
placeholder="Search username...">

<button class="searchBtn"
onclick="searchUsers()">
Search
</button>
</div>

<div id="results" class="results"></div>

<div id="msg" class="msg">
Search for a username
</div>

</main>

<nav>
<a href="home.html">⌂</a>
<a href="search.html">⌕</a>
<a href="create.html">＋</a>
<a href="activity.html">♡</a>
<a href="profile.html">◉</a>
</nav>

<script>

const API_KEY=
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID=
"crockcell-cd2e6";

const BASE=
"https://firestore.googleapis.com/v1/projects/"
+PROJECT_ID+
"/databases/(default)/documents";

let token=
localStorage.getItem("crockcellIdToken");

let uid=
localStorage.getItem("crockcellUid");

let refreshToken=
localStorage.getItem("crockcellRefreshToken");


function $(id){
return document.getElementById(id);
}


function defaultPhoto(){

return "data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="100" height="100">
<rect width="100%" height="100%" fill="#222"/>
<text x="50%" y="60%"
text-anchor="middle"
fill="#777"
font-size="40">👤</text>
</svg>
`);

}


async function refresh(){

if(!refreshToken)return false;

try{

const r=await fetch(
"https://securetoken.googleapis.com/v1/token?key="
+API_KEY,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:
"grant_type=refresh_token&refresh_token="
+encodeURIComponent(refreshToken)
}
);

const d=await r.json();

if(!r.ok||!d.id_token)return false;

token=d.id_token;

refreshToken=
d.refresh_token||refreshToken;

localStorage.setItem(
"crockcellIdToken",
token
);

localStorage.setItem(
"crockcellRefreshToken",
refreshToken
);

return true;

}catch(e){

return false;

}

}


async function firestore(path,opt={},retry=true){

opt.headers={
...(opt.headers||{}),
Authorization:"Bearer "+token,
"Content-Type":"application/json"
};

let r=await fetch(BASE+path,opt);

if((r.status===401||r.status===403)
&&retry&&refreshToken){

if(await refresh()){

return firestore(
path,
opt,
false
);

}

}

return r;

}


/* SEARCH USERS */

async function searchUsers(){

const text=
$("searchInput").value
.trim()
.toLowerCase()
.replace(/^@/,"");

if(!text){

$("results").innerHTML="";
$("msg").textContent=
"Username likho";

return;

}

$("msg").textContent=
"Searching...";

$("results").innerHTML="";


try{

const query={

structuredQuery:{

from:[
{
collectionId:"users"
}
],

where:{

fieldFilter:{

field:{
fieldPath:"username"
},

op:"EQUAL",

value:{
stringValue:text
}

}

},

limit:20

}

};


const r=await firestore(
":runQuery",
{
method:"POST",
body:JSON.stringify(query)
}
);


if(!r.ok){

console.log(await r.text());

$("msg").textContent=
"Search nahi ho pa rahi.";

return;

}


const rows=await r.json();

const users=
rows
.map(x=>x.document)
.filter(Boolean);


if(!users.length){

$("msg").textContent=
"No user found.";

return;

}


$("msg").textContent="";

for(const doc of users){

await renderUser(doc);

}

}catch(e){

console.log(e);

$("msg").textContent=
"Something went wrong.";

}

}


/* SHOW USER */

async function renderUser(doc){

const f=doc.fields||{};

const userId=
f.uid?.stringValue ||
doc.name.split("/").pop();

const name=
f.name?.stringValue ||
"User";

const username=
f.username?.stringValue ||
"";

const photo=
f.photoURL?.stringValue ||
"";


if(userId===uid)return;


const div=
document.createElement("div");

div.className="user";

div.innerHTML=`

<img class="avatar"
src="${photo||defaultPhoto()}"
alt="Profile">

<div class="userInfo">

<div class="name">
${escapeHTML(name)}
</div>

<div class="username">
@${escapeHTML(username)}
</div>

</div>

<button class="follow"
id="follow-${userId}">
Follow
</button>

`;


$("results").appendChild(div);


const button=
document.getElementById(
"follow-"+userId
);


const following=
await isFollowing(userId);


if(following){

button.textContent=
"Following";

button.classList.add(
"following"
);

}


button.onclick=
()=>toggleFollow(
userId,
button
);

}


/* CHECK FOLLOW */

async function isFollowing(targetUid){

const id=
uid+"_"+targetUid;

const r=
await firestore(
"/follows/"+id
);

return r.ok;

}


/* FOLLOW / UNFOLLOW */

async function toggleFollow(
targetUid,
button
){

button.disabled=true;


try{

const id=
uid+"_"+targetUid;


/* ALREADY FOLLOWING */

if(button.classList.contains(
"following"
)){

const r=
await firestore(
"/follows/"+id,
{
method:"DELETE"
}
);

if(!r.ok){

console.log(await r.text());

button.disabled=false;

return;

}

button.textContent="Follow";

button.classList.remove(
"following"
);

}else{

const body={

fields:{

followerId:{
stringValue:uid
},

followingId:{
stringValue:targetUid
},

createdAt:{
timestampValue:
new Date().toISOString()
}

}

};


const r=
await firestore(
"/follows/"+id,
{
method:"PATCH",
body:JSON.stringify(body)
}
);


if(!r.ok){

console.log(await r.text());

button.disabled=false;

return;

}

button.textContent=
"Following";

button.classList.add(
"following"
);

}

}catch(e){

console.log(e);

}

button.disabled=false;

}


/* HTML SAFE */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ENTER TO SEARCH */

$("searchInput").addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){
searchUsers();
}

});


if(!token||!uid){

location.href="index.html";

}

</script>

</body>
</html>
