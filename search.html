<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Search - CROCKCELL</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
padding-bottom:70px
}

.header{
height:64px;
display:flex;
align-items:center;
padding:0 16px;
border-bottom:1px solid #222
}

.back{
font-size:28px;
margin-right:14px;
cursor:pointer
}

.title{
font-size:21px;
font-weight:bold
}

.searchArea{
padding:14px 16px;
background:#000;
position:sticky;
top:0;
z-index:5
}

.searchBox{
height:52px;
display:flex;
align-items:center;
background:#1b1b1b;
border:1px solid #333;
border-radius:16px;
padding:4px 5px
}

.searchSymbol{
width:40px;
text-align:center;
font-size:21px;
color:#aaa
}

#searchInput{
flex:1;
height:42px;
border:0;
outline:0;
background:transparent;
color:#fff;
font-size:16px;
padding:0 5px
}

#searchInput::placeholder{
color:#888
}

.clear{
width:38px;
height:38px;
border:0;
background:transparent;
color:#999;
font-size:22px;
display:none
}

.searchButton{
width:44px;
height:44px;
border:0;
border-radius:13px;
background:#fff;
color:#000;
font-size:20px;
font-weight:bold;
cursor:pointer
}

.section{
padding:0 16px
}

.heading{
font-size:14px;
color:#999;
margin:4px 0 10px
}

.user{
display:flex;
align-items:center;
padding:12px 0;
border-bottom:1px solid #202020;
cursor:pointer
}

.avatar{
width:52px;
height:52px;
border-radius:50%;
object-fit:cover;
background:#292929;
margin-right:12px
}

.info{
flex:1;
min-width:0
}

.name{
font-size:16px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.username{
font-size:14px;
color:#999;
margin-top:4px
}

.follow{
border:0;
border-radius:10px;
padding:8px 13px;
background:#fff;
color:#000;
font-weight:bold;
cursor:pointer
}

.following{
background:#292929;
color:#fff
}

.empty{
text-align:center;
color:#888;
padding:35px 10px
}

.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
height:60px;
background:#000;
border-top:1px solid #222;
display:flex;
justify-content:space-around;
align-items:center;
z-index:10
}

.bottom a{
color:#aaa;
text-decoration:none;
font-size:23px
}

.bottom a.active{
color:#fff
}
</style>
</head>

<body>

<div class="header">
<div class="back" onclick="history.back()">‹</div>
<div class="title">Search</div>
</div>

<div class="searchArea">
<div class="searchBox">

<div class="searchSymbol">⌕</div>

<input
id="searchInput"
type="text"
placeholder="Search people..."
autocomplete="off"
>

<button id="clearButton" class="clear">×</button>

<button id="searchButton" class="searchButton">⌕</button>

</div>
</div>

<div class="section">

<div id="heading" class="heading">
Suggested people
</div>

<div id="results"></div>

</div>

<div class="bottom">
<a href="home.html">⌂</a>
<a href="search.html" class="active">⌕</a>
<a href="create.html">＋</a>
<a href="activity.html">♡</a>
<a href="profile.html">◉</a>
</div>

<script>

const API_KEY="AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";
const PROJECT_ID="crockcell-cd2e6";

const BASE=
`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

let token=localStorage.getItem("crockcellIdToken");
let uid=localStorage.getItem("crockcellUid");
let refreshToken=localStorage.getItem("crockcellRefreshToken");

let users=[];
let timer=null;

const input=document.getElementById("searchInput");
const results=document.getElementById("results");
const heading=document.getElementById("heading");
const clearButton=document.getElementById("clearButton");

if(!token || !uid){
location.href="index.html";
}

function esc(v){
return String(v||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function getValue(field){

if(!field)return"";

if(field.stringValue!==undefined)
return field.stringValue;

if(field.integerValue!==undefined)
return field.integerValue;

return"";
}

async function refresh(){

if(!refreshToken)return false;

try{

const r=await fetch(
`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:
"grant_type=refresh_token&refresh_token="+
encodeURIComponent(refreshToken)
}
);

const d=await r.json();

if(!r.ok || !d.id_token)
return false;

token=d.id_token;

if(d.refresh_token)
refreshToken=d.refresh_token;

localStorage.setItem(
"crockcellIdToken",
token
);

localStorage.setItem(
"crockcellRefreshToken",
refreshToken
);

return true;

}catch(e){
return false;
}
}

async function firebase(path,options={}){

options.headers=Object.assign(
{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
options.headers||{}
);

let r=await fetch(BASE+path,options);

if((r.status===401 || r.status===403)
&& refreshToken){

const ok=await refresh();

if(ok){

options.headers.Authorization=
"Bearer "+token;

r=await fetch(BASE+path,options);

}
}

const text=await r.text();

let data=null;

try{
data=text?JSON.parse(text):null
}catch(e){}

if(!r.ok){

throw new Error(
data?.error?.message ||
("Firebase error "+r.status)
);

}

return data;
}

function makeUser(doc){

const f=doc.fields||{};

return{
id:doc.name.split("/").pop(),
name:getValue(f.name),
username:getValue(f.username),
bio:getValue(f.bio),
photoURL:getValue(f.photoURL),
email:getValue(f.email)
};

}

async function loadUsers(){

try{

/*
 Firebase ka simple users collection
 GET use kar rahe hain.
*/

const data=await firebase(
"/users?pageSize=100"
);

users=(data.documents||[])
.map(makeUser);

/*
 Agar current user kisi wajah se collection
 response me nahi mila to local profile se
 usko manually add kar denge.
*/

const mine=localStorage.getItem(
"crockcellProfile"
);

if(mine){

try{

const p=JSON.parse(mine);

if(p){

const already=users.some(
u=>u.id===uid
);

if(!already){

users.unshift({
id:uid,
name:p.name||"",
username:p.username||"",
bio:p.bio||"",
photoURL:p.photoURL||"",
email:p.email||""
});

}

}

}catch(e){}

}

showUsers("");

}catch(e){

console.log(e);

results.innerHTML=
`<div class="empty">
Search users load nahi ho paaye.
</div>`;

}

}

function showUsers(text){

const q=text.trim().toLowerCase();

clearButton.style.display=
q?"block":"none";

let list=[];

if(!q){

list=users.slice(0,10);

heading.textContent=
"Suggested people";

}else{

list=users
.map(u=>{

const username=
(u.username||"").toLowerCase();

const name=
(u.name||"").toLowerCase();

let score=99;

if(username===q)
score=0;

else if(name===q)
score=1;

else if(username.startsWith(q))
score=2;

else if(name.startsWith(q))
score=3;

else if(username.includes(q))
score=4;

else if(name.includes(q))
score=5;

return{
...u,
score
};

})
.filter(u=>u.score<99)
.sort((a,b)=>a.score-b.score);

heading.textContent=
"Search results";

}

renderUsers(list);

}

function renderUsers(list){

if(!list.length){

results.innerHTML=
`<div class="empty">
No users found
</div>`;

return;
}

results.innerHTML=list.map(u=>{

const photo=
u.photoURL ||
"https://via.placeholder.com/100";

const name=
u.name ||
u.username ||
"User";

const username=
u.username||"";

return`

<div class="user" data-id="${esc(u.id)}">

<img
class="avatar"
src="${esc(photo)}"
onerror="this.src='https://via.placeholder.com/100'"
>

<div class="info">

<div class="name">
${esc(name)}
</div>

<div class="username">
${username?"@"+esc(username):""}
</div>

</div>

${
u.id!==uid
?
`<button
class="follow"
data-follow="${esc(u.id)}"
>
Follow
</button>`
:
""
}

</div>

`;

}).join("");

document.querySelectorAll(".user")
.forEach(row=>{

row.addEventListener("click",function(e){

if(e.target.closest(".follow"))
return;

const id=this.dataset.id;

/*
 Abhi selected user ID save kar rahe hain.
 Next step me profile page isi ID ko read karega.
*/

localStorage.setItem(
"crockcellViewedUser",
id
);

location.href=
"profile.html?uid="+
encodeURIComponent(id);

});

});

document.querySelectorAll(".follow")
.forEach(button=>{

button.addEventListener(
"click",
async function(e){

e.stopPropagation();

await toggleFollow(
this.dataset.follow,
this
);

});

});

}

async function toggleFollow(target,button){

const id=uid+"_"+target;

try{

/* Pehle check */

let exists=true;

try{

await firebase(
"/follows/"+id,
{method:"GET"}
);

}catch(e){

exists=false;

}

if(exists){

await firebase(
"/follows/"+id,
{
method:"DELETE"
}
);

button.textContent="Follow";
button.classList.remove("following");

}else{

await firebase(
"/follows/"+id,
{
method:"PATCH",
body:JSON.stringify({
fields:{
followerId:{
stringValue:uid
},
followingId:{
stringValue:target
},
createdAt:{
timestampValue:
new Date().toISOString()
}
}
})
}
);

button.textContent="Following";
button.classList.add("following");

}

}catch(e){

alert(
"Follow update nahi ho paya."
);

}

}

input.addEventListener(
"input",
function(){

clearTimeout(timer);

timer=setTimeout(
()=>{
showUsers(input.value);
},
150
);

});

document.getElementById(
"searchButton"
).addEventListener(
"click",
function(){

showUsers(input.value);
input.focus();

});

clearButton.addEventListener(
"click",
function(){

input.value="";

showUsers("");

input.focus();

});

input.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){
showUsers(input.value);
}

});

loadUsers();

</script>

</body>
</html>
