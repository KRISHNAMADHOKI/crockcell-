<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile - CROCKCELL</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#fafafa;
color:#111;
}

header{
height:60px;
background:white;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
position:sticky;
top:0;
z-index:10;
}

.logo{
font-size:22px;
font-weight:bold;
}

.headbtn{
border:0;
background:none;
font-size:25px;
cursor:pointer;
}

.wrap{
max-width:700px;
margin:auto;
padding:20px 15px 80px;
}

.profile{
display:flex;
gap:20px;
align-items:center;
padding:10px 0 25px;
}

.photo{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
background:#ddd;
border:1px solid #ddd;
}

.details{
flex:1;
min-width:0;
}

.name{
font-size:21px;
font-weight:bold;
}

.username{
color:#777;
margin-top:4px;
}

.bio{
margin-top:8px;
font-size:14px;
}

.stats{
display:flex;
gap:28px;
margin-top:14px;
}

.stat{
text-align:center;
}

.stat b{
display:block;
font-size:18px;
}

.stat span{
color:#777;
font-size:12px;
}

.actions{
display:flex;
gap:10px;
margin-bottom:20px;
}

.action{
flex:1;
padding:10px;
border:0;
border-radius:8px;
background:#111;
color:white;
font-weight:bold;
cursor:pointer;
}

.edit{
background:#eee;
color:#111;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:3px;
}

.post{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
background:#ddd;
cursor:pointer;
}

.empty{
text-align:center;
color:#777;
padding:40px 10px;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:60px;
background:white;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
align-items:center;
z-index:20;
}

.bottom a{
text-decoration:none;
color:#111;
font-size:13px;
}
</style>
</head>

<body>

<header>

<button
class="headbtn"
id="back">
‹
</button>

<div class="logo">
CROCKCELL
</div>

<button
class="headbtn"
id="settings">
⚙
</button>

</header>

<div class="wrap">

<div id="profileBox">
Loading...
</div>

<div
class="actions"
id="actions">
</div>

<div id="postsBox">
<div class="empty">
Loading posts...
</div>
</div>

</div>

<div class="bottom">
<a href="home.html">Home</a>
<a href="search.html">Search</a>
<a href="create.html">Create</a>
<a href="reels.html">Reels</a>
<a href="profile.html">Profile</a>
</div>

<script>

const API_KEY=
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID=
"crockcell-cd2e6";

let token=
localStorage.getItem(
"crockcellIdToken"
);

let refreshToken=
localStorage.getItem(
"crockcellRefreshToken"
);

const myUid=
localStorage.getItem(
"crockcellUid"
);

const params=
new URLSearchParams(
location.search
);

/*
 IMPORTANT:
 Search se actual UID URL me aayegi.
 Agar URL me UID nahi hai,
 to viewed user check hoga.
 Last me apni UID.
*/

const requestedUid=
params.get("uid") ||
localStorage.getItem(
"crockcellViewedUser"
) ||
myUid;

let currentUser=null;

const base=
`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;


function esc(x){

return String(x||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function value(v){

if(!v)return "";

return v.stringValue ||
v.integerValue ||
v.doubleValue ||
v.booleanValue ||
"";

}


/* REFRESH TOKEN */

async function refreshTokenNow(){

if(!refreshToken)return false;

try{

const r=await fetch(
"https://securetoken.googleapis.com/v1/token?key="+
API_KEY,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:
"grant_type=refresh_token&refresh_token="+
encodeURIComponent(refreshToken)
}
);

const d=await r.json();

if(!r.ok||!d.id_token){
return false;
}

token=d.id_token;

refreshToken=
d.refresh_token||
refreshToken;

localStorage.setItem(
"crockcellIdToken",
token
);

localStorage.setItem(
"crockcellRefreshToken",
refreshToken
);

return true;

}catch(e){

return false;

}

}


/*
================================================
USER BY UID
================================================
*/

async function findUserByUid(uid){

const body={

structuredQuery:{

from:[
{
collectionId:"users"
}
],

where:{

fieldFilter:{

field:{
fieldPath:"uid"
},

op:"EQUAL",

value:{
stringValue:uid
}

}

},

limit:1

}

};

let r=await fetch(
base+":runQuery",
{
method:"POST",

headers:{
"Authorization":
"Bearer "+token,

"Content-Type":
"application/json"
},

body:JSON.stringify(body)

}
);


if(r.status===401||
r.status===403){

if(await refreshTokenNow()){

return findUserByUid(uid);

}

}


const data=await r.json();

if(!r.ok){

throw new Error(
data.error?.message||
"User search failed"
);

}


const result=
data.find(
x=>x.document
);


if(!result)return null;


const doc=
result.document;

const f=
doc.fields||{};


return{

docId:
doc.name.split("/").pop(),

uid:
value(f.uid)||uid,

name:
value(f.name)||"User",

username:
value(f.username)||"",

bio:
value(f.bio)||"",

photoURL:
value(f.photoURL)||"",

email:
value(f.email)||""

};

}


/*
================================================
USER BY DOCUMENT ID
================================================
*/

async function findUserByDocId(id){

const r=await fetch(

`${base}/users/${encodeURIComponent(id)}`,

{
headers:{
"Authorization":
"Bearer "+token
}
}

);


if(r.status===401||
r.status===403){

if(await refreshTokenNow()){

return findUserByDocId(id);

}

}


if(!r.ok)return null;


const doc=
await r.json();

const f=
doc.fields||{};


return{

docId:
doc.name.split("/").pop(),

uid:
value(f.uid)||id,

name:
value(f.name)||"User",

username:
value(f.username)||"",

bio:
value(f.bio)||"",

photoURL:
value(f.photoURL)||"",

email:
value(f.email)||""

};

}


/*
================================================
GET EXACT USER
================================================
*/

async function getUser(id){

/*
 Search se UID aa rahi hai,
 isliye pehle UID field search.
*/

let user=
await findUserByUid(id);

if(user){

return user;

}


/*
 Old/legacy document ID support.
*/

return await findUserByDocId(id);

}


/*
================================================
POSTS
================================================
*/

async function getPosts(uid){

const body={

structuredQuery:{

from:[
{
collectionId:"posts"
}
],

where:{

fieldFilter:{

field:{
fieldPath:"userId"
},

op:"EQUAL",

value:{
stringValue:uid
}

}

},

limit:100

}

};


let r=await fetch(

base+":runQuery",

{
method:"POST",

headers:{
"Authorization":
"Bearer "+token,

"Content-Type":
"application/json"
},

body:
JSON.stringify(body)

}

);


if(r.status===401||
r.status===403){

if(await refreshTokenNow()){

return getPosts(uid);

}

}


const data=
await r.json();


if(!r.ok){

throw new Error(
data.error?.message||
"Posts failed"
);

}


return data
.filter(x=>x.document)
.map(x=>x.document);

}


/*
================================================
FOLLOW CHECK
================================================
*/

async function checkFollow(uid){

if(uid===myUid)return false;

const id=
myUid+"_"+uid;

const r=await fetch(

`${base}/follows/${encodeURIComponent(id)}`,

{
headers:{
"Authorization":
"Bearer "+token
}
}

);


if(r.status===404){
return false;
}


if(r.status===401||
r.status===403){

if(await refreshTokenNow()){

return checkFollow(uid);

}

}


return r.ok;

}


/*
================================================
FOLLOW
================================================
*/

async function followUser(uid){

const id=
myUid+"_"+uid;

const body={

fields:{

followerId:{
stringValue:myUid
},

followingId:{
stringValue:uid
},

createdAt:{
timestampValue:
new Date().toISOString()
}

}

};


const r=await fetch(

`${base}/follows/${encodeURIComponent(id)}`,

{
method:"PATCH",

headers:{
"Authorization":
"Bearer "+token,

"Content-Type":
"application/json"
},

body:
JSON.stringify(body)

}

);


if(r.status===401||
r.status===403){

if(await refreshTokenNow()){

return followUser(uid);

}

}


return r.ok;

}


/*
================================================
UNFOLLOW
================================================
*/

async function unfollowUser(uid){

const id=
myUid+"_"+uid;

const r=await fetch(

`${base}/follows/${encodeURIComponent(id)}`,

{
method:"DELETE",

headers:{
"Authorization":
"Bearer "+token
}
}

);


if(r.status===401||
r.status===403){

if(await refreshTokenNow()){

return unfollowUser(uid);

}

}


return r.ok;

}


/*
================================================
SHOW PROFILE
================================================
*/

function showProfile(user){

currentUser=user;

const own=
user.uid===myUid;

const photo=
user.photoURL||
"https://via.placeholder.com/150?text=C";


document.getElementById(
"profileBox"
).innerHTML=`

<div class="profile">

<img
class="photo"
src="${esc(photo)}"
alt=""
>

<div class="details">

<div class="name">
${esc(user.name)}
</div>

<div class="username">
@${esc(user.username)}
</div>

${
user.bio
?
`<div class="bio">
${esc(user.bio)}
</div>`
:""
}

<div class="stats">

<div class="stat">

<b id="postCount">
0
</b>

<span>
Posts
</span>

</div>

<div class="stat">

<b>
0
</b>

<span>
Followers
</span>

</div>

<div class="stat">

<b>
0
</b>

<span>
Following
</span>

</div>

</div>

</div>

</div>

`;


if(own){

document.getElementById(
"actions"
).innerHTML=`

<button
class="action edit"
id="editBtn">

Edit Profile

</button>

`;

document.getElementById(
"editBtn"
).onclick=()=>{

location.href=
"edit-profile.html";

};

}else{

document.getElementById(
"actions"
).innerHTML=`

<button
class="action"
id="followBtn">

Loading...

</button>

`;

const btn=
document.getElementById(
"followBtn"
);

checkFollow(user.uid)
.then(
isFollowing=>{

btn.textContent=
isFollowing
?"Following"
:"Follow";

btn.className=
isFollowing
?"action edit"
:"action";

btn.onclick=
async()=>{

btn.disabled=true;

if(isFollowing){

await unfollowUser(
user.uid
);

}else{

await followUser(
user.uid
);

}

location.reload();

};

});

}

}


/*
================================================
SHOW POSTS
================================================
*/

function showPosts(posts){

const count=
document.getElementById(
"postCount"
);

if(count){

count.textContent=
posts.length;

}


const box=
document.getElementById(
"postsBox"
);


if(!posts.length){

box.innerHTML=`

<div class="empty">
No posts yet
</div>

`;

return;

}


const grid=
document.createElement(
"div"
);

grid.className="grid";


posts.forEach(doc=>{

const f=
doc.fields||{};

const image=
value(f.image);

if(!image)return;


const img=
document.createElement(
"img"
);

img.className="post";

img.src=image;

img.alt="Post";


img.onclick=()=>{

localStorage.setItem(
"crockcellViewedPost",
doc.name.split("/").pop()
);

alert(
"Post open system next step me add hoga."
);

};


grid.appendChild(img);

});


box.innerHTML="";

box.appendChild(grid);

}


/*
================================================
START
================================================
*/

async function start(){

if(!token||!myUid){

location.href=
"index.html";

return;

}


try{

if(refreshToken){

await refreshTokenNow();

}


/*
 IMPORTANT:
 requestedUid ko kabhi myUid se
 replace nahi karna.
*/

const user=
await getUser(
requestedUid
);


if(!user){

document.getElementById(
"profileBox"
).innerHTML=`

<div class="empty">

User profile nahi mili.

</div>

`;

return;

}


/*
 Ab jis user ki profile khuli hai,
 uski actual UID save hogi.
*/

currentUser=user;

localStorage.setItem(
"crockcellViewedUser",
user.uid
);


showProfile(user);


const posts=
await getPosts(
user.uid
);

showPosts(posts);


}catch(e){

console.error(e);

document.getElementById(
"profileBox"
).innerHTML=`

<div class="empty">

Profile load nahi ho payi.

<br><br>

${esc(e.message)}

</div>

`;

}

}


/* BACK */

document.getElementById(
"back"
).onclick=()=>{

if(history.length>1){

history.back();

}else{

location.href=
"home.html";

}

};


/* SETTINGS */

document.getElementById(
"settings"
).onclick=()=>{

if(
currentUser &&
currentUser.uid===myUid
){

location.href=
"edit-profile.html";

}else{

alert(
"Ye dusre user ki profile hai."
);

}

};


start();

</script>

</body>
</html>
