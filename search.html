<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CROCKCELL Search</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}


/* HEADER */

.header{
  padding:20px 18px 15px;
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(0,0,0,.95);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #222;
}

.title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:15px;
}

.search-row{
  display:flex;
  gap:8px;
}

.search-input{
  flex:1;
  height:50px;
  border:0;
  outline:none;
  border-radius:20px;
  background:#191919;
  color:#fff;
  padding:0 17px;
  font-size:16px;
}

.search-btn{
  width:55px;
  height:50px;
  border:0;
  border-radius:20px;
  background:#fff;
  color:#000;
  font-size:22px;
}


/* MESSAGE */

.message{
  min-height:25px;
  padding:12px 18px 0;
  color:#888;
  font-size:14px;
}


/* RESULTS */

.results{
  padding:8px 15px 100px;
}

.user-card{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 5px;
  border-bottom:1px solid #181818;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  flex-shrink:0;
}

.user-info{
  flex:1;
  min-width:0;
}

.name{
  font-size:17px;
  font-weight:bold;
}

.username{
  margin-top:4px;
  color:#888;
  font-size:14px;
}

.open-btn{
  border:0;
  border-radius:15px;
  background:#fff;
  color:#000;
  padding:9px 14px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#666;
  padding:55px 20px;
}


/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:20;
  display:flex;
  justify-content:space-around;
  padding:8px;
  border-radius:24px;
  background:rgba(25,25,25,.9);
  backdrop-filter:blur(18px);
  border:1px solid #333;
}

.nav-item{
  flex:1;
  text-align:center;
  padding:8px 4px;
  border-radius:17px;
  color:#999;
  text-decoration:none;
  font-size:11px;
}

.nav-item.active{
  background:#fff;
  color:#000;
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

</style>

</head>

<body>


<div class="header">

  <div class="title">
    Search
  </div>

  <div class="search-row">

    <input
      id="searchInput"
      class="search-input"
      type="text"
      placeholder="Search people..."
      autocomplete="off"
      autocapitalize="none"
    >

    <button
      class="search-btn"
      onclick="searchUsers()"
    >
      ⌕
    </button>

  </div>

</div>


<div
  id="message"
  class="message"
></div>


<div
  id="results"
  class="results"
>

  <div class="empty">
    Username ya alphabet type karke search karo
  </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <a
    class="nav-item"
    href="home.html"
  >
    <span class="nav-icon">⌂</span>
    Home
  </a>

  <a
    class="nav-item active"
    href="search.html"
  >
    <span class="nav-icon">⌕</span>
    Search
  </a>

  <a
    class="nav-item"
    href="reels.html"
  >
    <span class="nav-icon">▶</span>
    Reels
  </a>

  <a
    class="nav-item"
    href="messages.html"
  >
    <span class="nav-icon">♡</span>
    Messages
  </a>

  <a
    class="nav-item"
    href="profile.html"
  >
    <span class="nav-icon">◯</span>
    Profile
  </a>

</div>


<script>


/* =========================
   FIREBASE
========================= */

const API_KEY =
"AIzaSyDOfo32KHl1r6LZotgqj8WAgcjHzt2ORJk";

const PROJECT_ID =
"crockcell-cd2e6";


/* =========================
   LOGIN SESSION
========================= */

let token =
localStorage.getItem(
  "crockcell_idToken"
);

let uid =
localStorage.getItem(
  "crockcell_uid"
);


if(!token){

  token =
  sessionStorage.getItem(
    "crockcell_idToken"
  );

}

if(!uid){

  uid =
  sessionStorage.getItem(
    "crockcell_uid"
  );

}


if(!token || !uid){

  window.location.replace(
    "index.html"
  );

}


/* =========================
   ELEMENTS
========================= */

const searchInput =
document.getElementById(
  "searchInput"
);

const results =
document.getElementById(
  "results"
);

const message =
document.getElementById(
  "message"
);


/* =========================
   SEARCH TIMER
========================= */

let searchTimer=null;


/* =========================
   LIVE SEARCH
========================= */

searchInput.addEventListener(
  "input",
  function(){

    clearTimeout(searchTimer);

    const text =
    searchInput.value
      .trim()
      .toLowerCase();


    if(!text){

      results.innerHTML =
      `<div class="empty">
        Username ya alphabet type karo
      </div>`;

      message.textContent="";

      return;

    }


    /*
      Thoda delay rakha hai taaki
      har alphabet par Firebase ko
      unnecessary request na jaye.
    */

    searchTimer =
    setTimeout(
      function(){

        searchUsers();

      },
      250
    );

  }
);


/* =========================
   SEARCH USERS
========================= */

async function searchUsers(){

  const text =
  searchInput.value
    .trim()
    .toLowerCase();


  if(!text){

    results.innerHTML =
    `<div class="empty">
      Search something
    </div>`;

    return;

  }


  message.textContent =
  "Searching...";


  results.innerHTML =
  `<div class="empty">
    Searching...
  </div>`;


  try{


    /*
      Firestore prefix search:

      username >= typed text

      username < typed text + high unicode

      Example:

      "kr"

      kr...
      krishna...
      krish...
    */

    const endText =
    text + "\uf8ff";


    const queryURL =
    "https://firestore.googleapis.com/v1/projects/" +
    PROJECT_ID +
    "/databases/(default)/documents:runQuery" +
    "?key=" +
    API_KEY;


    const queryBody = {

      structuredQuery: {

        from: [

          {
            collectionId:"users"
          }

        ],

        where: {

          compositeFilter: {

            op:"AND",

            filters:[

              {

                fieldFilter:{

                  field:{
                    fieldPath:"username"
                  },

                  op:"GREATER_THAN_OR_EQUAL",

                  value:{
                    stringValue:text
                  }

                }

              },

              {

                fieldFilter:{

                  field:{
                    fieldPath:"username"
                  },

                  op:"LESS_THAN",

                  value:{
                    stringValue:endText
                  }

                }

              }

            ]

          }

        },

        orderBy:[

          {

            field:{
              fieldPath:"username"
            },

            direction:"ASCENDING"

          }

        ],

        limit:30

      }

    };


    const response =
    await fetch(
      queryURL,
      {

        method:"POST",

        headers:{

          Authorization:
          "Bearer "+token,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify(
          queryBody
        )

      }
    );


    if(!response.ok){

      const errorText =
      await response.text();

      console.error(
        "Firestore search error:",
        errorText
      );

      throw new Error(
        "SEARCH_FAILED"
      );

    }


    const rows =
    await response.json();


    /*
      Firebase runQuery returns
      rows containing documents.
    */

    const users=[];


    for(const row of rows){

      if(!row.document){
        continue;
      }


      const f =
      row.document.fields || {};


      const foundUID =
      f.uid?.stringValue || "";


      const foundUsername =
      f.username?.stringValue || "";


      if(!foundUID ||
         !foundUsername){

        continue;

      }


      /*
        Apna account list me nahi dikhana.
      */

      if(foundUID===uid){

        continue;

      }


      users.push({

        uid:foundUID,

        username:foundUsername,

        name:
        f.name?.stringValue ||
        foundUsername,

        photoURL:
        f.photoURL?.stringValue ||
        "",

        bio:
        f.bio?.stringValue ||
        ""

      });

    }


    renderUsers(users,text);


  }catch(error){

    console.error(error);


    message.textContent =
    "Search failed.";

    results.innerHTML =
    `<div class="empty">
      Search nahi ho paayi.
    </div>`;

  }

}


/* =========================
   SHOW USERS
========================= */

function renderUsers(users,text){

  results.innerHTML="";


  if(!users.length){

    message.textContent =
    "No users found.";

    results.innerHTML =
    `<div class="empty">
      "${escapeHTML(text)}"
      se koi user nahi mila.
    </div>`;

    return;

  }


  message.textContent =
  users.length +
  " users found";


  users.forEach(function(user){

    const card =
    document.createElement(
      "div"
    );

    card.className =
    "user-card";


    card.innerHTML = `

      <img
        class="avatar"
        src="${
          user.photoURL ||
          placeholderPhoto()
        }"
        alt=""
      >

      <div class="user-info">

        <div class="name">
          ${escapeHTML(
            user.name
          )}
        </div>

        <div class="username">
          @${escapeHTML(
            user.username
          )}
        </div>

      </div>

      <button
        class="open-btn"
        type="button"
      >
        Open
      </button>

    `;


    card
      .querySelector(
        ".open-btn"
      )
      .onclick=function(){

        openProfile(
          user
        );

      };


    results.appendChild(
      card
    );

  });

}


/* =========================
   OPEN PROFILE
========================= */

function openProfile(user){

  window.location.href =
    "profile.html?uid=" +
    encodeURIComponent(
      user.uid
    ) +
    "&username=" +
    encodeURIComponent(
      user.username
    );

}


/* =========================
   ENTER KEY
========================= */

searchInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      searchUsers();

    }

  }
);


/* =========================
   HTML SAFETY
========================= */

function escapeHTML(text){

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   DEFAULT PHOTO
========================= */

function placeholderPhoto(){

  return "data:image/svg+xml," +

    "<svg xmlns='http://www.w3.org/2000/svg' " +

    "width='100' height='100'>" +

    "<rect width='100' height='100' " +

    "fill='%23333333'/>" +

    "</svg>";

}

</script>

</body>
  </html>
