<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hidden Chats - CROCKCELL</title><style>body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:20px}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{border:0;background:#171717;color:#fff;border-radius:12px;padding:10px 14px;font-size:18px}.title{font-size:24px;font-weight:700}.muted{color:#999;font-size:13px}.card{background:#111;border:1px solid #242424;border-radius:18px;padding:14px}.chat{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #252525}.chat:last-child{border-bottom:0}.avatar{width:44px;height:44px;border-radius:50%;background:#292929;display:grid;place-items:center;font-weight:700}.info{flex:1}.unhide{border:0;background:#fff;color:#000;border-radius:10px;padding:9px 12px;font-weight:700}.empty{text-align:center;padding:35px 10px;color:#999}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">‹</button><div><div class="title">Hidden Chats</div><div class="muted">Chats you chose to hide</div></div></div><section class="card" id="list"></section><script>const key='crockcellHiddenChats';function get(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}function set(v){localStorage.setItem(key,JSON.stringify(v))}function render(){const box=document.getElementById('list');const arr=get();if(!arr.length){box.innerHTML='<div class="empty">No hidden chats yet.</div>';return}box.innerHTML=arr.map((x,i)=>{const name=String(x.username||x.name||'User');const initial=name[0]?.toUpperCase()||'U';return `<div class="chat"><div class="avatar">${initial}</div><div class="info"><b>${esc(name)}</b><div class="muted">Hidden chat</div></div><button class="unhide" data-i="${i}">Unhide</button></div>`}).join('');box.querySelectorAll('.unhide').forEach(b=>b.onclick=()=>{const a=get();a.splice(Number(b.dataset.i),1);set(a);render()})}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();</script></main></body></html>
